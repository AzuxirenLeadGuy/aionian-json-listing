40:
  1:
    1: Kakaɗ tǝghǝr kǝ hulfa Yesu Kǝristi, zǝra Dauda kwa ghǝravaan ndakwani zǝra Ibrahim.
    2: Ibrahim wa yaa Ishaku, ya nǝ Ishaku kǝ Yakuba, ya nǝ Yakub kǝ Yahuda ard zaraabahaana.
    3: Ya nǝ Yahuda kǝ Ferez ard Zera. Babbaatǝr Tamara. Ya nǝ Ferez kǝ Hezron, ya nǝ Hezron kǝ Aram,
    4: ya nǝ Aram kǝ Amminadab, ya nǝ Amminadab kǝ Nashon, ya nǝ Nashon kǝ Salmon.
    5: Ya nǝ Salmon kǝ Bowaz, ɗaaga babbaan Rahab. Ya nǝ Bowaz kǝ Obed, ɗaaga babbaan Rut. Ya nǝ Obed kǝ Yesse,
    6: ya nǝ Yesse kǝ Tlǝkes Dauda. Ya nǝ Dauda kǝ Saluman, ɗaaga babbaan Betshaba, kwandza uusa Uri wura.
    7: Ya nǝ Saluman kǝ Rehobowam, ya nǝ Rehobowam kǝ Abija, ya nǝ Abija kǝ Asa,
    8: ya nǝ Asa kǝ Yehoshafat, ya nǝ Yehoshafat kǝ Yoram, ya nǝ Yoram kǝ Uzziya,
    9: ya nǝ Uzziya kǝ Yotam, ya nǝ Yotam kǝ Ahaz, ya nǝ Ahaz kǝ Hezekaya,
    10: ya nǝ Hezekaya kǝ Manasse, ya nǝ Manasse kǝ Aman, ya nǝ Aman kǝ Yosiya,
    11: ya nǝ Yosiya kǝ Yekoniya ard zaraabahaan sartakwa hutsavtǝra nǝ uudah damma Babila kiyava ɛɛva.
    12: Tǝhalakwa lanngavtǝrda nǝ iitǝr damma Babila, kaa yigayig nǝ Yekoniya kǝ Shayeltiyel, ya nǝ Shayeltiyel kǝ Zerubbabela,
    13: ya nǝ Zerubbabel kǝ Abihud, ya nǝ Abihud kǝ Eliyakim, ya nǝ Eliyakim kǝ Azor,
    14: ya nǝ Azor kǝ Zadok, ya nǝ Zadok kǝ Akim, ya nǝ Akim kǝ Eliyud,
    15: ya nǝ Eliyud kǝ Eliyazar, ya nǝ Eliyazar kǝ Mattan, ya nǝ Mattan kǝ Yakub,
    16: ya nǝ Yakub kǝ Isuvu zhiila Maryam, Maryam wa yaayig kǝ Yesu kwa ɗahav dǝ Kǝristi.
    17: Baɗǝm nǝ hulfaatǝr ciigǝt tǝ Ibrahim dat Dauda, hulf kǝlawa tar uufaɗa, ciigǝt tǝ Dauda damma sarta kwa hutsavtǝra nǝ yaa Izraˈila damma Babila kiyava ɛɛva, hulf kǝlawa tar uufaɗa, ciigǝt ma sarta ɛɛvǝr ma Babila da tǝ sarta yiga Kǝristi, hulf kǝlaawa tar uufaɗa.
    18: Wan nǝ ɗuuli yava nǝ Yesu Kǝristi. Ma sartǝn ndza ɓǝlghara nǝ Isuvu kǝ dzǝgwambǝr kǝ Maryam babba Yesu. Lakuti kǝsgaan kiyava uusa, kaa dlǝghǝgadlǝghǝg kǝ iin kǝ huɗ tǝdvad Shǝɗǝkwa Daadamazhigǝla.
    19: Nahabi nǝ Isuvu jambuwaan kǝ tsǝgar zhǝru mataataka uudah biya, aɗaba uuda jiirjiir nǝ iina. Kaa ɓaa dabariya tagwav kǝ iin dǝ vakaiy ma ɗyamɗyamǝra.
    20: Masartǝn ba ndzǝgaan nǝ iin ba dzamaghǝra, kaa tlǝgaraatlǝg zǝrɓǝlga Yaazhigǝl ma sǝnnga, aiyama taa kǝ iina, “Isuvu zǝra Dauda, gǝdzbi kǝ kǝssa Maryam kiyava uusagh biya, aɗaba huɗɗǝn dǝvakai nǝ iinna dǝga Shiɗkwa Daadamazhigǝla.
    21: Da yigaan kǝ zǝra, agha da farva kǝ ɗaag Yesu, aɗaba iin wada katta uudahaan sagal ma haipahaatǝra.”
    22: Dzǝghardzǝg wanahaan baɗǝm mbakyarvad righǝvant nǝ dǝgiti tagada nǝ Yaazhigǝl tǝdvad tlayang taakiya,
    23: “Pakwara dǝghwa da dlǝghgaan kǝ huuɗa, da ya kǝ zǝra, da fǝvarva ɗaag Immanuela.” Dǝgiti tuuk vakai nǝ Immanuela, “Daadamazhigǝl ǝmtaɗ dǝ kǝmiyamma.”
    24: Ciyit ba nǝ Isuvu ma haara, kaa gatǝgaan kǝ iin kǝ dǝgiti taga nǝ zǝrbǝlga Yaazhigǝla. Kaa kǝsguukǝsǝg nǝ Isuvu kǝ Maryam nal kǝ uusaana.
    25: Farabi kǝ dzaghǝr biya, bamma tǝhala kwa yaa nǝ iin kǝ zǝraana, farva kǝ iin kǝ ɗaag Yesu.
  2:
    1: Tǝhalakwa yava nǝ Yesu ma kǝssa Bitalahami ma larda Yahudiya ma zamana Tlǝkǝs Hirudus, kaa sagat kǝ lii sǝrgasǝrǝg kǝ dǝgit tǝghǝr kwadladl dagat damma Wurshalima.
    2: Kaa ndavǝg kǝ iitǝr taakiya, “Mǝr nǝ tlǝksa Yahudahǝn kwa yavan ni? Aɗaba kǝmnda nǝghǝga kwadladlaan sagat dǝ sǝga, iin wa kǝmaa sagau nǝmnd sa ɓagarnǝs kwatnahǝra.”
    3: Cinngha ba nǝ Tlǝkǝs Hirudus ǝndkwana, kaa ba uushig kǝ ghǝrana, baz uudaha Wurshaliim baɗǝmma.
    4: Kaa dzahgantdzahǝg kǝ iin kǝ maalmaalah ma zhiila kǝsuufah ard lii tsaga adzahadzaha Muusa, ndavtǝru kǝ iin kǝ vakavaki da yaav dǝ Kǝristina.
    5: Am nǝ iitǝr taa kǝ iina, “Ma kǝsa Bitalahamiya, malarda Yahudiya. Aɗaba vinda bandkwah nǝ tlayanng taakiya,
    6: “‘Kǝgh Bitalahami ma larda Yahud ndakwani, agha ǝnkykwah bi nǝng ma lii kwara Yahud biya. Aɗaba da sagal ma kǝgh nǝ dadda kwarga, kwada piya uudahar Izraila.’”
    7: Kaa ɗahtǝrǝtɗahǝg kǝ Hirudus kǝ lii sǝrgasǝrg kǝ dǝgitǝn damma dlǝmmbaava, kaa nǝghǝgaakanǝghǝg kǝ iin vakaatǝr kǝ kalkala sarti nǝghara nǝ iitǝr kǝ kwadladlǝna.
    8: Kaa ɓǝltǝrǝtɓǝlǝg kǝ iin damma Baitalahami amaa, “Damdǝg ndan ndavamndavǝg bad hǝnkal kǝ vakavaki dǝ zǝriina, tǝhala kwama tlamaraatlǝga, am saas am tagǝwana, ghǝravar ndakwani ǝn dagal da ɓagarnǝs kwatnaha.”
    9: Ghyǝngara ba nǝ iitǝr kǝ cinnga ǝlbǝga tlǝkǝsna, kaa dagalaatǝr kǝ iitǝra, dlaɓa ka dagal kǝ iitǝr gata kwadladlǝn nǝghara nǝ iitǝr tǝvuukwatǝra, tangw da vakavakǝn ghaca nǝ iin tǝghǝr kǝ zǝriina.
    10: Nǝghara ba nǝ iitǝr kǝ kwadladlǝna, kaa hwaɗag kǝ iitǝr ba vaivaiya.
    11: Daragha ba nǝ iitǝr damma hǝnyahiina, kaa nǝghǝganǝghǝg kǝ iitǝr kǝ zǝriina ard babbaan Maryam, ar kǝla kǝ ghunj tǝvuukwana ar ɓaganǝs kǝ kwatnaha. Tǝhalakwaha, ar palna kǝ kadlangngahaatǝr ar vǝlar kǝ adawana ard tǝrshan lubban ard mur.
    12: Kaa gwiyaghǝra daas kǝ iitǝr damma kǝsaatǝr tǝ ɗuuli tlǝrna, aɗaba ɓǝlatǝraaɓǝlǝg nǝ Daadamazhigǝl kǝ magi ma sǝnng taakiya, aa gwiya darbi daa da vak Hirudus biya.
    13: Daral ba nǝ iitǝra, kaa tsǝgwatsug kǝ zǝrbǝlga Daadamazhigǝl vak Isuvu ma sǝnnga amaa, “Ciiga, kǝsantkǝsǝg kǝ zǝrna ard babbaana ǝmndǝramǝmndǝrǝg damma haaya Masara. Ndzamandzǝg vaakwaha, bamma tagankuratag lakuti am gwiyaghǝra saasa, aɗaba da gatǝgaan nǝ Hirudus kǝ zǝrǝn kiyava tsǝgaana.”
    14: Kaa ciig kǝ Isuvu kavǝɗa, kǝsant kǝ zǝrna ard babbaana, kaa dagal kǝ iin damma haaya Masara.
    15: Ndza kǝ iin vaakwaha tangwa damma sarta kwa ǝmtsa nǝ Hirudusa. Kwana dzǝghaar mbakyarvad righǝvant nǝ dǝgiti tagada nǝ Yaazhigǝl tǝdvad tlayanng taakiya, “Ɗahanant saa ma Masar kǝ zǝrara.”
    16: Nǝghaaka ba nǝ Hirudus taakiya, ɗyamɗyamǝr wa marararda lii sǝrga dǝgitna, kaa badza ǝrviɗmahuɗ kǝ iin ba vaivaiya. Kaa ba ɓǝlgantɓǝlg kǝ iin kǝ uudah da ciɓa zaraa ghwalvaha kwama Bitalahami baɗǝmma ard kǝsahaanǝn hǝrz dǝ iina, ciigǝt tǝ zǝr vuunj dat zǝra hǝi buwa, kalkal dǝ sartǝn tagarar nǝ lii sǝrgasǝrgǝn kǝ ǝlbǝg tǝghǝr kǝ zǝriina.
    17: Ma sarta kwahiin wa righavant nǝ dǝgiti tagavda tǝdvad tlayang Irmi taakiya,
    18: “Cinngavacinng nǝ huulǝg ma Rama, huulǝga badzǝga ǝrviɗmahuɗ ba vaivaiya, kats Rahil wa tuug mbakyarvad zarhaana, lawalǝg baz fa ǝrviɗya aɗaba zarhaani ǝmtsaharaǝmtsahǝga.”
    19: Tǝhala ǝmtsǝga Hirudusa, kaa tsugwatsug kǝ zǝrɓǝlga Yaazhigǝl vak Isuvu ma sǝnng ma Masara,
    20: amaa, “Ciiga kǝsantkǝsant kǝ zǝrna ard babbaana, gwig da damma haaya Izraila, adaba lii gata tsa shifǝga zǝrna, ǝmtsaharaǝmtsahǝga.”
    21: Kaa ba ciig kǝ iin kǝsant kǝ zǝrna ard babbaana, kaa daas kǝ iin damma Izraila.
    22: Cinngha ba nǝ iin taakiya Arkilayus zǝra Hirudus guyugwig kǝ daddaana, kwara larda Yahuda, kaa gǝdzǝg kǝ gwuya daas da vaakwaha. Bǝlavara ba nǝ magi ma sǝnnga, kaa kyǝha daas kǝ iin damma Galili.
    23: Kaa dagal kǝ iin ndza ma kǝsiin kwa ɗahav dǝ Nazarata. Righavant ǝndkwan nǝ dǝgiti tagara nǝ tlayangah taakiya, “Da ɗahav dǝ uuda Nazarata.”
  3:
    1: Ma hǝnngahaatsa, sǝghalsǝg nǝ Yuhwan dadda tsuufǝg da taa ǝlbǝg maraw ma tǝghala ma larda Galili,
    2: taakiya, “Pǝlampǝlǝg kǝ ghǝra aɗaba tlǝksǝra Daadamazhigǝl ba hǝrza.”
    3: Kwan wa ndza taga nǝ tlayang Ishay kǝ ǝlbǝg tǝghǝrǝna, taakiya, “Mǝng nǝ uud ɗaag ma tǝghala, amaa, ‘Ɓadlamarnaɓadlǝg kǝ ɗuul kǝ Yaazhigǝla, am ɓadlarna kǝ ɗuulaan ba ndǝɗɗa.’”
    4: Sǝɗavi tsǝguv nǝ Yuhwan ɓagava dǝ guja adlugwama, dǝga ndzǝɗa huɗaana ɓagava dǝ hǝluwa. Dǝgzǝgaana ndza ayayuwa ard yuwa mamma.
    5: Kaa ba sagau kǝ uudaha Wurshslim ard uudaha larda Yahudiya baɗǝmma, baz lii ma lardǝn dǝ Zaagha Judan da vakaana.
    6: Kaa tagaan kǝ iitǝr kǝ haipahaatǝra, ɓagtǝra kǝ iin kǝ tsuufǝg ma Zaagha Judan.
    7: Nǝgha ba nǝ iin kǝ Farisah ard Sadukiyah ba ɗyak da vakaan kiyava ɓagtǝr tsuufǝga, kaa amaa taa kǝ iitǝra, “Kuram faɗǝga ghavalahaan dǝ gurna! Warwaa ghudkura harɗa ngǝdlgarwa kǝ dlaɗa Daadamazhigǝlǝn sagauni?
    8: Ɓagamɓag kǝ dǝgitahi da mardamarg taaki pǝlamapǝlǝg kǝ ghǝra.
    9: Tsam bi kǝ kusǝgh taakiya, ‘Ibrahim nǝ daadamnd biya.’ Ən tagkurtaga, virɗigaravirɗig nǝ Daadamazhigǝl kǝ zarh kǝ Ibrahim dǝ kwanahaan kǝ akuraha.
    10: Bavǝtbǝg nǝ hiil tǝ suuha uufa, badǝm nǝ uufi lawalǝg kǝ yazǝr marawa, ghudvars ɓǝlǝvdǝm damma kaara.
    11: “Ən ɓagkur dǝ yu nai kǝ tsuufǝg kiyava mara taaki pǝlamapǝlǝg kǝ ghǝra, mǝng nǝ dadda kwa jakwaraajig dǝ ndanngǝr da sagau tǝ halara, tlanalbi nai aandzu kǝ kǝssa kimbakaan biya. Da ɓagkur dǝ Shǝɗkwa Daadamazhigǝla, ard kaar nǝ iin kǝ tsuufǝga.
    12: Kuwa bǝgaan bamma dǝvaana, da bǝggrzha kǝ hǝiyaana, da hutsǝdaan kǝ hǝiyaan damma kuvǝraana, da haars kǝ kaar kǝ hyahya dǝ kaari maay ǝmtsǝg biya.”
    13: Sagha ma kwahiin kǝ sart nǝ Yesu saama Galili, kaa dagal kǝ iin damma zaagha Wurdǝn kwakyarvad ɓagara nǝ Yuhwan kǝ tsuufǝga.
    14: Naha tsǝharvatsǝg nǝ Yuhwana, amaa taa kǝ iina, “Kai ndakwi mana naa magha ɓagwi nǝng kǝ tsuufǝga, agha sagau ndar dlaɓ nǝng sa vakari?”
    15: Ngugharangu nǝ Yesu amaa, “Aandz bandkwah ndakwana, aɗaba kalkalaan righvant nǝ dǝgiti naag nǝ Daadamazhigǝla.” Kaa haigaranthaig kǝ Yuhwana.
    16: Tǝhalakwa ɓagavara nǝ tsuufǝg kǝ Yesu, bad sagalaan ma yuwa, kaa wurgǝtwurg kǝ ghǝrazhigǝla, dlaɓa kaa nǝghǝganǝghǝg kǝ Shiɗǝkwa Daadamazhigǝl saay da tǝghǝr kǝ iin band garava kakura.
    17: Kaa cinngvacinnga nǝ ghai sii ma ghǝrazhigǝl taakiya, “Kwana iin nǝ zǝrara, ǝn waigaana dlaɓa ǝn cinngaan kǝ ǝmtakǝraan ba vaivaiya.”
  4:
    1: Ngal langaan nǝ Shiɗǝkwa Daadamazhigǝl kǝ Yesu damma tǝghala, kiyava fǝshgaan kǝ Shatanaha.
    2: Tǝhala kǝsgaana Yesu kǝ adǝla hǝng kwul uufaɗ ard vang kwul uufaɗa. Tǝhalakwaha kaa njǝkǝnjiig kǝ waiya.
    3: Kaa sagau kǝ Shatanaha, amaa taa kǝ iina, “Magha ba zǝra Daadamazhigǝla, nǝdalnǝg ci kǝ akurǝn kǝ bruudiya.”
    4: Kaa ngwangug nǝ Yesu amaa, “Vindavavindǝg ma kakaɗ Daadamazhigǝl taakiya, “‘Dǝgzǝg kalti bi wa hǝkya shifǝga uudbiya, bamma ǝlbǝgahi sagal vak Daadamazhigǝl baɗǝmma.’”
    5: Kaa lanngaan kǝ Shatanah kǝ Yesu damma Wurshalima kǝss ɗyak caccuwanacaccuwana. Ngal lanngdit dat ghǝra vǝgya Daadamazhigǝla.
    6: Aiyama taa kǝ iina, “Magha ba zǝra Daadamazhigǝla, dzǝvǝg ndan daaya. Aɗaba vindavavindǝg taakiya, “‘Da tagarta nǝ Daadamazhigǝl kǝ zǝrɓǝlgahaan, ar da tsǝkǝs kǝ dǝv haik kǝ tsǝgaan kǝ shigahagh tǝ akura.’”
    7: Ngugharangug nǝ Yesu, taa kǝ iina, “Vindavavindǝg dlaɓ taakiya, ‘Fǝsh bi kǝ Yaazhigǝl Daadamazhigǝlagh biya.’”
    8: Ngal gwiya lanngaan nǝ Shatanah damma ghǝra aghw ba kyakkwa, kaa margardmarg kǝ iin kǝ tlǝksǝraha duni ard ndangǝrahaatǝr baɗǝmma.
    9: Aiyam nǝ shatanah taa kǝ iina, “Ən vǝlakvǝlǝg kǝ kwanahaan baɗǝmma akwama kǝlghakǝlǝg kǝ ghwunj tǝvuukwara, agha ɓagwǝs kǝ kwatnahǝra.”
    10: Ngugharangug nǝ Yesu amaa, “Yagh vaakwan Shatanaha, aɗaba vindavavindǝg taakiya, “‘Ɓagarɓag kǝ kwatnahǝr kǝ Yaazhigǝl Daadamazhigǝlagha, ba iin pall wagha da ɓagarnǝs nǝng kǝ kwatnahǝra.’”
    11: Kaa dagalaan kǝ Shatanaha, kaa sagau kǝ zarabǝlga ar mǝlaruwa.
    12: Cinngha ba nǝ Yesu taaki viyavǝtviig nǝ Yuhwana, ngal dagal kǝ iin damma Galili.
    13: Ɗuwars kǝ iin kǝ Nazarat kaa dagal da ndzǝga ma Kafarnahum, kwandza tǝvǝgh kǝ yuwahaiya, tǝ ghaala dǝ larda Zebulun ard Naftali.
    14: Tǝdvadkwan kǝ ɗuul wa righǝvant nǝ dǝgiti tagada nǝ tlayang Ishai taakiya,
    15: “Larda Zebulun ard larda Naftali ma Galili, larda lii ar Yahudah biya. Lardǝn hǝrz dǝ yuwahayin tangw damma gyilga zaagha Wurduna.
    16: Uudahi ar ndzǝgama gurtla nǝgharanǝghǝg kǝ parakrakǝr ba vaivaiya, lii ndzǝga ma shiɗkwa ǝmtsǝg dlaɓa, sǝghawisǝg nǝ parak da tǝghǝr kǝ iitǝra.”
    17: Ciigǝt tǝ kwahiin kǝ sart wa fǝgharzha nǝ Yesu kǝ taa ǝlbǝg maraw taakiya, “Pǝlampǝlǝg kǝ ghǝra aɗaba tlǝkǝsǝra ghǝrazhigǝl ba hǝrza.”
    18: Tǝ ɗuula dagal nǝ Yesu tǝvǝgh kǝ Yuwahaiya Galili, kaa nǝghǝganǝghǝg kǝ iin kǝ zarha baabah buwa, Siman kwa ɗahav dǝ Bitrusa, ard zǝra babbaan Andrawusa, ar ɓǝla amshiya vaiya kilfatǝr ma yuwahaiya, aɗaba ar lii vaiya kilf nǝ iitǝra.
    19: Am Yesu taa kǝ iitǝra, “Gatamkwagatǝga, ǝnda nǝkurdalnǝg kǝ lii vaiya uudah da vakara.”
    20: Batwatsǝra ar ɗuwars kǝ dǝgaha vaiya kilfaatǝra, kaa gata Yesu kǝ iitǝra.
    21: Tǝghǝrdǝga dagala, kaa gwuya nǝghǝganǝghǝg kǝ iin kǝ zarha baabah buwa, Yakuba ard zǝra babbaan Yuhwana zarha Zabadi. Ar ma pɛrayu ǝmtaɗ dǝ daddaatǝr Zabadi, ar ɓadla amshiya vaiya kilfatǝra, kaa ɗahtǝrǝt kǝ iina.
    22: Batwatsǝra kaa ɗuugarsɗuug kǝ iitǝr kǝ pɛrayuwaatǝr ard daddaatǝra, kaa gata Yesu kǝ iitǝra.
    23: Gwaivagwaig nǝ Yesu ma Galili baɗǝmma, tsagtǝr dǝgit ma guda dzugwazhigǝla, dlaɓa taa ǝlbǝg marawa tlǝkǝsǝra Daadamazhigǝla, mbahǝgaan dlaɓ aandzu hulfa kwar kǝ kuzaha, ard lii yang biya.
    24: Cinngalcinng nǝ ǝlbǝg tǝghǝr kǝ iin baɗǝmma ma haaya Suuriya. Kaa ba lanngaan kǝ uudah kǝ lii dǝ kuzah baɗǝmma, ard lii yangbiyah shahshaha, ard lii hǝɓa dlaɗa, ard makwayaha, ard lii ciɓǝg nǝ Shatanah baz lii ǝmtsamtsan nǝ vǝgh mbahavtǝrambahǝg baɗǝmma.
    25: Kaa gatǝgaan kǝ dzahava uudah ba ɗyaka ma Galili, dlaɓa ard lii ma larda Dikafulis ard Wurshalima, ard lii ma larda Yahudiya baz lii gyilga zaagha Wurdǝna.
  5:
    1: Nǝghgha ba nǝ Yesu kǝ dzahava uudah baɗyaka, kaa dagat kǝ iin damma ghwaa, cǝhura kǝ iina. Kaa ba dagau kǝ mbǝrzahaan da vakaana.
    2: Ngal farzha kǝ iin tsagtǝr dǝgita.
    3: “Ar dǝ bark nǝ lii sǝrgasǝrg kǝ hǝtsǝgalhǝtsǝgaatǝr ma gata Daadamazhigǝla, aɗaba tlǝksǝra ghǝrazhigǝl dǝgaatǝra.
    4: Ar dǝ bark nǝ lii dǝ badzǝga rǝviɗmahuuɗa, aɗaba da tagǝvtǝrtag nǝ dzǝgwagha.
    5: Ar dǝ bark kanadiyaha, aɗaba ar da gwigaan kǝ duniya.
    6: Ar dǝ bark nǝ lii kǝma ɓa dǝgiti naag Daadamazhigǝla, aɗaba ar da baghǝga.
    7: Ar dǝ bark nǝ lii mara zhuwadaala, aɗaba da marvǝtǝrmarǝg nǝ zhuwadaala.
    8: Ar dǝ bark nǝ lii caɗaɗ nǝ ǝrviɗmahuda, aɗaba ar da nǝghǝganǝhǝg kǝ Daadamazhigǝla.
    9: Ar dǝ bark nǝ lii fa gabǝra, aɗaba da ɗahvǝtǝrɗahǝg dǝ zarha Daadamazhigǝla.
    10: Ar dǝ bark nǝ lii hǝɓa dlaɗ kwakyarvad ɓa hɛrǝrra, aɗaɓa tlǝkǝsǝra ghǝrazhigǝla dǝgaatǝra.”
    11: “Am dǝ bark nǝ uurama, akwama ar ɗaava kuram nǝ uudaha, ar vǝlkur kǝ dlaɗa, dlaɓa ar ɓagkura kǝ dǝga kǝlaadǝrah shahshah mbakyarvad kaiya.
    12: Dlayamdlaiga am hwaɗag ba vaivaiya, mbakyarvad am da tlǝkǝnatlǝg kǝ dǝgshigaru baɗyak ma ghǝrazhigǝla. Aɗaba vǝlartǝr bandkwah nǝ uudah kǝ dlaɗ kǝ tlayanngahi sarǝv lakuti kǝskurama.
    13: “Kuram nǝ iizha duniya. Akwama maadlai nashnash nǝ iizh biya, da gwiya gwivdaa ndar nǝ nashnashani? Maadlai tlǝraan biya, bamma ɗivda dagala, hapǝna nǝ uudaha.
    14: “Kuram parak duniya. Akwama favafǝg nǝ kǝs tǝ gavala shiɓvǝna biya.
    15: Maay mbiyav nǝ kaara jahuramba humbvara kǝghai biya, bamma hǝrtǝvǝt tǝ dǝga hǝrtǝgaan vakavaki da ba parakrak kǝ uudahi hǝnnyah baɗǝma.
    16: Bandkwah dlaɓa, parakaruwa aandz ba pǝripǝri tǝvuukwa uudaha, kiyava nǝghǝganǝghǝg kǝ iitǝr kǝ dǝgitah marawi am ɓag nǝ uurama, ar da fǝgaarafǝg kǝ Daadaruwi ma ghǝrazhigǝla.
    17: “Tlatlam bi taakiya sanhi mbakyarvad ǝn kalarwut kǝ Adzahadzah Musa ard tsaga tlayanngah nai biya, sanhi mbakyarvad ǝn righanta.
    18: Ba jiirjiir wan tagkurtaga, lakuti ghyǝng nǝ zhigǝla ard haaya, maay nǝ dǝgit aandzu ba hǝɗikǝn ma vindǝga Adzahadzaha Muus kwada nig biya, bamma righavantrighǝg baɗǝmma.
    19: Mbakyarvad kwaha baɗǝm daddakwa kǝladakǝlǝg aandzu ba pal ma adzahadzahahaan hǝɗikǝnna, tsagtǝru dlaɓ kǝ kǝla adzahadzahahaan kǝ uudaha, da ɗahav nǝ iin daddakwa ǝnkykwah ma tlǝkǝsǝra ghǝrazhigǝla. Baɗǝm nǝ daddakwa gatǝgaan kǝ adzahadzahiina, dlaɓa tsagartsag kǝ uudaha, da ɗahav nǝ iin dǝ uud maamal ma tlǝkǝsǝra ghǝrazhigǝla.
    20: Ən tagkurtaga, akwama jamtǝruubi kǝ lii tsaga adzahadzaha Muus ard Farisah dǝ jiir biya, am dǝgaa bi damma tlǝkǝsǝra ghǝrazhigǝl biya.
    21: “Cinngamacinng ndza tagavtǝrdatag kǝ daadijaharu taakiya, ‘Tsǝbi kǝ shifǝg biya, baɗǝm daddakwa tsǝga shifǝga, da tǝvartǝg nǝ shariya.’
    22: Aiciya ǝn tagkurtaga, baɗǝm nǝ daddakwa nguɗa ǝrviɗmahuɗ dǝ zǝraabaana, da tǝvartǝg nǝ shariya. Daddakwa ɗahgarva zǝraabaan taakiya maay nǝ dǝgiti agha tuukvakai biya, da lanngav damma guda ta shariya, dlaɓa daddakwa ɗahgarva zǝraabaan dǝ dlaga, dlaiyaan ɓǝlǝvdǝm damma kaara faiya.
    23: “Kwakyarvad kwaha, akwamagha ɗiya baiku tǝ bagadiya kyulǝga, kaa dzamnadzamǝg kǝskǝgh taakiya hǝkyakahǝkyig nǝ zǝraabagh ma ǝrviɗmahaɗaana,
    24: faffǝg kǝ baikuwaghǝn tǝvuukwa bagadi ndana, dǝga agha ɓaga kǝ gabǝrǝr dǝ zǝraabagh bazǝngwa. Ka sagau kǝskǝgh da ɗiya baikuwagha.
    25: “Akwama da ɗiya ghunjagh nǝ uudana, ɓag kǝ gabǝrǝr dǝ iin tǝ watswats tǝghǝrdǝg lakuti damma guda ta shari. Akwama maay ǝndkwah biya, da langaklang davak alkali, alkali dlaɓa da langaklang davak yaa dela, ar ɓǝlkadǝm ma guda bǝrfina.
    26: Bak jiira wan tagaktaga, lakuti sǝkadasǝg nǝ uud vaakwaha, bamma pǝlghapǝlǝg kǝ kwaɓi gatak nǝ uud baɗǝmma.
    27: “Cinngamacinng ndza tagavdatag taakiya, ‘Ɓagam bi kǝ gwaragwar biya.’
    28: Aiciya ǝn tagkurtag, baɗǝm nǝ daddakwa vazǝna dǝkhǝra, dlaɓa kaa kǝmgaan kǝ iina, ɓagaaɓag kǝ gwaragwar dǝ vakai ma ǝrviɗmahuɗaana.
    29: Akwama fǝkaa kǝ ɓa haip nǝ gyiya dǝvaakaffagha, tǝdatǝɗǝga agha ɓǝldana. Ngulǝm maay ba nǝ uuɓiya vǝghagh pal tǝghǝr kwada ɓǝlǝvdǝm nǝ vǝghagh baɗǝm damma kaara faiya.
    30: Akwama fǝkaa kǝ ɓa haip nǝ dǝvaakaffagha, ghwudaghudǝga agha ɓǝldana. Ngulǝm maay ba nǝ uuɓiya vǝghagh pal tǝghǝr kwada ɓǝlǝvdǝm nǝ vǝghagh baɗǝm damma kaara faiya.
    31: “Tagavdatag dlaɓ taakiya, ‘Daddakwa tagwavatagw dǝ uusaana, barari ghudara kǝ kakaɗa tagwavǝgh dǝ iina.’
    32: Aiciya dǝgiti ǝn tagkurnaiya in taakiya, akwama tagwavatagw nǝ uudan dǝ uusaan kwakyarvad haipa gwaragwar biya, fadǝmfǝg ma ɗuula ɓa gwaragwara. Baɗǝm daddakwa kǝsguukǝsǝga, ɓa ba gwaragwar dǝ iina.
    33: “Gwaastaana, cinngamacing tagavtǝratag kǝ daadijaharu taakiya, ‘Kǝldabi kǝ lanngiyagh biya, bamma agha righant kǝ langiyi tǝghara nǝnng kǝ Yaazhigǝla.’
    34: Aiciya dǝgiti ǝn tagkurnaiya in taakiya, zambi kǝ ngwaɗǝg ba linnglinng biya, aandzu dǝ ghǝrazhigǝl biya aɗaba vaka ndzǝgana Daadamazhigǝla.
    35: Zambi dlaɓ kǝ ngwaɗǝg dǝ haay biya, aɗaba vaka fa shiga Daadamazhigǝla, bi dǝ Wurshalima aɗaba iin nǝ kǝssa Tlǝkǝs ɗyaka.
    36: Zǝbi dlaɓ kǝ ngwaɗǝg dǝ ghǝragh biya aɗaba agha nǝdalbi kǝ guja ghǝragh aandzu pall kǝ maɗukwa bi gyangw biya.
    37: Dǝgiti ɓagaaɓaga kǝ maraw kǝ taga iin taakiya, ‘Aana,’ bi ‘Əndkwah biya’, majuujig ma kwana, aasǝgal vak shatanaha.
    38: “Cinngamacinng tagavdatag taakiya, ‘Gyiya dlakulva gyiya, tlǝrɗ dlaɓa dlakulva tlǝrɗa.’
    39: Dǝgiti ǝn tagkur naiya, akwama naa ɓa dǝgit ghwaɗ nǝ uudan tǝ kǝgha, ɓagarbi kǝ uushav biya, ma ɓǝlakaɓǝlǝg nǝ uudan kǝ mahupeng tǝ uumǝla dǝvaakaffa, agha guyarant ghyaba kwah palla.
    40: Akwama ɗiyakaaɗiig nǝ uudan kǝ ghunnj kwakyarvad kǝskava kǝ angyuwagha, agha vǝlar baz amugdiyagha.
    41: Akwama fakaafǝg nǝ gwarǝɗ kǝ dagala mil palla, dǝgdagal ǝmtaɗ dǝ iin kǝ dǝga mil buwa.
    42: Akwama ghalaaghalǝg nǝ uudan kǝ dǝgit vakagha, agha vǝlara. Dlaɓa ma sǝghǝvsǝg nǝ uudan sa kǝla gǝmau vakagha, piyarda biya.
    43: “Cinngamacinng tagavdatag taakiya, ‘Waig kǝ zǝraabagha, agha ɗuwant kǝ tlǝghumagha.’
    44: Aiciya, ǝn tagkurtaga, wayamwaig kǝ tlǝghumaharuwa, dzǝgwamtǝrdzǝgw kǝ zhigǝl kǝ lii vǝlkur dlaɗa
    45: Tǝdvad ɓakwan wam da nǝg nǝ uuram kǝ zarha Daadaru kwama ghǝrazhigǝla, kwa fǝgara kǝ faci kǝ ɓa parakrakǝr tǝghǝr kǝ yaa daddaha jiira ard lii ɓa kǝlaadǝra, hyitǝrhyig dlaɓ kǝ yu kǝ yaa daddaha jira ard yaa daddaha kǝlaadǝra.
    46: Akwamam waiya ba lii waiya kuram nǝ uurama, auci nǝ dǝgshigi am da tlǝkǝna nǝ uurami? Aandzu lii dzaha hadam ndakwi ar ɓagaan bandkwana.
    47: Akwamam tagtǝr bak zaraabaharu nǝ uuram kǝ uusa, auci gǝrgǝraru dǝ kyalma uudahi? Aandzu kǝrdiyah ndakwi ar ɓagaan bandkwaha.
    48: Mbakyarvad kwaha, namalnǝg kǝ yaa daddaha jiira band Daadaru kwama ghǝrazhigǝla.
  6:
    1: “Famfǝg kǝ hyǝmiya aa nal bi nǝ gata Daadamazhigǝlaru kǝ dǝga nǝgha gyi biya, aɗaba ma ɓagamaɓag ǝndkwaha, am da tlǝkna bi kǝ dǝgshigaru vak Daadaruwi kwama ghǝrazhigǝl biya.
    2: “Mbakyarvad kwaha, akwamagha da vǝlgar dǝgit kǝ uuda, kutbi ma ghai bandkwa ɓag nǝ muniyah ma guda dzǝgwazhigǝl ard dǝ ɗuulah kiyava dlǝbǝvtǝrǝt biya, ba jiirjiira wan tagkurtaga, cauwaracaug kǝ dǝgshigaatǝr ba ma kwahiina.
    3: Akwma agha da mǝlgaru kǝ dadda kwa maay dǝ vakai biya, aa sǝrabi nǝ dǝvaa ghyaɓagh kǝ dǝgiti ɓag nǝ dǝvaa kafagh biya.
    4: Aɗaba dǝgaha jiirjiiri kwa ɓagha nǝnng shiɓashiɓana, nǝghǝganǝghǝg daadagh baɗǝm kǝ dǝgitah ɓagha nǝng shiɓashiɓana, da vǝlakvǝlǝg kǝ dǝgshǝgagha.
    5: “Akwamam da dzǝgwazhigǝla, ɓagam bi ǝndkwa ɓag nǝ muniyah biya, aɗaba ar naaba dzǝgw vaka ghacgan kǝ zhigǝla ma guda dzǝgwazhigǝla ard barama ɗuula kiyava nǝghtǝrnǝghǝg kǝ uudaha. Ba jiir wan tagkurtaga, tlarkǝnatlǝg kǝ dǝgshigaatǝra.
    6: Akwamagha da dzǝgwazhigǝla, dǝg daadama gudagha, agha hǝdarduwa. Agha dzǝgwa kǝ zhigǝl kǝ Daadaghi kwa nǝghva biya, Daadaghi kwa nǝghǝganǝghǝg kǝ dǝgiti ɓagav shiɓashiɓana, da vǝlakvǝlǝg kǝ dǝgshigagha.
    7: “Akwamam dzǝgwazhigǝla, gwayamars bi ǝnd lii sǝrgabi kǝ Daadamazhigǝl biya, aɗaba ar tlatla taaki ma dzǝgwaradzǝgw kǝ zhigǝl tlaɗɗa da cinngtǝrnuu ǝndkwah nǝ Daadamazhigǝla.
    8: Ɓagam bi ǝnd dǝgaatǝr biya, Aɗaba sǝrgasǝrg nǝ Daadaru kǝ dǝgiti am naag nǝ uuram lakuti am ghalgaana.
    9: “Dzǝgwamdzǝgw kǝ zhigǝl ǝndkwana. “‘Daadamnd kwama ghǝrazhigǝla, aa fǝvaarafǝg nǝ ɗaagagha,
    10: tlǝksǝragha aasasǝga, dǝgiti agha naag nǝng aa ɓagvǝnaɓag ma duni bandkwa ɓagav ma ghǝrazhigǝla.
    11: Vǝlkǝmndvǝlǝg kǝ dǝgzǝg haniina dlaɓa ba kǝlahǝnga.
    12: Ɓǝshkǝmndanaɓǝshig kǝ haipahamnda, bandkwa kǝm ɓǝshtǝr nǝmnd kǝ lii ɓagkǝmnd haipaha.
    13: Langkǝmnd bi da vaka fǝshig biya, katkǝmndkatǝg vak Shatanaha.’
    14: “Aɗaba ma ɓǝshamtǝrnaɓǝshig kǝ lii ɓagarkura haipa, Daadaruwi ma ghǝrazhigǝl ndakwi da ɓǝshkurnaɓǝshiga.
    15: Akwama ɓǝshamtǝrnaa bi kǝ haipahaatǝr kǝ uudah biya, da ɓǝshkurna bi dlaɓ nǝ Daadaru kǝ haipaharu biya.
    16: “Akwamam da kǝsa andǝla, badzam bi kǝ huɗvǝgaru ǝnd kwa ɓag muniyah biya, ar badzǝda kǝ huɗvǝgaatǝr kiyav sǝrvan taakiya ar kǝsa andǝla, bak jiirjiira wan tagkur naiya, tlarkǝnatlǝg kǝ dǝgshigahaatǝra.
    17: Akwamagha kǝsa andǝla, agha barda kǝ huɗvǝgagha, agha massa kǝ wal tǝ ghǝragha,
    18: aɗaba aa nǝghvaakai taakiya agha kǝsa andǝl biya. Daadaghi kwa nǝghǝva biya, dlaɓa kwa nǝghǝganǝghǝg kǝ dǝgǝti ɓagav shiɓashiɓana, da vǝlakvǝlǝg kǝ dǝgshigagha.
    19: “Dzahamar bi kǝ alman kǝ ghǝraru ma duni biya, vakavaki da badzǝdabadzǝg nǝ agatla ard kwalaviyavi biya, ɗlaɓa ard vakavaki da dǝgaadǝg nǝ gǝlah ar ghǝluwa.
    20: Bammam dzaharu kǝ alman kǝ ghǝraru ma ghǝrazhigǝla, vakavaki da badzǝda bi nǝ agatla ard kwalaviyavi biya, dlaɓa vakavaki da dǝgaa bi nǝ gǝlah ar da ghǝlu biya.
    21: Aɗaba vakavaki da almanagha, dzamaghǝragh ndakwi ba vaakwaha.
    22: “Gyiya band kaara jahurammb nǝ iin kǝ vǝgha, akwama ba lapi nǝ gyiyahagh, baɗǝm nǝ vǝghagh da ba parak ba vaivaiya.
    23: Akwama yang bi nǝ gyiyahagh biya, baɗǝm nǝ vǝghagh ba gurtla. Akwama nalnǝg nǝ paraka vǝghagh kǝ gurtla, ba jiirjiira da ba ɗyak ba vaivai nǝ gurtlǝna!
    24: “Maay wa ɓagarnǝsɓag kǝ kwatnahǝr kǝ dadda hǝnyahah bu biya, bi ɗuwant kwa palla, nahant kwa palla, bi hǝkyina kǝ palla nenna kǝ palla, ɓaga bi taakiya am nahant kǝ Daadamazhigǝla am nahant kǝ kwaɓ biya.
    25: “Mbakyarvad kwaha, ǝn tagkurtaga ndavam bi kǝ dǝgiti am da zǝgaru nǝ uuram kǝ shifǝgaru biya, ard dǝgiti am da hǝɓǝg nǝ uuram biya, dlaɓa ard ɗuuli am da tlǝkǝna nǝ uuram kǝ sǝɗav dat vǝgharu biya. Mbats juu bi nǝ shifǝg kǝ dǝgzǝg biya? Nii juu bi ha nǝ vǝgh kǝ sǝɗavahi?
    26: Vazamvazǝg kǝ ɗiikah ndana, ar maay riig biya, ar maay ghuda hǝi biya, ar maay dlaɓ dzaagaan damma kuvǝr biya, bakǝvakwaha gǝltǝrgǝlǝg Daadaruwi kwama ghǝrazhigǝla, jamtǝru bi nǝ uuram kǝ iitǝr dǝ ndangǝr biya?
    27: War ma kuram mbakyarvad dzama dǝgiti tǝ ghǝraan fǝgarnaafǝg kǝ hǝnngah aandzu ba hǝɗikǝn kǝ ghǝraani?
    28: “Aujilbǝg kǝskuram dzama sǝɗavi am da nguɗǝg nǝ uurami? Vazamvazǝg kǝ ɗuuli ghubarǝg nǝ kwadladlah ndana, ar maay ɓa tlǝra aandzu haa sǝɗav biya.
    29: Bakǝvakwaha ǝn tagkurtaga, aandzu Saluman ma ndzǝgana ndangǝraan ndakwi tapghǝnai kǝ caɗvacaɗǝg ǝnd palǝraatǝr biya
    30: Aitsaa, akwama caɗnacaɗǝg Daadamazhigǝl kǝ kazhakwa tǝghal ǝndkwana, kwar mǝng haniina dlakadur ɓǝlvǝtǝrdǝm damma kaara, kyakaɗaava kuram ha wada vǝlkur bi nǝ iin kǝ sǝɗav hi? Kuram lii hǝtsahǝtsan fadghǝrna.
    31: “Mbakyarvad kwaha, ndavam bi taakiya, ‘Auwa kǝm da zǝg nǝmndi?’ Bi ‘Auwa kǝmnda hǝɓɓǝg nǝmndi?’ Bi ‘Auwa nǝ dǝgiti kǝmnda nguɗǝg nǝmndi?’
    32: Aɗabad kwaha lii sǝrga bi kǝ Daadamazhigǝl biya, iitǝr lii gata kwanahaan kǝ dǝgitah baɗǝmma. Sǝrgasǝrǝg nǝ Daadaru kwama ghǝrazhigǝl taakiya am naagaan kǝ kwanahaan kǝ dǝgitaha.
    33: Gatamgatǝg kǝ tlǝkǝsǝra Daadamazhigǝl ba zǝnngwa, ard dǝgiti naag nǝ iina. Da vǝlkurvǝlǝg kǝ kwanahaan kǝ dǝgitah baɗǝmma.
    34: Mbakyarvad kwaha, ndavambi kǝ dlakadur biya, aɗaba dlakadur sagau bad dlaɗaana, dlaɗa hinan ndakwi tlaltlǝg kwakyarvad haniina.
  7:
    1: “Tar bi kǝ shari kǝ uudah biya. Akwama ɓaghiniɓaga, ar da taktǝg nǝ uudaha kǝ shariya.
    2: Aɗaba hulfa shariyi am tǝgar nǝ uuram kǝ uudaha, da tǝkur bandkwah nǝ uud kǝ shariya, kuwǝn am kurgar nǝ uuram kǝ uudah dǝ vakaiya, da kurkur bad vakai nǝ uuda.
    3: Aujilbǝg agha vaza zǝr afǝsafǝsa dǝga dakari ma gyiya zǝraabagh kwal fataaɗ kǝskǝgh tǝ gugyǝmba dakari ma gyiyaghi?
    4: Agha tagar ndar kǝ zǝraabagh taakiya, ‘Ən sǝkadasǝg kǝ zǝr afǝsafǝsa dǝga dakarǝn ma gyiyaghǝn,’ mbats kǝgh ndakwani gugyǝmba dakar wa ma gyiyaghi?
    5: Kǝgh muunina, kǝsdakǝsǝg kǝ gugyǝmba dakarǝn ma gyiyaghǝn ndana, kiyava nǝghǝganǝghǝg kǝskǝgh ba caɗaɗɗa lakuti agha da kǝsa zǝr afǝsagǝsa dǝga dakarǝn ma gyiya zǝraabaghǝna.
    6: “Vǝlamtǝr bi kǝ ghǝgyah kǝ dǝgiti caccuwanacaccuwanan biya, aɗaba ar da gwiyav ar tahkurdana. Vǝlamtǝr bi dlaɓ kǝ jindararu kǝ ghavzah biya, aɗaba ar da hapgaana.
    7: “Ghalamghalǝga, da vǝlǝkurvǝlǝg nǝ uuda, gatamgatǝga, am da tlǝkǝnatlǝga, ngadlamngadlǝga, da wurkurwurǝg nǝ uud kǝ ghaiya wakyagha.
    8: Aandzu kwar kǝ dadda ghalǝga vǝlvarvǝlǝga, aandzu kwar kǝ dadda gatǝga tlǝkǝnatlǝga, aandzu kwar kǝ dadda ngadla wakyagha da wurvarwurǝg nǝ wakyagha.
    9: War ma kuram daadaha, akwama ghalaaghalǝg nǝ zǝraan kǝ bruudi, vǝlar kǝ akuri?
    10: Nii ma ghalaaghalǝg nǝ zǝran kǝ kilfa, vǝlar kǝ ghaval dlakulvaan hi?
    11: Akwama kurami dangw huɗaharu am sǝrgasǝrǝg kǝ vǝlǝga dǝgit maraw kǝ zarharuwa, kyakaɗava daadaruwi ma ghǝrazhigǝli kaci wa da vǝltǝr bi kǝ dǝgitah maraw kǝ lii ghalǝgan biya!
    12: “Baɗǝm nǝ dǝgitahi am naag nǝ uuram ɓagkura nǝ uudaha, kuram ndakwani ɓagamtǝrɓaga. Aɗaba kwan wa tagada nǝ adzahadzaha Muus ard tlayanha.
    13: “Tamtǝg kǝ ghaiya wakyaghǝn jǝghwna, aɗaba ɗuula daas da vaka ǝmtsǝga ba bahahha, dlaɓa kwanǝn kǝ ɗuula ba tsalalla. Lii tǝgaana ar ba dyaka.
    14: Ɗuula tlǝkǝna shifǝga. Ba jǝghwa nǝ iina, dlaɓa dladlaɗ nǝ tǝgaana. Lii tǝgaana ar maay ɗyak biya.
    15: “Famfǝg kǝ hyǝmmi tǝ tlayangaha fiidfiida kwar sahasagaw da vakaru dǝ garava tughaha, ma huɗmahuɗa ar jagajagaan band ghǝgyaha tǝghala.
    16: Am da nǝghǝtǝraakanǝghǝg tǝdvad tlǝrahaatǝra. Cagvacag nǝ zarha inabi tǝ uufa takka? Nii cagvacag ha nǝ zǝra ghǝgyiv tǝ zaz hi?
    17: Bandkwah dlaɓ makwar kǝ uufi marawa yaa ba zǝr marawa, uufi ghwaɗa, ya zǝr ghwaɗa.
    18: Maay nǝ uufi maraw ya zǝr ghwaɗ biya, dlaɓa uufi ghwaɗa yiga bi kǝ zǝr maraw biya.
    19: Baɗǝm nǝ uufi maay ya zǝr maraw biya, aa ghudvarsghudǝga, ɓǝlvdǝm damma kaara.
    20: Mbakyarvad kwaha am da nǝghǝgaakanǝghǝg kǝ tlayanngaha fiidfiid tǝdvad tlǝrahaatǝra.
    21: “Ɗǝm bi dadda kwa taa kǝskai ‘Yaazhigǝl, Yaazhigǝl’ da daas damma tlǝksǝra ghǝrazhigǝl biya, bamma dadda kwa ɓagaaɓag kǝ dǝgiti naag nǝ Daadar kwama ghǝrazhigǝla.
    22: Daghuvala ta shariya, ar da tagwatag nǝ uudaha baɗyak taakiya, ‘Yaazhigǝl, Yaazhigǝl, tagamnda bi kǝ ǝlbǝg maraw ma ɗaagagh biya? Lagwamndada bi kǝ shatanah ma ɗaagagh biya? Ɓagamda bi kǝ dǝgaha jappǝr baɗyak ma ɗaagagh biya?’
    23: Tǝhala kwaha, ǝnda tagtǝrtag taakiya, ‘Ən sǝrkur bi ba dǝm biya. Yagham vakar kǝlaadahaana.’
    24: “Mbakyarvad kwaha baɗǝm daddakwa cinnghacinng kǝ ǝlbǝgara, dlaɓa ɓagaan kǝ tlǝr dǝ vakaiya, da nǝg band dadda dabari kwa ndǝraa vǝgyaan tǝ akurna.
    25: Hyiyaa ba nǝ yuwa, kaa righǝtrighǝg nǝ zaagha kǝla saasa, fǝɗ ndakwi tsa saas dat hǝnyahiina, bakǝvakwaha dlǝghana biya, aɗaba ndǝrava tǝ akura.
    26: “Baɗǝm daddakwa cinnghacinng kǝ ǝlbǝgara, dlaɓa ɓagaa bi kǝ tlǝr dǝ vakai biya, ba kalkal dǝ dlagǝn kwa ndǝraa hǝnyahaan tǝ sǝghǝla.
    27: Hyiyaa ba nǝ yuwa, righǝtrighǝg nǝ zaagha, fǝd ndakwi tsa saas dat hǝnyahiin, kaa dlǝga, dlagaadlag bafakya.”
    28: Ghyǝnga ba nǝ Yesu tagtǝr kwanahaan kǝ dǝgitaha, kaa ba ɓa jappǝr kǝ uudah dǝ tsagaanana.
    29: Aɗaba tsagatǝr band daddakwa dǝ ndzǝɗa, gǝrgǝr dǝ tsaga lii tsaga adzahadzaha Muusa.
  8:
    1: Sahi ba nǝ Yesu sii ma aghwa, kaa gatǝgaan kǝ uudaha baɗyaka
    2: Kaa sagau kǝ dadda vǝc da vakaana, kǝla kǝ iin kǝ ghunj tǝvuukwaana amaa, “Yaazhigǝla, ma haighanthaiga, mbǝkwimbǝga.”
    3: Kaa vǝlla dǝv kǝ Yesu tapǝna kǝ dadda vǝcna amaa, “Haiyananthaiga, mbambǝga.” Batwatswatsǝra, kaa mbǝgambǝg kǝ iina.
    4: Aiyam nǝ Yesu taa kǝ iina, “Faffǝg kǝ hyǝmmiya tagar bi aandzu kǝ war kǝ dǝgiti aa dzǝgardzǝgǝn biya, dǝg mardamarǝg kǝ ghǝragh vak zhiila kǝsuufa, agha vǝlda kǝ baiku bandkwa tagada na adzahadzaha Musa. Ɓagnaɓag kwana kiyava fadghǝr kǝ dlamakǝlaawa taakiya mbǝghambǝga.”
    5: Dagha ba nǝ Yesu damma Kafarnahum, ngal dagau kǝ tlauja Rum maamal da vakaan da ghalgaan taakiya,
    6: “Yaazhigǝla, kwatnahar hǝngan hǝnyah ǝmtsamtsan nǝ vǝgha, hǝɓa dlaɗ ba vaivaiya.”
    7: Aiyam Yesu taa kǝ iina, “Ən dagau da mbǝgaana.”
    8: Kaa ngugwamgug kǝ tlauj maamalna amaa, “Yaazhigǝla, tlanal bi nai kǝskǝgh kǝ sagau sa vǝgyar biya, tagdatag ba kǝ ǝlbǝg kalti kwatnahar da mbǝga.
    9: Aɗaba kai dǝghǝrar ndakwani ǝn mazhangyil kǝ kwarǝga uuda, mǝng dlaɓ tlaujah mazhangyil kǝskaiya, ǝn tagardatag kǝ pallaatǝr taakiya, ‘Dǝga,’ kaa dagauwa. Kwatlǝrǝn dlaɓ ǝn ɗaagantdaaga taakiya, ‘Sawa,’ sagauwa, Akwama taganartag dlaɓ kǝ kwatlǝrǝna, ‘Ɓagnaɓag kǝ dǝgit ǝntkwaha,’ kaa ɓagaana.”
    10: Cinngha ba nǝ Yesu ǝndkwaha, kaa ɓa jappǝr kǝ iina, aiyama kǝ lii gatǝgaana, “Ən tagkurtag kǝ jiira, tapanna bi kǝ tlǝkǝnatlǝg kǝ uud dǝ fadghǝr ǝndkwan ma Izrail biya.
    11: Ən tagkurtaga, baɗyak nǝ uudah ar da sii dǝ sǝga ard sagat dǝ sǝga ar da cihurgan ǝmtaɗ dǝ Ibrahim ard Ishaku ard Yakub vaka za kaffa hwaɗag ma tlǝkǝsǝra ghǝrazhigǝla.
    12: Aɗaba uudahi ɓadlavtǝrna kǝ iitǝr nǝ tlǝksǝra ghǝrazhigǝla, da ɗiivtǝrdǝm damma gurtla, vakavaki ar da tuug nǝ iitǝr ard ghwada dǝv dǝ tlǝrɗa.”
    13: Aiyam nǝ Yesu taa kǝ tlauja maamalǝna, “Dǝgdaasa, da ɓagakɓag nǝ uud mbakyarvad fadghǝragha.” Kaa mbǝg nǝ kwatnaha nǝ iina batwatsǝra.
    14: Dagha ba nǝ Yesu da vǝgya Bitrusa, kaa nǝghǝganǝghǝg kǝ iin kǝ babba uusa Bitrus ɓǝlgan njǝkǝn fǝɗa.
    15: Tapǝna kǝ iin kǝ dǝva uusiina, kaa mbǝgambǝg kǝ iin tuuk kǝ fǝɗiina, ngal ciiga ɓagtǝra kǝ dǝgzǝga.
    16: Ɓǝlaa ba hwaasa, kaa sǝdǝvsǝga kǝ uudah kǝ lii ciɓǝg shatanah baɗyak da vak Yesu, tagada ba ǝlbǝg kalti, ngal sagal shatanahahaan ma vǝghaatǝra, mbahǝnan baz lii yangbiya.
    17: Tǝdvad kwan wa righavant nǝ dǝgiti tagavda tǝdvad tlayang Ishay taakiya, “Kǝsakiyamaarakǝsǝg kǝ kuzahamiyama, dlaɓa kǝskiyamaaran kǝ yangbiyahamiyama.”
    18: Nǝgha ba nǝ Yesu kǝ uudah baɗyak faɗǝga tǝghǝr kǝ iina, ngal tagartag kǝ iin kǝ mbǝrzahaan maraa dzǝva dagal dat ghyaba kwah kǝ ghaiya yuwa haiya.
    19: Ngal sagau kǝ dadda tsaga adzahadzah da vakaana, amaa taa kǝ iina, “Dadda tsaga dǝgita, ǝn gatakgatǝg badǝm vakavaki agha dagal nǝnga.”
    20: Ngugharangug nǝ Yesu amaa, “Mbayakaha ar da afkahaatǝra, ɗiikaha dlaɓa mǝng vakavaka hǝnnganahaatǝra, Zǝra Uuda maay vaka hǝnnganan biya.”
    21: Am nǝ pall ma mbǝrzahaan taa kǝ iina, “Yaazhigǝla, ǝn dǝgaadǝg ndan ǝn hǝɗnan kǝ daadara.”
    22: Aiyam nǝ Yesu taa kǝ iina, “Gatkwagatǝga, aa hǝɗarhǝɗǝg lii ǝmtsaharaǝmtsahǝg kǝ zaraabahaatǝri ǝmtsaraǝmtsǝga.”
    23: Dagha ba nǝ Yesu damma pɛrayuwa, kaa gatǝgaan kǝ mbǝrzahaana.
    24: Kaa ciig kǝ ghabag ard fǝɗ ma yuwahaiya, fǝgharzhafǝg baz yu ghubǝɗa saas damma pɛrayuwa, Yesu dlaba hǝnahaara.
    25: Kaa dagau kǝ mbǝrzahaan ar ciyanta, am nǝ iitǝra, “Yaazhigǝla, katkǝmndkatǝga wakǝm tǝ ɗuula ǝmtsǝga.”
    26: Aiyama taa kǝ iitǝra, “Aujilbǝg kǝskuram gǝdzǝg ǝndkwani, kuramǝn dǝ fadghǝr hǝɗiikǝna?” Kaa ciig kǝ iin cagara kǝ gyi kǝ fǝɗǝn ard ghubǝɗǝga yuwa, kaa kyaɓalǝgakyaɓalǝga.
    27: Kaa ɓa jappǝr kǝ mbǝrzahaana, aiyam nǝ iitǝra, “Hulfakwar kǝ uud wana, baz fǝɗ ard ghubǝɗǝga yu ar cinngarnucinngni?”
    28: Tsǝgwa ba nǝ Yesu ma haaya Garisaha, kaa sagau kǝ uudah bu kwa ciɓtǝr shatanah sa vak Yesu, gǝdzǝvtǝrgǝdzǝg ba vaivaiya, aɗaba ar ndzǝga bamma gǝtlaha, maay wa ta kwahiin kǝ ɗuul biya.
    29: Kaa huulǝg kǝ iitǝr ar taakiya, “Au lambagh dǝ kǝmnd Zǝra Daadamazhigǝli? Agha sa vǝlkǝmnd dlaɗ ba sart ndakwani ɓagaa biya?”
    30: Mǝng nǝ maandala agyaragyara ghavzah ar piig kǝ dagalaatǝra.
    31: Ngal ba ghalgaan kǝ shatanahaan kǝ Yesu taakiya, “Akwama sǝghkǝmndadasǝga, ɗiikǝmndarsɗiig damma gyǝɗya ghavdzahaana.”
    32: Aiyama taa kǝ iitǝra, “Damdǝg ciya,” Kaa daas kǝ iitǝr damma ghavzahiina. Baɗǝm gyǝɗya ghavzǝn kaa ǝmdǝra daay kǝ iitǝr bawatswats damma yuwahaiya, ngal ruug kǝ iitǝra.
    33: Kaa ǝmndǝra daas kǝ lii piya ghavzahaana. Daragha ba nǝ iitǝr damma kǝssa, kaa tagaan kǝ iitǝr kǝ dǝgitahi dzǝghaar dǝ lii ciɓtǝr nǝ shatanahǝn baɗǝmma.
    34: Ngal sagal kǝ uudah ma kǝsiin baɗǝm da tlǝgaraa Yesu. Nǝghara ba nǝ iitǝra, kaa ghalgaan kǝ iitǝr maa ɗuwars kǝ lardaatǝra.
  9:
    1: Kaa daas kǝ Yesu damma pɛrayuwa, ngal dagal tǝghǝra yu damma Kafarnahum, kǝssi ghubara nǝ iina.
    2: Kaa sagau kǝ uudah dǝ daddakwa ǝmtsamtsan nǝ vǝgha hǝngan tǝ kǝjja, nǝghǝgha ba nǝ Yesu kǝ fadghǝratǝra, aiyama kǝ daddakwa ǝmtsaǝmtsan nǝ vǝghǝna “Zǝrara, ndavbiya, ɓǝshakanaɓǝshǝg nǝ uud kǝ haipahagha.”
    3: Cinngara ba nǝ lii tsaga adzahadzaha ǝndkwaha, kaa takǝvatag kǝ iitǝr mataatakaatǝr taakiya, “Kwanǝn kǝ uuda badza ɗaaga Daadamazhigǝla!”
    4: Nǝghakanǝghǝg nǝ Yesu kǝ dzamaghǝraatǝra, amaa kǝ iitǝra, “Aujibǝg am dzama kǝlaadǝr ma ǝrvidmahuɗaruwi?
    5: Kwar wa tsaftsaf kǝ taga, taakiya, ‘Bǝshakanaɓǝshǝg nǝ uud kǝ haipahagha nii ciiga dǝgdagalhi?’
    6: Ən naagaan am sǝran taakiya Zǝra Uuda dǝ ndzǝɗa ɓǝsha haipah ma duniya.” Kaa amaa taa kǝ daddakwa ǝmtsamtsan nǝ vǝghna, “Ciig kǝssǝg kǝjjagha dǝg daas dahǝnyaha.”
    7: Tǝhalakwaha, kaa ciig kǝ uudanǝna, ngal daas kǝ iin da vǝgyaana.
    8: Nǝghara ba nǝ dzahava dlamakǝlaawa ǝndkwaha, kaa gǝdzǝg kǝ iitǝra, ar gala Daadamazhigǝla kwa vǝlgar hulfa kwan kǝ ndzǝɗ kǝ uudaha.
    9: Ɗughars ba nǝ Yesu kǝ vakavaka kwahiina, kaa nǝghǝganǝhǝg kǝ iina kǝ uuda nǝ iin kwa ɗahav dǝ Matiyu cihurgan vaka cauwa hadama. Am Yesu taa kǝ iina “Gatkwagatǝga” ngal ciig kǝ iin kaa gatǝgaana.
    10: Tǝhalakwaha, kaa za kaf kǝ Yesu ma vǝgya Matiyu, ngal sagau kǝ lii cauwa hadama ard yaa daddaha haip ba ɗyaka ar cihuran buud za kaf kǝ iitǝr dǝ iina ard mbǝrzahaana.
    11: Nǝghǝra ba nǝ Farisiyah ǝntkwaha, ngal am nǝ iitǝr taa kǝ mbǝrzahaana, “Aujibǝg kǝ dadda hǝnyaharu za kaf ǝmtaɗ dǝ lii cauwa hadama ard yaa daddaha haipi?”
    12: Cinngha ba nǝ Yesu ǝntkwaha, aiyama, “Lii yanga maay lambatǝr dǝ dadda mba uud biya, bamma lii yang biya.
    13: Damdǝg tsagamtsag kǝ dǝgiti tuuk vakai wanǝna, ‘Zhuwadaal wan naag nai vakaruwa kyulǝgg biya.’ Sanhi da ɗaa lii jiir bi nai biya, sanhi mbakyarvad yaa daddaha haipa.”
    14: Kaa dagau nǝ mbǝrzaha Yuhwana dadda tsuufǝg davak Yesu, am nǝ iitǝra, “Aujilbg kǝskǝmnd ard Farisiyah kǝm kǝsgaan ka andǝla, kwakyarvadau kǝ mbǝrzahah ar maay kǝsgani?”
    15: Aiyam nǝ Yesu taa kǝ iitǝra, “Ar badzǝgaan nǝ tsaghwaha zhiila ghuula kǝ ǝrvidmahuɗ ma bar ǝmtaɗ dǝ zhiila ghuula? Da sagau sarta kwa da kǝsav zhiila ghuula dagal vakatǝra, ar da kǝssǝg ma kwah sarta nǝ iitǝra kǝ andǝla.
    16: “Maay wa ghudgǝtghudǝg kǝ daala sǝɗav tlappant tǝ ǝnghura sǝɗav biya aɗaba da tǝhgaan kǝ ǝnghura sǝɗav na, tǝhgaana, da jǝguujǝg kwa ndza wura.
    17: Maay wa ɗiya daala yuwa inabi damma ǝnghura ambǝla hǝllu biya, akwama ɗiyavdǝmɗiiga, ciɓgaan kǝ ǝnghura ambǝla hǝllwuna, ɗiya dagal nǝ yuwa inabiya badzǝgaan kǝ ambǝla hǝlluwa. Daala yuwa inabi ɗiyav bamma daala ambǝla hǝlluwa tǝvad kwah wa da ɗiigal bi nǝ iin biya dlaɓa ciɓǝgai nǝ ambǝla hǝllu biya.”
    18: Ma sarta taa kwanǝn kǝ Yesu, kaa sagau nǝ maala ma guda dzǝgwazhigǝla da vakaana, kǝla kǝ ghuunj tǝvuukwana, amaa, “Dǝghwar aa ǝmtsǝga ba ndakwana, asǝg tapnatapǝg da ciiga.”
    19: Kaa dagal kǝ Yesu ard mbǝrzahaan gata uuda nǝ iina.
    20: Mǝng nǝ uusiin viigaan kǝlawa tar buwa kǝla avǝza, ka dagau kǝ iina gyilga Yesu tapǝna kǝ ghaiya sǝɗavaana.
    21: Amaa ma ǝrviɗmahuɗaana, “Akwama tapannatapǝg aandzu ba ghaiya sǝɗavaan kaltiya, ǝn da mbǝga.”
    22: Gwiyavǝt ba nǝ Yesu kaa nǝghǝganǝghǝga, aiyama, “Ndav bi dǝghwar biya, fadghǝragha mɓakanambǝga.” Batwatsǝra, kaa mbǝga kǝ uusina.
    23: Dagha ba nǝ Yesu da vǝgya maala ma guda dzǝgwazhigǝlǝna, kaa nǝhganǝhǝg kǝ iin kǝ lii fǝrta faakila ard dzahava dlamaa kǝlaaw ar tuuga.
    24: Aiyam nǝ Yesu, “Ciyamciig vaakwana, ǝmtsabi nǝ dughwiin biya, hǝnnahaara.” Kaa ɓagar ghuɓasǝga nenneg kǝ iitǝra.
    25: Lagwavtǝrda ba nǝ uudah da gyǝmala, kaa daas kǝ iina hǝkyinan kǝ dǝva dughwiina, ngal ciiga.
    26: Kaa cinngalcinng nǝ ǝlbǝg tǝghǝr kǝ iin aandzu taakwara.
    27: Ɗughars ba nǝ Yesu kǝ vakavak kǝ iina, kaa ba gatǝgaan kǝ gulfah buwa ar ɗaag bad halavuwa ndzǝɗaatǝr ar taakiya, “Zhukǝmndaalazhug, Zǝra Dauda!”
    28: Dagha ba nǝ Yesu damma kwatlǝrǝn kǝ hǝnyaha, kaa daas kǝ gulfah bu da vakaana, aiyama taa kǝ iitǝra, “Famdǝghǝrtfǝg taakiya ǝn mbǝkurambǝga?” Aiyam nǝ iitǝra, “Aana, Yaazhigǝla.”
    29: Tǝhala kwaha, kaa tapǝna kǝ iin kǝ gyiyahaatǝra aiyama, “Tǝdvad fadhǝraruwa, mbǝkurmbǝg nǝ uuda?”
    30: Ngal wurǝg kǝ gyiyahaatǝra, tǝhala kwaha ka ɓǝltǝra nǝ Yesu kǝ magi ba vaivaiya amaa, “Tagamarbi aandzu kǝ war biya.”
    31: Daral ba nǝ iitǝra, kaa ba kutǝgaan kǝ iitǝr kǝ ǝlbǝgǝn tǝghǝr kǝ iin aandzu takwar ma lardiina.
    32: Ar tǝ ɗuula sagala, kaa sǝvardǝvsǝg nǝ daddakwa mamghant nǝ shatanaha kǝ Yesu.
    33: Savda ba nǝ Satanahna, kaa fǝgarzhafǝg kǝ uuda nǝ iin kǝ taa ghaiya, kaa ɓa jappǝr kǝ dzahava dlama kǝlaawa, aiyam nǝ iitǝra, “Ba dǝm tapavnai kǝ nǝghǝganǝghǝg kǝ hulfa kwan kǝ dǝgit ma Izrail biya.”
    34: Aiyam Farisiyaha, “Abi lagw dǝ ndzǝɗa maala Shatanah nǝ iin kǝ shatanaha.”
    35: Tǝhala kwaha, kaa gwaivagwaig kǝ Yesu ma kǝssaha ard gǝdzǝr kǝssaha, tsagtǝrtsag ma guda dzugwazhigǝla, tagtǝr ǝlbǝg maraw tǝghǝr kǝ tlǝkǝsǝra Daadamazhigǝla, mbahtǝran dlaɓ kǝ uudahi dǝ kuzah shahshaha ard lii yang biya.
    36: Nǝgha ba nǝ iin kǝ dzahava dlamaa kǝlaaw baɗyaka, kaa zhutǝrdalaazhuuga. Aɗaba ar hǝɓa dlaɗa maay wa mǝltǝrumǝlǝg biya, ar band tughwahǝn kwal dadda piiga.
    37: Aiyama taa kǝ mbǝrzahaana, “Tlǝra ghuda hǝi ba ɗyaka, dlaɓa lii ɓa tlǝra ar ba ǝnkykwahha.
    38: Mbakyarvad kwaha, ghalamghalǝg kǝ dadda guhha maa dzǝgaraa kǝ lii ɓaa tlǝra, maraa ghudara kǝ hǝiya.”
  10:
    1: Kaa ɗahtǝrantɗahǝg nǝ Yesu kǝ mbǝrzahaan kǝlaawa tar buwa. Vǝlatǝrvǝlǝg kǝ ndzǝɗa lagwa shatanaha ar mbaha kuzah shahshaha ard lii yang biya.
    2: Wan nǝ ɗaagaha mbǝrzah kǝlaawa tar buna. Dǝga zǝnngwa iin nǝ Siman kwa ɗahav dǝ Bitrus ard dǝ zǝra babbaan Andrawus ard Yakubu zǝra Zabadi ard zǝra babbaan Yuhwana,
    3: ard Filigus ard Batalomi ard Tuma ard Matiyu dadda cauwa hadama ard Yakubu zǝra Halfa ard Taddiyus,
    4: Siman kwa naagaan kǝ za vukwa kǝsaana, ard Yahuda Iskariyoti kwa zuu langiya Yesu.
    5: Ɓǝlatǝrǝtɓǝlǝg nǝ Yesu kǝ mbǝrzahaan kǝlaawa tar buna, amaa taa kǝ iitǝra, “Dam bi davak lii ar Yahudah biya, ɗlaɓa dam bi damma kǝssa Samariyah biya.
    6: Dlakulva kwaha damdǝg da vak tughaha uudaha Izraila kwa zaharazahǝga.
    7: Damdǝg tagamtǝrtag kǝ ǝlbǝg marawa taakiya, ‘Tlǝksǝra ghǝrazhigǝla hǝrzǝthǝrzǝga.’
    8: Mbahamtǝrmbahǝg kǝ lii yang biya, ciyamtǝrciig kǝ lii ǝmtsaharaǝmtsahǝga, mbahamtǝrmbahǝg kǝ magyagulfaha, lagwamlagw kǝ Shatanaha. Tlamkǝna ba gyaagyaana vǝlamtǝrvǝlǝg ba gyaagyaana.
    9: Kǝsam bi kǝ adawana, aandzu agwalɛl, aandzu vǝrzhagan ma ambǝlaru biya.
    10: Kǝsam bi kǝ ambǝl mam dagal biya, aandzu sǝɗav buwa, aandzu kimbak aandzu zad biya, aɗaba dadda ɓa tlǝra dlaikǝndlaig nǝ dǝgshigaana.
    11: “Baɗǝm nǝ kǝsa ard gǝdzǝr kǝssahi am dǝgaa nǝ uurama, gatamgatǝg kǝ uuda jiirjiir am ndzan ma vǝgyaana tangw damma sarti am da ciig nǝ uurama.
    12: Akwama damaghan da hǝnyahiina, tagamtǝrtag taakiya, ‘Gabǝrǝr tǝghǝr kǝskurama.’
    13: Akwama uudaha jiirjiir wa ma hǝnyahiina, gabǝraruwa aa ndzandzǝg tǝghǝr kǝ iitǝra, akwama uudaha jiirjiir biya, gabǝraruwa gwiya saa kǝskurama.
    14: Baɗǝm daddakwa lawalǝg kǝ dlǝgha kurama, ard cinnga ǝlbǝgaruwa, pangamdapang kǝ alagwat tǝ shigaharuwu akwamam da ɗuwa kǝsaatǝra.
    15: Bak jiir wan tagkur naiya, da zhuvtǝrdaala kǝ uudaha Sadum ard Gumara tǝghǝr kǝ uudaha kǝssiin daghuvala ta shariya.
    16: “Wan ɓǝlkurɓǝlǝg band tuughwah ma taataka ghǝgyaha tǝghala, mbakyarvad kwaha ndzamandzǝg ba ɗyamɗyam band ghavala, dlaɓa am nal kalaliyah band kakuura.
    17: Famfǝg kǝ hyǝmmi dǝ uudah aɗaba ar da langkurlang damma guda ta shariya, ar da ɓalkura kiiɓ ma guda dzǝgwazhigǝlaatǝra.
    18: Ar da langkurlang da tǝvuukwa maamaalah ard tlǝkǝssah mbakyarvad kaiya, kiyava taa ǝlbǝg maraw kǝskuram tǝvuukwatǝra ard tǝvuukwa lii ar yahudah biya.
    19: Akwama langarkurdalanga, ndavam bi kǝ dǝgiti am da tag nǝ uuram biya, ard ɗuuli am da tag nǝ uuram biya, aɗaba da vǝlkurvǝlǝg nǝ uud kǝ dǝga tagga.
    20: Aɗaba kuram bi wada taaghai biya, shǝɗkwa Daadaru wa da taaghai mbakyarvad kurama.
    21: “Zǝraaba da za lanngiya zǝraabaan da tsǝvana, daada da za lanngiya zǝraana, zarha ar da ciitǝrant kǝ yaatǝra da ciɓǝvtǝrana.
    22: Uudah baɗǝm ar da naakur bi mbakyarvad ɗaagara, dlaɓa baɗǝm daddakwa ghacaghacig dat ghalaana, da tlǝkǝnatlǝg kǝ katǝga.
    23: Akwamar vǝlkur dlaɗ ma kwatlǝrǝn kǝssa, ǝmndǝraǝmdǝrga damma kǝssi tǝvuukwa, jiira wan takur naiya lakuti am tsǝgarvaratsǝg kǝ kǝsaha Izraila baɗǝmma, da saaya nǝ Zǝra Uuda.
    24: “Daddakwa tsaga dǝgit vak kǝ uuda jiguubi kǝ dadda tsagar dǝgit biya, jiguubi dlaba nǝ kwatnah kǝ dadda hǝnyahaan biya.
    25: Tlǝgaltlǝg nǝ dadda tsaga dǝgit vak kǝ uuda, nal band dadda tsagar dǝgita, dlaɓa kwatnah band dadda hǝnnyahaana. Akwamar ɗaag dǝ Baˈalzabul kǝ dadda hǝnnyaha, ar da ɗaatǝr dǝ kwa juujig kǝ Baˈalzabul kǝ uudahi ma hǝnnyahiina.
    26: “Mbakyarvad kwaha, gǝdzamtǝr biya, aɗaba maay nǝ dǝgiti hǝɗahǝdan kwa da maay wurav biya, dlaɓa maay nǝ dǝgiti shiɓashiɓan kwa da sǝrvaaka biya.
    27: Dǝgiti taagankur nai magurtla, tagamtag bat ɓalaɓala, dǝgiti cinngama nǝ uram da gǝlagǝla, tlǝhamtlǝhǝg tǝ ghǝra guda.
    28: Gǝdzam bi kǝ lii tsǝgatsǝg kǝ vǝgha biya aɗaba ar maay dǝ ndzǝɗa tsa shifǝg biya, gǝdzamgǝdzǝg kǝ dadda kwa tsǝgatsǝg kǝ vǝgh ard shifǝg ma kaarafaiya.
    29: Maay kwan vǝlav nǝ caakwah bu tǝ kwaɓ pal biya? Bakǝvakwaha maay aandzu pallǝratǝr ɓǝladagal da tǝ haay kwal sǝrga bi kǝ daadaru biya.
    30: Baz guujaha ghǝraharu ndakwani kǝdlakǝdlana.
    31: Mbakyarvad kwaha, ndavam biya, jamujig nǝ uuram kǝ caakwah baɗyak dǝ ndanngǝra.
    32: “Baɗǝm daddakwa haiyakuthaig kǝskai tǝvuukwa uudaha, kai ndakwi ǝn da haiganthaiga dǝ iin tǝvuukwa Daadar kwa ma ghǝrazhigǝla.
    33: Aiciya, badǝm daddakwa haiyakut bi tǝvuukwa uudah biya, kai ndakwani ǝn da haigant bi dǝ iin tǝvuukwa Daadar kwa ma ghǝrazhigǝl biya.
    34: “Tlatlam bi taakiya sanhi kwakyarvad ǝn vǝlkur kǝ gabǝrǝr nai damma duni biya, maaya, sanhi kwakyarvad ǝn vǝlkur kǝ gabǝrǝr biya, ba tagwazhatagwazha.
    35: Sandi tagwazhatagwazha, adaba “‘zǝra da ɓa dau dǝ daddaana, dughwa da ɓa dau dǝ babbaana, ghuul dlaɓa dǝ ɓa dau dǝ jikkan uusa.
    36: Uudaha hǝnnyahaan kǝ uudan war da ɓa dau dǝ iina.’
    37: “Badǝm nǝ daddakwa waiya daddaan bi babbaana tǝghǝr kǝskaiya, tlǝgal bi kǝ nǝg kǝ dǝgar biya. Dlaɓa baɗǝm nǝ daddakwa waiya zǝraan bi dǝghwaana tǝghǝr kǝskaiya tlǝgal bi kǝ nǝg kǝ dǝgar biya.
    38: Badǝm nǝ daddakwa kǝsǝghanti kǝ tlaɓahǝrtǝgaan ngal gata kai biya, tlǝgal bi kǝ nǝg kǝ dǝgar biya.
    39: Baɗǝm nǝ daddakwa naa kata shifǝgaana, ɓǝlgaan dagala. Baɗǝm nǝ daddakwa ɓǝlda shifǝgaan kwakyarvad kaiya aa fǝgabadfǝga.
    40: “Baɗǝm nǝ daddakwa dlǝghakuradlǝghǝga, dlǝghakwidlǝghǝg kǝskaiya, baɗǝm nǝ daddakwa dlǝghakwidlǝghǝga, dlaghaadlǝghǝg kǝ daddakwa ɓǝlkwadi kaiya.
    41: Baɗǝm nǝ daddakwa dlaghaadlǝghǝg kǝ tlayanga kwakyarvad tlayang nǝ iina, da tlǝkǝnatlǝg kǝ dǝgshiga tlayanga. Dlaɓa badǝm nǝ daddakwa dlaghaadlǝghǝg kǝ uuda jirjira kwakyarvad uuda jirjira nǝ iina, da tlǝkǝnatlǝga kǝ dǝgshiga uuda jirjiira.
    42: Baɗǝm nǝ daddakwa vǝlgar kuwa yu lǝmcikcik kǝ pall ma lii hǝɗiikǝn kwakyarvad mbǝrzar nǝ iina, ǝn takurtaga da pilwai nǝ dǝgshigaan biya.”
  11:
    1: Ghyǝnga ba nǝ Yesu kǝ tagtǝr dǝgitah kǝ mbǝrzahaan kǝlaawa tar buwa, kaa dagal kǝ iin damma kǝsaha Galili da tsagtǝr dǝgitah ard taa ǝlbǝg maraw kǝ uudaha.
    2: Ma sarta kwahiina Yuhwan dadda tsuufǝga ndza ma guda birfǝna, cinngha ba nǝ iin kǝ dǝgitahi ɓag nǝ Yesu, kaa ɓǝlgantɓǝlǝg kǝ iin kǝ mbǝrzahaan da vakaana.
    3: Ar ndavaru taakiya, “Kǝgh wagha da saayin nii, kǝm paka kwatlǝrǝnhi?”
    4: Am nǝ Yesu taa kǝ iitǝra, “Gwiyamagwig daas am tagar kǝ Yuhwan kǝ dǝgiti amaa nǝghǝga nǝ uurama, ard dǝgiti amaa cinnga nǝ uurama.
    5: Gulfaha ar nǝghǝganǝghǝga, ghurɗikaha ar dagala, yaa daddaha vǝca mbahavtǝrambahǝga matanngaha ar cinngacinnga, uudahi ǝmtsaharaǝmtsahǝga ciyavtǝrǝtciiga, dlaɓa tagǝvtǝrtag nǝ ǝlbǝg marawa kǝ talagaha.
    6: Dǝ bark nǝ daddakwa tǝrɗa bi tǝ ɗuul mbakyarvad kai biya.”
    7: Ar tǝghǝrdǝga ciya dagal nǝ mbǝrzaha Yuhwana, kaa fǝgarzhafǝg kǝ Yesu kǝ taa ǝlbǝg tǝghǝr kǝ Yuhwan vak dlamakǝlaawa, “Au wamaa dagal nǝ uuram da vazǝgaan ma tǝghali? Amaa da vaza kazhakwahaanǝn tlaɗtlaɗǝn kwa gajag nǝ fǝɗ na?
    8: Au kaci wa damal nǝ uuram da vazǝgaani? Daddakwa caɗva ma sǝɗav marawna? Udahi ndzǝga ma vǝgya tlǝkǝsa iitǝr wa nguɗa sǝɗavah marawa.
    9: Au kaci wa damal nǝ uuram da vazǝgaani? Tlayannga? Ən tagkurtaga, juujig vavvaan kǝ tlayannga.
    10: Kwan wa vindava nǝ ǝlbǝg tǝghǝr taakiya, “‘Ən da ɓǝlgaan kǝ zǝrɓǝlgar tǝvuukwagha, kwada ɓadlak ɗuul lakuti agha da saaya.’
    11: “Ən tagkurtag kǝ jiira, ma huɗa uudah kwa yaa nǝ ǝnghwasaha, maay wa juujig kǝ Yuhwan dadda tsuufǝg dǝ ɗyakǝr biya. Bakǝva kwaha, daddakwa ǝngykwah ma tlǝksǝra ghǝrazhigǝl juujig kǝ iin dǝ ɗyakǝra.
    12: Cigǝt ma zamana Yuhwan dadda tsuufǝga damma kwanǝn kǝ zamana, tlǝksǝra ghǝrazhigǝl hǝɓa ba dlaɗ ma dǝva kǝlaadaha, lii vǝlgar dlaɗɗiina, iitǝr wanaa pǝrɗa tlǝksǝra ghǝrazhigǝl bad ndzǝɗa.
    13: Aɗaba adzahadzaha Muusa ard kakaɗa tlayanngaha baɗǝm tagardatag kǝ tlayanngǝr tǝghǝr kǝ tlǝksǝra ghǝrazhigǝl lakuti saay nǝ Yuhwana.
    14: Dlaɓa akwamam haiyamanthaig dǝ kwanǝna, Ili wa ndza tagavda nǝ ǝlbǝg tǝghǝr taakiya da saayna, iin nǝ Yuhwana.
    15: Dadda kwad hyǝmmiya, aa cinnga.
    16: “Ən da gǝrǝg dau nai kǝ kwanǝn kǝ zamani? Ar band zarhah cihurgan tǝ ɓala kasukwa ar ɗaa ghǝrahaatǝr ar taakiya,
    17: “‘Kǝm fǝrtǝkura kǝ faakila, lamwalǝg kǝ shakalga, kǝm ɓǝlkura kǝ ǝngsa taa dzǝgwagha, lamwalǝg kǝ tuuga.’
    18: “Sahi ba nǝ Yuhwan dadda tsuufǝga maay zǝgaana maay hǝɓǝgaan biya, aiyam nǝ uurama, ‘Shatanah wa ma vǝghaana.’
    19: Sahi ba nǝ Zǝra Uuda zǝgaana hǝɓǝgaana, ar taakiya, ‘Wayam dadda tlǝhuɗa ard dadda hǝɓa kya, tsaghwa lii cauwa hadama ard yaadaddaha haipaha.’ Bakǝvakwaha nǝghvaakanǝghǝg nǝ dabariya Daadamazhigǝl tǝdvad tlǝrahaana.”
    20: Kaa cagtǝraacag nǝ Yesu kǝ gyi kǝ kǝsahi kwa ɓagaa nǝ iin kǝ dǝgaha jappǝr baɗyaka, aɗaba pǝlar bi kǝ ghǝr biya.
    21: “Dǝga zhuwadaal kǝ sǝkǝgh Korazin! Dǝga zhuwadaal kǝ sǝkǝgh Betsaida! Akwama ɓagava ma Taya ard Sidun nǝ dǝgaha jappǝrahaanǝn ɓagavǝna vakaruwǝna, ma pǝlara bawur kǝ ghǝra. Maa tsǝgwarǝvtsǝgw kǝ akacakaca ar kutǝr kǝ aftsa.
    22: Aici wan tagkurtaga, daghuvala ta shariya da zhutǝrdaala kǝ Taya ard Sidun nǝ Daadamazhigǝla tǝghǝr kǝ sǝkurama.
    23: Kǝgh Kafarnahuma! Magha tlǝg nǝng da fǝkaarafǝg nǝ uud damma ghǝrazhigǝla? Maaya! Da fǝkaara bi nǝ uud biya, agha dii ba kǝ kaara faya, akwama ɓagava ma Sadum nǝ tlǝra jappǝrahaan ɓagav ma kǝsaharuwǝna, maa ba ndzǝgaan gwastaana.
    24: Aiciya wan tagkurtaga, daghuvala ta shariya, da zhuvardaala kǝ Sadum tǝghǝr kǝskǝgha.”
    25: Ma sarta kwaha wa tagaa nǝ Yesu taakiya, “Ən tagak uus Daada, Yaazhigǝla ghǝrazhigǝl ard duniya, aɗaba shiɓǝghtǝrvashiɓǝg kǝ dǝgitahaanǝn kǝ lii dǝ dabariya ard lii sǝrgasǝrga, kaa martǝrdamarǝg kǝskǝghǝg kǝ zǝr zarhaha.
    26: Bandkwah, Daada, aɗaba kwan nǝ dǝgiti ɓagakaɓag kǝ marawa.
    27: “Badǝm nǝ dǝgitaha, vǝlghwavǝlǝg nǝ Daadara. Maay wa sǝrgasǝrǝg kǝ Zǝriin biya bamma Daada. Dlaɓa maay wa sǝrgasǝrǝg kǝ Daadiin biya, bamma Zǝriina ard kwa haigant Zǝriin marardana.
    28: “Asamasǝg sa vakara, baɗǝmaru lii kuɗaralkuɗǝga ard lii sǝpa kadlannga, ǝn kǝskuraran am tlǝkkǝna kǝ diyakuɗǝga.
    29: Cinngamcinng kǝ dǝgiti ǝn tagkur naiya, bandkwa bǝlvar nǝ zuuki ma kungy kǝ kawa uusǝga, am tsagaan dlaɓa vakara. Aɗaba kaiya ǝn kalaliya ǝn maay naaghǝr biya, dlaɓa am tlǝknatlǝg kǝ gabǝr ma ǝrviɗmahuɗaharuwa.
    30: Aɗɗaba zuukiyara ba tsaftsafa, kadlanngahara maay ɗǝmɗǝm biya.”
  12:
    1: Daghuvala faciya ngiiga Yahudaha, ghudadagal nǝ Yesu ard mbǝrzahaan ma guha hǝiya, ngal fǝgharzafǝg nǝ mbǝrzahaan kǝ kala ghǝra hǝiya ar zǝggaana aɗaba njǝtǝr waiya.
    2: Nǝghara ba nǝ Farisiyah ǝndkwaha, am nǝ iitǝr taa kǝ Yesu, “Zharga, mbǝrzahagh ar ɓa dǝgiti dzah kǝ ɓagaan daghuvala ngiiga.”
    3: Aiyam nǝ Yesu taa kǝ iitǝra, “Mbats karantamabi kǝ dǝgiti ɓagaa nǝ Dauda ard lii ǝmtaɗ dǝ iin ma sartakwa ndza njitǝr nǝ waiy biya?
    4: Kaa daas kǝ iin damma vǝgya Daadamazhigǝla kǝsant kǝ iin kǝ bǝruudi kwa favtǝra ba kǝrkangyǝkwa kǝ zhiila kǝsa uufah zuwa, vǝltǝr baz lii ǝmtaɗ dǝ iin kwa dzah zǝgaan kǝ iitǝra.
    5: Nii karantamabi ha ma Adzahadzaha Muus kwa kǝlarda nǝ zhiila kǝssufah kǝ adzahadzaha ngiig ma vǝgya Daadamazhigǝla, mbats nal bi kǝ haip kǝ iitǝr biya?
    6: Ən tagkurtaga, wan nǝ daddakwa juujig kǝ vǝgya Daadamazhigǝl vaakwana.
    7: Akwamamaa sǝrgasǝrǝg kǝ dǝgiti tuuk vakai nǝ ǝlbǝgahaan kwa taakiya, ‘Zhuwadaal wan naag naiya, kyuulǝg biya, mamaa maay ghaza daddakwa maay dǝ haip biya.’
    8: Aɗaba Zǝra Uuda iin yaazhigǝla faciya ngiiga.”
    9: Kaa ɗugarsɗuug kǝ Yesu kǝ vakavakintsa, ngal daas kǝ iin damma guda dzǝgwazhigǝlatǝra.
    10: Ndza mǝng nǝ uuda nǝ iin ǝmtsamǝmtsan nǝ dǝv vakwahiina, kaa ndavgarundavǝg kǝ iitǝr kǝ Yesu, taakiya, “Haighanthaig nǝ adzahadzah mbǝvna nǝ uuda daghuvala Faciya Ngiiga?” Ndavararu kwakyarvad ar tlǝkǝna kǝ iin dǝ haipa.
    11: Aiyama taa kǝ iitǝra, “Akwama mǝng nǝ daddakwa dǝ tuugh pal makurama, ma dahi damma afǝkka daghuvala Faciya Ngiiga, mbats maay kǝsgaan nǝ dadda tuughǝn sagat biya?
    12: Abi ndanng ba nǝ uud tǝghǝr kǝ tuugha. Mbakyarvad kwaha kalkalan ɓagvǝna nǝ harǝr daghuvala Faciya Ngiiga.”
    13: Aiyama taa kǝ uudanena, “Vǝlǝg kǝ dǝvaagha.” Kaa vǝlgaan kǝ iin kǝ dǝvaana, ngal mbǝg kǝ dǝvaan bandkwa pallna.
    14: Kaa dagal kǝ Farisah da diya sawariya ma taatakatǝra tǝghǝr kǝ ɗuuli ar da tsǝg nǝ iitǝr kǝ Yesu.
    15: Nǝghǝghaaka ba nǝ Yesu ǝndkwaha, ngal ɗuugarsɗuug kǝ iin kǝ vakavakiina, kaa gatǝgaan kǝ uudah badyaka, mbahtǝra kǝ lii yanng bi baɗǝmma.
    16: Ɓǝltǝra kǝ magi taakiya, aa tagarar bi aandzu ǝndwar biya.
    17: Tǝdvad kwan wa righavant nǝ dǝgiti tagada nǝ tlayang Ishaya taakiya,
    18: “Wan kwatnahar kwa kǝsanaaka naiya, ǝn waigaana, ǝn cinngaan kǝ ǝmtakǝraan ba vaivaya. Ən da righǝgaan dǝ shǝɗkwara, iin wada tagtǝr ǝlbǝga shariya jiir kǝ uudaha.
    19: Da maay ɓala agajaw bi taa ǝlbǝg dǝ caagyi biya, da cinngvabi nǝ ghaiyaan tǝ ɗuul biya.
    20: Da maay kǝla ghuvi hǝrzh kǝ kǝlǝg biya, da maay ǝmtsa kaara jahurambi kwa hǝrz kǝ ǝmtsǝg biya, bamma da fǝgharaafǝg kǝ jira zuu kǝ fiira.
    21: Fantara uuda dǝgshiga ba tǝ ɗaagaana.”
    22: Kaa sǝdǝvsǝg nǝ uudah kǝ makwai kwa mamghant nǝ shatanaha dlaɓa gulfa da vak Yesu, ngal mbǝnan kǝ iin kǝ uuda nǝ iina, farhza kǝ taaghai kaa nǝghǝganǝgha.
    23: Kaa ɓa japǝr kǝ dlamaa kǝlaaw baɗǝmma, aiyam nǝ iitǝra, “Aitsa Zǝra Dauda bi wan kwanya?”
    24: Cinngara ba nǝ Farisiyah ǝndkwaha, aiyam nǝ iitǝra, “Abi lagw dǝ ndzǝɗa Baˈalzabul tlǝkǝsa shatanaha nǝ uudanǝn kǝ shatanaha.”
    25: Nǝghaakanǝghǝg nǝ Yesu kǝ dzama ghǝraatǝra, aiyama taa kǝ iitǝra, “Baɗǝm nǝ tlǝksǝri tagwazhatagw hutsǝg buwa ar ɓa tlǝghum dǝ ghǝrahaatǝra, kwanǝn kǝ tlǝksǝr da zǝlma biya, bandkwah dlaɓ nǝ kǝsa bi hǝnnyah ma tagwazhatagw hutsǝg buwa, ar ɓa tlǝghum dǝ ghǝrahaatǝra da badzǝga.
    26: Akwama lagwan nǝ shatanah kǝ shatanaha, ɓa uushav dǝ ghǝraana, da ɓag ndar kaci nǝ tlǝksǝraan kǝ ndzǝɗi?
    27: Akwaman lagw dǝ ndzǝɗa Baˈalzabul nai kǝ shatanaha, mbǝrzaharuwum? Ar lagw dǝ ndzaɗa wari? Mbǝrzaharuwa wa da tǝkur shari tǝghǝr kwanǝnna.
    28: Akwaman lagw dǝ ndzǝɗa Shiɗkwa Daadamazhigǝla nai kǝ shatanaha, mbats tlǝksǝra Daadamazhigǝla sǝghawiisǝg da tǝghǝr kǝskurama.
    29: “Maay wa dǝgaadǝg da vǝgya dadda ndzǝɗ hutsavarvan nǝ almanan biya, ba zǝnngwa bamma takwasavant nǝ dadda ndzǝɗǝna, lakuti hutsǝvarvahutsǝg nǝ almanana.
    30: “Daddakwa maay ǝmtaɗ dǝ kai biya, tlǝghumar nǝ iina, dlaɓ daddakwa mǝlghwad bi kǝ dzahgaan biya, kwazǝg bad kwazǝga.
    31: Mbakyarvad kwaha, ǝn tagkurtaga, da ɓǝshivtǝrnaɓǝshig kǝ uudah aandzu hulfa kwar kǝ haip ard badza ɗaaga kwa ɓagara nǝ iitǝra, aiciya, daddakwa badza ɗaaga Shiɗǝkwa Daadamazhigǝl da ɓǝshvarna biya.
    32: Akwama tagadatag nǝ uudan kǝ ǝlbǝga nennig tǝ Zǝra Uuda da ɓǝshvarnaɓshiga, aiciya, baɗǝm nǝ daddakwa nǝnna Shiɗkwa Daadamazhigǝla da ɓǝshvarna bi ba dǝm biya.
    33: “Uuf marawa yaa zǝr marawa, uufi ghwaɗa yaa ba zǝr ghwaɗa, ma kwar kǝ uufa nǝghvaakanǝghǝg tǝdvad zarhaana.
    34: Kuram faɗǝga ghavalahaan kǝlaadahna, am da tag ndar nǝ uuram kǝ dǝgitah maraw kuram ndakwani am kǝladahi? Abi, dǝgiti ma ǝrviɗmahuɗ wa tag nǝ ghaiya.
    35: Uuda jiira ba jiir wa sagal ma ǝrviɗmahuɗaana, uudi kǝlaada ba kǝlaadǝr wa sagal ma ǝrviɗmahuɗaana.
    36: “Ən takurtaga, baɗǝm nǝ ǝlbǝgah ghwaɗ kwa tagarda nǝ uudaha, ar da tagaan daghuvala ta shariya.
    37: Aɗaba tǝdvad ǝlbǝgahagh wada tak nǝ uud kǝ shariya, bi da maay nǝ uud ghazakghazǝg biya, bi da ghazǝka nǝ uuda.”
    38: Am kyalǝma lii tsaga adzahadzah ard Farisiyah taa kǝ Yesu, “Dadda tsaga dǝgita, makǝmaa naagaan magha markǝmndadan kǝ dǝga sǝrga.”
    39: Ngwatǝrangug nǝ Yesu amaa, “Uudaha zamana ar kǝlaadaha, dlaɓa ar za lanngiya Daadamazhigǝla. Ar gata maa marǝvtǝrda nǝ dǝga sǝrga, maay watlǝrǝn kǝ dǝga sǝrgi da marǝvtǝrmarǝg biya, bamma dǝga tlayang Yunana.
    40: Bandkwa ɓagaa nǝ Yunan kǝ hǝng hǝkǝrɗ baz avǝɗ baz faci ma huɗa kilfa. Da bandkwah dlaɓ nǝ Zǝra Uud da ɓa hǝng hǝkǝrɗ baz avǝɗ baz faci ma kusǝgha haaya.
    41: Daghuvala ta shariya, uudaha Neneva ar da ciig ǝmtaɗ dǝ uudaha zamana, ar martǝrda kǝ uudaha zamanǝn taakiya ar ghazaghazana, aɗaba pǝlara mbakyarvad ǝlɓǝg marawǝn tagada nǝ Yunan nǝ iitǝr kǝ ghǝra. Wan ci, nǝ daddakwa juujig kǝ Yunan vaakwana.
    42: Daghuvala ta shariya, da ciig nǝ tlǝkǝssa Sheba uusa ǝmtaɗ dǝ uudaha zamanǝna. Martǝrdan taakiya ghazaraghazǝga, aɗaba ghǝravaana sal vaka bǝtky sa cinnga dabariya Salumana. Wan ci, daddakwa juujig kǝ Salumana vaakwana.”
    43: “Akwama salsǝg nǝ Shatanah ma vǝgha uuda, kaa gwaiyav kǝ iin gata vakavaka ɗiyakudǝg tlakǝna biya, aɗaba maay nǝ yu vakavaka kwahiin biya.
    44: Ngal ba tagan taakiya, ‘Ən guya daas da vakavaki sanal naiya.’ Akwama guyaagwig daasa, tlǝgharaatlǝg kǝ hǝnyahǝn maay aandzu ǝndwar biya, dlaɓa hyaɗahyɗana ɓadlaɓadlana.
    45: Kaa dagal kǝ iin dzǝgdaan kǝ kwatlǝrǝn kǝ shatanah uuɗiffa kwa jaruujig kǝ iin dǝ kǝlaadǝra, kaa daas kǝ iitǝr ar ndzan vaakwaha. Tǝhalakwaha ndzǝgana uudanǝna, da jǝguujig kǝ ndzǝganaanǝn ndza wurǝn kǝ badzǝga. Da bandkwah dlaɓ nǝ uudaha zamanǝn dǝ kǝlaadǝra.”
    46: Tǝghǝrdǝga tagtǝr ǝlbǝg nǝ Yesu kǝ uudaha, kaa sagau kǝ babbaana ard zarha babbaan ar ghacan gyimala, ar naa taaghai dǝ iina.
    47: Am nǝ uuda nǝ iin taa kǝ Yesu, “Wai baabagha ard dǝ zarhabaabagh ar ghacga gyimala, ar naa taaghai dǝ kǝgha.”
    48: Aiyam nǝ Yesu taa kǝ uudanǝnna, “War nǝ baabara ard zarha baabarni?”
    49: Kaa maraa mbǝrzahaan kǝ iin dǝ dǝva aiyama, “Wan nǝ baaba ra ard zaraabahar vaakwana.
    50: Baɗǝm nǝ daddakwa ɓa dǝgiti naag nǝ daadar kwa ma ghǝrazhigǝla, iin zǝraabara, ard dǝghwa baabara ard baabara.”
  13:
    1: Ba daghuvala kwahiin kǝ faciya, kaa sǝgalsǝg nǝ Yesu hǝnyahiina, ngal dagal kǝ iin cǝhuran tǝ ghaiya yuwa haiya.
    2: Kaa faɗav kǝ uudah baɗyak sa tǝghǝr kǝ iina, mbakyarvad kwaha kaa daas kǝ iin damma pɛra yuwa cǝhurana. Kaa ghacgaghacǝg kǝ uudah tǝ ghaiya gardza.
    3: Kaa tagtǝrtag kǝ iin kǝ dǝgitah baɗyak dǝ garava, amaa, “Mǝng dadda riig kwa dal da riiga.
    4: Riig nǝ iina, kaa ɓalgalɓalǝg kǝ kyalǝma hulf dat ɗuula, kaa caguucag kǝ ɗiikaha.
    5: Kyalǝm ɓalal dat caccahǝlaw vakavaki maay nǝ haay ɗyak biya, kaa laghǝr ba watswatsa aɗaba maay nǝ haay ɗyak biya.
    6: Ghwut ba nǝ faciya, ngal fuug kǝ iitǝra, aɗaba baharabi kǝ tlali vaivai biya, kaa ghulǝg kǝ iitǝra.
    7: Kyalǝm ɓalal damma takka, kaa ghwubararaa nǝ takka, tsarva kǝ ɓǝlauwa.
    8: Kyalm ɓalal dat haay marawa, kaa ya zǝr dǝrmǝkka, kyalǝm kul ǝngkwaha, kyalǝm dlaɓ kul hǝkǝrɗa.
    9: Dadda kwad hyǝmiya cinngaana aa cinnga.”
    10: Kaa dagau kǝ mbǝrzah davakaan ar ndavaru taakiya, “Aujibǝg agha tagtǝr bad garav kǝ ǝlbǝg kǝ uudahi?”
    11: Kaa ngutǝraangug kǝ Yesu, amaa, “Haiyakuranthaig nǝ uud am sǝra kǝ dǝgiti shǝɓashǝɓan ma tlǝkǝsǝra Daadamazhigǝla, kiyava iitǝra vǝlavtǝr biya.
    12: Aɗaba baɗǝm dadda kwad dǝgita, da fǝvarnaafǝga baɗyaka, dlaɓa da jǝguujig tǝ iin ba vaivaiya, dadda kwa maay dǝ vakai biya, da kǝsvarǝvkǝssǝg aandzu ba hǝɗikǝni dǝ vakai nǝ iina.
    13: In wan tagtǝr nai kǝ ǝlbǝg dǝ garavna, “‘Aandzu ar vazǝgaana ar nǝghǝga biya, aandzu ar cinngaana, ar cinnga biya dlaɓa ar nǝghǝgaaka biya.’
    14: “Righǝtrighǝg nǝ tlayangngǝra Ishaya tǝghǝr kǝ iitǝr taakiya, “‘Am da cinngaana am da cinngaaka biya, am da vazǝgaana, ba dǝm am da nǝghǝgaaka biya.
    15: Aɗaba uudahaan ba dǝkdǝk nǝ ǝrvidmahuɗaatǝra, ar cinnga ba dlah dǝ hyǝmiyahaatǝra, dlaɓa ar hǝɗardu kǝ gyiyahaatǝra. Maa maay ǝndkwah biya, maraa nǝghǝganǝg dǝ gyiyahaatǝra, maraa cinngacinng dǝ hyǝmiyahaatǝra dlaɓa maa nǝgharaakanǝghǝg ma ǝrvidmahuɗaatǝra ar pǝla kǝ ghǝra ǝn mbǝtǝrnana.’
    16: “Bark nǝ gyiyaharuwa aɗaba ar nǝghǝganǝghǝga, dlaba hyimmǝyaharu ar cinngacinnga.
    17: Bak jiira ǝn tagkurtaga, tlayangaha ard uudaha jirjira ba ɗyaka, naharnahǝg kǝ vazza dǝgiti nǝghama nǝ uurama, nǝghara biya, ard dǝgiti cinngama nǝ uurama, cinngara biya.
    18: “Wan nǝ dǝgiti tuuk vakai nǝ garava dadda riigna.
    19: Badǝm dadda kwa cinnghacinng kǝ ǝlbǝg tǝghǝr kǝ tlǝksǝra, dlaɓa nǝghaaka biya. Kaa sagau kǝ shatanaha ghǝldan kǝ ǝlbǝgǝn sagal ma ǝrviɗmahuɗaana, kwanǝn kǝ hulfa iin wa ɓalal dat ɗuula.
    20: Hulfǝn ɓalal dat caccahǝlawna, iin garava uudahanǝn cinngaracinng kǝ ǝlbǝgna, dlaɓa dlǝgharadlǝghǝg bad hwaɗǝga.
    21: Aɗaba baabi kǝ tlali biya, fadghǝraan ba dǝga sart hǝɗiikǝna, sǝghǝv ba dlaɗ kwakyarvad ǝlbǝgiina, kaa tagwzhatagw kǝ iin dǝ fadghǝrana.
    22: Hulfǝn kwa ɓalal damma takkǝna, iin garava uudi cinnghacinnga kǝ ǝlbǝga Daadamazhigǝla, dzama kadlannga duniya ard hyahǝra, tsǝgharvatsǝg kǝ ɓǝlauwa yaa bi kǝ zǝr biya.
    23: Hulfǝn riyava tǝ haay marwna iin garava dadda kwa cinnghacinnga kǝ ǝlbǝga Daadamazhigǝla dlaɓa nǝghǝghaakanǝghǝga, ngal yaa kǝ zǝra, kwana dǝrmǝkka, kwana kul unkwaha, kwana kul hǝkǝrɗa.”
    24: Vǝlatǝrvǝlǝg nǝ Yesu kǝ kwatlǝrn ke garava, amaa, “Da gǝrav nǝ tlǝksǝra ghǝrazhigǝl dǝ uudi riiya hulf maraw ma guhaana.
    25: Ma sartǝn hǝnna haar nǝ uudah baɗǝmma, kaa dagal kǝ dadda tlǝghuman riiyars kǝ dlǝgh miizhangyil hǝiyina, ngal dasaana.
    26: Ghubara ba nǝ hǝiya yaak kǝ zǝra, dlǝgh ndakwani ghubaraghubarga.
    27: “Kaa sagau kǝ kwatnahahaan ar tagar kǝ dadda hǝnyahaatǝr taakiya, ‘Dadda hǝnyaha, mbats hulf maraw bi wa riigha nǝng ma guhaghǝn biya? Aa sǝga ndar ka ci nǝ dlǝghi?’
    28: “Aiyama taa kǝ iitǝra, ‘Dadda tlǝghum wa ɓagaa kwaha.’ “Aiyam nǝ kwatnahaan taa kǝ iin, ‘Agha naagaan kǝm taɗdan kǝ dlǝghahaana?’
    29: “Amaa taa kǝ iitǝra, ‘Taɗam biya, aa nali vaka taɗa dlǝgh kǝskuram am taɗdan baz hǝi biya.
    30: Aɗuwamtǝrɗuug aa ghubararghubarg ba ǝmtaɗ tangw damma sarta ghuda hǝiya, ma kwah kǝ sarta ǝn da tagtǝrtag nai kǝ lii ghuda hǝiya ar da farzha aghwa dlǝgha ar ngwaɗant aɗagwal aɗagwala hǝvars kaara, dzahvant nǝ hǝiya ɗiivǝdǝm damma kuvǝra.’”
    31: Vǝlatǝrvǝlǝg nǝ Yesu kǝ kwatlǝrn kǝ garava, amaa, “Tlǝksǝra ghǝrazhigǝla band hulfa zǝra mastad kwa riiya nǝ uudan ma guhaana.
    32: Iin wa mishish ma hulfah badǝmma, akwama ghubaraghubarga, juguujig kǝ dǝgitahi riiva ma ɗyaghar baɗǝmma kaa nǝg kǝ uufa, kaa ɓa vǝgyahaatǝr kǝ ɗiikah tǝ dǝvahaana.”
    33: Gwiya vǝlatǝrvǝlǝg nǝ Yesu kǝ kwatlǝrn kǝ garava amaa, “Tlǝksǝra ghǝrazhigǝla band yista kwa kǝɗghant nǝ uusiin dǝ taasa ahupi hǝkǝrɗa, kaa uushigǝtuushig kǝ ahupiyin baɗǝm dǝ yistina.”
    34: Tagatǝrtag nǝ Yesu kǝ dzahava uudah baɗǝm kǝ dǝgitah dǝ garava. Maay nǝ dǝgiti tagatǝr nǝ iin kwal garav biya.
    35: Tǝdvad kwan wa rǝghvant nǝ dǝgiti tagada nǝ tlayang Ishaya taakiya, “Ən da tagaan kǝ ǝlbǝg dǝ garavaha, dǝgiti ndza shǝɓashǝɓan gwil fǝgarzha duni, ǝn da tagaana.”
    36: Kaa ɗutǝrǝsɗuug nǝ Yesu kǝ dzahava uudaha, kaa daas kǝ iin da hǝnyaha. Ngal tlǝgaraatlǝg kǝ mbǝrzahaana, am nǝ iitǝr taa kǝ iina, “Tagkǝmndtag kǝ dǝgiti tuuk vakai nǝ garava dlǝgh ma guhna.”
    37: Kaa ngutǝrangug nǝ Yesu amaa, “Dadda kwa riiya hulf marawa, iin Zǝra Uuda.
    38: Guhna iin nǝ duniya, hulf marawna, iin zarha tlǝksǝra Daadamazhigǝla. Dlǝghna iitǝr zarha shatanah.
    39: Dadda tlǝghumǝn riiya dlǝghna, iin shatanaha. Sarta ghwuda hǝina, iin ghyǝnnga duniya, lii ghuda hǝiya iitǝr nǝ zarhaɓǝlga Daadamazhigǝla.
    40: “Bandkwa dzahav nǝ dlǝgh hǝvars nǝ kaara, da band kwah daghuvala ghyǝnnga duniya.
    41: Da ɓǝlgaan Zǝra Uud kǝ zarhaɓǝlgaana, ar da dzahaant baɗǝm kǝ dǝgitahi fǝgara uudah kǝ ɓa haipa, baz lii ɓa tlǝra kǝlaɗǝr baɗǝmma, ar da lagwtǝrda dagal ma tlǝksǝraana.
    42: Ar da ɗiitǝrdǝm damma kaara faaya, vakwaha ar da tuuga ar da ghwada dǝv dǝ tlǝrɗa.
    43: Tǝhalakwaha ar da mbiig band faciya nǝ uudaha jiirjiira ma tlǝksǝra daddaatǝra. Dadda kwa dǝ hyǝmiya cinngaana aa cinnga.
    44: “Tlǝksǝra ghǝrazhigǝla band almani kwa shiɓavǝna ma guuha, kwa tlǝkǝna nǝ uudana ngal gwiya shiɓnanna, mbakyarvad ɗyakǝra hwaɗaga kaa valǝt kǝ dǝgahaani dǝvakai nǝ iin baɗǝmma, ngal sǝgwa kǝ guuhiina.
    45: “Gwastǝna, tlǝksǝra ghǝrazhigǝla band zǝra kasǝkwa, kwa gata akura ndannga.
    46: Tlǝkǝna ba nǝ iin kǝ akurǝn ndanng pal ba vaivaina, ngal valǝt kǝ dǝgahaan baɗǝm sǝgwa kǝ iina.
    47: “Gwastǝna dlaɓa, tlǝksǝra ghǝrazhigǝla band amshiya vaiya kilfa kwa ɓǝlavdǝm damma yuwahaiya, vaiyitvaig kilfah shahshaha.
    48: Righǝt ba nǝ iina, ngal tǝɗdatǝɗǝg kǝ yaa daddaha vaiya kilf dat ghaiya gardza, ar dzǝraakan kǝ kilfahi marawa, ar ɗiivǝdǝm damma alghwa ɗiivǝdan nǝ wa maraw biya.
    49: Da band kwah daghuvala ghyǝnnga duniya, ar da sagau nǝ zarhaɓǝlga Daadamazhigǝla, ar da tagwtǝrzha kǝ kǝlaadah sagal ma uudaha jiirjiira.
    50: Ar da ɗiitǝrdǝm kǝ kǝlaadah damma kaara faiya, vakavaki ar da tuug nǝ iitǝra ar ghwada dǝv dǝ tlǝrɗa.”
    51: Am nǝ Yesu taa kǝ iitǝra, “Nǝghamaakanǝghǝg kǝ kwanahaan baɗǝmma?” Kaa ngug kǝ iitǝra takiya, “Aana.”
    52: Aiyama taa kǝ iitǝra, “Mbakyarvad kwaha baɗǝm dadda tsaga adzahadzaha kwa nalnǝg kǝ mbǝrz ma tlǝksǝra ghǝrazhigǝla, band dadda hǝnyaha kwa sadda daala almana ard ǝnghura alman vaka fǝgaana.”
    53: Ghyǝnng ba nǝ Yesu tagtǝr dǝgitah dǝ garava, kaa dagalaan kǝ iina.
    54: Dagha ba nǝ Yesu damma kǝssana, kaa fǝgarzhafǝg kǝ iin tsagtǝr dǝgit kǝ uudah ma guda dzǝgwazhigǝlaatǝra, kaa ɓa jappǝr kǝ iitǝra, ar taakiya, “Aa tlǝkǝna mǝr nǝ uudanǝn kǝ hulfa kwan kǝ dabari ard dǝ ndzǝɗa ɓa tlǝraha jappǝrni?
    55: Zǝra kafintini wan kwan biya? Babbaani wa ɗahav dǝ Maryam biya? Zarhaababani nǝ Yakuba, Isuvu, Siman ard Yahud biya?
    56: Dughwaha babbaan bi wa ǝmtaɗ dǝ kǝmyamǝn biya? Tlakǝnamǝr kaci nǝ iin kǝ kwanahaan baɗǝmmi?”
    57: Kaa badzǝg kǝ ǝrvidmahuɗatǝra. Am Yesu taa kǝ iitǝra, “Bamma kǝsaana ard hǝnyhaan wa maay nǝ tlayanng dǝ ndanng biya.”
    58: Ɓagaa bi nǝ iin kǝ dǝgaha jappǝr ɗyak vakwah biya, adaba ar maay dǝ fadghǝr biya.
  14:
    1: Ma sarta kwah wa cinngha nǝ Tlǝkǝs Hirudus kǝ ǝlbǝg tǝghǝr kǝ Yesu.
    2: Amaa taa kǝ kwatnahahaana, “Kwan kǝ uuda, Yuhwan dadda tsuufǝg waa ciigǝt ma gǝtlaha, iin waa tlǝkǝna nǝ iin kǝ ndzǝɗa ɓa dǝgaha jappǝrahaana.”
    3: Aɗaba ndza viyǝtviig nǝ Hirudus kǝ Yuhwana, takwasanta, ɓǝldǝm damma guda bǝrfin kwakyarvad Hirudiya, uusa zǝra babbaan Filigusa.
    4: Aɗaba ndza tagartag nǝ Yuhwan kǝ Hirudus taakiya, kalkalaan bi kǝ iin kǝssa Hirudiya biya.
    5: Bakǝvakwaha nahanahǝg nǝ Hirudus kǝ tsa Yuhwana, ndza gǝdza gyiya uudaha, aɗaba haiyaranthaig nǝ uudah taakiya tlayanga nǝ iina.
    6: Sǝgha ba nǝ sarta ɓa kwaanda Hirudusa, kaa shakalǝg kǝ dughwa Hirudiya tǝ vuukwa ghulabaha, fǝgharaafǝg kǝ Hirudus kǝ cinnga ǝmtaakǝr ba vaivaiya.
    7: Tǝgharatǝg kǝ langyiya baz zǝgara gwaɗǝg taakiya, da vǝlǝgarvǝlǝg kǝ dǝgiti ghalǝg nǝ iin baɗǝmma.
    8: Ngal diigaradiig nǝ babbaan kǝ sawariya dǝgiti da tag nǝ iina, amaa, “Aa vǝlwavǝlǝg nǝ uud kǝ ghǝra Yuhwan dadda Tsuufǝg bandakwan ma kwatama.”
    9: Cinnguu bi nǝ tlǝkǝs kǝ ǝmtakǝra ǝlbǝgiin biya, aɗaba mbakyarvad ngwaɗǝgi zaa nǝ iin tǝvuukwa ghwulabahaana, ngal tagaan kǝ iin taaki aa vǝlvarvǝlǝg nǝ dǝgiti naag nǝ iina.
    10: Ɓǝlant kǝ uud damma guda bǝrfina ghudva ghǝr tǝ Yuhwana.
    11: Sǝvdaa nǝ ghǝraan ma kwatama, vǝlǝvar kǝ dughwiina, kaa lanngardaa kǝ iin kǝ babbaana.
    12: Kaa sagau kǝ mbǝrzaha Yuhwana ar kǝssant kǝ tlǝwa vǝghaan ar hǝɗǝnana, tǝhala kwaha ngal daagal kǝ iitǝr ar tagar kǝ Yesu.
    13: Cinngha ba nǝ Yesu ǝndkwaha, kaa daas kǝ iin damma pɛra yuwa, ngal dagal da vakavaki maay aandzu ǝndwar biya, ndzan ba daghuvaana. Cinngara ba nǝ uudaha, kaa sagal kǝ iitǝr ma kǝssahaatǝra, ngal dagal kǝ iitǝr gatǝgaana.
    14: Sǝghal ba nǝ iin ma pɛra yuwa, kaa nǝghǝganǝghǝg kǝ iin kǝ uudah ba ɗyaka. Ngal zhutǝrdaalazhuuga, dlaɓa mbǝhtǝra kǝ lii yang bi ma iitǝra.
    15: Dǝm ba faci kǝ ɓǝladaaya, kaa dagau kǝ mbǝrzahan da vaakana, am nǝ iitǝra, “Kwan kǝ vakavaka maay aandzu ndǝwar biya, dlaɓa hǝrz faci kǝ ɓǝladaaya. Ɗutǝrsɗuug kǝ uudaha kiyava dagal kǝ iitǝr damma kǝsah ar gatu kǝ dǝgzǝga.”
    16: Aiyama nǝ Yesu taa kǝ iitǝra, “Maay nǝ tlǝra dagalaatǝr biya. Vǝlamtǝrvǝlǝg nǝ uuram kǝ dǝgzǝga.”
    17: Am nǝ iitǝra taa kǝ iina, “Dǝgiti vakamnd vaakwana, ba bǝruudi dlǝɓa ard kilf bu kaltiya.”
    18: Aiyama, “Anakam da vakara.”
    19: Ngal tagtǝrtag kǝ iin kǝ uudah aa cahwararacahwarǝg tǝ kazhakwa, kaa kǝsgantkǝsǝg kǝ iin kǝ bǝruudi dlǝɓ ard kilf buwa, dzǝgant kǝ iin kǝ ghǝraan damma ghǝrzhigǝla, tagar kǝ uus kǝ Daadamazhigǝla. Tǝhalakwaha, lahǝna kǝ bǝruudina vǝltǝr kǝ mbǝrzahana ar tagwtǝrna kǝ uudaha.
    20: Baɗǝmmaatǝr zaruuzǝga tlatǝrtlǝga, ar dzahaant nǝ mbǝrzahaan kǝ ghwadǝgahaani tǝmaatǝmga, righantrighǝg kǝ alghw kǝlaawa tar buwa.
    21: Uudahi zaruuzǝga tamaha ghwalvah alfu dlǝɓa, maay ba nǝ zǝrha ard ǝnghwasah biya.
    22: Bad ghyǝngaatǝr waha, kaa fǝtǝraafǝg nǝ Yesu kǝ mbǝrzahaan damma pǝra yuwa, kiyava dagal kǝ iitǝr zungw tǝghǝr kǝ iin dat ghyaba kwah kǝ gardza, aɗaba paka salama uudah nǝ iina.
    23: Tǝhalakwa salamada nǝ iin kǝ uudaha, ngal dagat kǝ iin da dzǝgwazhigǝla ma aghw ba daghuvaana, ɓǝlgharaaɓǝlǝg baz avǝɗ vaakwah ba daghuvaana.
    24: Ma kwahiina sarta ndza ma taataka yuwahaiya nǝ pɛrayuwa, kaa tsǝgaan kǝ fǝɗ kǝ ghubǝɗǝga yu dat pɛrayuwa, aɗaba ndza ba gyar nǝ fǝɗ dǝ pɛrayuwa.
    25: Tamaha karfe hǝkǝrɗa avǝɗa, kaa happa dagal kǝ Yesu tǝghǝra yuwa da vak mbǝrzahaana.
    26: Nǝghara ba nǝ mbǝrzahaan kǝ iin happa dagal dǝ shig tǝghǝra yuwa, kaa gǝdzǝg kǝ iitǝra. Ar hulǝg mbakyarvad dladlawa ar taakiya, “Dadda kwa sǝgal tǝ afka.”
    27: Bat watsǝra, kaa tagtǝrtag kǝ Yesu taakiya, “Ndavam biya, ba kaiya, gǝdzam biya.”
    28: Kaa ngug kǝ Bitrus amaa, “Yaazhigǝla, akwama ba kǝgha, ɗaakwaɗaag sa vakaagh tǝghǝra yuwa.”
    29: Aiyam nǝ Yesu, “Asǝga.” Kaa sagal kǝ Bitrusa ma pɛrayuwa, farzha kǝ dagal tǝghǝra yuwa da vak Yesu.
    30: Nǝghǝgha ba nǝ iin kǝ fǝɗ ciyǝtciig bad ndzǝɗa, kaa gǝdzǝg kǝ iina aɗaba fǝgharzhafǝg nǝ yu kǝ ndǝgaana. Kaa huulǝg kǝ iin amaa, “Katkwakatǝg, Yaazhigǝla.”
    31: Bat watsǝra kaa vǝlǝgaan kǝ Yesu kǝ dǝvaan viyita, aiyama “Kǝgh dadda hǝtsahǝtsan nǝ fadghǝrna, aujilbǝg agha ɓa ndawndawi?”
    32: Daragha ba nǝ iitǝra damma pɛrayuwa, kaa kyaɓalgakyaɓalǝg kǝ fǝdna.
    33: Kaa ɓagarnǝsɓag nǝ lii ma pɛrayuwǝn kǝ kwatnahǝr kǝ Yesu, ar taakiya, “Bak jiijiira agha Zǝra Daadamazhigǝla.”
    34: Dzǝvara ba nǝ iitǝr kǝ yuwa haiya, ar tsugwa ma Janisarat.
    35: Nǝgharaaka ba nǝ uudaha kǝsiin kǝ Yesu, kaa bǝla ghai kǝ iitǝr damma kǝsahi tǝghǝr kǝ iitǝr baɗǝmma, ar sardǝv kǝ lii yang bi badǝmma.
    36: Kaa ghalgaan kǝ iitǝr maa ɗuutǝrnaa kǝ lii yang bi maraa tapnan aandzu ghaaya sǝɗavaana, baɗǝm lii taparnatapǝga mbaharambahǝga.
  15:
    1: Tǝhalakwaha kaa sagau kǝ kyalǝma Farisiyaha ard lii tsaga adzahadzah sagal ma Wurshalim da vak Yesu am nǝ iitǝra,
    2: “Aujilbǝg kǝ mbǝrzahagh ar kǝlla dǝga daadijaha tlǝvuukwahi? Aɗaba ar maay bara dǝv lakwti ar da zaa kaf biya.”
    3: Aiyam nǝ Yesu taa kǝ iitǝra, “Kuramǝm, aujilbǝg kǝskuram am kǝlla adzahadzaha Daadamazhigǝl kwakyarvad dǝga daadijahawi?
    4: Am nǝ Daadamazhigǝla, ‘Faarafǝg kǝ daadagh ard baabagha,’ dlaɓa ‘Baɗǝm dadda ɗaava daddaana bi babbaana, barari tsavva.’
    5: Kuram am tsagtǝrtsag kǝ uudah taakiya, akwama mǝng nǝ uudani dǝ dǝgit kwada mǝlgaru kǝ daddaana bi babbaana, ngal tagaan taakiya, ‘Baɗǝm nǝ dǝgiti mammaa da tlǝkǝna nǝ uuram vakara, fanarafǝg kǝ Daadamazhigǝla.’ Mbakyarvad kwaha fǝghaara bi kǝ daddaan ard babbaan dǝvakai biya.
    6: Mbakyarvad dǝgaha daadijaruwa, namdalnǝg nǝ uuram kǝ ǝlbǝga Daadamazhigǝl kǝ dǝga lakǝra.
    7: Kuram muuniyahaana! Mbats ba jiir nǝ tlayanngǝrǝn tagada nǝ Ishaiya tǝghǝr kǝskuram taakiya,
    8: “‘Udahaana, ar fǝkwara bat vaa ghai kalti, ǝrviɗmahuɗaatǝr bitky dǝ kaiya.
    9: Ar ɓaggwa ba gyaan kǝ kwatnahǝra, ar tsaga adzahadzaha uudah tǝghǝr kǝ ǝlbǝga Daadamazhigǝla.’”
    10: Ɗahatǝrǝtɗahǝg nǝ Yesu kǝ dzahava uudah da vakaana, amaa taa kǝ iitǝra, “Cinngamcinnga am nǝghaakana.
    11: Dǝgiti daadamma ghaiya kǝ uud bi wa fǝgara kwadlambǝr kǝ uud tǝvuukwa Daadamazhigǝl biya. Bamma dǝgiti sagal ma ghaiyaana.”
    12: Kaa sagau kǝ mbǝrzahaan da vak Yesu am nǝ iitǝra, “Agha sǝrgasǝrg taaki aandzaa badzgalbadzǝg nǝ ǝrviɗya Farisiyah sarta kwaraa cinnga nǝ iitǝr kǝ ǝlbǝgna?”
    13: Aiyam nǝ Yesu taa kǝ iitǝra, “Baɗǝm nǝ riigi kwa riiya nǝ Daadari ma ghǝrazhigǝl biya, da taɗava.
    14: Aaɗuwamtǝrɗuuga. Ar gulfah nǝ iitǝra, lii taɗa gulfaha. Akwama gulf wa taɗa gulfa, ba bǝrkuɗaatǝr ar mbǝɗa daay damma afǝka.”
    15: Aiyam nǝ Bitrus taa kǝ iina, “Tagkǝmndtagg kǝ dǝgiti tuuk vakai nǝ garavna.”
    16: Aiyam nǝ Yesu taa kǝ iitǝra, “Mbats gwaastǝn nǝghamaaka biya?
    17: Baɗǝm nǝ dǝgiti zǝguu nǝ uuda, ba zǝnngw da bak ghaiyaana, kaa damma huɗaana, tǝhala kwaha kaa sagal ma vǝghaana.
    18: Dǝgiti aa sagal ma ghaiya uuda, aa sǝgal bamma ǝrviɗmahuɗaana. Iin wa fǝgara ndzǝgaana kwadlambǝr kǝ uud tǝvuukwa Daadamazhigǝla.
    19: Aɗaba sagal bamma ǝrviɗmahuuɗ nǝ dzama dǝgit ghwaɗa, ndǝ tsa sifǝga, ɓa gwaragwara, ɓa gǝlla, shiida fiida, ard badza ɗaaga.
    20: Kwanahaan wa fǝgaraa ndzǝgaana kwadlambǝr kǝ uud tǝvuukwa Daadamazhigǝla, za kaf kwaal bara dǝv bi wa fǝgaraa ndzǝgan kwadlambǝr kǝ uud tǝvuukwa Daadamazhigǝl biya.”
    21: Ɗughars ba nǝ Yesu kwahiin kǝ vakavaka, ngal dagal kǝ iin damma larda Taya ard Sidon,
    22: Kaa huula saas kǝ uusa yaa Kanˈana, amaa, “Zhukwadalaazhuug, Yaazhigǝla, Zǝra Dauda. Mǝng nǝ dǝghwar kwa vǝlgar nǝ shatanah kǝ dlaɗ ba vaivaiya.”
    23: Tagghar bi nǝ Yesu aandzu ndau biya, kaa ba sagau kǝ mbǝrzahaa da ghalgaana, aiyam nǝ iitǝra, “Lagwarslagw kǝ uusna, aɗaba gata kǝmyamma dlaɓa mbakiyammbǝg dǝ huulǝga.”
    24: Ngwatǝrangug nǝ Yesu amaa, “Ɓǝlakwadi mbakyarvad tughwaha Israˈilǝn zaharazahǝgǝn nǝ uuda, mbakyarvad uudahi tlǝrǝn biya.”
    25: Ngal sagau kǝ iin kǝlla kǝ ghunnj tǝvuukwana amaa, “Yaazhigǝla, mǝlwadmǝlga.”
    26: Aiyamaa, “Kalkalaan bi kǝ kǝsvant nǝ kaffa zarh ɓǝlǝvtǝrda kǝ ghǝgyah biya.”
    27: Amaa, “Aana, bandkwah, Yaazhigǝla, aandzu ghǝgyaha ar cagaan kǝ pashpasha kaffi ɓalgal vaka zǝg kǝ dadda hǝnyahaatǝra.”
    28: Kaa ngugarangugg kǝ Yesu amaa, “Uusǝna, fadghǝragh ndzǝɗandzǝɗana, tsakatsǝg nǝ uud kǝ puutagha.” Bat watsǝr kaa mbǝgambǝg kǝ dǝghwaana.
    29: Ciyit ba vaakwahiin nǝ Yesu kaa ta ghaiya Yuwa haiya Galili. Ngal dagat kǝ iin dat kungula aghwa, cǝhurana.
    30: Kaa sagau kǝ uudah baɗyak da vakaan dǝ ghurɗikaha, gulfaha, lii ǝmtsamtsan nǝ uuɓiya, makwayaha, ard uudahi tlǝrǝn baɗyaka, ar ɗiitǝra tǝvuukwana. Ngal mbahtǝrana.
    31: Nǝghgha ba nǝ uudah kǝ makwayah ar taa ghaiya, lii ǝmtsamtsan nǝ uuɓiya, uuɓiyatǝr nalnǝg balapiya, ghurɗikah ar dagala, gulfah dlaɓ ar nǝghǝganǝghǝga. Kaa galla Daadamazhigǝla yaa Izraˈila kǝ iitǝr baɗǝmma.
    32: Tǝhala kwaha, ngal ɗahtǝrǝtɗahǝg nǝ Yesu kǝ mbǝrzahaan amaa, “Ən ɓa zhuwadaala kwanǝn kǝ uudaha, hǝngah hǝkǝrɗ wan kwana ar ba ǝmtaɗ dǝ kaiya, ba kwal dǝgzǝga. Ən naay kǝ ɗutǝrǝsɗuug daas dǝ wai biya, aɗaba haik ɗiya haar kǝ iitǝr tǝghǝrdǝga.”
    33: Am nǝ mbǝrzah taa kǝ iina, “Da tlǝvkǝna mǝr nǝ dǝgzǝgǝn da tlǝtǝraara kǝ uudahaan ma tǝghal vaakwani?”
    34: Kaa ndavtǝruundavǝg kǝ Yesu taakiya, “Ɗummba bruudi ngwɛn wa vakaruwi?” Aiyam nǝ iitǝra, “Uuɗiifa ard mishish kilf hǝɗiikǝna.”
    35: Kaa fǝtǝraafǝg kǝ iin kǝ dlamakǝlaaw cahwargan tǝ haaya.
    36: Kǝsant kǝ iin kǝ ɗummba bruudi uuɗiifǝn ard kilfna, tagar kǝ iin kǝ uus kǝ Daadamazhigǝla lahnana. Vǝltǝr kǝ iin kǝ mbǝrzahaana, kaa vǝltǝr nǝ mbǝrzahaan kǝ uudaha.
    37: Baɗǝmaatǝr zaruuzǝga, tlatǝrtlǝga, kaa dzahgantdzahǝg nǝ mbǝrzahaan kǝ ghwadgahaan ar rɛghant kǝ alǝghwah uuɗiifa.
    38: Uudahi zaruuzǝga, tamaha damma ghwalvah alfu uufaɗa, maay ba nǝ ǝnghwasah ard zarh biya.
    39: Salamada ba nǝ iin kǝ uudaha, kaa damma pɛra yuwa, ngal dagal damma haaya Magadan.
  16:
    1: Sarǝvsǝg nǝ Farisiyaha ard Sadukiyah da vak Yesu kiyava fishǝgaan kǝ iitǝra, kaa ghalgaan kǝ iitǝr ma martǝrdan kǝ dǝga sǝrǝg kwa da mara taakiya, sǝghhi vak Daadamazhigǝla.
    2: Ngutǝrnaguga, amaa, “Akwama ɓǝlaaɓǝlǝg nǝ hwaasa, ma nǝghǝmanǝghǝg kǝ zhigǝla ba kyanga, am tagaan taakiya da maraw nǝ kǝs dlakaduura.
    3: Akwama nǝghamanǝghǝg kǝ zhigǝl ba kyanga dlakaduur wur ciyitciig nǝ ghabaga, am tagaan taakiya, ‘Da hyiyav nǝ yuwa hiinanna.’ Am nǝghǝgaakanǝghǝg tsau kǝ ndzǝgana zhigǝla. Ɗǝmakurvaa ndar kaci nǝghǝgaaka ndzǝgan kwanǝn kǝ zamani?
    4: Uudaha zamana ar maay dǝ jiir tǝvuukwa Daadamazhigǝl biya, dlaɓa ar kǝladaha. Ar nagan mara nǝgha kǝ dǝga sǝrga, da maay marvǝtǝrmarǝg nǝ watlǝrn kǝ dǝga sǝrǝg biya, bamma dǝga sǝrǝga Yunana.” Kaa ɗuutǝrsɗuug kǝ iin ngal dagalaana.
    5: Daral ba nǝ mbǝrzahaan dat ghyaba kwah kǝ gardza yuwa haiya, mbats viyaatǝraviig nǝ kǝsa bruudiya.
    6: Aiyam nǝ Yesu taa kǝ iitǝra, “Famfǝg kǝ hyǝmiya, dlaɓa am fǝgaan kǝ taaɗ tǝ yista Farisiyah ard Sadukiyaha.”
    7: Kaa fagarzhafǝg kǝ iitǝr tagaan ma taatakatǝr taakiya, “Mbakyarvad kǝsyamant bi kǝ bruudi nii?”
    8: Nǝghghaaka ba nǝ Yesu ǝndkwana, aiyama, “Kuuram lii hǝtsahǝtsan nǝ fadghǝra, aujilbǝg am taaki am maay dǝ bruudi biyi?
    9: Mbats gwastǝn nǝghamaaka biya? Viiyakuraviig nǝ ɗuuli gǝlantǝrǝt nai kǝ uudah alfu dlǝɓ dǝ ɗummba bruudi dlǝɓa? Alghwa ngwɛn wa dzahamant nǝ uurami?
    10: Nii ma sarta kwa gǝlantǝrǝt nai kǝ uudah alfu uufaɗ dǝ ɗummba bruudi uudifna, alghw ngwɛn wa dzahamant nǝ uurami?
    11: Aujibǝg nǝghǝghaamaka bi taakiya ǝn tag tǝghǝr kǝ bruudi bi nai kǝ ǝlbǝgǝn biyi? Amaaya, famfǝg kǝ hǝnkal tǝ yista Farisiyaha ard Sadukiyaha.”
    12: Tǝhalakwah wa nǝgharaaka nǝ mbǝrzahaan taakiya, tagtǝr taaki aa farfǝg kǝ hǝnkal tǝ yistin kwa ɗiiyav ma bruudiyin biya, mbats tagtǝr taakiya aa farfǝg kǝ hǝnkal dǝ tsagaana Farisiyaha ard Sadukiyaha.
    13: Sǝghal ba nǝ Yesu damma larda Kaisariya Filibi, kaa ndavtǝrundavǝg kǝ iin kǝ mbǝrzahaana, amaa, “War nǝ Zǝra Uud mar tagaan nǝ uudahi?”
    14: Aiyam nǝ iitǝra, “Kyalm ar taakiya Yuhwan dadda tsuufǝga, kyalmah ar taakiya, tlayanga Iliya, kyalmah dlaɓa ar taakiya Irimiya bi pal ma tlayangaha.”
    15: Aiyama taa kǝ iitǝra, “Kuramǝm ǝn war nai mam tlǝg nǝ ghǝraruwi?”
    16: Kaa ngwangug kǝ Siman Bitrusa taakiya, “Kǝgh nǝ Kǝristi, Zǝra Daadamazhigǝla kwa dǝ shifǝga.”
    17: Aiyam nǝ Yesu taa kǝ iina, “Agha dǝ bark nǝng, Siman zǝra Yunana, aɗaba uud bi wa markada kwanǝn biya, aa markada nǝ Daadar ma ghǝrazhigǝla.
    18: Ən tagaktaga, agha Bitrus nǝnga, agha band akur kwa ndǝra nǝ uudan kǝ hǝngah tǝ vakaiya, ǝn da ɓaatlǝr dǝ kǝgh nai kǝ fǝtǝrna ndzǝɗ kǝ yaa daddaha gata kaiya, kwa da maay nǝ ǝmtsǝg dǝ ndzǝɗa tǝghǝr kǝ iitǝr biya.
    19: Ən da vǝlakvǝlǝg kǝ dǝga wura tlǝksǝra ghǝrazhigǝla, dlaɓa badǝm nǝ dǝgiti agha ngwuɗǝgant nǝng ma duniya, da ngwuɗav ma ghǝrazhigǝla, baɗǝm dǝgiti agha pǝlnanǝng ma duniya, da pǝlav ma ghǝrazhigǝla.”
    20: Ɓǝlatǝraaɓǝlǝg nǝ Yesu kǝ magyi kǝ mbǝrzahaan ba vaivai aa tagarar bi aandzu ndǝwar taakiya kai nǝ Kǝristi biya.
    21: Ciigǝt ma kwahiin kǝ sart wa tagatǝr nǝ Yesu kǝ mbǝrzahaan taakiya, barari dagal damma Wurshalima, da hǝɓuu kǝ dlaɗa shahshaha, ma dǝv kǝ maalaha ard maala zhiila kǝssufah ard lii tsaga adzahadzaha, da tsǝvana, tǝ hǝng hǝkǝrɗa da ciivant dǝ shifǝga.
    22: Ngal tǝɗant nǝ Bitrus damma dlǝmmbaava, cagaraa kǝ gyiya, amaa, “Aa tsanttsǝg nǝ Daadamazhigǝla, Yaazhigǝla, da dzǝgaar bi nǝ wan dǝ kǝgh ba dǝm biya.”
    23: Kaa gwiyav nǝ Yesu da vak Bitrus, amaa, “Yagh vakar Shatanaha, agha akura mbǝɗa uud tǝ ɗuul nǝng vakara, agha dzamaghǝr band uuda dǝg shiga ndǝ Daadamazhigǝl biya.”
    24: Aiyam nǝ Yesu taa kǝ mbǝrzahaana, “Baɗǝm dadda kwa na gata kaiya, bamma ɗugharsɗuug kǝ ghǝraana, kǝsant kǝ tlaɓa hǝrtǝgaana, gatǝkwagatǝga.
    25: Aɗaba baɗǝm dadda kwa na kata shifǝgaana, da ɓǝgaan dagala, Badǝm nǝ daddakwa ɓǝlda shifǝgaan mbakyarvad kaiya da tlǝknatlǝga.
    26: Au peɗaan kǝ uud akwama tlakǝnatlǝg kǝ duni baɗǝmma, tǝhalakwaha ɓǝldan kǝ shifǝgaani? Nii auwa da vǝlǝda nǝ uudan dlakulva shifǝgaani?
    27: Zǝra Uuda da sii dǝ zǝrɓǝlgahaan ma ndangǝra Daddaana, da vǝlgarvǝlg kǝ dǝg shigaan aandzu war kalkala dǝgiti ɓagaa nǝ iina.
    28: Ən takurtaga, mǝng nǝ kyalma uudahi ghaciga vakwanǝnna ar da maay ǝmtsǝg biya bamma nǝghǝgharanghǝg kǝ saay Zǝra Uuda ma tlǝkǝsǝraana.”
  17:
    1: Tǝhala hǝngah ǝngkwaha kaa langtǝrdǝtlang nǝ Yesu kǝ Bitrus, ard Yakubu, ard zǝrababba Yakub, kwa iin nǝ Yuhwan, dagat damma ghǝra aghwa ba kyakw ba daghuvaatǝra.
    2: Kaa gwivǝtgwiig nǝ ndzǝganan tǝvuukwatǝra, baz huɗǝvǝgaan ndakwi mbiig band faciya, sǝdavaan ndakwi kaa nǝg kǝ maɗǝkw ba tǝlla.
    3: Batwatsǝra kaa tsǝgwatsugw kǝ tlayang Musa ard tlayang Iliya. Kaa taa ghai kǝ iitǝr dǝ Yesu.
    4: Aiyam Bitrus taa kǝ Yesu, “Yaazhigǝla, marawa nǝ ndzǝgana miyam vaakwana. Akwama haighanthaiga ǝn tafǝgan kǝ tsakwamah hǝkǝrɗa, pal kǝskǝgha, pal kǝ Musa, pal kiyava Iliya.”
    5: Ma sartǝn ba ndzǝgaan taa ghai nǝ Bitrusa, kaa hǝɗtǝrduhǝɗǝg nǝ akummba, kaa cinngvacinng nǝ ghai sagal ma akumb taakiya, “Kwana iin zǝrara, kwan waig naiya, ǝn cinngaan kǝ ǝmtakǝraan ba vaivaiya. Cinngamarnucinnga.”
    6: Cinngara ba nǝ mbǝrzahaan ǝndkwaha, kaa gǝdzǝgǝtgǝdzǝg kǝ iitǝr ba vaivaiya, baz mbǝɗa damma haay kǝ iitǝra.
    7: Kaa sagau kǝ Yesu taptǝrnana amaa, “Ciyamciiga, gǝdzam biya.”
    8: Kaparant ba nǝ iitǝr kǝ ghǝra, nǝghara bi aandzu ndǝwar biya, nǝghara ba Yesu daghuvaana.
    9: Ar tǝghǝrdǝga saay nǝ iitǝr ma aghwa, am nǝ Yesu taa kǝ iitǝra, “Tagamarbi aandzu kǝ war kǝ dǝgiti amaa nǝghǝga nǝ uuram biya, bamma ciyavantciig Zǝra Uud ma gǝtlah dǝ shifǝga.”
    10: Kaa ndavgarundavǝg nǝ mbǝrzahaan taakiya, “Aujibǝg kǝ lii tsaga adzahadzaha Muus ar taakiya, barari bamma tlayang Iliya wada saay ba zǝnngwi?”
    11: Kaa ngutǝrangug kǝ Yesu taakiya, “Ba pakatta da saay nǝ Iliya, da ɓadlǝna kǝ dǝgitah ba ɗǝmma.
    12: Ən tagkurtag ciya, sahi ba wur nǝ iliya, nǝgharaaka bi kǝ iin biya, baz ɓagar dǝgitahi naaghant nǝ ghǝraatǝra. Bandkwah dlaɓa Zǝra Uud da hǝɓgaan kǝ dlaɗ mizha dǝvaatǝra.”
    13: Ngal nǝghǝgaakanǝghǝg kǝ mbǝrzahaan taakiya, tagtǝr tǝghǝr kǝ Yuhwan dadda tsuufǝga.
    14: Daral ba nǝ iitǝr da vaka dzahava dlamaa kǝlaawa, kaa sagau kǝ uuda nǝ iin da vak Yesu kǝla kǝ iin kǝ ghunnj tǝvuukwana,
    15: amaa, “Yaazhigǝla, zhuwardaalazhuug yagh kǝ zǝrara, tsagwara nǝ shiɗkwa shatanaha, hǝɓgaan dlaɓ kǝ dlaɗ ba vaivaiya. Shiga ngwɛn wan ba ɓalgaan damma kaara ard yuwa.
    16: Langandalang davak mbǝrzahagha, pǝletǝrvaapileg nǝ mbǝgaana.”
    17: Kaa ngugarangug nǝ Yesu amaa, “Kuram uudaha zamanna, am maay dǝ fadghǝr biya, am ɓa kǝlaadǝra, ǝn da zǝlma ǝmkyangar nai dǝ kurami? Ən da zǝlma ǝmkyangar nai ɓǝshkur kwanahaani? Ayakam kǝ zǝriin sa vaakwana.”
    18: Kaa cagaraacag nǝ Yesu kǝ gyi kǝ shiɗkwa Shatanhna, kaa ɗugarsɗuug kǝ shiɗkwa shatanah kǝ zǝriina, batwatsǝra ngal mbǝg kǝ iina.
    19: Kaa sagau kǝ mbǝrzah sa vak Yesu ma sartǝn maay aandzu ndǝwar vakaan biya, am nǝ iitǝr taa kǝ iina, “Aujilbǝg kǝskǝmnd pǝlekǝmndvaa lagwa shiɗkwa Shatanahiini?”
    20: Aiyam nǝ Yesu taa kǝ iitǝra, “Kwakyarvad hǝtsalhǝtsǝg nǝ fadghǝraruwa, ǝn tagkurtag kǝ jiira, akwamaa mǝng nǝ fadghǝraru ba hǝɗikǝn band zǝra mastada, mammaa tagardatag kǝ aghwǝn taakiya, ‘Ciig vaakwana, dǝg da vaakwaha,’ maa ciiga. Maa maay nǝ dǝgiti pilkurvaapilǝg biya.
    21: Lagwguvda bi nǝ hulfa kwanahaan biya, bamma tǝdvad dzǝgwazhigǝla ard kǝsa andǝla.”
    22: Dzaharvǝt ba nǝ mbǝrzahǝn ma Galili, kaa tagtǝrtag nǝ Yesu taakiya, “Da vǝlav Zǝra Uud damma dǝv kǝ uudaha,
    23: ar da tsǝgaana. Tǝ hǝnga hǝkǝrɗ ta ciivant dǝ shifǝga.” Kaa tsǝtǝratsǝg kǝ vǝgh ba vaivai kǝ mbǝrzahaana.
    24: Daragha ba nǝ Yesu ard mbǝrzahaan damma Kafarnahum, kaa tlǝgaraatlǝg nǝ lii cauwa hadam kwakyarvad vǝgya Daadamazhigǝl kǝ Bitrusa, am nǝ iitǝr taa kǝ iina, “Maay nǝ dadda kwa tsagkur dǝgit ɗiya hadam kwakyarvad vǝgya Daadamazhigǝl biya?”
    25: Aiyam nǝ Bitrusa, “Ɗigaana.” Dagha ba nǝ Bitrus da hǝnyaha, kaa fǝgarzhafǝg nǝ Yesu kǝ tagar ghaiy taakiya, “Au wagha nǝghǝga nǝng tǝghǝr kǝ ndavǝgni? Ar caug vak war nǝ tlǝksaha duni kǝ hadam, ar caug vak zarhaatǝr nii, ar caug vak uudahi tlǝrǝn hi?”
    26: Ngwa ba nǝ Bitrus taakiya, “Vak uudahi tlǝrna.” Aiyam nǝ Yesu taa kǝ iina, “Mbats maay nǝ zarhaatǝr ɗigaan biya.
    27: Bakǝvakwaha, haik badza ǝrviɗmahuɗ kǝ iitǝr dǝ kǝmya, dǝg damma yuwa haiya ɓǝlǝg kǝ kwanjara, agha wurant kǝ ghaiya kilfi agha fǝgarzha nǝng kǝ vigaana, agha da tlǝknatlǝg kǝ kwaɓi da tlǝgaltlǝg kǝ pǝlgaana, agha kǝsant kǝ kwaɓiina, agha ɗiya kǝ hadamagh ard dǝgara.”
  18:
    1: Ma kwahiin kǝ sarta, kaa sagau kǝ mbǝrzah da ndavgaru kǝ Yesu taakiya, “War kaci wa juujig baɗǝm kǝ ɗyakǝr ma tlǝkǝsǝra ghǝrazhigǝli?”
    2: Kaa ɗahant kǝ iin kǝ zǝrzǝriin sa vakaana, ghacnan ma taatakaatǝra.
    3: Aiyama, “Bak jiira wan tagkurtaga, akwama namal bi band zǝrzarhǝn biya, am tapna bi kǝ daa damma tlǝkǝsǝra ghǝrazhigǝl biya.
    4: Mbakyarvad kwaha, baɗǝm daddakwa fǝsauna ghǝraan band zǝrzǝrǝna, iin wa ɗyak ma tlǝkǝsǝra ghǝrazhigǝla.
    5: Baɗǝm dadda kwa dlǝghaadlǝghǝg kǝ zǝrzǝr ndǝ kwanǝn ma ɗaagara, dlǝghakwidlǝghǝg kǝskaiya.
    6: “Baɗǝm nǝ daddakwa fǝgara pal ma zarhahaan kwar fadghǝr tǝ kai kǝ ɓa haipa, da ngulǝm ba nguɗvardǝm nǝ akura vaar ɗyak ma kuungy ɓǝlvdǝm damma yuwa haiya kiyava ndǝgaana.
    7: Dǝga zhuwadaal kǝ duniya kwakyarvad dǝgitahi fǝgaraa uudah kǝ ɓa haipa, barari sagau nǝ dǝgitahi da fǝgaraa uudah kǝ ɓa haipa, dǝga zhuwadaal kǝ dadda kwa sagau tǝdvad iina.
    8: “Akwama fǝkaa kǝ ɓa haip nǝ dǝvagh bi shigagha, ghuddaghudǝg agha ɓǝldana. Da ngulǝm agha tlǝkkǝna kǝ shifǝga damma zǝrazǝr dǝ dǝv palla bi shig palla, tǝghǝr kwa da ɓǝlvdǝm nǝ uud damma kaara fai dǝ dǝvahagh buwa ard shigahagh buwa.
    9: Akwama gyiyagh wa fǝkaa ɓa haipa, tǝɗdatǝɗǝg agha ɓǝldana. Da ngulǝm agha tlǝkǝna kǝ shifǝga damma zǝrazǝr dǝ gyi palla, tǝghǝr kwada bǝlkadǝm nǝ uud damma kaara faiya dǝ gyiyahagh ba bǝrkuɗa.
    10: “Famfǝg kǝ hyimiya, nɛnnɛmbi aandzu kwar pal ma zarhahaan biya. Ən tagkurtaga, zǝrɓǝlgahaatǝr ba kǝlaa hǝnng ma ghǝraazhigǝla ar nǝghǝganǝghǝg kǝ huɗvǝga Daadar ma ghǝrazhigǝla.
    11: Aɗaba sahi ba kǝrkangyakw nǝ Zǝra Uud da kata lii zaraazǝga.
    12: “Mam tlǝg nǝ uuram, akwama dǝ tuughah dǝrmǝk nǝ uudana, kaa zaazǝg pallaatǝra, abi ɗuugaan kǝ kul vaslaambaɗ tar vaslaambaɗǝn vaka piig kaa dagal da gata pallǝn aa zaazǝgǝn?
    13: Bak jiir wan tagkur naiya, akwama tlakǝnatlǝg kǝ tuugh na zǝgazǝgna, hwaɗagaana juujig kǝ kul vaslambaɗ tar vaslambaɗǝn kwa zahara bi na.
    14: Band kwah dlaɓa nǝ Daadaru ma ghǝrazhigǝla naabi zaan aandzu pall ma zǝrzarhahaan biya.
    15: “Akwama ɓagakaɓag nǝ zǝraabagh kǝ haipa, tagarnaatag kǝ haipaana, aandz ba kǝghar dǝ iina. Akwama cinngakanaacinnga gwighǝdaagwiig kǝ ndzǝganaru dǝ zǝraabagha.
    16: Akwama cinngakanaa biya, agha gwiya dagal dǝ uud pal bi uudah buwa, kiyava cinngva nǝ ǝlbǝg tǝdvad shida uudah buwa bi hǝkǝrɗa.
    17: Akwama lawalǝg nǝ zǝraabagh kǝ cinngtǝrcinnga, agha tagtǝr kǝ yaa daddaha gata Yesu, akwama lawalǝg kǝ cinngtǝrcinnga, nǝdalnǝg band kǝrdiya bi band dadda dza hadama.
    18: “Bak jiir wan tagkur naiya, badǝm nǝ dǝgiti am nguɗǝgant nǝ uuram ma duniya, nguɗanguɗa ma ghǝrazhigǝla, dǝgiti am pǝlna nǝ uuram ma duniya, da pǝlav ma ghǝrazhigǝla.
    19: “Ən gwiya tagkurtaga, akwama haiyaranthaig nǝ uudah bu ma kuram kǝ ghala dǝgit ma duniya, da ɓagtǝrɓag nǝ Daadar kwama ghǝrazhigǝla.
    20: Baɗǝm vakavaki dzahvǝt nǝ uudah buwa bi hǝkǝrɗa ma ɗaagara, ǝn ba ǝmtaɗ dǝ iitǝra.”
    21: Kaa sagau kǝ Bitrus da vak Yesu, amaa taa kǝ iina, “Yaazhigǝla, da ɓagwi shig ngwɛɛn nǝ zǝraabar kǝ haip lakuti ǝn ɓǝsharnaani? Ɓagaɓag damma shig uuɗiffa?”
    22: Aiyam nǝ Yesu taa kǝ iina, “Shig uuɗif kalti biya, shig uuɗif damma kul uuɗifa.
    23: Mbakyarvad kwaha, da gǝrav nǝ tlǝksǝra ghǝrazhigǝl dǝ tlǝksa kwa naa kǝdla dǝgahaan kwama dǝv kǝ kwanahahaana.
    24: Fǝgharzha ba nǝ tlǝks kǝ kǝdlǝgaana, kaa sǝvardǝvsǝg nǝ uudi gatǝg nǝ iin tǝ ambǝla adawan alfu kǝlaawa.
    25: Pilgharvaa ba nǝ pǝlgaana, kaa tagaan kǝ tlǝkǝsǝn taakiya, aa vǝlvǝtvǝlǝg baz iina baz uusaana baz zarhaana baz dǝgitahi dǝ vakai nǝ iin baɗǝmma kiyava pǝlgaana.
    26: Kaa ghalgaan kǝ kwatnahaanǝn kǝla kǝ ghunnj tǝvuukwana, aiyama, ‘Fǝwifǝg kǝ huɗa ǝn da pǝlakpǝlǝg baɗǝmma.’
    27: “Kaa zhugardaalazhuug nǝ dadda hǝnyahaan kǝ kwatnahǝn ɓǝsharna kǝ gǝmauwaan ba ɗǝmma ɗuwars dagalaana.
    28: “Bad sagala kwatnahǝn waha, kaa nǝghǝganǝghǝg kǝ iin kǝ tsaghwa tlǝraan kwa gatǝg nǝ iin tǝ gǝmauwa sǝll kǝlaawa, ngal viyit kǝ iin hǝkyarna kǝ mbakulera, amaa, ‘Pǝlwipǝlǝg kǝ gǝmauwi ǝn gatak naiya.’
    29: Ngal kǝlgakǝlǝg nǝ tsaghwa tlǝraanǝn kǝ ghunnj tǝvuukwan ghalgaana, amaa, ‘Fǝwifǝg kǝ huɗa ǝn da pǝlakpǝlga.’
    30: Lawalǝg nǝ kwatnahǝn kǝ cinngaana, ngal ɓǝldǝm kǝ iin damma guda bǝrfina, bamma pǝlaapǝlǝg kǝ gǝmauwaana.
    31: Cinngara ba nǝ tsaghwaha tlǝraan kǝ dǝgiti dzǝghaardzǝgna, cinngaru bi kǝ ǝmtakǝraan biya, kaa dagal kǝ iitǝr ar tagar kǝ dadda hǝnyahaatǝr kǝ dǝgiti dzǝghaardzǝg baɗǝmma.
    32: Kaa ɗahgantɗahǝg nǝ dadda hǝnyahǝn kǝ kwatnahǝna, amaa taa kǝ iina, ‘Agha kǝlaada kwatnah nǝnnga, ɓǝshankanaaɓǝshig nai kǝ gǝmauwǝn baɗǝm mbakyarvad ghalgagha.
    33: Mbats kalkalaan bi kǝskǝgh agha zhuwardaala kǝ tsaghwa tlǝragh band kwana zhuukadaala naiyin biya?’
    34: Tsaatsǝg nǝ ǝrviɗmahuuɗ kǝ tlǝks ba vaivaiya, vǝlda kiyava vǝlgar dlaɗa, bamma pǝlaapǝlǝg kǝ gǝmauwiin baɗǝmma.
    35: “Da ɓagtǝr bandkwan nǝ Daadar kwa ma ghǝrazhigǝl kǝ lii larwalǝg kǝ ɓǝshtǝrna kǝ zǝraabahaatǝr bad ǝrviɗmahuɗ palla.”
  19:
    1: Ghyǝnnga ba nǝ Yesu kǝ taa kwanahaan kǝ dǝgitaha, kaa ɗugarsɗuug kǝ iin kǝ larda Galili damma larda Yahuda, kwa tǝ gyaba kwah kǝ Zaagha Judan.
    2: Kaa gatǝgaan kǝ uudah baɗyaka, dlaɓa mbahghanambahǝg kǝ lii dǝ kuzah vaakwaha.
    3: Kaa sagau kǝ kyalma Farisiyah da fishgaana, am nǝ iitǝr taa kǝ iina, “Tǝdvad tsagaana Muusa, kalkalaan kǝ uudan tagwavǝgha dǝ uusaan aandzu tǝghǝr kǝ hulfa kwar kǝ dǝgiti ɓaga nǝ iina?”
    4: Kaa ngutǝrangug kǝ Yesu amaa, “Mbats, karantama bi taakiya, bamma daa zǝnngwa, Dadda Virɗiga, ‘ndǝraandǝrǝg kǝ ghwalva ard uus biya?’
    5: Amaa dlaɓa, ‘Mbakyarvad kwaha, ɗuugaan nǝ uud kǝ daddaana ard babbaan ǝmtsǝvǝt tǝ uusaana, ba bǝrkuɗ ar da nǝg kǝ vǝgh palla.’
    6: Ar madlai vǝgh buwa biya, naralnǝg kǝ vǝgha palla, dǝgiti aa matlǝgant nǝ Daadamazhigǝla, aa tagw bi nǝ uud biya.”
    7: Aiyam nǝ iitǝra kǝ iina, “Ma ba ǝndǝkwah tsauwa, aujilbǝg kǝ Musa taga taakiya, barari ghudvara nǝ kakaɗa tagwavǝgh kǝ uusa, dlaɓa lagwvarsi?”
    8: Aiyam nǝ Yesu taa kǝ iitǝra, “Mbakyarvad dǝkdǝka ghǝraruwa wa haiyakurant musa taakiya, aa ghudvarghudǝg nǝ kakkaɗa tagwavǝgh kǝ uusa, ndza ǝndkwah bi ma daa zǝnngw biya.
    9: Ən tagkurtaga, baɗǝm daddakwa tagwvǝgha dǝ uusaana, ma maay kwakyarvad gwaragwar biya, ma kǝsuukǝsǝg kǝ kwatlǝrn kǝ uusa, ɓaa ba gwaragwar dǝ iina.”
    10: Aiyam nǝ mbǝrzah taa kǝ iina, “Akwama bandkwan nǝ ndzagana zhiila ard uusa, mbats ndzǝga kwal kǝsa uusa wa marawa.”
    11: Am Yesu taa kǝ iitǝra, “Ɗǝm bi nǝ uudahi haiganthaig kǝ ǝlbǝgǝn biya, bamma lii haitǝrant nǝ Daadamazhigǝla.
    12: Mǝng nǝ lii yavvǝtǝra kǝɓkya, ar da kǝsguu bi kǝ uus biya, mǝng nǝ lii datlatǝrǝt nǝ uudaha, mǝng dlaɓ nǝ lii hayarant nǝ iitǝr bad ghǝraatǝr taakiya, ar maay da kǝsa uus mbakyarvad gata tlǝksǝra ghǝrazhigǝl biya. Baɗǝm daddakwa haiganthaig kǝ ǝlbǝgna aa haiyanthaiga.”
    13: Tǝhalakwaha, kaa sǝgardǝvsǝg nǝ uudah kǝ zarhaha kǝ Yesu kiyava fǝtǝra dǝva, dlaɓa dzǝgwtǝra kǝ zhigǝla. Nǝghara ba nǝ mbǝrzahaan ǝndkwaha, kaa cagtǝraacag kǝ iitǝr kǝ gyi kǝ lii sarardǝvsǝgna.
    14: Am nǝ Yesu taa kǝ iitǝra, “Ɗuwamtǝrɗuug kǝ zarha sa vakara, tsamtǝrǝva biya, aɗaba tlǝksǝra ghǝrazhigǝla dǝga hulfa kwan kǝ zarha.”
    15: Fatǝrnaa ba nǝ iin kǝ dǝva, ngal mǝla dagalaana.
    16: Mǝng nǝ uuda nǝ iina sǝghǝv sa vak Yesu amaa “Dadda tsaga dǝgita, awan nǝ dǝgit maraw ǝn da ɓag nai ǝn tlǝkna kǝ shifǝga tangw damma zǝrazǝri?”
    17: Aiyama nǝ Yesu taa kǝ iina, “Aujilbǝg agha ndavakai tǝghǝr kǝ dǝgiti marauwi? Ba Daadamazhigǝla pal wa marauwa. Akwama agha naagaan agha tlǝkna kǝ shifǝga tangw damma zǝrazǝra, tsufanttsufǝg kǝ kwanahaan kǝ adzahadzahaha.”
    18: Aiyama taa kǝ Yesu, “Kwar kǝ adzahadzahahi?” Am Yesu taa kǝ iina, “‘Tsǝbi kǝ shifǝga biya, ɓag bi kǝ gwaragwar biya, ɓag bi kǝ gǝl biya, ghudars bi dlaɓ kǝ fiid kǝ uud biya,
    19: faarafǝg kǝ daadagha ard baabagha,’ dlaɓa ‘agha wayant kǝ tlǝgharaawakyaghagh band ghǝragha.’”
    20: Am nǝ daala zǝrǝn taa kǝ Yesu, “Tsufananttsufǝg baɗǝm kǝ kwanahaana, au dlaɓ wa tǝmgwani?”
    21: Aiyam nǝ Yesu taa kǝ iina, “Akwama agha naagaan agha nal kǝ uuda jiijiira, valǝtvalǝg kǝ dǝgahagh baɗǝmma, agha tagwarda kǝ talagaha, agha da tlǝkǝnatlǝg kǝ dǝgshigah ma ghǝrazhigǝla, kaa gatkwagatǝg kǝskǝgha.”
    22: Cinngha ba nǝ daala zǝrǝn kǝ ǝlbǝgna, kaa badzǝdabadzǝg kǝ iin kǝ ǝrviɗmahuɗa, aɗaba dadda hyah nǝ iin ba vaivaiya, kaa ba mǝla dagalaana.
    23: Aiyam nǝ Yesu kǝ mbǝrzahaana, “Ən takurtaga, da dǝgaa ba dlah nǝ dadda hyah damma tlǝksǝra ghǝrazhigǝla.
    24: Ən gwiya tagkurtaga, da tsaftsaf kǝ adlǝgwam dagal tǝ ɗuula liipǝr tǝghǝr kǝ dadda hyah daa damma tlǝksǝra Daadamazhigǝla.”
    25: Cinnghara ba nǝ mbǝrzahaan ǝndkwaha, kaa ɓa jappǝr kǝ iitǝra, ba vaivaiya aiyam nǝ iitǝra, “Ma ba ǝndkwan tsaa, war kaci wada tlǝkǝna katǝgi?”
    26: Ngal zhartǝrzharǝg kǝ Yesu, amaa taa kǝ iitǝr, “Kwan kǝ dǝgita ɓaga bi vak uud biya, vak Daadamazhigǝla ɓagaɓag nǝ wanahaan baɗǝmma.”
    27: Aiyam Bitrus taa kǝ iina, “Wai ci, ɗuwamndarɗug kǝ dǝgahamnd baɗǝmma kwakyarvad gata kǝgha. Au ci wa kǝmnda tlǝkna nǝmndi?”
    28: Am Yesu taa kǝ iitra, “Jiir wan tagkur naiya, ma zamanǝn kwa da sagauna, Zǝra Uuda da cihurga tǝ avǝda kwargaan ma tlǝksǝraan kwa ndanga, kuramǝn gatamkwagatǝgna, kuram wam da cihurga tǝ avǝdah kǝlaawa tar buwa, kiyava kwara kuɗigaha yaa Izraila kǝlaawa tar buwa.
    29: Baɗǝm nǝ dadda kwa ɗugars vǝgyaha, bi zǝraabahaana, bi dughaha babbaana, bi daddaana bi babaana bi uusaana, bi zarhaana ard guhah kwakyarvad kaiya, da tlǝkǝnatlǝg juujig kwah shig dǝrmǝkka, da tlǝkna dlaɓa kǝ shifǝg tangw damma zǝrazǝra.
    30: Da baɗyaka nǝ uudaha zǝnngwa ar da nǝg kǝ dǝga hala, dǝga hala dlaɓa ar da nǝg kǝ dǝga zǝnngwa.
  20:
    1: “Tlǝksǝra ghǝrazhigǝla da band dadda hǝnyhiin kwa dal ba wurkǝs da gata bariyamah kiyava ɓa tlǝr ma guha inabiyaana.
    2: Kaa tagvatag kǝ iitǝr kǝ gana kwab kwa ɗivar kǝ baryam ma vannga, ngal lanngtǝrdan damma guhaana.
    3: “Tamaha karfi vaslambaɗa dlakadura, kaa gwiya dagal kǝ iin dlaɓa, kaa nǝghǝganǝghǝg kǝ iin kǝ uudahiin ar ghacga ba gyagyaan tǝ ɓalla kasukwa.
    4: Aiyama taa kǝ iitǝra, ‘Kuram ndakwani damdǝg damma guhara, ǝn da ɗiikurɗiig ba marauwa.’
    5: Kaa dagal kǝ iitǝra. “Kaa gwiya dagal kǝ iin dǝ vaci tǝghǝra, dlaɓa ard kalkala karfi hǝkǝrɗa hwaasa, ɓagtǝra bandkwa ɓagatǝra nǝ iin kǝ uudahaatsa.
    6: Damma karfi dlǝɓa hwaasa, kaa gwiya dagal tlǝtǝraa kǝ uudahiin ar ghacga ba gyagyaana, amaa taa kǝ iitǝra, ‘Aujilbǝg bǝrnif vanng am ndzǝga ba gyagyaani?’
    7: “Aiyam nǝ iitǝr taa kǝ iina, ‘Aɗaba maay dadda kwa vǝlkǝmnd tlǝra ɓag biya.’ “Amaa taa kǝ iitǝra, ‘Kuram ndakwani damdǝg da ɓatlǝr ma guhara.’
    8: “Ɓǝlaa ba nǝ hwaasa, kaa ba tagartag nǝ dadda guhǝn kǝ daddakwa mǝlgaru kǝ fa hyimmi tǝ guhna, ‘Ɗahtǝrantɗahǝg kǝ lii ɓa tlǝrǝn agha ɗiitǝra kǝ kwaɓa tlǝraatǝra, farzhafǝg dǝ dǝga hala dat dǝga zǝnngwa.’
    9: “Lii dalar tamaha damma karfi dlǝɓa hwaasana, ma waratǝr dlǝgha dǝgiti diivar kǝ baryam ma vannga.
    10: Lii fararzha dagal ba zǝnngwna, tlatlar taakiya da jiguujig nǝ kwaɓatǝr kǝ dǝga kyalma uudaha, ghǝravaatǝr ndakwani ma waraatǝr dlǝgha ba dǝgiti diivar kǝ baryam ma vannga.
    11: Cauwara ba nǝ iitǝra, kaa zavgarǝv ghaiy kǝ iitǝr kǝ dadda guha.
    12: Ar taakiya, ‘Lii araa sǝgal tǝhalǝna, araa ɓaga ba tlǝra aawa palla, agha ɗiikǝmnda ba kalkal dǝ iitǝra, kǝmǝndi kǝma vannga ba ɓa tlǝra, aɗuug ci kǝ dlaɗa faciyi kǝmnda hǝɓguu nǝmnda.’
    13: “Kaa ngwarangug kǝ iin kǝ pall ma taatakaatǝra, amaa, ‘Tsaghwara zangku biya, tagikǝvai kǝ gan taakiya, ǝn da ɗiyak kwaɓi ɗiivar kǝ baryam ma vanga biya?
    14: Cauwacaug kǝ dlayagha dǝg daasagha, na naagant ba nai kǝ diitǝr kǝ lii aa sǝgal tǝhala kalkal dǝgiti na vǝlak naiya.
    15: Mbats ǝn maay dǝ ndzǝɗa ɓa dǝgiti na naagant nǝ ghǝrar dǝ kwaɓar biya? Nii agha shilg kwakyarvad ǝn ɓa hɛrǝr ba vaivaihi?’
    16: “Ar da nǝg band kwan nǝ dǝga hal kǝ dǝga zǝnngwa, dǝga zǝnngwa ar da nǝg kǝ dǝga hala.”
    17: Tǝ ɗuula dagat damma Wurshalim nǝ Yesu ard mbǝrzahaana, kaa ɗahtǝrǝtɗahǝg damma gyaba, amaa taa kǝ iitǝra,
    18: “Kiyam dagat damma Wurshalima vakavaki da vǝlav nǝ Zǝra Uuda damma dǝv kǝ maalah ma zhiila kǝsuufah ard lii tsaga adzahadzaha, ar da ghudara kǝ sharia ǝmtsǝga.
    19: Tǝhalakwaha ar da vǝltǝr damma dǝv kǝ lii Yahudah biya, ar da nengaana ar da kalaakana, da hǝrtǝvǝta, tǝ hǝnga hǝkǝrɗ da civanta.”
    20: Kaa sagau nǝ babba zarha Zabadi dǝ zarhaan da ghalǝg vak Yesu, kǝla kǝ iin kǝ ghunj tǝvuukwaana ngal ghala dǝgit vakaana.
    21: Aiyama taa kǝ iina, “Au wa nag nǝngi?” Am nǝ uusiin taa kǝ Yesu, “Haiyanthaig yaan kǝ zarharǝn buna ma pal cǝhura tǝ dǝva kafagha, pal tǝ dǝva ghyaɓagh ma tlǝksǝragha.”
    22: Am nǝ Yesu taa kǝ zarhahina, “Am sǝrgai kǝ dǝgiti am ghalǝg nǝ uuram biya. Am hǝɓgahǝɓǝg kǝ dlaɗǝn ǝn da hǝɓǝg naina?” Aiyam nǝ iitǝra, “Kǝm hǝɓgahǝɓǝga.”
    23: Amaa taa kǝ iitǝra, “Ba pakat am da hǝɓǝgahǝɓǝg kǝ dlaɗara, ndzǝgan tǝ dǝvaa kafara ma dǝva ghyaɓara kai bi wa dǝ ndzǝɗa vǝlgaan biya, kwanahaan kǝ vakavakaha, ɓadlavtǝrna kǝ lii dzǝratǝraaka nǝ Daadar kwa ma ghǝrazhigǝla.”
    24: Cinnghara ba nǝ mbǝrzahaan kǝlaawǝn ǝndkwaha, kaa badzǝdabadzǝg kǝ iitǝr kǝ ǝrviɗmahuɗ dǝ zarhabaabahǝn buwna.
    25: Kaa ɗahtǝrǝtɗahǝg nǝ Yesu baɗǝmmaatǝra, amaa, “Am sǝrgasǝrg taakiya tlǝksahi kwar Yahudah biya ar fǝtǝra ngǝɗǝp kǝ uudahatǝra, maalahatǝr ndakwani ar martǝr ndzǝɗa kǝ uudahatǝra.
    26: Da ǝndkwah bi ma taatakaru biya. Dlakulvakwaha, badǝm daddakwa naa nǝg kǝ maal ma kurama, barari nal kǝ kwatnaharuwa.
    27: Dlaɓa baɗǝm nǝ dadda kwa naa nǝg kǝ maal ma kurama, barari naal kǝ ɛɛvaruwa.
    28: Bandkwah dlaɓ nǝ Zǝra Uuda sahi bi mbakyarvad ɓagvarnǝs kwatnahǝr biya, sahi mbakyarvad ɓa kwatnahǝra, vǝlda dlaɓ kǝ shifǝgaan kiyava vara uudah baɗyaka.”
    29: Ar tǝ ɗuula ɗuwa Yariku nǝ Yesu ard mbǝzahaana, kaa gatǝgaan kǝ uudah baɗyak dagala.
    30: Mǝng nǝ gulfah bu ar cihurga tǝ ghyaba ɗuula, cinngara ba nǝ iitǝr taakiya Yesu wa ghuda dagala, kaa dzǝgantdzǝg kǝ iitǝr kǝ ghaiya, am nǝ iitǝra, “Yaazhigǝla, Zǝra Dauda! Zhukǝmdaalazhuuga!”
    31: Kaa cagtǝraacag nǝ uudah kǝ gyiya, ar tagtǝr taaki aa ndzarandzǝg ba ɗǝwa. Ar gwiya dzǝgant kǝ ghai bad halavuwa ndzǝɗahatǝr ar taakiya, “Yaazhigǝla, Zǝra Dauda! Zhukǝmndaalazhuuga!”
    32: Kaa ghacgaghacig kǝ Yesu, ɗahtǝrǝt amaa taa kǝ iitǝra, “Auwam nag nǝ uuram ǝn ɓagkurani?”
    33: Aiyam nǝ iitǝra, “Yaazhigǝla, kǝm naa magha wurkǝmndant kǝ gyiyahamnda.”
    34: Ngal zhutǝrdaalazhuug kǝ Yesu, tapnan kǝ gyiyahaatǝra, batwatsǝra kaa wurgǝtwurǝg kǝ gyiyahaatǝra, ngal gata Yesu kǝ iitǝra.
  21:
    1: Hǝrzarǝt ba nǝ Yesu ard mbǝrzahaan damma Bǝtafaji gǝdzǝrkǝsa kwa hǝrz dǝ Wurshalima vaka Aghwa Uufaha Zaitun, kaa ɓǝlgantɓǝlǝg kǝ iin kǝ mbǝrzah buwa.
    2: Amaa taa kǝ iitǝra, “Damdǝg daadamma kǝsǝn tǝvuukwaruna. Bad daasaruwa am da nǝghǝganǝghǝg ka aghyunngw nguɗgan dǝ zǝraan tǝvǝgha, pǝlamtǝrdaapǝlǝg am sǝtǝrdaa sa vaakara.
    3: Akwama ndavakurundavǝg nǝ uudana, tagamartag taakiya, Yaazhigǝl wa naatǝrnaaga, da gwiya saas dǝ iitǝr ba ndakwana.”
    4: Dzaghaar kiyava righa dǝgiti tagada nǝ tlayanng taakiya,
    5: “Tagamtǝrtag kǝ uudaha Wurshalima, ‘Wayam nǝ tlǝksaru da vakaaruwa, kalaaliya uuda nǝ iina, dagal tǝ aghyunngwa, zǝra aghyunngw wa dagal nǝ iin tǝ vakaiya.’”
    6: Kaa dagal kǝ mbǝrzahaana ar ɓagnan bandkwa tagatǝr nǝ Yesu.
    7: Ar sardǝv kǝ aghyunngwiin baz zǝraana, ar ɓala kǝ sǝɗavahaatǝr tǝ iitǝra, kaa ba ɗalgaan kǝ Yesu cihura tǝ vakaiya.
    8: Kaa ɓala sǝɗavahaatǝr nǝ uudah ba ɗyak tǝ ɗuula, kyalmah dlaɓa ar kala kǝ aabayah tǝ uuf ar ɓala kǝ iitǝr tǝ ɗuula.
    9: Uudahi mǝlara dagal tǝvuukaana ard lii gatǝg mahala ar dzǝgant kǝ ghai ar taakiya, “Galyamgalǝg kǝ Zǝra Dauda. Barǝk kǝ dadda kwa sagau ma ɗaaga Yaazhigǝla! Galyamgalǝg kǝ Daadamazhigǝla!”
    10: Dagha ba nǝ Yesu damma Wurshalima, kaa cigǝtciig kǝ hǝnkala uudah baɗǝm ma kǝsiin ar taakiya, “War wa nǝ iin kǝ uudi?”
    11: Aiyam nǝ uudahǝn dagal gata Yesuwǝn taa kǝ iitǝra, “Kwan iin nǝ tlayang Yesu, kwa sǝghal ma Nazarat ma Galili.”
    12: Dagha ba nǝ Yesu damma gaagazaiya vǝgya Daadamazhigǝla, lagwatǝrda kǝ lii vǝla dǝgitah ard lii sagwa dǝgitah ma vakai baɗǝmma, tlagars kǝ iin kǝ tibǝra lii mɓǝɗa kwaɓa ard avǝdaha lii vǝla takalamasara.
    13: Amaa taa kǝ iitǝra, “Vindavavindǝga taakiya, “‘Vǝgyar da ɗahav dǝ Vǝgya Daadamazhigǝla,’ namdalnǝg nǝ uuram kǝ ‘zazza shiɓa gǝlaha.’”
    14: Kaa sagau kǝ gulfah ard ghurɗikaha da vakaan ma Vǝgya Daadamazhigǝla, mbǝttǝrana.
    15: Nǝghara ba nǝ maalah ma zhiila kǝsuufah ard lii tsaga adzahadzah kǝ dǝga japǝrǝn ɓǝgaa nǝ Yesu na, ard ɗiya cauwa zarh ma gaagazaiya Vǝgya Daadamazhigǝla, ar taakiya, “Galiyamgalǝg kǝ Zǝra Dauda.” Kaa badza ǝrviɗmahuɗ kǝ iitǝra.
    16: Aiyam nǝ iitǝr taa kǝ Yesu, “Agha cinngacinng kǝ dǝgiti ar tag nǝ zarhahaan kwana?” Kaa ngwangug nǝ Yesu amaa, “Mbats tapamnai kǝ karantǝgaan ma kaɗkaɗa ǝlbǝga Daadamazhigǝl vindavindan taakiya, “‘Yaazhigǝla, kǝgh wa tagh taaki agha ɗaag tǝdvad ghaiya zarhaha ard vuunjah nǝng kǝ galgagh sagal biya’?”
    17: Tǝhalakwaha, kaa ɗuutǝrsɗuug kǝ iin ma kǝsiina, kaa ba mǝla dagal damma Betani, ngal hǝnng kǝ iin vaakwaha.
    18: Wurraa ba nǝ kǝsa, kaa gwiyaghǝra saas kǝ Yesu damma Wurshalima ngal njǝkǝnnjiig kǝ wai tǝ ghǝrdǝga.
    19: Nǝghgha ba nǝ Yesu kǝ uufa ghǝgyiv tǝ ghaiya ɗuula, kaa dagau kǝ iin da tǝvǝgh kǝ uufina, tlakǝna bi aandzu dau tǝvakai biya, ba hyǝmiya. Amaa taa kǝ uufiina, “Ba dǝm agha maadlai gwiya ya zǝr biya.” Tǝhala kwaha kaa ghulǝg kǝ uufiina.
    20: Nǝghara ba nǝ mbǝrzahaan ǝndkwana, kaa ɓaa jappǝr kǝ iitǝr ba vaivaya. Aiyam nǝ iitǝra, “Aujilbǝg kǝ uufǝn aa ghulgal ba watswatsi?”
    21: Kaa ngutǝrang kǝ Yesu, amaa, “Bak jiir wan tagkurtaga, akwamamma mǝng dǝ fadghǝra, dlaɓa am maay ɓaa ndaundau biya, mammaa ɓagaɓag kwa juujigg kǝ dǝgiti na ɓagara nai kǝ uuffa ghǝgyivna, am tagardatag dlaɓ kǝ aghwǝn taakiya, ‘Ciig vaakwana dǝg damma yuwa haiya,’ maa ciiga.
    22: Akwama famdǝghǝrǝtfǝga, baɗǝm nǝ dǝgiti am ghalga nǝ uurama vak Daadamazhigǝla ma dzǝgwazhigǝla, am tlǝkǝnatlǝga.”
    23: Dagha ba nǝ Yesu damma gaagazaiya Vǝgya Daadamazhigǝla, kaa tsagtǝr dǝgit kǝ uudah, ngal sagau kǝ maalah ma zhiila kǝsuufah ard maalah tǝghǝr kǝ dlamaa kǝlaaw da vakaana, am nǝ iitǝr taa kǝ iina, “Agha ɓag dǝ kwar kǝ ndzǝɗ nǝng kǝ kwanahaan kǝ dǝgitahi? Dlaɓa vǝlakak war kǝ ndzǝɗi?”
    24: Kaa ngutǝrangug kǝ Yesu taakiya, “Ən ndavkurundavǝg ghǝravar kǝ ndavǝg palla. Akwama tagamwitaga, ghǝravar ndakwani ǝn tagkurtag kǝ ndzǝɗi ǝn ɓag nai kǝ tlǝr dǝ vakaiya.
    25: Ndzǝɗǝn ndza dǝ vakai Yuhwan dadda tsuufǝgǝn tsaa, vǝlghar nǝ Daadamazhigǝl nii uudhi?” Kaa tagkǝvatag kǝ iitǝr mataatakatǝra, taakiya, “Akwama tagiyamatag taakiya, ‘Sahi vak Daadamazhigǝla,’ da tagaan taakiya, ‘Aujilbǝg ci famdǝghǝrǝt bi tǝ iin biyi?’
    26: Akwama tagiyamatag taakiya, ‘Vak uuda,’ kiyam gǝdza dǝgǝti ar da ɓagkiyam nǝ uudaha, aɗaba baɗǝm nǝ uudah haiyaranthaig taakiya ndza tlayanga nǝ Yuhwana.”
    27: Kaa ngugarangug kǝ iitǝr kǝ Yesu taakiya, “Sǝramdai kǝ vakavaki sal dǝ ndzǝɗiin biya.” Am Yesu taa kǝ iitǝra, “Ghǝravar ndakwani ǝn maay tagkurtag, kǝ ndzǝɗi ǝn ɓag nai kǝ kwanahaan kǝ dǝgitah biya.
    28: “Au wamaa tlǝg uurami? Mǝng nǝ uuda nǝ iin dǝ zaraa ghwalvah buwa, kaa dagau da vak kǝ dǝga zǝnngwa, amaa taa kǝ iina, ‘Zǝrara, dǝg da ɓa ɓatlǝr ma guha inabi hinana.’
    29: “Aiyam nǝ zǝrǝn taa kǝ iina, ‘Ən maay dagal biya,’ tǝhalakwaha, kaa ɗayaghǝr kǝ iin kaa ba dagala.
    30: “Ngal dagau kǝ daadiin da vak kǝ dǝga buwa, tagar kǝ iin kǝ dǝgiti taghar nǝ iin kǝ zǝngwna, kaa ngwangug kǝ zǝriin taakiya, ‘Iiya, ǝn dagau, daada,’ tǝhalakwaha lǝwa kǝ dagala.
    31: “Ma iitǝr buna tsaa, warwa ɓagaa dǝgiti naag daddaatǝri?” Aiyam nǝ iitǝra, “Dǝga zǝnngwa.” Am nǝ Yesu taa kǝ iitǝr dlaɓa, “Bak jiira ǝn tagkurtaga, lii cauwa hadahama ard tandaha ar da dǝgaa nǝ iitǝr damma tlǝksǝra Daadamazhigǝl tǝghǝr kǝskurama.
    32: Aɗaba sahisǝg nǝ Yuhwan da markurd ɗuula jiirjiira, famdǝghǝrǝt bi nǝ uuram tǝ iin biya. Lii cauwa hadama ard tandaha fardghǝrǝtfǝg tǝ iina. Bakǝvakwaha, ndzaa tǝhala nǝghǝganǝghǝgaru kwana, lamwalǝg kǝ pǝlaghǝr am fǝdghǝrǝt tǝ iina.
    33: “Kaa tagtǝrtag kǝ Yesu kǝ garava. Mǝng nǝ uuda nǝ iin kwa ɓagaa guha inabi, ɓǝlaraa kǝ ghǝrgha, tǝfa kǝ vaka pǝrtsa zǝra inabi, dlaɓa ndǝrǝt kǝ gud ba tlaɗ kiyava dadda uufakyauwa. Vǝltǝr kǝ mbuucaan kǝ yaa daddaha uusǝga, kaa dagal kǝ iin damma lardi tlǝrna.
    34: Ɓagaa ba sarta caa zǝra inabi, kaa ɓǝlgantɓǝlǝg kǝ iin kwatǝnahahaan davak lii cauwar mbuuca guhǝna, kiyava sǝgarda zarha inabi ma guha.
    35: “Ngal viigǝtviig nǝ lii cauwar mbuucin kǝ kwatnahahaana, ar kalaaka kǝ palla, ar tsa kǝ palla, ar ɗawala kǝ kwah dǝ akura.
    36: Gwiya ɓǝlant kǝ kwatlǝrn kǝ kwatanahah baɗyaka kwa jarujig kǝ lii ndza zǝnngwa, ngal ɓagaan kǝ lii cauwar mbuucin band kwa ɓagartǝra nǝ iitǝra kǝ lii ndza zǝnngwa.
    37: Tǝhalakwah baɗǝmma, kaa ɓǝlgantɓǝlǝg nǝ dadda guhǝn kǝ zǝraan da vak lii cauwara mbuucna, amaa, ‘Mbatak ar da fǝgaarafǝg kǝ zǝrarna.’
    38: “Nǝghara ban lii cauwara mbuuca guhǝn kǝ zǝrna, kaa tagkǝvatag kǝ iitǝr mataatakatǝr taakiya, ‘Wan ci dadda kwada gwigaana, na tsiyamatsǝga, kiyava nǝg guhiin kǝ dǝga miyamma.’
    39: Ar viyǝt, ar ɗuuldan da gyilga ghǝrgha, ar tsana.
    40: “Aitsaa, akwama saghaasǝg nǝ dadda guhǝna, au kaci wa da ɓagtǝr nǝ iin kǝ lii cauwara mbuuca guhni?”
    41: Am nǝ iitǝr taa kǝ iina, “Da ciɓan kǝ kǝlaadahaan vǝlatǝr nǝ iin kǝ mbuuca guhna, da vǝltǝr kǝ guhiin kǝ uudahitlǝrn kwar da vǝlgar dlaiyaan ma kadlannga guhiina.”
    42: Am nǝ Yesu taa kǝ iitǝra, “Mbats tapamnai karantǝgaan ma kakkaɗa Daadamazhigǝl biya? “‘Akuri ɗuwarars nǝ yaa daddaha ndǝrga, iin wa nal kǝ akura nɗǝrǝg marawa. Kwana tlǝra Yaazhigǝla, dǝga jappǝr dlaɓ ma gyiyahaamnda.’
    43: “Mbakyarvad kwaha, ǝn tagkurtaga, da cauwav nǝ tlǝksǝra Daadamazhigǝl vakaruwa, da vǝlǝvtǝr kǝ uudahi tlǝrǝn kwar da ɓa dǝgitahi naag nǝ Daadamazhigǝla.
    44: Baɗǝm daddakwa mbǝɗǝga da tuuk kwanǝn kǝ akurna, kalǝg ba hwɛɓhwɛɓa, dlaɓa uudani ɓǝlhi na akurǝn da tǝghǝr kǝ iina, ɗǝgaan ba tukwtukwa.”
    45: Cinngara ba nǝ maalah ma zhiila kǝsuufah ard Farisiyah kǝ garavahaan tagada nǝ iina, kaa nǝghǝgaakanǝghǝg kǝ iitǝr taakiya tag tǝghǝr kǝ iitǝra.
    46: Kaa gata ɗuula viigaan kǝ iitǝra, gǝdzar gyiya uudaha, aɗaba kǝsarantkǝsǝg nǝ uudah kǝ iin taakiya tlayannga.
  22:
    1: Gwiya tagatǝrtag nǝ Yesu kǝ kwatlǝrǝn kǝ garava, amaa,
    2: “Tlǝksǝra ghǝrazhigǝl band tlǝks kwa ɓagghara hwaɗaga kǝsa uus kǝ zǝraana.
    3: Kaa ɓǝlgantɓǝlǝg kǝ iin kwatnahahaan da tagtǝr kǝ lii ɗahavtǝrɗahǝgǝn da vaka hwaɗaga kǝsa uusna, larwalǝg nǝ uudahiin kǝ sagauwa.
    4: “Ngal gwiya ɓǝltǝrǝtɓǝlǝg kwatlǝrǝn kǝ kwatnahah amaa, ‘Tagamtǝrtag kǝ uudahaan ɗahavtǝrɗahgǝn taakiya, “Wa ɓadlannaɓadlǝg nǝ dǝgzǝga, haravahǝrǝg nǝ kauwaha ard tlah ngatlangatlana, wa gyǝnngavagyǝnng ɓadla dǝgitah baɗǝmma. Aa sarasǝg sa vaka hwaɗagiina.”’
    5: “Far bi nǝ iitǝr kǝ hyǝmi biya, kaa mǝla dagalaatǝra. Kwana dal damma guhaana, kwatlǝrǝn dal da ɓa kasukwana.
    6: Kyalǝmah dlaɓa ar vaitǝrǝt kǝ kwatnahahaana, ar kaltǝraakana, ar ciɓtǝrana.
    7: Kaa badza ǝrviɗmahuuɗ kǝ tlǝksǝn ba vaivaiya. Ngal ɓǝlgantɓǝlǝg kǝ iin kǝ tlaujahaana, ar vaitǝrǝta, ar ciɓtǝra kǝ lii ciɓara shifǝgna, ar haar kǝ kaar kǝ kǝsaatǝra.
    8: “Tǝhalakwaha, amaa taa kǝ kwatnahahaana, ‘Ghyǝnngavaghyǝng nǝ ɓadla vaka hwaɗga kǝssa uusna, lii ɗahantǝr nai da vaka hwaɗaga kǝsa uusna, maa dlaitǝr bi kǝ sagau biya.
    9: Mbakyarvad kwaha, tamtǝg kǝ baabura, ɗahamatǝrɗahǝg kǝ uudahi am tlǝgara nǝ uuram baɗǝmma, aa sarsǝg da vaka hwaɗaga kǝsa uusa.’
    10: Kaa ba dagal kǝ kwatnahaanǝn tǝ baabur baabur ar ɗahant kǝ uudahi tlararaa nǝ iitǝra baɗǝmma, lii kǝlaadaha ard lii ɓa dǝga jiijiira, righǝtrighǝg nǝ vaka hwaɗag dǝ ghulabaha.
    11: “Daghan ba nǝ tlǝksǝn da vaza ghulabaha vaka hwaɗaga, kaa nǝghǝganǝghǝg kǝ iin kǝ uuda nǝ iin kwa tsǝguv bi kǝ sǝɗava hwaɗag biya.
    12: Aiyama taa kǝ uuda nǝ iina, ‘Tsaghwa, aghaa sǝgaa ndar nǝng da vaka hwaɗagǝn ba kwal tsǝguv sǝɗava hwaɗaga kǝsa uusi?’ Pilgharvaapilǝg nǝ dǝga tag kǝ uuda nǝ iina.
    13: “Am tlǝksǝn taa kǝ kwatnahahaana, ‘Ngwaɗamnanguɗǝg kǝ dǝvaahaan ard shigahaana, ɓǝlamdaɓǝlǝg da gyimala, damma gurtla, vaakwaha da tuug ǝmtaɗ dǝ ghwada dǝv dǝ tlǝrɗa.’
    14: “Baɗyak nǝ uudahi ɗahavtǝrantɗahǝga, ba hǝɗiikǝn nǝ lii dzǝravtǝraakadzǝga.”
    15: Kaa ɗiya sawari kǝ Farisiyaha tǝghǝr kǝ ɗuuli ar da ngar nǝ iitǝr kǝ dlǝgǝd kǝ Yesu tǝdvaɗ ǝlbǝgahi da tag nǝ iina.
    16: Kaa ɓǝlgantɓǝlǝg kǝ iitǝr kǝ mbǝrzahaatǝr ard kyalma uudaha Hirudus da vak Yesu, am nǝ iitǝra, “Dadda tsaga dǝgit, kǝm sǝrgasǝrǝg taakiya agha uuda jiirjiira, agha tsaga ɗuula Daadamazhigǝl ba jiirjiira, agha maay dlaɓ fa dagar ma uudah biya, kǝsghankǝsǝg kǝ uudah ba kalkala.
    17: Tagkǝmndtag kǝ jiira, kalkalaan nii kǝskǝmnd ɗiigar hadam kǝ Kaisara kalkalaaan bi hii?”
    18: Nǝghaakanǝghǝg nǝ Yesu kǝ kǝlaadǝraatǝra, amaa taa kǝ iitǝra, “Kuram muniyahaana, aujilbǝg am fǝsha kaiyi?
    19: Maramwadamarǝg ndan kǝ kwaɓiin ɗiyav dǝ hadamna.” Ngal ar sardǝv kǝ kwaɓiina.
    20: Aiyama taa kǝ iitǝra, “Dzakǝva wara ard ɗaaga war wa nǝ iin tǝvakaini?”
    21: Kaa ngug kǝ iitǝra, “Dǝga Kaisara.” Aiyam nǝ Yesu taa kǝ iitǝra, “Vǝlamarvǝlǝg kǝ Kaisar kǝ dǝga Kaisar, am vǝlar kǝ Daadamazhigǝl kǝ dǝga Daadamazhigǝla.”
    22: Cinngara ba nǝ iitǝr ǝndkwaha, kaa ɓa jappǝr kǝ iitǝra, ar ɗuwarsa. Kaa mǝla dagalaatǝr kǝ iitǝra.
    23: Ba daghuvala kwahiina, mǝng nǝ kyalma Sadukiyaha, iitǝr wa fardghǝrǝt bi taaki mǝng ciig ma gǝtlah biya, sarǝv sa vak Yesu dǝ ndavǝga,
    24: am nǝ iitǝra, “Dadda tsaga dǝgita, vindakǝmndavindǝg Musa taakiya, akwama ǝmtsaaǝmtsǝg nǝ uudan kwal yiga kǝ zǝr dǝ uusaana, kǝsgaan nǝ zǝrababbaan kǝ uusiin kiyav yaagar zarh kǝ zǝra babbaana.
    25: Ndza mǝng nǝ zarha baabah uudif ma taatakamnda, kǝsuu nǝ yag kǝ uussa, ǝmtsan ba kwal yiga kǝ zǝra, kaa kǝsguukǝsǝg kǝ zǝra babbaan kǝ uusaana.
    26: Dzǝghaar bandkwah dǝ zǝra buwa, baz zǝra hǝkǝrɗa, tanngw dat zǝra uuɗiifa.
    27: Tǝhalakwaha kaa ǝmtsǝgaǝmtsǝg nǝ uusiina.
    28: Aici tsaa, da nǝg kǝ uusa warkaci nǝ iin pal ma iitǝr daghuvala ciig ma ghǝtlah? Aɗaba uuɗiffa ǝmtaɗaatǝr kǝsarukǝsǝga.”
    29: Am nǝ Yesu taa kǝ iitǝra, “Dzamaghǝraru kalkal biya, aɗaba am sǝrgai kǝ ǝlbǝga Daadamazhigǝl vinndavinndan biya, dlaɓa am sǝrgai kǝ ndzǝɗa Daadamazhigǝl biya.
    30: Daghuvala ciig ma gǝtlaha, da maay nǝ ghwalvah kǝsa uuss biya, da maay dlaɓ pǝghwav nǝ dǝghwah da vǝgya zhiil biya. Ar da nǝg band zarha ɓǝlga Daadamazhigǝla.
    31: Dlaɓa tǝghǝr kǝ ciig ma gǝtlaha, karantama bi kǝ dǝgiti tagakur nǝ Daadamazhigǝl taakiya,
    32: ‘Kai nǝ Daadamazhigǝla Ibrahim, Daadamazhigǝla Ishaku, ard Daadamazhigǝla Yakub biya’? Daadamazhigǝla lii dǝ shifǝg nǝ iina, dǝga lii ǝmtsaharaǝmtsahǝg biya.”
    33: Cinngara ba nǝ uudah ǝndkwana, kaa ɓa jappǝr kǝ iitǝr tǝdvad tsagaanaana.
    34: Cinngara ba nǝ Farisiyah taakiya piletǝvaatag nǝ dǝga tag kǝ Sadukiyah vak Yesu, kaa dzahav kǝ iitǝr.
    35: Mǝng nǝ dadda tsaga adzahadzaha Mus ma taatakatǝr kwa fǝsha Yesu dǝ ndavǝga.
    36: Amaa, “Dadda tsaga dǝgit, kwar ka adzahadzah wa juujig ma adzahadzah baɗǝmmi?”
    37: Ngugharangug nǝ Yesu amaa, “‘Wayantwaig kǝ Yaazhigǝl Daadamazhigǝlagh bad ǝrviɗmahuɗagh baɗǝmma, baz shifǝgagh baɗǝmma, baz hǝnkalagh baɗǝmma.’
    38: Kwana iin nǝ adzahadzaha zǝnngwa, dlaɓ iin wa juujig baɗǝmma.
    39: Dǝga bu ndakwi band dǝga zǝnngwa, ‘Wayantwaig kǝ tlǝgharaawakyaghagh band ghǝragha.’
    40: Baɗǝm nǝ adzahadzaha Musa ard tlayangngaha araa haciga bat kwanahaan ka adzahadzah buna.”
    41: Dzaharvǝt ba nǝ Farisihyah vak palla, kaa ndavtǝruundavǝg nǝ Yesu,
    42: amaa, “Auwa tlatlǝg nǝ ghǝraru tǝghǝr kǝ Kǝristi? Zǝra war ni nii?” Aiyam nǝ iitǝr taa kǝ iina, “Zǝra Dauda.”
    43: Am nǝ Yesu taa kǝ iitǝra, “Ɓagaa ndar ci nǝ Daud tǝdvad ndzǝɗa Shiɗǝkw Daadamazhigǝl ɗaha dǝ, ‘Yaazhigǝli’? Am nǝ Dauda,
    44: “‘Am nǝ Yaazhigǝl taa kǝ Yaazhigǝlara, “Cihuracihurǝg tǝ dǝvaa kafara bamma nandalnǝg kǝ tlǝghumahagh da mizhangyil kǝ shigahagha.”’
    45: “Akwama ɗaag dǝ Kǝristi nǝ Daud kǝ ‘Yaazhigǝl tsaa,’ Nǝgal ndar kaci nǝ Kǝristi kǝ zǝraani?”
    46: Maay wa ngugharangug biya. Ciigǝt daghuvala kwahiina maay wa gwiya shughana gyiya ndavgharundavǝg biya.
  23:
    1: Am Yesu taa kǝ dzaha dlamaa kǝlaawa ard mbǝrzahaana,
    2: “Vǝlavtǝr kǝ lii tsaga adzahadzaha ard Farisiyah nǝ ndzǝɗa tsaga adzahadzaha Musa.
    3: Mbakyarvad kwaha, famfǝg kǝ hǝnkal kǝ ɓa dǝgitahi ar tsagkur nǝ iitǝra, ɓagam bi kǝ dǝgiti ar ɓag nǝ iitǝr biya. Aɗaba ar maay ɓa dǝgiti ar tsag nǝ iitǝr biya.
    4: Ar ngwaɗant kǝ kadlanngah kwa ɗǝmɗǝma, ar faatǝra kǝ uudah ma ghǝra, ghǝravaatǝr ndakwani ar maay mǝltǝrumǝlǝg aandzu dǝ zǝra dǝv pal biya.
    5: “Baɗǝm nǝ dǝgitahi ar ɓag nǝ iitǝra, ar ɓag ba kiyava nǝghǝganǝghǝg kǝ uudaha, ar mbaghant kǝ ǝlbǝga Daadamazhigǝl ba maandala, ar ngwaɗǝt tǝ ghaiya uuvǝgaatǝra, dlaɓa ar kutǝr kǝ sǝɗav kwada apatsapats ba tlaɗ tlaɗ tuuk ghaiyaana.
    6: Ar naa ba vǝlvǝtǝr vaka ndzǝgan marawa vaka ɓa hwaɗaga, ard dǝga ndzǝgan ndannga ma guda dzǝgwazhigǝla.
    7: Ar naa ba fǝvtǝraaran dǝ taa uus ma kasukwa, dlaɓa ar naa ba ɗahvǝtǝr dǝ ‘Dadda Tsaga Dǝgita’.
    8: Aiciya, aa ɗaakur bi nǝ uud dǝ ‘Dadda Tsaga Dǝgiti’ biya, aɗaba Dadda Tsagkur Dǝgit ba palla, am ba zaraabah baɗǝmma.
    9: Ɗahambi aandzu war dǝ ‘Daada,’ ma duni biya, aɗaba ba pal nǝ Daada kǝskurama, kwama ghǝrazhigǝla.
    10: Aa ɗahkur bi dlaɓ nǝ uud dǝ ‘Tlǝvuukw’ biya, aɗaba ba pal nǝ Tlǝvuukw kǝskurama, iin nǝ Kǝristi.
    11: Baɗǝm nǝ dadda kwa ɗyak ma kuurama, aa nǝdalnǝg kǝ ghǝraan kǝ kwatnahaaruwa.
    12: Baɗǝm dadda kwa fǝgaara ghǝrana da nenneva, dadda kwa nenna ghǝraana, da fǝvaarafǝga.
    13: “Dǝga zhuwadaal kǝsǝkuram lii tsaga adzahadzaha Musa ard Farisaha, muniyaha! Hǝɗamarduhǝɗǝg nǝ uuram kǝ ɗuula daa damma tlǝksǝra ghǝrazhigǝla. Kuram dǝ ghǝravaru ndakwi damagha biya, dlaɓa ɓǝlamtǝrnaa bi kǝ lii naa daas biya.
    14: Dǝga zhuwadaal kǝ sǝkuram lii tsaga adzahadzaha Musa ard Farisiyaha, muuniyaha! Am naa ba zaa kadlanga ǝngwasahi ruuwa zaalahatǝra, am naa ba dzǝgwazhigǝl ba tlaɗa kiyava nǝghǝkurnǝghǝg kǝ uuda, mbakyarvad kwaha, da vǝlkurvǝlǝg nǝ uud kǝ dlaɗ ba vaivaya.
    15: “Dǝga zhuwadaal kǝ sǝkurama lii tsaga adzahadzaha ard Farisiyaha, muuniyaha! Am dahadagal damma kǝsah shahshah dlaɓa am dzava yuwa haiya kiyava tlǝkna dadda pǝlaghǝr aandzu ba palla, akwama tlamkǝnatlǝga, am nǝdal kǝ zǝra kaara fai juujig kǝskurama.
    16: Dǝga zhuwadaal kǝskuram gulfaha lii martǝr ɗuul kǝ uudaha! Am taakiya, ‘Baɗǝm nǝ dadda kwa zaazǝg kǝ ngwaɗǝg dǝ vǝgya Daadamazhigǝla maay nǝ dǝgit tǝ vakai biya, baɗǝm nǝ dadda kwa zaazǝg kǝ ngwaɗǝg dǝ adawan kwa ma vǝgya Daadamazhigǝla, barari viigaan nǝ ngwaɗǝga.’
    17: Kuram dlagah gulfaha, kwar wa juujig dǝ ɗyaka, adawan nii, vǝgya Daadamazhigǝli kwa ɗǝfghaaka adawanhi?
    18: Am taagaan taakiya, ‘Baɗǝm dadda kwa zǝgga ngwaɗǝg dǝ bagadiya, maay dǝgit tǝ vakai biya, aɗaba baɗǝm dadda kwa zǝgga ngwaɗǝg dǝ vǝlga gyagyaan kwa ɗiyav tǝ bagadiya, barari viigaan nǝ ngwaɗǝga.’
    19: Kuram gulfahaana, kwar wa juujig kǝ ɗyakǝra! Vǝlga gyagyaan nii bagadi kwa pǝsha vǝlga gyagyaan hi?
    20: Mbakyarvad kwaha, baɗǝm dadda kwa zǝgga ngwaɗǝg dǝ bagadiya kyulǝga, zaazǝg kǝ ngwaɗǝg dǝ vakaiya ard dǝgitahi tǝ vakai baɗǝmma.
    21: Baɗǝm dadda kwa zǝgga ngwaɗǝg dǝ vǝgya Daadamazhigǝla, zaazǝg kǝ ngwaɗǝg dǝ vakaiya ard Daadamazhigǝl kwa ndzǝga ma vakaiya.
    22: Baɗǝm daddakwa zǝgga ngwaɗǝg dǝ ghǝrazhigǝla, zaazǝg kǝ ngwaɗǝg dǝ avǝda kwarga Daadamazhigǝla ard dadda kwa cihurga tǝ vakaiya.
    23: “Dǝga zhuwadaal kǝ sǝkuram lii tsaga adzahadzaha ard Farisiyaha, muuniyahaana! Am sagal dǝ pal ma kǝlaaw ma kadlangaha caccakuram ǝnd kyimba, araariya ard mbakila, lamwalǝg kǝ ɓaa dǝgitah kwa juujig kǝ maraw ma adzahadzaha, ǝnd jiira, zhuwadaala ard fadghǝra, kwanahaan wa maa dlaiyaan kǝskuram kǝ ɓagaan ba kwal ɗugars kǝskuram kǝ ɓaa kyalmahaana.
    24: Kuuram gulfaha lii martǝr ɗuul kǝ uudaha, am rahgarzharahǝg kǝ dǝgiti ǝngykwah ǝnd dǝg pǝghyiga, bakǝvakwaha, am ndǝgaan kǝ adlǝgwama.
    25: “Dǝga zhuwadaal kǝskuram lii tsaga adzahadzaha ard Farisiyaha, muuniyaha! Am bar ba ilgaan kǝ kuwa ard dafa, aɗaba mahuɗmahaɗa righarighan dǝ dlǝrmǝg ard naaghǝra.
    26: Kǝgh gulfa zhiila Farisiya, farzhafǝg kǝ bara huɗa kuwa ard huɗa dafa, aɗaba ilgaan ndakwani nal ba cuwaɗaɗɗa.
    27: “Dǝga zhuwadaal kǝskuram lii tsaga adzahadzah ard Farisiyaha, muuniyaha! Am band gǝtlah kwa masavǝt nǝ dǝgit tǝll tǝ vakaiya, kwa maraw kǝ vazǝg tǝ ɓalaɓala, mahuɗmahuɗa righarighan dǝ tlatla uudahi ǝmtsaharaǝmtshǝga ard dǝgitahi ghwaɗghwaɗa.
    28: Am band kwah ghǝravaruwa, mar zharkurzharǝg nǝ uudah tǝ ɓalaɓala, am band uudaha jirjira, mbats mahuɗmahuɗa, am righarighan dǝ muuniyira ard kǝlaadǝra.
    29: “Dǝga zhuwadaal kǝskurama, lii tsaga adzahadzaha ard Farisiyah, muuniyaha! Aɗaba am ndara gǝtlaha tlayanngaha, dlaɓa am caɗa gǝtlaha uudaha jiirjiira.
    30: Am tagaan dlaɓ taakiya, ‘Akwama kǝmnda ndza mǝng nǝmnd ma zamana daadijahamnda, maa mǝlamntǝrubi kǝ ɗiya avǝza tlayanngah biya.’
    31: Tǝdvad kwah wa maramda nǝ uuram taakiya, kuram zarha lii ciɓara tlayanngha.
    32: Bam zavukw dǝ ghyǝnnga tlǝraha kǝlaadǝrǝn kwa fǝgharzha nǝ daadijaru kǝ ɓagaana.
    33: Kuram ghavalahaana, kuram faɗǝga ghavalahaan dǝ gurna! Am da ngǝdlgarwa ndandar nǝ uuram kǝ kaara faiyi?
    34: Mbakyarvad kwah wan ɓǝlkur nai kǝ tlaiyangaha ard lii ɗyamɗyamǝr ard lii tsaga adzahadzaha Musa, am da ciɓgaan kǝ kyalmaha, am da hǝrtǝt kǝ kyalmaha, dlaɓa am da ɓaltǝra kǝ tsǝg kǝ kyalmah ma guda dzǝgwazhigǝlaruwa, baz gatǝrgatǝg kǝskuram damma kǝssaha, am vǝltǝr dlaɗa.
    35: Aɗabad kwaha, da gwiya daa damma kunngyaru nǝ avǝza uudaha jiijiir kwa ciɓava ma duniya, ciigǝt tǝ avǝza Habil uuda jiirjiir tangw da tǝ avǝza Zakariya zǝra Berekiya, kwa tsama nǝ uuram ma taataka bagadi ard vǝgya Daadamazhigǝla.
    36: Bak jiirjiir wan tagkur naiya, baɗǝm nǝ wanahaan da dzǝgaardzǝg dǝ uudaha zamana.
    37: “Au wan Wurshalima, Wurshalima! Lii ciɓa tlaiyannga Daadamazhigǝla, lii ɗawala lii ɓǝlavant da vakaruwa, shig ngwan kǝskai na dzaha kuram band kwa dzahǝg nǝ ghwacik kǝ zarhaan damma dlambakaana, lamwalǝg nǝ uurama.
    38: Waici, ɗuwakurna ɗuug nǝ uud kǝ vǝgyaru nalnǝg kǝ kwazaha.
    39: Wan tagkurtag ciya, am da maadlai nǝghkwanǝghǝg biya, da ba daghuvala kwam da taag nǝ uuram taakiya, ‘Dǝ bark nǝ dadda kwa sagau ma ɗaaga Yaazhigǝla.’”
  24:
    1: Sǝghal ba nǝ Yesu ma Vǝgya Daadamazhigǝla, kaa mǝla dagalaana, kaa margardamarǝg nǝ mbǝrzahaan kǝ vǝgya Daadamazhigǝl ndǝrandǝrana.
    2: Aiyam nǝ Yesu taa kǝ iitǝra, “Am nǝghǝganǝghǝg ba ɗǝmma nǝ wanahaan ndǝrandǝranna? Bak jir wan tagkur naiya, maay na akur aanji pal da Ɗuuvars tǝghǝr kǝ zǝrabaan biya. Da tlagav saaya baɗǝmma.”
    3: Cihurgan nǝ Yesu ta Aghwa Zaituna, kaa dagau kǝ mbǝrzahaan da vakaana ba daghuvaatǝra, aiyam nǝ iitǝra, “Takǝmndtaga da dzǝgaar hǝr nǝ wanǝn kǝ dǝgiti? Au nǝ dǝgiti kǝm da sǝrgaaka nǝmnd taakiya agha hǝrzh saaya ard ghyinnga zamani?”
    4: Ngwatǝrangug nǝ Yesu, amaa taa kǝ iitǝra, “Famfǝg kǝ hyǝmiya, aa valkurdai nǝ uud biya.
    5: Aɗaba uudah ba ɗyaka ar da sagau ma ɗaagara ar taakiya, iitǝr nǝ Kǝristiya, ar da valgaan kǝ uudah ba ɗyaka.
    6: Am da cinngacinng kǝ ǝlbǝga ghwaava ard dlahalǝg ghwaava, gǝdzam biya, aɗaba kwanahaan kǝ dǝgitaha barari bamma dzǝghardzǝga, halavuwaana sǝghǝvbi ndan biya.
    7: Larda da dǝgaradǝg kǝ kwatlǝrn kǝ Larda dǝ ghwaava. Tlǝksǝra da dǝgara kǝ kwatlǝrn kǝ tlǝksǝr dǝ ghwaava. Da sagau nǝ waiya, haay ndakwani da gajagav vakavak shahshaha.
    8: Baɗǝmma wanahaan ba fǝgarzhan ndana.
    9: Tǝhala kwaha ar da vaikurvaiga, ar da vǝlkur kǝ dlaɗa, ar da ciɓkurana, ar da naakur bi nǝ uudah mbakyarvad ɗaagar biya.
    10: Ma kwahiin kǝ sarta da ba dyak nǝ uudahi da ɗuwa fadghǝraatǝra, ar da zuu kǝ langyiya zǝraabaahatǝra, dlaɓa ar da naabi kǝ zarabahaatǝr biya.
    11: Tlayannga fiidfiidah ar da sagau badyaka, ar da valda kǝ uudah baɗyaka.
    12: Mbakyarvad ɗyakǝra kǝlaadǝra, wayakǝva uudah baɗyak da maadlaiya.
    13: Baɗǝm daddakwa ɓǝshgaan tanngw dat halavuwana da tlǝkǝnatlǝg katǝga
    14: Kwan kǝ ǝlbǝg marawa tlǝksǝra ghǝrazhigǝlna da tagav aanji takwar ma duniya, kwakyarvad nal kǝ shiid kǝ uudah baɗǝmma, tǝhalakwaha kaa da sagau nǝ halavuwana.
    15: “Akwama nǝghamanaghǝg kǝ dǝgit dzah kwada sa dǝ ǝmtsǝg ghaciga ma vǝgya Daadamazhigǝla, bandkwa tagada nǝ tlayang Daniyela, dadda karantǝgaana aa nǝghaakanǝghǝga,
    16: lii ndzǝga ma Yahudiya, aa mdǝrarǝmdǝrǝg damma aghwaha.
    17: Dadda kwa tǝghǝra guda, aa sabi saay sa kǝssa dǝgit hǝnnyah biya.
    18: Dadda kwa ma guuh dlaɓa, aa gwi bi saas sa kǝssa sǝdavaan biya.
    19: Da dǝga zhuwadaal kǝ ǝngwasahi ǝnhuɗa ard lii dǝ zar ma dlaaga ma kwanǝn kǝ sarta.
    20: Dzǝgwamdzǝgw kǝ zhigǝla aa sabi nǝ ǝmdǝrgǝn ma sarta akuhya ard sarta faciya ngiig biya.
    21: Aɗaba ma kwahiin kǝ sarta da hǝɓav nǝ dlaɗ ba vaivaiy kwa tapavnai hǝɓgaan gwil fazha duni tangw samma haniina, da maadlabi hǝɓav hulfaan biya.
    22: “Maa maay mbakyarvad gulavnagulǝg hǝnngahǝn biya, maa maay nǝ uuda dǝgshig tǝmǝg dǝ shifǝg biya, mbakyarvad uudahaan dzǝravtǝraakaanǝna, da gulav nǝ hǝngaha.
    23: Ma sarta kwahiina, akwama tagakuratag nǝ uud taakiya, ‘Wanam Kǝristi vaakwana!’ bi ‘Wai vaakwaha!’ haiyamant biya!
    24: Aɗaba da sagau nǝ Kǝristiya fiidfiida ard tlayanngaha fiidfiida, ar da ɓagaan kǝ dǝgaha sǝrga ard dǝgaha jappǝr baɗyak kiyava vala uudaha, akwama ɓagaaɓaga baz lii dzǝravtǝraakana.
    25: Aiciya, wa tagankurtag bamma sarta.
    26: “Mbakyarvad kwaha, akwama tagakurtag nǝ uud taakiya, ‘Wai nǝ iin ma tǝghala,’ dambi dagal biya. Akwma tagakuratag nǝ uud taakiya, ‘Wai nǝ iin ma huɗa guda,’ haiyamant biya.
    27: Bandkwa wukyiɗǝg nǝ zhigǝl sagatsǝg ba parakrak tanngw dagata. Da band kwah nǝ saaya Zǝra Uuda.
    28: Vakavaki dǝ dǝgiti ǝmtsaǝmtsana, ar dzahav vaakwah guumbaha.
    29: “Tǝhala hǝɓa dlaɗa nǝghǝgaraa gyina, “‘Da ba niknik nǝ faciya, kyil dlaɓa da maay mara parakaan biya, da ɓala saay nǝ kwadladlah tǝ zhigǝla, da gajagav nǝ dǝgitah ɗyak ɗyak tǝ zhigǝla.’
    30: “Tǝhala kwaha, da nǝghvanǝghǝg nǝ dǝga sǝrga Zǝra Uud tǝ zhigǝla. Baɗǝm nǝ uudaha duniya ar da tuug mbakyarvad dladlawa. Ar da nǝghǝganǝghǝg kǝ Zǝra Uud sii ma akumba dǝ ndzǝɗa ard dǝ ndanngǝr ba vaivaiya.
    31: Da ɓǝlgaan kǝ zarha ɓǝlgaan da fǝrta dǝraw kwa tuug ba vaivaiya, ar da dzahant kǝ lii dzǝravtǝraaka sagatsǝga, dii dǝ dǝga, saa dǝ sǝga, dagal dǝ dǝga ciigǝt ma ngyila zhigǝl dat ghaalaana.
    32: “Tsagamtsag kǝ ndzǝgana uufa ghǝgiva. Akwama fǝgharzgafǝg nǝ dǝvahaan kǝ ɗa daala ndaɗa, dlaɓa farzha kǝ daala hyǝmiya, sǝramasǝrǝg taakiya hǝrz nǝ madara.
    33: Bandkwah dlaɓ akwama nǝghamanǝghǝg kǝ dǝgitahaan tagankur nai baɗǝmma, sǝramasǝrǝg taaki hǝrzǝthǝrzǝg nǝ sart ba mbɛv dǝ ghaiya guda.
    34: Bak jiir wan tagkur naiya, uudaha zamanǝnna ar da maay ǝmtsǝg biya, bamma dzǝghardzǝg nǝ wanahaan kǝ dǝgit baɗǝmma.
    35: Zhigǝla ard haaya ar da ghyinnga, ǝlbǝgara da maay ghyinng biya.
    36: “Maay wa sǝrgasǝrǝg kǝ sart ma faciyi da dzǝgaar wanǝn kǝ dǝgit biya, aanji Zarha ɓǝlga Daadamazhigǝli ma zhigǝla ma zǝraana, ba Daadiin kaltiya.
    37: Bandkwa ɓagava ma zamana Nuhu, da dzǝgaar bandkwah daghuvala saaya Zǝra Uuda.
    38: Band ma kwah kǝ sart lakwti kǝ sagaw kǝ yu kǝlg ɗyaka, ar zǝgaan nǝ uudaha, ar hǝɓgaana, ar gaan nǝ ghwalvah kǝ uusa, pǝghwav dlaɓ nǝ dǝghwaha da vǝgya zhiila, tanngw damma sarti dagha nǝ Nuhu damma pɛrayuwa.
    39: Lakuti ar nǝghǝgaakanǝghǝg kǝ dǝgiti dagala, nǝghar bak tlǝtǝraatlǝg nǝ ghavala yu kǝlg ɗyak hutstru ba ɗǝmma. Da band kwah dlaɓ nǝ saaya Zǝra Uuda.
    40: Ma kwahiin kǝ sarta, da nǝghvanǝghǝg nǝ uudah bu ɓatlǝr ma guha, da kǝsvant palla, da Ɗuuvars wa palla.
    41: Da nǝghvanǝghǝg nǝ ǝnghwasah bu ar haiya vaar ǝmtaɗa, da kǝsvant palla, da Ɗuuvars wa palla.
    42: “Mbakyarvad kwaha ndzamandzǝg ba ɓadlaɓadlana, aɗaba am sǝrgai kǝ sarti da saay nǝ Yaazhigǝlaru biya.
    43: Sǝramasǝrǝg taakiya, akwamaa sǝrgasǝrǝg nǝ dadda hǝnyah kǝ sart da sagau nǝ gǝl da vǝgyaan kavǝɗa, maa maay hǝna haar biya, dlaɓa maa ɗugarnaai kǝ gǝlǝn da vǝgyaan biya.
    44: Mbakyarvad kwaha, kuram ndakwani ɓadlamvǝghaɓadlǝga, aɗaba am sǝrgai kǝ sarti da sii nǝ Zǝra Uud biya.
    45: “War kaci kwatnahǝn kwa fǝvdǝghǝrǝtfǝgǝna, kwad dabari, kwa fǝghardǝm nǝ dadda hǝnnyahaan kǝ vǝgyaan ma dǝvaan kiya fa hyimi kǝ iin tǝ vakaiyana, dlaɓ vǝltǝr kǝ kaf kǝ kyalma kwatnah bamma sarti?
    46: Dǝ bark nǝ kwatnahǝn kwada tlǝgara nǝ dadda hǝnyahaan ɓa tlǝr ma sǝghaasǝga.
    47: Bak jiir wan tagkur naiya, da fǝgardǝmfǝg kǝ kadlanngahaan baɗǝm damma dǝvaan kǝ kiyava fa hyimmi tǝ vakaiya.
    48: Mbatak dadda nguɗi kwatanahǝna, dlaɓa tagaratag kǝ ghǝraan taakiya, ‘Da maay dadda hǝnnyahar saas wats biya,’
    49: da farzha kǝ iin kǝ kala tsaghwaha tlǝraana, dlaɓa zǝgaan kaa hǝɓgaan dǝ lii hǝɓa kya.
    50: Akwama ɓagaaɓag ǝndkwaha, da saas dadda hǝnnyahaan daghuvali maay ma taɗaan biya dlaɓa ma sarti sǝrgabi nǝ iin biya.
    51: Da tlǝkǝntlǝgg nǝ dadda hǝnyahaan dǝ tsǝg ba vaivaiya, dlaɓa da vǝlar kǝ dlaɗ ǝmtaɗ dǝ muuniyaha, vaakwaha da tuug nǝ uuda ǝmtaɗ dǝ ghwada dǝv dǝ tlǝrɗa.
  25:
    1: “Ma kwahiin kǝ sarta, da gǝrav nǝ tlǝksǝra ghǝrazhigǝl dǝ dǝghwah kǝlaawa kwa kǝsarant kaaraha jahuramb da vaka dlǝgha zhiila ghuula.
    2: Dlǝɓ ma iitǝra ar dlagaha, dlǝɓ dlaɓa ar ɗyamɗyama.
    3: Ma sarta kwa kǝsarant nǝ dlagahaan kǝ kaaraha jahurambatǝra, kǝsarantbi kǝ wal vakaatǝr biya.
    4: Lii ɗyamɗyamna kǝsarantkǝsǝg kǝ kaaraha jahuramb baz wal ma mǝrt vakaatǝra.
    5: Zǝlamazǝlmǝg nǝ zhiila ghuulǝn lakwti sagauwa, kaa njitǝrnjiig kǝ haara, ngal ba tsǝtǝratsǝg kǝ haara.
    6: “Ma kyakyaka avǝɗa, ngal cinngvacinng nǝ ɗaag taakiya, ‘Wanam zhiila ghuula! Asama sa dlǝghgaana.’
    7: Kaa ba ciig kǝ dǝghwahaan kǝlaaw ǝmtaɗaatǝra, ar ɓadlǝna kǝ kaaraha jahurammbatǝra.
    8: Am nǝ dlagahaan taa kǝ lii ɗyamɗyamna, ‘Gamkǝmndugǝg yaru kǝ wal ba hǝɗiikǝna, aɗaba naa ǝmtsǝg nǝ kaaraha jahurambamnda.’
    9: Aiyam nǝ lii ɗyamɗyamǝn taa kǝ iitǝra, ‘Maaya, da tlǝkiyamaara biya. Ngulǝm dam da vak lii vǝlgaan am sǝgwa kǝ dǝgaruwa.’
    10: Daral ba nǝ iitǝr da sǝgwa walna, lakwti saas kǝ iitǝra, sǝghaasǝg nǝ zhiila ghuula, kaa daas kǝ lii ɓadlarvǝghaɓadlǝg ǝmtaɗ dǝ iina da vaka hwaɗaga, kaa hǝɗvarduhǝɗǝg nǝ wakyagha.
    11: “Tǝhalakwaha, kaa sǝgaasǝg kǝ dlaga dǝghwahaan dlǝɓna, am nǝ iitǝra, ‘Dadda ndannga, Dadda ndannga, wurkǝmndantwurg kǝ wakyagha!’
    12: Kaa ngutǝrangug nǝ zhiilaghuulǝn taakiya, ‘Bak jiira wan tagkur naiya, Ən sǝrkur biya.’
    13: “Mbakyarvad kwaha ndzamandzǝg ba ɓadlaɓadlana, aɗaba am sǝrgai kǝ faciya ma sart biya.
    14: “Tlǝksǝra Daadamazhigǝla band garava uudi kwada dagal dǝ dǝga, kaa ɗahtǝrǝt kǝ kwatnahaan fǝtǝrdǝm kǝ dǝgahaan da mizha dǝvaatǝra.
    15: Vǝlar kǝ pall kǝ adawan alfu dlǝɓa, pall dlaɓ vǝlar kǝ adawan alfu buwa, vǝlar dlaɓ kwatlǝrǝn kǝ adawan alfu palla, makwaraatǝr vǝlghar ba kalkala ndzǝɗaana, Kaa dagalaana.
    16: Kaa fǝgarzhafǝg kǝ dadda kwa cauwa adawan alfu dlǝɓǝn kǝ mbǝɗa dǝv bat watsǝra, kaa ba tlǝnatlǝg kǝ iin kǝ yu alfu dlǝɓ tuuk vakaiya.
    17: Bandkwah dlaɓ dadda kwa cauwa adawan alfu buna, tlakǝna kǝ yu alfu bu tuuk vakaiya.
    18: Kiyava dadda kwa cauwa adawan alfu pallǝna, nǝghǝghar bak kwaɗǝgakwaɗǝg kǝ affǝk hǝɗnan kǝ kwaɓa dadda hǝnyahaanǝna.
    19: “Tǝhala zǝlmazǝlmǝga, kaa gwiyaghǝra saas kǝ dadda hǝnyaha kwatnahahaan kiyava sǝrgasǝrǝg kǝ dǝgiti ɓagara nǝ iitǝr dǝ kwaɓiina.
    20: Kaa sagau kǝ dadda kwa cauwa adawan alfu dlǝɓǝn dǝ kwatlǝrǝn kǝ alfu dlǝɓa amaa, ‘Dadda hǝnyaha, adawan alfu dlǝɓ wa vǝlghwa nǝnnga. Wan nǝ yu alfu dlǝɓ naa tlǝkǝna nai tuuk vakaiya.’
    21: Am nǝ dadda hǝnyahaan taa kǝ iina, ‘Uusa, kwatnaha jiijiira, kwa fǝvdǝghǝrǝtfǝg tǝ vakaiya. Fǝvdǝghǝrǝtfǝg tsau dǝ kǝgh tǝghǝr kǝ zǝr dǝgit hǝdikǝna, ǝn da vǝlakvǝlǝg kǝ tlǝri juujig kwana. Asǝg sa dlaig ǝmtaɗ dǝ kaiya.’
    22: “Kaa sagau kǝ dadda kwa cauwa alfu buwa adawana, amaa, ‘Dadda hǝnyaha, alfu buwa adawan wa vǝlghwa nǝnnga. Wan nǝ yu alfu bu naa tlǝkǝna nai tuuk vakaiya.’
    23: Am nǝ dadda hǝnyahaan taa kǝ iina, ‘Uus, kwatnaha jiijiira, kwa fǝvdǝghǝrǝtfǝg tǝ vakaiya. Fǝvdǝghǝrǝtfǝg tsau dǝ kǝgh tǝghǝr kǝ dǝgit hǝdikǝna, ǝn da vǝlakvǝlǝg kǝ tlǝri juujig kwana. Asǝg sa dlaig ǝmtaɗ dǝ kaiya.’
    24: “Kaa sagau kǝ dadda kwa cauwa alfu adawan pallna, amaa, ‘Dadda hǝnyaha, ǝn sǝrgasǝrg mbǝlɛmbǝlɛn ɓagakǝv dǝ kǝgha, agha ghuda hii vakavaki riigha biya. Agha vai ba dzaha dǝgit vakavaki kutgha biya.
    25: Iin wa gǝdzakut kaiya, ǝn kwaɗa kǝ afka ǝn hǝɗnanna. Na kǝ dǝgagha.’
    26: “Am nǝ dadda hǝnyahaan taa kǝ iina, ‘Kǝgh, kwatnahǝn kǝlaadna, mandǝlghna! Mbats agha sǝrgasǝrǝg taakiya ǝn ghuda hii vakavaki riyana biya, dlaɓa ǝn vai ba dzaha dǝgit vakavaki kutana biya.
    27: Maa fǝghwifǝg kǝ kwaɓar ma banka, maa bad saasar ǝn tlǝkǝna kǝ yu tuuk vakaiya!
    28: Mbakyarvad kwaha, cauwamarvacaug kǝ alfuwa adawan pallna am vǝlar kǝ dadda kwad alfu kǝlaawna.
    29: Aɗaba baɗǝm nǝ daddakwa dǝ dǝgita, da fǝvarnaafǝga tlǝkna baɗyaka. Kwa maay dǝ vakai biya, aanji hǝɗikǝni dǝ vakai nǝ iina, da cauwav vakaana.
    30: Ɓǝlamdǝmɓǝlǝg kǝ kǝlaada kwatnahǝn damma gurtla. Vaakwaha da tuug ǝmtaɗ dǝ ghwada dǝv dǝ tlǝrɗa.’
    31: “Ma Sarti da saay nǝ Zǝra Uud ma ndanngǝraan ǝmtaɗ dǝ zarha ɓǝlga Daadamazhigǝl baɗǝmma, ngal da cihura tǝ avǝd ndanng ma tlǝkǝsǝraana.
    32: Da dzahvant nǝ uudaha duni badǝm da tǝvuukwana, da wahtǝrzha kǝ uudah hutsǝg buwa, bandkwa wahgarzh nǝ dadda piya alman kǝ tughah ard aagwaha guja.
    33: Da dzant kǝ tughah damma dǝvaa kafaana, aagwah da tǝ dǝvaa ghyaɓaana.
    34: “Tǝkalakwah da tagtǝrtag nǝ tlǝkǝs kǝ lii tǝ dǝvaa kafaanǝn taakiya, ‘Asamasǝg nǝ uuramǝn fakura nǝ Daadar kǝ barkna! Na dlǝghamadlǝghǝg kǝ tlǝksǝrǝn ɓadlakurna Daadamazhigǝl bamma fazha duniya.
    35: Aɗaba sarta kwandza njǝkwa nǝ waiya, vǝlamwavǝlǝg nǝ kǝ dǝga zǝga. Sarta kwandza njǝkwa nǝ andǝla, gamwadgǝg kǝ yuwa hǝɓǝga. Ndzan ghulaba, dlǝghamkwidlǝghǝga.
    36: Ndzan maay dǝ sǝɗav biya, vǝlamwavǝlǝg kǝ sǝɗava. Ndzan yang biya, famwufǝg kǝ hyimiya. Ndzan ma guda bǝrfina, nǝghamwanǝghǝga.’
    37: “Tǝhalakwaha, kaa da ngugarngug nǝ uudaha jiijiir taakiya, ‘Yaazhigǝl, nǝghamnd kak hǝr nǝmnd njak wai kǝm vǝlak kǝ dǝga zǝgi? Bii njak nǝ andǝl kǝm gǝgku kǝ yuwa hǝɓǝgi?
    38: Nǝghamnd kak hǝr nǝmnd agha ghulab kǝm dlǝghkani? Bii agha maay dǝ sǝɗav kǝm vǝlak kǝ saɗavi?
    39: Nǝghamnd kak hǝr nǝmnd agha yangbiya, bii agha ma guda bǝrfin kǝm nǝghkaani?’
    40: “Kaa da ngutǝrangug nǝ tlǝsksǝn taakiya, ‘Ba jiir wan tagkur naiya, ɓagamaraɓag tsau kǝ daddakwa hǝɗiikǝn pall ma kwanahaan kǝ zaraabaharna, bakalkal amaa ɓagwi ba kǝskaiya.’
    41: “Tǝhakwah da tagtǝrtaag kǝ lii tǝ dǝvaa ghyaɓaan taakiya, ‘Yagham vakar lii tlafatlafanǝnna, damdǝg damma kaara fai kwa maay ghyinng ba dǝm biya, kwa ɓadlavarna kǝ Shatanah ard zarha ɓǝlgaana.
    42: Aɗaba ndza njǝkwa nǝ waiya, vǝlamwa bi kǝ dǝga zǝg biya. Ndza njikwa nǝ andǝla, gamwad bi kǝ yu biya.
    43: Ndzan ghulaba, dlǝghamkwi biya, ndzan maay dǝ sǝɗav biya, vǝlamwabi kǝ sǝɗav biya, ndzan yang biya, dlaɓa ndzan ma guda bǝrfina nǝghamwa biya.’
    44: “Ghǝravaatǝr ndakwani ar da ngug taakiya, ‘Yaazhigǝla, nǝghamnd kak hǝr nǝmnd agha ɓǝsha wai, bi njak nǝ andǝl, bi agha ghulaba, bi agha maay dǝ sǝɗav, bi agha yang biya, bi agha ma guda bǝrfina kǝm lǝwa kǝ fǝku hyǝmiyi?’
    45: “Kaa da ngutǝrngug taakiya, ‘Bak jiir wan tagkur naiya, ɓagamara bi tsau kǝ dadda kwa hǝɗiikǝn pall ma uudahaanǝn biya, ɓagamwi bi kǝskai biya.’
    46: “Kwanahaan kǝ uudaha, ar da hǝɓa dlaɗ tangw damma zǝrazǝra, uudaha jiikiira ar damma shifǝga tangw damma zǝrazǝra.”
  26:
    1: Ghyǝnnga ba Yesu kǝ tagtǝr kwanahaan kǝ dǝgitah baɗǝmma, aiyama taa kǝ mbǝrzahaana,
    2: “Am sǝrgasǝrǝg taakiya tǝmaa ba hǝnng bu kǝ Hwaɗaga Haarakǝsa Dzava Hǝnyaha, da vǝlǝvda dlaɓ nǝ Zǝra Uuda da hǝrtǝvǝta.”
    3: Kaa dzahav kǝ maalah ma zhiila kǝsauufah ard tlǝvuukwah tǝghǝr kǝ uudaha ma vǝgya maal ba tingting ma zhiila kǝsauufah, kwa ɗahav dǝ Kayafa.
    4: Kaa ba ɗiya sawariya viya Yesu kǝ iitǝr da gǝlagǝl kiyava tsǝgaan kǝ iitǝra.
    5: Aiyam nǝ iitǝra, “Ɓag yam bi sarta hwaɗag biya, haik kǝ ciya hǝnkal kǝ uudaha.”
    6: Ma sartǝn ndza ma Bitani nǝ Yesu ma vǝgya Siman kwandza njakǝn vǝcca.
    7: Kaa sagau nǝ uusiin da vak Yesu dǝ mǝrta kwa ɓagava dǝ akura onis, righarighan dǝ tǝrshǝn bǝtbǝt kwa ba pir ganan ɗiyarǝt dat ghǝr ma sartǝn ndza zaa dǝga zǝg nǝ iina.
    8: Nǝghǝghara ba nǝ mbǝrzahǝn ǝndkwaha, kaa badzǝg kǝ ǝrviɗmahuɗatǝra, aiyam nǝ iitǝra ma taatakatǝra, “Badza ba dǝgiti nǝ wanna.
    9: Maa vǝlavu nǝ tǝrshinna, maa tlavkǝnatlǝg nǝ kwaɓ ba ɗyaka maa vǝlavtǝrvǝlǝg kǝ talagaha.”
    10: Sǝrghaakasǝrǝg tsau nǝ Yesu kǝ dǝgiti ar tag nǝ iitǝra aiyama taa kǝ iitǝra, “Aujilbǝg am gaghya uusǝn ǝndkwani? Abi dǝgit maraw wa ɓagwi nǝ iina.
    11: Ba kǝlaa hǝnga am ba ǝmtaɗ dǝ talagaha, ǝn maay nai ǝmtaɗ dǝ kuram kǝlaa hǝnng biya.
    12: Kwan kǝ tǝrshinǝn aa ɗaigǝt nǝ iin tǝ vǝgharna, aa ɓag kwakyarvad ɓadla hǝɗa kaiya.
    13: Bak jiijiir wan tagkur naiya, baɗǝm nǝ vakavaki da tagav nǝ ǝlbǝg maraw ma duni baɗǝmma, da ba tagav nǝ dǝgiti ɓagaa nǝ uusǝn kiyava dzamgaana.”
    14: Kaa ba dagal kǝ pal ma mbǝrzah kǝlaawa tar buwna, kwa ɗahav dǝ Yahuda Iskariyuti, da vak maalah ma zhiila kǝsauufaha.
    15: Aiyama, “Awam da vǝlgwa nǝ uuram, akwama vǝlankurvǝlǝgi?” Ar vǝlar kǝ sǝl kul hǝkǝrɗa.
    16: Ciigǝt tǝ kwahiin kǝ sarta wa fǝgharzha nǝ iin kǝ gata ɗuul vǝltǝr Yesu.
    17: Daghuvala zǝngwa Hwaɗaga Haara kǝssa bǝruudi kwal yista, kaa sagau nǝ mbǝrzahaan da vak Yesu, am nǝ iitǝr taa kǝ iina, “Vaakwar wagha naag nǝng ma kǝmǝnda ɓadlkana kǝ dǝgazǝg Hwaɗaga Haara kǝssa dzava hǝnyah kiyava zǝgaan kǝskǝghi?”
    18: Aiyama, “Damdǝg damma huɗa kǝsa da vak uuda nǝ iina, tagamartaga, ‘Daada tsaga dǝgiti, waa taakiya, ɓagaaɓag nǝ sart kwan da zǝg nai kǝ dǝga zǝga Hwaɗaga Haarakǝsa Dzava Hǝnyah ma vǝgyagh ǝmtaɗ dǝ mbǝrzahaara.’”
    19: Kaa ɓagaan kǝ mbǝrzahaan bandkwa tagatǝr nǝ Yesu kǝ ɓagaana, kaa ɓadlnaɓadlǝg kǝ iitǝr kǝ dǝga zǝga Hwaɗaga Haarakǝsa Dzava Hǝnyaha.
    20: Ɓǝlaa ba hwaasa, ngal cihuran da za dǝga zǝga ǝmtaɗ dǝ mbǝrzahaan kǝlaawa tar buwa.
    21: Ar tǝghǝrdǝga za dǝga zǝga, am nǝ Yesu taa kǝ iitǝra, “Bak jiijiir wan tagkur naiya, palla ma kurama da vǝla kaiya.”
    22: Kaa njitǝrnjiig ba vaivaiya, ar farzha kǝ ndavgarundavǝg ba da palla palla ar taakiya, “Kai ni, Yaazhigǝla?”
    23: Kaa ngutǝranguga amaa, “Daddakwa za dǝga zǝg ǝmtaɗ dǝ kaiya ma kuwa, iin wa da vǝla kaiya.
    24: Zǝra Uuda da ǝmtsǝg bandkwa vindava ma kakkaɗa Daadamazhigǝl tǝghǝr kǝ iina. Dǝga zhuwadaal kǝ daddakwa da vǝla Zǝra Uuda! Ngulǝn maa yava bi nǝ uuda nǝ iin biya.”
    25: Aiyam nǝ Yahud kwa vǝlǝt Yesu na, “Kai ni, dadda tsaga dǝgita?” Aiyam nǝ Yesu taa kǝ iina, “Kǝgh ndakwani taghǝdataga.”
    26: Ar tǝghǝrdǝga za dǝga zǝga, kaa kǝsgantkǝsǝg nǝ Yesu kǝ bǝruudiya, tagar kǝ uus kǝ Daadamazhigǝla, lahnan vǝltǝr kǝ mbǝrzahaana, amaa, “Namamma zamzǝga, kwana iin nǝ vǝghara.”
    27: Kaa kǝsgantkǝsǝg kǝ iin kǝ kuwa yuwa inabiya, tagar kǝ uus kǝ Daadamazhigǝla, vǝltǝra amaa, “Hǝɓamhǝɓǝg baɗǝmaruwa.
    28: Kwana iin nǝ avǝzara dǝga righa lanngiya kwa ɗiyavda mbakyarvad uudah baɗyaka, kiyava ɓǝsha haipahaatǝra.
    29: Ən tagkurtaga, ǝn madlai da gwiya hǝɓa yuwa inabiyin biya, bamma daghuvali ǝn da hubǝg nai kǝ daalaan ǝmtaɗ dǝ kuram ma tlǝksǝra Daadara.”
    30: Ɓǝlara ba Yesu ard mbǝrzahaan kǝ ǝngsa, kaa sagal kǝ iitǝra, ngal ba dagat kǝ iitǝr damma Aghwa kwa dǝ Uufaha Zaitun.
    31: Am nǝ Yesu taa kǝ iitǝra, “Bamma huɗa avǝɗna, baɗǝmaru am da mbǝɗǝg ma fadghǝraru am da ɗukusa, mbakyarvad dǝgiti da dzǝgaar dǝ kaiya, aɗaba ba vindavindan taakiya, “‘Ənda tsǝgaan kǝ dadda piiya almana, da kwazǝg nǝ agyaragyara tughwaha.’
    32: “Tǝhala kwama da ciyakutciig nǝ uud dǝ shiifǝga, ǝn da dǝgaa nai tǝghǝr kǝskuram damma Galili.”
    33: Am nǝ Bitrus taa kǝ iina, “Aanji ar mbǝɗan ma fadghǝraatǝr baɗǝm mbakyarvad dǝgiti da dzǝgaar dǝ kǝgha, ǝn da maay nai biya.”
    34: Am nǝ Yesu taa kǝ iina, “Bak jiir wan tagak naiya, bamma huɗa avǝɗna, lakuti wiig kǝ ghwatkala, agha da ɓagaan kǝ agajawa sǝrkwai shig hǝkǝrda.”
    35: Aiyam nǝ Bitrus taa kǝ iina, “Aanji ǝn da ǝmtsǝg ǝmtaɗ dǝ kǝgha, ǝn da maay ɓagaan kǝ agajawa sǝra kǝgh biya.” Tagarar bandkwah dlaɓ nǝ mbǝrzah baɗǝmma.
    36: Kaa dagal kǝ Yesu ard mbǝrzahaan damma Getsamani, aiymaa taa kǝ mbǝrzahaana, “Ndzamandzǝg vaakwana, ǝn dagal da dzǝgwazhigǝl vaakwaha.”
    37: Kaa ba dagal kǝ iin dǝ Bitrus ard zarha Zabadi buwa, ngal mbǝkǝnmbǝga dlaɓa kaa badza ǝrviɗmahuud kǝ iina.
    38: Amaa dlaɓ taa kǝ iitǝra, “Badzǝga ǝrvidmahuɗǝn ǝn dǝvakai naina, anǝgha ba tsakwitsǝga. Ndzamandzǝg vaakwana, uufamuufǝg ǝmtaɗ dǝ kaiya.”
    39: Gavǝt ba nǝ iin dagal da tǝvuukw hǝɗiikǝna, ngal tsǝɗi kǝ iin kǝ ghǝraan damma haay dzǝgwa kǝ zhigǝla, amaa, “Daadara, akwama ɓagaaɓaga, kǝswaarakǝssǝg kǝ kwanǝn kuwa dlaɗa, bakǝvakwaha, gat bi kǝ dǝgiti ǝn naag nai biya, bamma dǝgiti agha naag nǝnnga.”
    40: Sagha ba nǝ iin savak mbǝrzahaana, tlatǝra hǝna haara, amaa taa kǝ Bitrusa, “Mbats am uufǝgabi kǝ dǝga aau pal ǝmtaɗ dǝ kai biya.
    41: Uufamuufǝga am dzǝgwaan dlaɓ kǝ zhigǝl haik dagau kǝskuram damma fǝshiga, shiɗǝkw naagaana, vǝgh wa ɗǝmɗǝma.”
    42: Kaa gwiya dagal kǝ iin kǝ dǝga buwa, dzǝgwa kǝ zhigǝl amaa, “Daadara akwama da ghudkwaarabi nǝ wan kǝ dlaɗ bamma hǝɓanuuhǝɓǝga, aandzandzǝg bat naagagha.”
    43: Gwiyaghǝra ba nǝ iin saasa, tlatǝra ba hǝna haara, Aɗaba haar wa ma gyiyaatǝra.
    44: Kaa gwiya ɗutǝrǝsɗuug kǝ Yesu, ngal ba gwiya dagal da dzǝgwazhigǝl kǝ dǝga hǝkǝrɗa, kaa gwiya tagaan kǝ iin kǝ ǝlbǝgi tagada nǝ iin wura.
    45: Kaa saas kǝ iin da vak mbǝrzahaan amaa taa kǝ iitǝra, “Gwaastǝn am badlaɓ ba hǝnahaar am ɗiya kuɗga? Wa ɓagaaɓag ci nǝ sart kwada vǝlav nǝ Zǝra Uuda damma dǝv kǝ yaa dadda haipa.
    46: Ciyamciiga, jiyam dagala. Wa sǝghaasǝg nǝ dadda vǝla kaiya.”
    47: Ba ndzǝgaan Yesu ba taa ghaiya, ka sagau kǝ Yahuda pall ma kǝlaawa tar buwna, ǝmtaɗ dǝ dzahava dlamaa kǝlaaw baɗyak dǝ katsakarah ard dǝ zadaha, ɓǝlartǝr nǝ maalah ma zhiila kǝsauuf ard dǝ tlǝvuukwaha.
    48: Aɗaba tagatǝrdatag daddakwa da vǝlgaanǝn kǝ dǝga sǝrgi da marg nǝ iin taakiya, “Dadda kwanda ɓǝrhug nai na, iin nǝ uuda nǝ iin viyamviiga.”
    49: Bad saasaana, kaa dagau kǝ iin da tǝvǝgh kǝ Yesu amaa taa kǝ iina, “Uus, dadda tsaga dǝgita!” Kaa bǝrhugaan kǝ Yahuda.
    50: Aiyam nǝ Yesu taa kǝ iina, “Tsaghwa, ɓag kǝ dǝgiti aa sǝkadsǝga.” Kaa sagau kǝ uudahiin, ar viyit kǝ Yesu ar hǝkynana.
    51: Nǝghǝgha ba nǝ pal ma lii ǝmtaɗ dǝ Yesu ǝntkwaha, ngal tǝɗda kǝ katsakaraan ghudarda kǝ hyimmi kǝ kwatnaha maal ba tingting ma zhiila kǝsauufaha.
    52: Am nǝ Yesu taa kǝ iina, “Gwidǝmgwiig kǝ katsakaragh damma kumbǝghaana, aɗaba baɗǝm daddakwa tǝɗda katsakara, da tsǝg ba katsakara.
    53: Mam tlǝg nǝ uuram ǝn ɗahgant bi kǝ Daadar, tlǝgwadi ba watswats kǝ zarha ɓǝlg kwa juujig kǝ dakwala tlaujah kǝlaawa tar bu biya?
    54: Ai ci tsaa, da righav ndandar wa tagada nǝ Əlbǝga Daadamazhigǝl vindavindan taaki ba pakat wanǝn kǝ dǝgit dzǝgardzǝgi?”
    55: Ma kwahiin kǝ sarta amaa taa kǝ uudahiina, “Amaa sagau dǝ katsakarah ard dǝ zadah da viya kai bandgi ǝn dadda zaa ɗuula? Ba kǝla hǝnnga ǝn bamma gaagazaiya Vǝgya Daadamazhigǝl ǝn tsaga dǝgita, viyamkwa biya.
    56: Baɗǝm wanahaan dzǝghaar ba kiyava righa dǝgiti vindara nǝ tlayanngah ma Əlbǝga Daadamazhigǝl vindavindana.” Cinngaraba nǝ mbǝzahaan kwanǝnna, kaa ta dagalaatǝr kǝ iitǝr baɗǝm ar ɗuwarsa.
    57: Kaa lanngaan kǝ lii viyarǝt Yesu dagal da vak Kayafa, zhiila kǝsauuf maamaala, vakavaki dzaharvǝt nǝ maalaha lii tsaga adzahadzah ard tlǝvuukwaha.
    58: Kaa gatǝrgatǝg kǝ Bitrus mahal mahal ba bitky tangw dat ghaiya wakyagha zhiila kǝsauuf maamaala, kaa daas kǝ iin damma gaagazayan cihura ǝmtaɗ dǝ lii uufa wakyagh kiyava vaza dǝgiti da dzǝgardzǝga
    59: Kaa ba gata shiidaha fiid kwada tagav tǝghǝr kǝ Yesu nǝ zhiila kǝsauufah maamaal ard lii ma gyiɗ baɗǝmma, kiyava tsǝgaan kǝ iitǝra.
    60: Tlarkǝna biya, bakǝvakwaha mǝng nǝ kyalma uudah ba ɗyak sarǝv sa ɓa shiida fiida. Tǝhalakwaha kaa sagau kǝ uudah buwa
    61: aiyam nǝ iitǝra, “Kwan kǝ uuda wa taga taaki, ‘Ən dlagnadlag kǝ vǝgya Daadamazhigǝla, ǝn gwiya ndǝrǝt bamma hǝng hǝkǝrɗa.’”
    62: Kaa ciig kǝ maal ba tingting ma zhiila kǝsauufaha, amaa taa kǝ Yesu, “Agha maay dǝ ǝlbǝg biya? Shiidǝn tag nǝ uudahaan tǝghǝr kǝskǝghǝnmi?”
    63: Mbǝɗabi Yesu kǝ ghaiyaan biya. Aiyam maal ba tingting ma zhiila kǝssauufah taa kǝ iina, “Aɗabad Daadamazhigǝl kwad shifǝga, tagkǝmndtag akwama kǝgh Kǝristi, Zǝra Daadamazhigǝla.”
    64: Aiyam nǝ Yesu taa kǝ iina, “Band kwagha tagda nǝnnga. Ən tagkurtag baɗǝmma, ciigǝt ndakwana am da nǝghǝganǝghǝg kǝ Zǝra Uuda cihurgan tǝ dǝvaa kafa Dadda Ndzǝɗa, sii ma akumba zhigǝla.”
    65: Kaa tahdatahǝg kǝ maal ba tingting ma zhiila kǝsauufah kǝ sǝɗavaan mbakyarvad badzǝga ǝrviɗmahuuɗ amaa, “Badzadabadzǝg kǝ ɗaaga Daadamazhigǝla! Kwar kaci kǝ shiid wa kiyam gwiya naag nǝmyami? Amaa cinngacinng aa badza ɗaaga Daadamazhigǝla.
    66: Au wamaa nǝghǝga nǝ uurami?” Kaa ngugangug kǝ iitǝr taakiya, “Tlaltlǝg maa tsǝvana!”
    67: Kaa tafgarvatafǝg kǝ iitǝr kǝ ashaghwvai ma huɗvǝga, ar dlaghara kǝ tsǝga, ar ɓalara kǝ mahupennga,
    68: ar taakiya, “Tagkǝmndtag kǝ tlayanngǝra, akwama ba kǝgh nǝ Kǝristiya, tag kǝ dadda kwa tsaktsǝga!”
    69: Ma kwaniin kǝ sarta, ndza cihurgan ma gaagazaya hǝnnyahiina Bitrusa, kaa sagau nǝ dǝghwiin ɓatlǝr hǝnyahiin da vakaan amaa taa kǝ iina, “Abi ghǝravagh ndakwi agha ǝmtaɗ dǝ Yesu uuda Galilin!”
    70: Kaa ɓala gajau kǝ Bitrus tǝvuukwatǝr baɗǝmma, amaa, “Ən sǝrgabi nai kǝ dǝgiti agha tag nǝng tǝghǝr biya.”
    71: Saal ba nǝ iin samma bǝrcama, kaa nǝghǝganǝghǝg nǝ dughwi tlǝrǝn kwa ɓa tlǝr ma hǝnyahiina, amaa taa kǝ lii ghacga vaakwahiina, “Kwanǝn kǝ uud araa ndzaa ǝmtaɗ dǝ Yesu uuda Nazarat!”
    72: Kaa gwiya ɓala agajau kǝ Bitrus baz zaha ngwaɗǝg taakiya, “Ən sǝrga bi var kǝ uudanǝn biya.”
    73: Tǝhala zǝlam ba hǝɗikǝna, kaa sagau kǝ lii ghacga vaakwahiin davak Bitrusa, am nǝ iitǝra, “Ba pakat kǝgh ndakwani agha pal nǝng ma iitǝr yaana. Ghayi agha tag nǝng wa markadamarǝga.”
    74: Ngal farzha kǝ tlafa ghǝraana, ndaha ngwaɗǝga, taakiya, “Ən sǝrgai var kǝ uudanǝn biya.” Tǝhala kwaha kaa wiig kǝ ghwatkala.
    75: Kaa dzamnadzamǝg Bitrus kǝ ǝlbǝgi tagghar Yesu taakiya, “Lakuti wiig nǝ ghwatkal hinana, agha da ɓagaan kǝ agajawa sǝrkwai shig hǝkǝrɗa.” Kaa dagal kǝ Bitrus da gyimal ngal tuug kǝ iin ba vaivaiya.
  27:
    1: Wura ba kǝssa, kaa ɗǝya sawariya tsa Yesu kǝ maalaha zhiila kǝsauufa ard tlǝvuukwaha dlamaa kǝlaawa badǝmma.
    2: Ar ngwaɗarna kǝ dǝva, kaa langan kǝ iitǝr dagala, ar vǝlar kǝ gumna Bilatus.
    3: Nǝghǝgha ban Yahud kwa vǝlǝt Yesu taakiya, ghudavardaghudǝg shariya ǝmtsǝg kǝ Yesu, kaa mbǝkǝnmbǝg ma ǝrviɗya, ngal daas kǝ iin davak lii maamal ma zhiila kǝsauufah ard tlǝvuukwaha, gwitǝrdan kǝ sǝl kul hǝkǝrɗa adawanǝn cauwa nǝ iinna.
    4: Amaa, “Ɓaganaɓag kǝ haipa kwa vǝlanǝt nai kǝ dadda kwa maay dǝ haipǝn kiyava tsǝgga.” Aiyam nǝ iitǝra, “Au lambamǝndi? Waigagh kǝskǝgha.”
    5: Ɗiida kǝ iin kǝ kwaɓa adawanǝn ma Vǝgya Daadamazhigǝla, ngal dagal hǝrtǝt kǝ ghǝraana.
    6: Ar cagant maalaha zhiila kǝsauufahǝn kǝ kwaɓǝna, amaa nǝ iitǝra, “Dzah laɓa kwaɓiin dǝ kwaɓ Vǝgya Daadamazhigǝla, aɗaba kwaɓa avǝza.”
    7: Kaa ɗiya sawari kǝ iitǝr tǝghǝr kwaɓiina, ar sǝgwa kǝ vakavak vak lii ndǝra shakka, aɗaba nal kǝ vaka hǝɗa zǝr ndzǝgaha.
    8: Kwakyarvad kwan wa ɗahav nǝ iin gwastaan dǝ vaka avǝzna.
    9: Tǝdvad kwan wa righavant nǝ dǝgiti tagada nǝ tlaiyanng Irmi taakiya, “Kǝsavantkǝsǝg nǝ sǝl kwul hǝkǝrɗa adawana, kwaɓi haiyarant nǝ uudaha Israil kǝ ɗiigaan tǝ iina.
    10: Ar sǝgwa kǝ vakavaka vak lii ndǝra shak dǝ vakaiya, bandkwa tagghwa Yaazhigǝla.”
    11: Ma sartǝn ghacgan nǝ Yesu tǝvuukwa gumna, kaa ndavgarundavǝg kǝ gumǝn taakiya, “Kǝgh nǝ tlǝkessa Yahudaha?” Aiyam nǝ Yesu taa kǝ iina, “Bandkwa agha tagda nǝnnga.”
    12: Kaa ghwadgarnǝs ǝlbǝg kǝ maalaha zhiila kǝsauufah ard tlǝvuukwaha, tagatǝr bi nǝ Yesu aanji ndau biya.
    13: Aiyam nǝ Bilatus taa kǝ iina, “Agha cinnga bi kǝ ǝlbǝgahaan ar tag nǝ iitǝr tǝghǝr kǝskǝghǝn biya?”
    14: Ngughara bi Yesu kǝ ndavǝg aanji pal biya, kaa ba ɓa jappǝr kǝ gumǝn ba vaivaiya.
    15: Ma kwar kǝ sarta Hwaɗaga Haarakǝsa Dzava Hǝnyaha, nǝtnǝg gumǝn kǝ ɓǝla uud pal sagal ma guda bǝrfin kwa naag nǝ uudaha.
    16: Ma kwahiin kǝ sart ndza mǝng nǝ ɛɛvya kwa sǝrvasǝrg ba vaivai ma guda bǝrfin ɗaagaan Barabbas.
    17: Dzaharvǝt ba dlamaa kǝlaawa, kaa ba ndavtǝrundavǝg kǝ Bilatus taakiya, “War wam naag nǝ uuram ǝn ɓǝlkurǝsi? Barabbas nii Yesu kwa ɗahav dǝ Kristiyinhi?”
    18: Aɗaba sǝrghaakasǝrǝg Bilatus taakiya kwakyarvad shilǝg wa vǝlarda nǝ iitǝr kǝ Yesu.
    19: Cihurgan tǝ avǝda ta shari Bilatusa, kaa ɓǝlgantɓǝlǝg nǝ uusaan kǝ ghaiya amaa, “Aa tap bi kǝ uuda jiijiirǝn biya, aɗaɓa mbakwambǝg nǝ dlaɗ ma sǝng haniin tǝghǝr kǝ iina.”
    20: Kaa shahtǝrshahǝg kǝ maalaha zhiila kǝsuufah kǝ dlamakǝlaaw aa tagartag taakiya aa ɓǝlvarsɓǝlǝg nǝ Barabbas, aa tsǝvatsǝg nǝ Yesu.
    21: Kaa gwiya tagtǝrtag kǝ gumnǝn taakiya, “Kwar ma uudahaan buna wam naag nǝ uuram ǝn ɓǝlkurnǝsi?” Aiyam nǝ iitǝra “Barabbas.”
    22: Aiyam nǝ Bilatus taa kǝ iitǝra, “Auci wanda ɓag nai dǝ Yesu kwa ɗahav dǝ Kǝristini?” Kaa ngugangug kǝ iitǝr baɗǝm taakiya, “Aa hǝrtǝvǝthǝrtǝga!”
    23: Am nǝ Bilatusa, “Kwakyarvad auwi? Au nǝ haipi aa ɓaga nǝ iini?” Bakǝvakwaha, gwiya fararaa bad fǝg nǝ uudah kǝ ɗiya cauwa, ar taakiya, “Aa hǝrtǝvǝthǝrtǝga!”
    24: Nǝghǝgha ba nǝ Bilatus taakiya maay nǝ dǝgiti da ɓagaɓag nǝ iin biya, dlaɓa uudaha ar naa ciya jaaga, kaa gǝt kǝ iin kǝ yu barda kǝ dǝvahaan tǝvuukwa uudaha, amaa, “Zhigǝlaa dǝvar ma kunngya, tlǝkwibi nǝ avǝza uuda jiijiirǝn biya. Ba kwa vakaruci waha.”
    25: Kaa ngugangug kǝ uudah baɗǝmma, am nǝ iitǝra, “Dǝgshiga avǝzaana aa dǝg damma kungyamnda ard zarhamnda!”
    26: Kaa ɓǝltǝrnǝsɓǝlǝg kǝ iin kǝ Barabbas. Tǝhalakwa dlaghavaru kiiɓ kǝ Yesu, vǝlda kǝ iin kiyava hǝrtǝvǝta.
    27: Tǝhalakwaha, kaa langaan kǝ tlaujaha gumǝn damma gaagazaiya vǝgya gumna, ar dzaharaa kǝ dakwala tlaujah baɗǝm da tǝghǝr kǝ iina,
    28: ar sǝɗardan kǝ sǝɗava, ar tsugɗǝm ma sǝɗav kyang hulfa dǝga tlǝksaha.
    29: Ar ɓagara kǝ dzakwa kwarǝg dǝ dǝga taka, ar farǝm maghǝra, ar faraa kǝ hǝkya zad ma dǝvaa kafaana, tǝhalakwaha ar kǝla kǝ ghunj tǝvuukwan ar nenigaan ar taakiya, “Kǝm ma barkagh tlǝksa Yahudaha!”
    30: Ar tafarva kǝ ashaghwvaiya, ar cauwarva kǝ zadiina, kaa kalgaan kǝ iitǝr dǝ zad maghǝra.
    31: Ghyǝngara ba nǝ iitǝr kǝ nenigaana, ar sǝɗardan kǝ sǝɗavǝn kyangna, ar tsugwardǝm kǝ sǝɗavahaana. Kaa langaan kǝ iitǝr kiyava hǝrtǝga.
    32: Ar tǝghǝrdǝga dagala, kaa fadzaghǝr kǝ iitǝr dǝ zhiila Sayirin, ɗaagaan Siman, kaa fǝraafǝg kǝ iitǝr kǝsa tlaɓa hǝrta Yesu bad ndzǝɗa.
    33: Daral ba nǝ iitǝr da vakavaki ɗahav dǝ Golgota, dǝgiti tuukvakai nǝ Golgota, iin kuwa ghǝra.
    34: Kaa vǝlgarvǝlǝg kǝ iitǝr kǝ yuwa inabi laɓalaɓan dǝ dǝgit ɗyahɗyaha kiyava hǝɓgaana, tapghana ba nǝ iina, lǝwa kǝ hǝɓgaana.
    35: Hǝtaret ba nǝ iitǝra, kaa ba tagwnatagw kǝ iitǝr kǝ sǝɗavahaan tǝdvad tsa tsatsa.
    36: Tǝhalakwaha, kaa cahwarga cahwarǝg kǝ iitǝr vaakwahiin ar uufǝgaana.
    37: Kaa bǝgǝtbǝg kǝ iitǝr kǝ haipaan vindavindan tǝvaghǝraan taakiya, “KWANA IIN NƏ YESU TLƏKSA YAHUDAHA.”
    38: Kaa hǝtǝvǝthǝrtǝg dlaɓ nǝ gǝlah bu ǝmtaɗ dǝ iina, pal tǝ dǝvaa kafaana, pal tǝ dǝvaa ghyaɓaana.
    39: Uudahi ar tǝ ɗuula dagala ar nenigaana, ar gajaga ghǝra,
    40: ar taakiya, “Kǝghi tagh taakiya agha dlagnadlag kǝ Vǝgya Daadamazhigǝl agha gwiya ndǝrǝt bamma hǝng hǝkǝrɗa, katǝgci kǝ ghǝragha, akwamma agha ba zǝra Daadamazhigǝla, asǝgci saay tǝ tlaɓa hǝrtǝgǝn ndana!”
    41: Nenner bandkwah dlaɓ nǝ maalaha zhiila kǝsauufaha ard lii tsaga adzahadzaha Muusa ard tlǝvuukwaha, ar taakiya,
    42: “Katghantkatǝg kǝ uudahi tlǝrna, pilgharvaapilǝg kata ghǝraana. Akwama ba iin nǝ tlǝksa yaa Israˈila, aa sasǝgci saay ndan tǝ tlaɓa hǝrtǝgna, lakwti kǝmnda fǝdghǝrǝtfǝg dǝ iina
    43: Tsaghǝr tǝ Daadamazhigǝl tsauwa, aa katǝgci nǝ Daadamazhigǝl ndakwana, akwama ba naagaana, aɗaba tagadatag taakiya, ‘Ən Zǝra Daadamazhigǝla.’”
    44: Bandkwah dlaɓ nǝ gǝlah buna kwa hǝrtavtǝrǝt ǝmtaɗ dǝ iina, ghǝravatǝr ndakwani nenǝrnenga.
    45: Ciigǝt dǝ vaci tǝghǝra, tangw damma karfe hǝkǝrɗa hwaasa, hǝɗgharduhǝɗǝg nǝ gurtl kǝ lard baɗǝmma.
    46: Tamaha karfe hǝkǝrɗa faciya hwaasa kaa dzǝghantdzǝg nǝ Yesu kǝ ghaiya, amaa, “Eloi, Eloi, lama sabaktani?” Iin taakiya, “Daadamazhigǝlara, Daadamazhigǝlara, fiighkwada kwakyarvadawi?”
    47: Cinngaraba nǝ kyalma uudahi ghaciga vaakwahiin ǝndkwaha, am nǝ iitǝra, “Iliya wa ɗaag nǝ uudanǝnna.”
    48: Bat watswatsǝra kaa ǝmndǝrg kǝ pallǝraatǝra sǝdaa kǝ abarabara, rǝmndaa kǝ iin ma yuwa zǝra inabi kwarekreka, fǝt tǝ zad vǝlar kiyava hǝɓga.
    49: Am kyalma, “Ɗuwamarsɗuug ndana, vaziyamvazǝg mbatak da sii nǝ Iliya da katǝgaana.”
    50: Kaa gwiya dzǝgantdzǝg nǝ Yesu kǝ ghai bad halavuuwa ndzǝɗaana, tǝhalakwaha vǝlda kǝ shifǝgaana.
    51: Bamma kwahiin kǝ sart wa tǝhǝm ɓǝlɛɓǝlɛ kwama Vǝgya Daadamazhigǝl hutsǝg buwa, ciigǝt maghǝr damma suuha. Kaa gajagav kǝ haaya, akurah dlaɓa caɓaracaɓǝga.
    52: Kaa wargǝtwarǝg kǝ gǝtlaha, baɗyak nǝ uudaha jiijiiri ǝmtsaharaǝmtsahǝga, ciyarǝtciig dǝ shifǝga,
    53: saharalsahǝg ma gǝtlahaatǝra. Tǝhala ciiga Yesu ma gǝtlaha kaa daas kǝ iitǝr damma gǝdǝrkǝs caccuwanacaccuwana, nǝghartǝrnǝghǝg nǝ uudah baɗyaka.
    54: Ma sartǝn nǝghǝgha nǝ tlauja Roma maamaalǝn ard lii uufa Yesu kǝ gajagava haaya ard dǝgiti dzǝghaardzǝg baɗǝmma, kaa gǝdzǝg kǝ iitǝr ba vaivaiya, aiyam nǝ iitǝra, “Ba pakata, ndza Zǝra Daadamazhigǝla!”
    55: Mǝng dlaɓ nǝ kyalǝma ǝngwasah baɗyak kwa gatar Yesu kǝsantaan ma Galili ar ba mǝlgarumǝlga. Kaa ghacigaghacig kǝ iitǝr ba ndzaɗɗa, ar vaza dǝgiti dzǝgaardzǝga
    56: Ma iitǝra mǝng nǝ Maryam Magadala, ard Maryam babba Yakuba ard Isuvu, dlaɓa ard babba zarha Zabadi.
    57: Ɓǝlaa ba hwaasa, kaa sagau kǝ dadda hyahiina, zhiil Arimatiya, ɗaagaana Isuvu, gharavaan ndakwani mbǝrza Yesu.
    58: Kaa dagau kǝ iin davak Bilatus da ghala tluuwa vǝgha Yesu. Ngal ba vǝlgavǝlǝg nǝ Bilatus kǝ ɗuula kǝsgaana.
    59: Kaa kǝsgantkǝsǝg nǝ Isuvu kǝ tlǝwa vǝgha Yesu, faɗant ma kǝlpakan kwal laliya.
    60: Fǝdǝm kǝ iin ma daala gǝtlaana, kwa hurghana nǝ iin ma kura. Hǝɗardu kǝ iin kǝ ghaiya gǝtliin dǝ maandala akura, kaa ba dagalaana.
    61: Maryam Magadala, ard kwa pal kǝ Maryam ar cuhurgan ba gyakaɗ dǝ gǝtliina.
    62: Wurga kǝsaana, tǝhala Faciya Ɓadlavǝgha kaa dzahvǝtdzahǝg nǝ maalaha zhiila kǝsauufah ard Farisah tǝvuukwa Bilatus,
    63: Aiyam nǝ iitǝra, “Kǝm ma barkagha. Dzamamndnadzamǝg kǝ dǝgiti taga dadda vala uudǝn sarta kwan ndza dǝ shifǝg nǝ iin amaa, ‘Ən da ciig dǝ shiifǝg tǝhala hǝng hǝkǝrɗa.’
    64: Mbakyarvad kwaha, fǝtǝraafǝg kǝ uudah da uufa gǝtlǝn ba vaivaiya tangw dat hǝng hǝkǝrɗa, haik kǝ dagal kǝ mbǝrzahaan da ghǝla tluuwa vǝghaana, aɗaba ar da tagtǝrtag kǝ uudah taaki ciyitciig ma gǝtlaha. Valga hala da jǝguujig kǝ valga zǝngw ba vaivaiya.”
    65: Aiyam Bilatus taa kǝ iitǝra, “Dzǝgamǝtdzǝg kǝ tlaujaha, damdǝg da uufǝgaana, ɓagamɓag kǝlaa ndzǝɗaruwa.”
    66: Kaa dagal kǝ iitǝr da uufa gǝtliina, ar tsǝt kǝ dǝga sǝrga tlǝkǝs tǝ akura gǝtliina, dlaɓa ar fǝtǝraa kǝ tlaujah kǝ uufǝgaana.
  28:
    1: Dal ba faciya ngiiga Yahudaha, daghuvala laad ba wur kǝsa, kaa dagal kǝ Maryam Magdaliya ard kwa pallǝn kǝ Maryam da zhara gǝtla.
    2: Kaa gajagvǝtgajag haay baɗyakɗyaka, aɗaba zǝr ɓǝlga Daadamazhigǝl wa sahi ma zhigǝl da tlǝgarwa akurǝn kwa hǝɗavardu dǝ gǝtlna, cihura tǝvakaiya.
    3: Ndzǝganan mbiig band wukyiɗǝga. Sǝɗavaan maɗǝkw ba tǝll band tluuzha.
    4: Nǝghǝghara ba lii uufǝgaana, kaa gǝdzgǝtgǝdzǝg kǝ iitǝr ba vaivaiya, tǝg nǝ vǝghaatǝra, ar mbǝɗa damma haay bandgi ǝmtsaharaǝmtsahǝga.
    5: Am Zǝr ɓǝlga Daadamazhigǝlǝn taa kǝ ǝnghwasahaana, “Gǝdzam biya, ǝn sǝrgasǝrǝg am gata Yesu kwa hǝrtavǝtta.
    6: Maay vaakwan biya, ciyitciiga band kwa tagada nǝ iina, wan vakavaki hǝnngavna nǝ iina.
    7: Damdǝg ba watswatsa tagamtǝrtag kǝ mbǝrzahaan taakiya, ‘Ciyitciig ma gǝtlaha, wada dǝgaa nǝ iin tǝghǝr kǝskuram damma Galili, am da nǝghǝga vaakwaha.’ Əna sǝgga bak tagkur kwanǝnna.”
    8: Kaa hadzala dagal kǝ ǝngwasahiin vaka gǝtliina, gǝdzarǝtgǝdzǝga bakǝvakwaha ar dlaig ba vaivaiya, kaa ǝmdǝra daas kǝ iitǝr ar tagtǝr kǝ mbǝrzaha Yesu.
    9: Kaa tlǝtǝraatlǝg kǝ Yesu bad ghǝraana, amaa taa kǝ iitǝra, “Gabǝr tǝghǝr kǝskurama!” Kaa gavva daas kǝ iitǝr ba mbɛɛv da tǝvǝgh kǝ iina, ngal bǝrhwa shigahaan kǝ iitǝr ar ɓagarnǝs kwatnaha.
    10: Am nǝ Yesu taa kǝ iitǝra, “Gǝdzam biya. Damdǝg tagamtǝrtag kǝ zaraabahar aa dardǝg damma Galili, ar da nǝghǝkwa vaakwaha.”
    11: Ar tǝghǝrdǝga daas nǝ ǝnghwasahiina, kaa daas kǝ kyalǝma lii uufa gǝtlahǝn damma kǝssa, kaa tagtǝrtag kǝ iitǝr kǝ dǝgiti dzǝghaardzǝg baɗǝm kǝ maalah ma zhiila kǝsauufaha.
    12: Dzahavǝt ba nǝ maalah ma zhiila kǝsauufah ard tlǝvuukwaha dlamaa kǝlaawa, kaa ɗǝya sawari kǝ iitǝr ar vǝltǝr kǝ kwaɓ baɗyak kǝ tlaujaha.
    13: Aiyam nǝ iitǝra, “Tagamtǝrtag kǝ uudah taaki, ‘Mbǝrzahaan wa ghǝlarda kavǝɗ ma sarta kwa tsakǝmnda haara.’
    14: Aanji dǝm nǝ ǝlbǝgǝn damma hyǝmmi kǝ gumna, kǝm da tagartag nǝmnd kǝ ǝlbǝga, am da maay hǝɓa dlaɗ biya.”
    15: Kaa caugacaug kǝ tlaujah kǝ kwaɓiina, ar tagda band kwaa tagavtǝra. Kwanǝn kǝ ǝlbǝga, gwastaan ar ba kutgaan Yahudaha.
    16: Kaa dagal kǝ mbǝrzahaan kǝlaawa tǝmkikǝn damma Galili, damma aghwǝn tagatǝr nǝ Yesu taaki aa dzarghǝradzǝga.
    17: Nǝghara ba nǝ iitǝra, kaa ɓagar kwatnahǝr kǝ iitǝra, bakǝvakwaha, kyalmatǝr ɓagar ndaundauwa.
    18: Kaa saas kǝ Yesu sa tǝvǝgh kǝ iitǝr amaa, “Vǝlghwavǝlǝg nǝ uud kǝ ndzǝɗ baɗǝm ma ghǝrazhigǝla ard duniya.
    19: Mbakyarvad kwaha, damdǝg namtǝrdanǝg kǝ uudaha duni kǝ mbǝzahar baɗǝmma, am ɓagtǝra kǝ tsuufǝg ma ɗaaga Daada, ma ɗaaga Zǝra, ard Shiɗkw Daadamazhigǝla.
    20: Tsagamtǝrtsag kǝ dǝgitahi tagankur nai baɗǝm aa faraarafǝga. Ba pakata ǝn ba ǝmtaɗ dǝ kuram ba kǝlaa hǝnnga tangwa damma ghyinnga zamana.”
41:
  1:
    1: Kwanǝnna iin nǝ ǝlbǝg maraw tǝghǝr kǝ Yesu Kǝristi, Zǝra Daadamazhigǝla.
    2: Bandkwa fǝgharzha nǝ tlayang Ishay kǝ vindǝgaan ma kakkaɗaan taakiya, “Am Daadamazhigǝla, ‘Ənda ɓǝlgaan kǝ zǝr ɓǝlgar kiyava ɓadlak ɗuul lakuti aghada saaya.’
    3: Uudana ɓǝla tlǝhǝg ma tǝghala taakiya, ‘Ɓadlamarnaɓadlǝg kǝ ɗuulaan kǝ Yaazhigǝl ba ndǝɗɗa.’”
    4: Tsugwa ba nǝ Yuhwan dadda tsufǝg ma tǝghala, kaa tagtǝr ǝlbǝga Daadamazhigǝl kǝ uudaha. Amaa taa kǝ iitǝra, pǝlampǝlǝg kǝ ghǝra ɓag kura nǝ uud kǝ tsuufǝga, dlaɓa ɓǝshkurna Daadamazhigǝl kǝ haipaharuwa.
    5: Kaa ba sagau kǝ uudah baɗyak ma haiya Yahudiya, ard uudah ma kǝssa Wurshalim da vak Yuhwana. Ar tagaan kǝ haipahatǝra, ɓagtǝra kǝ iin kǝ tsuufǝg ma zaagha Judan.
    6: Sǝɗavi tsuguv Yuhwan ɓagava dǝ guja adlǝgwama. Dǝga ndzǝɗa huɗaana ɓagava dǝ hǝluwa, dlaɓa dǝga zǝgaana, ndzaba ayayuwa ard yuwa mamma.
    7: Kaa tagtǝrtag kǝ iin kǝ uudah taakiya, “Daddakwa da sagau tǝ halara jakwaraajig dǝ ndangǝra, kwa tlanalbi nai kǝ ngǝghrangǝg da pǝla aandzu zawwa kimbakaan biya.
    8: Kai ǝn ɓagkur dǝ yu kǝ tsuffǝga, iina da ɓagkur dǝ Shǝɗǝkwa Daadamazhigǝl kǝ tsuffǝga.”
    9: Makwahiin kǝ sarta, sǝghaasǝg nǝ Yesu saama kǝssa Nazarat ma haaya Galili. Kaa ɓagaraɓag kǝ Yuhwan kǝ tsuffǝg ma zaagha Judan.
    10: Bad sagal Yesu ma yuwa, kaa nǝghǝganǝghǝg kǝ ghǝrazhigǝl wurga, dlaɓa kaa tsugwatsugw Shiɗǝkwa Daadamazhigǝl saay da tǝghǝr kǝ iin band garava kakura.
    11: Kaa cinngalcinng nǝ kungy sii ma ghǝrazhigǝl taakiya, “Kǝgh zǝrara, ǝn wayakwaig ba vaivaiya.”
    12: Zǝlamai tǝhala kwah biya, kaa langaan kǝ Shǝɗǝkwa Daadamazhigǝl kǝ Yesu damma tǝghala,
    13: hǝngaan kwul uufaɗ ba vaakwaha, fǝshgaan Shatanaha. Yesu ndzar ǝmtaɗ dǝ dǝg tǝghalaha, dlaɓa zarha ɓǝlga Daadamazhigǝla sarǝvsǝg da mǝlgarumǝlga.
    14: Tǝhalakwa ɓǝlavdǝm Yuhwan ma guda bǝrfina, kaa dagal kǝ Yesu damma Galili taa ǝlbǝg maraw tǝghǝr kǝ Daadamazhigǝla.
    15: Amaa, “Ɓagaaɓag sarta. Tlǝkǝsǝra Daadamazhigǝl hǝrzǝthǝrzǝg saaya. Pǝlampǝlǝg kǝ ghǝra, am fǝdghǝrǝt tǝ ǝlbǝg marawǝna.”
    16: Ghuda dagal nǝ Yesu tǝvǝgh kǝ yuwahaiya Galili, kaa nǝghǝganǝghǝg kǝ iin kǝ Siman ard zǝrababbaan Andrawus, ar bǝla amshiyaha vaiya kilf ma yuwahaiya aɗaba ar ya daddaha vaiya kilf nǝ iitǝra.
    17: Am Yesu taa kǝ iitǝra, “Gatamkwagatǝga, ǝn da nǝkurdalnǝg kǝ lii ɗaha uudah sa vakara.”
    18: Bat watswatsǝra, kaa ɗugarsɗuug kǝ iitǝr kǝ amshiyaha vaiya kilfatǝra, kaa gatǝgaan kǝ iitǝra.
    19: Gavǝt ba nǝ iin da tǝvukw hǝɗikǝnana, kaa nǝghǝganǝghǝg kǝ iin kǝ zarha Zabadi, Yakuba ard Yuhwana. Ar ma pɛrayuwa, ar ɓadla amshiyaha vaiya kilfaatǝra.
    20: Bat watswatsǝra kaa ɗahtǝrǝt kǝ iina, kaa ɗugarsɗuug kǝ iitǝr kǝ daddaatǝr Zabadi ma pɛrayu ǝmtaɗ dǝ lii hutsarant nǝ iitǝr kǝ ɓa tlǝra, kaa gataa Yesu kǝ iitǝra.
    21: Yesu ard lii gatǝgaan daragha damma kǝssa Kafarnahuma. Ɓagaa ba Faciya Ngiiga, kaa daas kǝ iin damma guda dzahava Yahudaha, kaa farzha tsagtǝr dǝgit kǝ uudaha.
    22: Kaa ɓa jappǝr kǝ iitǝr dǝ tsagaanana, aɗaba tsagatǝr dǝgit ba kalkala, gǝrgǝr dǝ ɗuuli tsag nǝ lii tsaga adzahadzaha Musa.
    23: Maay ma taaɗatǝr biya, kaa dǝgaadǝg kǝ uuda nǝ iin kwa dǝ shǝɗǝkw ghwaɗ damma guda dzahava, huulǝg taakiya,
    24: “Au lambagh dǝ kǝmnd Yesu Uuda Nazaret? Agha sagau da ghyǝhha kǝmnda? Ən sǝrgasǝrga magha war nǝngnga. Kǝgh daddakwa Caccuwanacaccuwanan sahi vak Daadamazhigǝla.”
    25: Kaa cagaraacag nǝ Yesu kǝ gyi kǝ shǝɗǝkw ghwaɗǝna, amaa taa kǝ iina, “Ɗǝw amǝnga. Assagal ma uudanǝna.”
    26: Kaa gajagantgajag ba dladlaɗ nǝ shǝɗǝkw ghwaɗǝn kǝ uudanǝna. Kaa huulǝg kǝ iin dlaɓa kaa tsugwa dagalaana.
    27: Baɗǝm nǝ uudahi ndzar vaakwahiin ar ɓa jappǝr ba vaivaiya, baz ndava ghǝrahaatǝr kǝ iitǝr taakiya, “Au wa nǝ iini? Kwar kǝ daala tsaga dǝgit wanii? Tsaga dǝgit ba kalkala. Baz fǝtǝraafǝg kǝ iin kǝ shǝɗǝkw ghwaɗah kǝ ɓa dǝgiti naag nǝ iina.”
    28: Caaricaari nǝghar bak cinngalcinng nǝ ǝlbǝg tǝghǝr kǝ iin aandzu taakwar mahuɗa haaya Galili.
    29: Ba dǝ Sagala Yesu ǝmtaɗ Yakub ar dǝ Yuhwana ma guda dzahava, kaa daas kǝ iitǝr da vǝgyaz Bitrus ar dǝ Andrawus.
    30: Babba uusa Bitrus hǝngan njǝkǝn fǝɗa. Bat watswatsǝra, kaa tagartag kǝ iitǝr kǝ Yesu kǝ ǝlbǝg tǝghǝra.
    31: Kaa dagau kǝ iin da vakaana, hakyǝnan kǝ dǝvaan ciyanta. Kaa ɗugarsɗuug fǝɗiina, tǝhalakwaha bagtǝra nǝ uusǝn kǝ dǝgzǝga.
    32: Dǝghwaasa, tǝhala daaya faciya, kaa sǝdǝvsǝg kǝ uudah kǝ lii yangbi baɗǝm ard lii dǝ shǝɗkw ghwaɗ ma vǝghahaatra.
    33: Kaa dzahav kǝ lii ma kǝsiin baɗǝm tǝghaiya hǝnyahiina,
    34: kaa mbahnambahǝg nǝ Yesu kǝ lii dǝ kuzah shahshaha. Lagudan baz shǝɗǝkw ghwaɗ mavǝgh kǝ uudaha ba ɗyaka. Ɗuwatǝrnai kǝ shǝɗkw ghwaɗah kǝ taaghai biya, aɗaba ar sǝrgasǝrg ghǝravaatǝr taaki ma war nǝ iina.
    35: Dlakadur ba wurra, lakuti cag nǝ kǝsa, ciyitciig nǝ Yesu ɗugharsɗuug kǝ hǝnyaha, kaa dagal kǝ iin da vakavaki maay band war biya. Dzugwa kǝ iin kǝ zhigǝl vaakwaha.
    36: Kaa dagal kǝ Siman ǝmtaɗ dǝ tsaghwaha dagalaan da gatǝgaana.
    37: Tlararaa ba nǝ iitǝra, kaa tagaratag kǝ iitǝr taakiya, “Baɗǝm nǝ uudah ar gatakǝgha.”
    38: Ngwangwug nǝ Yesu amaa, “Jiyam dagal damma gǝdzǝr kǝssahi kwa hɛffa, kiyava da taa ǝlbǝg maraw kǝskai vaakwah dlaɓa. Aɗaba sanhi mbakyarvad kwah naiya.”
    39: Tǝhala kwaha kaa gwaivagwaig kǝ iin baɗǝm ma haaya Galili, taa ǝlbǝga Daadamazhigǝla ma guda dzahavaatǝra. Lagwdaan dlaɓ kǝ shǝɗkw ghwaɗah ma vǝgha uudaha.
    40: Mǝng nǝ uuda nǝ iin njǝkǝn vǝca sǝv sa vak Yesu, kǝla kǝ iin kǝ ghunja kaa ghalgaan taakiya, “Ma haighanthaiga, agha mbǝkwimbǝgga.”
    41: Kaa zhugardaalazhug kǝ Yesu, ɓǝlaraa kǝ dǝva, amaa taa kǝ iina, “Haiyanant haiga, mbambǝgga.”
    42: Bat watswatsǝra kaa ɗugarsɗuug kǝ kuza vǝciina, kaa mbǝgambǝg kǝ iina.
    43: Kaa ɓǝlgaraɓǝlǝg nǝ Yesu kǝ magiya ba vaivaiya, ɓǝlars kǝ iin dagala.
    44: “Tagarbi aandzu ndǝwar kǝ dǝgiti aa dzǝgardzǝg biya. Dǝga agha marda kǝ ghǝragh vak zhiil kǝsuufa, agha ɓaga kǝ kyulǝg bandkwa tagada Musa taakiya aa ɓagavɓag mbakyarvad caccuwagha. Ɓagnaɓag kwana kiyava fadghǝr kǝ uudah taakiya mbǝghambǝga.”
    45: Dlakulva kwaha, kaa ba dagal kǝ ghwalvǝn kutǝgaana kǝ ɗuuli mbavǝna dǝ iina. Kwan wa fǝghǝra shǝɓav kǝ Yesu akwama dagal damma kwatlǝrǝn kǝ kǝssa, kaa ndza kǝ iin vakavaki maay ndǝwar biya. Bakǝvakwaha, ar fǝgarna ba sagau nǝ uuda da vakaan aandzu takwara.
  2:
    1: Tǝhala hǝnngaha, kaa gwiya daas dlaɓ kǝ Yesu damma Kafarnahuma, kaa cinngacinng kǝ uudah taaki, sǝghaasǝg sa hǝnnyaha.
    2: Uudahi dzaharvǝt vaakwahiina, ndzar baɗyak ba vaivaiya, rǝghǝtrǝghǝg vak mbakyarvad uudah hǝnnyaha, baz tǝghaiya wakyagh ndakwani, maadlai vakavak biya. Kaa tagtǝr ǝlbǝg maraw kǝ iina.
    3: Kaa lanngaan kǝ uudah uufaɗ kǝ uuda nǝ iin ǝmtsaǝmtsan nǝ vǝgha da vakaana.
    4: Pletǝrvapilǝg daas dǝ vakai da vak Yesu mbakyarvad ɗyakǝra uudaha, kaa ba hurnahurg kǝ iitǝr kǝ ɗuul tǝ ghǝra gud kalkal dǝ Yesu. Wurarant ba nǝ iitǝr kǝ ghǝra gudǝna, kaa ɓǝlgaan kǝ iitǝr kǝ uudanǝn sii tǝ kǝjaana.
    5: Nǝghǝgha ba Yesu kǝ fadghǝratǝra, amaa taa kǝ daddakwa ǝmtsaǝmtsa nǝ vǝghna, “Zǝrara, ɓǝshakanaɓǝshig nǝ uud kǝ haipahagha.”
    6: Ndza mǝnng lii tsaga adzahadzaha Musa cihurgan vaakwahiina, ar dzama dǝgit ma ǝrviɗmahuɗahaatǝra,
    7: Ar taakiya, “Aujilbǝg kǝ uudanǝn taaghai ǝndkwani? Kǝsghantkǝsǝg kǝ ghǝraan band Daadamazhigǝla. Warwa dǝ ndzǝɗa ɓǝsha haipah mamai ba Daadamazhigǝl pall biyi?”
    8: Batwatswatsǝra, sǝrghaakasǝrg nǝ Yesu ma ǝrviɗmahuɗaana kǝ dǝgiti ar ɗunngɗunng nǝ iitǝr ma ǝrviɗmahuɗatǝra, amaa taa kǝ iitǝr, “Aujilbǝg kǝ sǝkuram dzama kwanahaanii?
    9: Kwarwa juujiga, ngulǝm tagvar kǝ dadda kwa ǝmtsaǝmtsa nǝ ghyaba vǝgh pallǝn, taakiya, ‘Ɓǝshakanaɓǝshig nǝ uud kǝ haipahagh nii, nii taakiya, ciig kǝsantkǝsǝg kǝ kǝjagh dǝgdagalhi?’
    10: Manaa naagan mammaa sǝraaka taakiya Zǝra Uuda mǝnng dǝ ndzǝɗa ɓǝsha haipah ma duniya.” Mbakyarvad kwaha, amaa taa kǝ daddakwa ǝmtsaǝmtsa nǝ vǝghǝna,
    11: “Amai kǝsǝkǝgha, ciiga, kǝssant kǝsǝg kǝ kǝjagha dǝg daas da hǝnnyaha.”
    12: Kaa ciig kǝ iina, kǝssant kǝ kǝjaana, kaa mǝla dagalaana. Baɗǝm nǝ uudaha ar vazǝgaana. Kwan wa fǝgharaa aandzu war kǝ ɓa ajappǝra, kaa gala Daadamazhigǝl kǝ iitǝra ar taakiya, “Tapamndnabi kǝ nǝghǝg kǝ dǝgit ǝnd kwan biya.”
    13: Kaa gwiya dagal kǝ Yesu dat ghaiya yuwa haiya Galili. Kaa sagau kǝ uudah baɗyak da vakaana, dlaɓa kaa tsagtǝrtsag kǝ iin kǝ dǝgitaha.
    14: Tǝghǝrdǝga dagala, kaa nǝghǝganǝghǝg kǝ iin kǝ Lawi zǝra Halfa cihurga vaka cauwa hadama. Am Yesu taa kǝ iina, “Gatkwagatǝga.” Ngal ba cigǝtciig kǝ iina, kaa gatarsa.
    15: Davalitlǝrna, ndza kaf nǝ Yesu vǝgya Lawi. Kaa zǝgaan kǝ kyalǝma lii cauwa hadama ard kyalma yaa daddaha haipah kǝ kaf ǝmtaɗ dǝ ii ard mbǝrzahaana, baɗyak ndzar gata Yesu. Ar cuhwaran ar zuu kaf ǝmtaɗ dǝ iina ar dǝ mbǝrzahaana, aɗaba uudah baɗyak wa gatargatǝga.
    16: Nǝghara ba lii tsaga adzahadzaha Musa kwar Farisah kǝ Yesu za kaf dǝ yaa dadda haipaha ard lii dza hadama. Kaa ndavgarundavǝg kǝ iitǝr kǝ mbǝrzahaan taakiya, “Aujilbǝg kǝ iin za kaf dǝ lii dza hadama, ard yaa dadda haipahi?”
    17: Cinngha ba nǝ Yesu ǝnd kwana, amaa taa kǝ iitǝra, “Mai lamba lii yanng dǝ dakut biya, bamma lii yanng biya. Sanhi sa ɗa lii dǝ jiir bi nai biya, sanhi mbakyarvad yaa dadda haipaha.”
    18: Mbǝrzaha Yuhwan dadda tsuufǝga ard dǝga Farisah ar kǝssa ndǝla. Kaa sagau kǝ uudahiin sa ndava Yesu taakiya, “Aujilbǝg kǝ mbǝrzaha Yuhwan ard dǝgaha Farisah ar kǝssa andǝla, kwakyarva dau kǝ dǝgahagh ar maay kǝssa andǝl biyi?”
    19: Ngwatǝrangug Yesu amaa, “Kǝsgaan nǝ tsaghwaha zhiila ghwuul kǝ andǝl akwamar ǝmtaɗ dǝ zhiila ghwuula? Maba ar ǝmtaɗ dǝ zhiila ghwuula ar maay kǝssa ndǝl biya.
    20: Mǝng sarti da sagauwa kwada kǝssav zhiila ghwuul dagal vakaatǝr ɗuuvtǝrsa. Ar da kǝssǝg ma sarta kwah nǝ iitǝr kǝ andǝla.
    21: “Maay wa ghuda daala sǝɗav tlapant tǝ ǝnghura sǝɗava biya. Akwama dzǝghardzǝga, tǝhgaan daala sǝɗavǝn kǝ ǝnghura sǝɗaviina, badzǝgaan da jǝguujig kwandza wura.
    22: Maay wa ɗiya daala yuwa inabi ma ǝnghura ambǝla hǝlǝw biya. Akwama ɗiyavdǝmɗiiga, kaa ciig kǝ yuwa inabiyin ciɓna kǝ hǝluwǝn, da ɗiya dagal nǝ yuwa inabi, dlaɓa ambǝla hǝluwǝn da badzǝga. Daala yuwa inabi ɗǝyav bamma daala ambǝla hǝlǝwa.”
    23: Daghuvala faciya ngiiga Yahudaha, Yesu ar dǝ mbǝrzahaan ar ghudadagal ma guha hǝiya. Kaa kalgaan kǝ mbǝrzahaan kǝ kyalma ghǝra hǝiya tǝ ghǝrdǝga.
    24: Am Farisiyah taa kǝ Yesu, “Zharga, aujilbǝg kǝ mbǝrzahagh ɓa dǝgiti dzah kǝ ɓagaan davala ɗǝyakuɗǝgi?”
    25: Ngwatǝranngug Yesu amaa, “Mbats, tapamnabi karanta dǝgiti ɓaga nǝ Dauda sartakwa mbakǝn waiy ard tsaghwahaan dlaɓa maay dǝgzǝg vakatǝr biya?
    26: Ma zamani ndza Abiyatar nǝ maal ba tinngtimng ma zhiila kǝsuufaha, kaa daas kǝ Dauda damma Vǝgya Daadamazhigǝla, zuu kǝ bruudi kwa favaan ba kǝngǝɗa, hǝyu kǝ zǝgaan aandzu wara, bamma zhiila kǝsuufaha. Dlaɓa vǝltǝr baz tsaghwaha dagalaana”
    27: Aiyam nǝ Yesu taa kǝ iitǝra, “Ɓagava kwakyarvad dǝ uud nǝ faciya ngiiga, ndǝrava bi nǝ uud kwakyarvad faciya ngiig biya.
    28: Aɗabad kwaha, Zǝra Uuda, iin Yaazhigǝl baz dǝga faciya ngiiga.”
  3:
    1: Gwiya dagha ba nǝ Yesu damma guda dzahava. Vaakwahiina ndza mǝng nǝ uuda nǝ iin ǝmtsaǝmtsan dǝv palla.
    2: Ma uudahi ndzar vaakwahiina, kyalmahaatǝra ndzarandzǝg ba ɗewwa ar zhargaan mbatak da mbǝgaan kǝ uuda nǝ iin daghuvala faciya ngiiga, kiyava tlǝkǝtlǝg kǝ iitǝr dǝ haipa.
    3: Am Yesu taa kǝ daddakwa ǝmtsaǝmtsan dǝvaana, “Assagal ghacaghacig tǝvuukw vaakwana.”
    4: Kaa ndavtǝru ndavǝg kǝ Yesu amaa, “Haiyakiyamanthaig nǝ adzahadzaha Muus kǝ ɓa dǝgit maraw davala ngiig nii ɓagvǝna kǝladǝrhi? Ngǝdlǝvǝna shifǝgnii tsǝvanhi?” Maay wa mbǝɗghant ghaiyan biya.
    5: Kaa vaztǝrvazǝg kǝ Yesu ba da palla pal dǝ badzǝga rǝviɗmahuda, kaa hǝrsa rǝviɗ kǝ iin mbakyarvad dǝgdǝgka ǝrviɗ mahuɗaatǝra. Aiyama taa kǝ daddakwa ǝmtsaǝmtsa dǝvna, “Vǝllǝg kǝ dǝvagha.” Kaa vǝlgaan kǝ iina, kaa mbǝgambǝg kǝ dǝvaan ba fakya.
    6: Kaa ba dagal kǝ Farisiyaha da ɓa dabari ǝmtaɗ dǝ uudaha Hirudus kǝ ɗuuli ar da tsǝg nǝ iitǝr kǝ Yesu.
    7: Kaa ciya dagal kǝ Yesu ar dǝ mbǝrzahaan ma kǝsiina, da tǝ ghaiya dǝlva Galili ba davaatǝra, dlaba kaa gatǝgaan kǝ uudah ba ɗyaka vaivaiya ma haaya Galili,
    8: ma kǝsa Wurshalima, ma Idumiya, ar dǝ lii kilga zaagha Judan, ar dǝ uudaha Taya ar dǝ Sidun. Aɗaba cinngaracinng kǝ dǝgitahi ɓag nǝ iina.
    9: Mbakyarvad ɗyakǝra uudaha, kaa tagtǝrtag nǝ Yesu kǝ mbǝrzahaana, aa sarardǝvsǝg kǝ perayu kwa ngyikwaha, haik kǝ tlagaan kǝ iitǝra.
    10: Mbakyarvad mbǝghanambǝg kǝ uudah ba ɗyaka, baɗǝm lii dǝ kuzaha ar tlagakǝva kiyava tapǝgaana.
    11: Baɗǝm sarti ar nǝghǝga shǝɗǝkw ghwaɗaha, ar nǝghaghǝr ba kǝ mbǝɗǝg tǝvuukwana ar huulǝg ar taakiya, “Agha Zǝra Daadamazhigǝla.”
    12: Kaa ɓǝltǝraɓǝlǝg kǝ iin kǝ magi ba vaivai kǝ shǝɗǝkw ghwaɗah taakiya, aa tagararbi kǝ uudah man war nai biya.
    13: Tǝhala kwaha, kaa dagat kǝ Yesu damma aghwa, ɗahant kǝ lii naag nǝ iina, kaa da vakaan kǝ iitǝra.
    14: Kaa dzǝrgaaka dzǝrǝg kǝ iin kǝ kǝlawa tar bu ma taatakatǝra (kwa ɗaatǝr nǝ iin dǝ Zǝrɓǝlgahaana). Aɗaba kiyava ndzǝgaan kǝ iitǝr ǝmtaɗ dǝ iina dlaɓa ɓǝltǝrǝt da taa ǝlbǝg marawa.
    15: Da vǝltǝr dlaɓ kǝ ndzǝɗa lagwa shǝɗǝkw ghwaɗaha.
    16: Wan kǝlawatar buna dzǝrghaaka nǝ iina. Siman, (kwa fǝgharva Yesu kǝ ɗaag Bitrus)
    17: Yakubu zǝra Zabadi ar dǝ zǝrababaan Yuhwana, (kwa fatǝrva nǝ iin kǝ ɗaag Buwarnajis, zarha karazhigǝla)
    18: Andrawus, Filigus, Bartilumi, Matiyu, Tuma, Yakub zǝra Halfa, Tadiyus, Siman, kwa naagaan kǝ zaa vuukwa kǝssaana,
    19: Yahuda Iskariyuti, kwa vǝlǝt Yesu.
    20: Tǝhala kwaha kaa daas kǝ Yesu da hǝnnyaha, kaa gwiya dzahav dlaɓ kǝ uudaha baz za kaf pǝletǝrvaapilǝg kǝ Yesu ar dǝ mbǝrzahaana.
    21: Cinngara ba nǝ yaatǝr ndǝkwana, kaa dagau kǝ iitǝr da saa dǝ vakaiya, aɗaba yaatǝr ar taaki, “Nalnǝg kǝ valaaga.”
    22: Am nǝ lii tsaga adzahadzaha Muusi saral ma Wurshalima, “Mǝng Baˈalzabul, Maala Shatanah ma vǝghaana. Tlakǝna vakaan kǝ ndzǝɗa lagwa shǝɗkw ghwaɗaha.”
    23: Kaa ɗahtǝrantɗahǝg Yesu kǝ uudahiin, kaa tagtǝr kǝ ǝlbǝg dǝ garav taakiya, “Lagwalagw Shatanah kǝ zǝraabaan Shatanaha?”
    24: Abi, ma tagwavǝmtagw nǝ kwarǝg hutsǝg buwa, kwan kǝ kwarǝga ghaciga biya.
    25: Band kwah dlaɓa, ma tagwavǝmtagw hǝnnyah hutsǝg buwa, kwan kǝ hǝnnyaha ghacig biya.
    26: Dlaɓa akwama cigharantciig shatanah kǝ ghǝraana tagwvǝm hutsǝg buwa, ghacig biya. Sǝghaasǝgga halavuwan.
    27: Maay wa dzugwantdzugw kǝ daas damma vǝgya dadda ndzǝɗ hutsarva kǝ kadlangahaan biya, bamma viyit kǝ uudanǝn nguɗǝnan, Lakuti hutsǝgarvahutsǝg kǝ kadlangaha vǝgyaana.
    28: “Ən tagkurtag kǝ jiira, da ɓǝshǝvtǝrnaɓǝshǝg aandzu hulfa kwar kǝ haipahi ɓagara nǝ uudaha, ar dǝ ǝlbǝga nenegahi ɓagarara nǝ iitǝr kǝ Daadamazhigǝla.
    29: Ai ciya, baɗǝm dadda kwa tagǝda ǝlbǝga nenǝg tǝ Shǝɗǝkw Daadamazhigǝla, da ɓǝshvarnaabi ba tangw damma zǝrazǝra biya. Ɓagaaɓag kǝ haipi kwada ɓǝshvarnaabi ba tangw damma zǝrazǝr biya.”
    30: Tagaatag Yesu kwan mbakyarvad ar taakiya, “Dǝ shǝɗkw ghwaɗ nǝ iina.”
    31: Kaa sagau kǝ babba Yesu ar dǝ zarha babbaan. Ar ghacan gyimala ar ɓǝlant kǝ uud da ɗaagaana.
    32: Ndza mǝng nǝ uudah ba ɗyaka ar cahwargan faɗagaan tǝghǝr kǝ iina, am nǝ uuda nǝ iin taa kǝ iina, “Wai baabagh ard zarha baabagh ar ghacǝga gyimala ar naa nǝgha kǝgha.”
    33: Kaa ndavgaru ndavǝg kǝ Yesu taakiya, “War baabara, ard zarha baabarni?”
    34: Kaa vaztǝrvazǝg kǝ iin kǝ lii cahwarga tǝvǝgh kǝ iina, aiyama, “Wan nǝ baabara ard zaraabahara.
    35: Ba ɗǝm daddakwa ɓa dǝgiti naag Daadamazhigǝla, iin zǝraabara, iin nǝ dǝghwa baabara, iin dlaɓ baabara.”
  4:
    1: Kaa gwiya tsagaan kǝ Yesu dlaɓ tǝ ghaiya dǝlva Galili. Uudahi faɗarvǝt da tǝghǝr kǝ iina ndzar ba ɗyaka, aɗabad kwaha, iin wa fǝghara daas kǝ iin damma pɛrrayiu cihuran ma vakaiya. Dzahava uudaha ar ghacigan tǝ ghaiya gardza zaagha.
    2: Kaa tsagtǝrtsag kǝ iin kǝ dǝgitah baɗyak tǝdvad garava. Amaa taa kǝ iitǝra,
    3: “Cinngamcinnga, dadda uusǝg dal da riig ma guhaana.
    4: Riig nǝ iina, kaa ɓalgalɓalǝg kyalma hulf da tǝ ɗuula, kaa sagau kǝ ɗiikah ar caggu.
    5: Kyalma hulfah ɓalal dat caccahǝlawa vakavaki maay haay ɗyak biya. Kaa laghǝra sagal kǝ iitǝr ba watswatsa aɗaba maay haay ɗyak vaakwahiin biya
    6: Ghut ba faciya, kaa fuugalfuug kǝ hǝiy ghulala, aɗaba badi bi kǝ tlali biya.
    7: Kyalǝm ɓalal damma takka, kaa ghubargaraa ghubarg kǝ takka kaa zǝgǝtzǝg kǝ takka tsarva kǝ ya zǝra.
    8: Kyalǝm ɓalal dat haay marawa. Kaa laghǝra sagala kǝ iitǝr ar ghubaran ba marawa, kyalǝmaan yaa zǝr kulhǝkǝrɗ-kulhǝkǝrɗ, kwatlǝrǝn kul ǝngkwah ǝngkwaha, kyalǝm dlaɓa zǝr dǝrmǝk-dǝrmǝka.”
    9: Tǝhala kwaha amaa, “Baɗǝm dadda kwad dǝ hyimya cinngaana aa cinnga.”
    10: Ma sarta kwandza cǝhurgan nǝ Yesu ba daghwvǝna, kaa ghalgaan kǝ mbǝrzahaan kǝlawa tar buwa ard lii gatǝgaan maa tagtǝr kǝ dǝgiti tuuk vakai garavǝna.
    11: Aiyama taa kǝ iitǝra, “Hayakuranthaig nǝ uud am sǝra kǝ dǝgiti shǝɓashǝɓan tǝghǝr kǝ tlǝkǝssǝra Daadamazhigǝla. Lii maay makuram biya, aandzu kwar kǝ dǝgita taggǝvtǝr bad garava.
    12: Iin wa nǝ iina, “‘Aandzu ar ba vazǝgaana, ar nǝghǝga biya. Aandzu ar cinngaana, ar nǝghǝgaaka biya. Aɗaba haik kǝ nǝghǝgaakanǝghǝg kǝ iitǝra, ar pǝla kǝ ghǝra ɓǝshivtǝrnana.’”
    13: Aiyam Yesu taa kǝ iitǝra, “Mbats nǝghamakai kǝ garavǝn biya? Am da nǝghǝgaaka ndar kaci kǝ kyalǝmani?
    14: Dadda riigna, ǝlbǝga Daadamazhigǝl wa riig nǝ iina.
    15: Hulfǝn ɓalal da tǝ ɗuulǝna, iitǝr garava lii cinngaracinng kǝ ǝlbǝga Daadamazhigǝla. Cinngara ba nǝ iitǝra, kaa sagau kǝ Shatanah hutsdan kǝ ǝlbǝgǝn riiyava ma rǝviɗ ma huɗaatǝrna.
    16: Band kwah dlaɓ hulfǝn ɓalal dat caccahǝlawǝna, iin garava lii bad cinngacinngaatǝr kǝ ǝlbǝgǝna, kaa dlǝghgadlǝgh kǝ iitǝr bad ǝrviɗ ma huɗ palla.
    17: Aɗaba ar maay tsau dǝ tlali biya, zǝlarmai vaivai biya. Akwama ciyitciig dlaɗ mbakyarvad ǝlbǝga Daadamazhigǝla, bat watswatsǝr kaa gwiya damma haal kǝ iitǝra
    18: Hulfi ɓalal damma takka, iin garava uudahi cinngaracinng kǝ ǝlbǝgiina.
    19: Bakǝva kwaha kǝmma dǝga duniya, ard naa hyahha, ard kǝmma kyalǝma dǝgitaha, dagha damma ǝrviɗ ma huɗɗaatǝr tsatǝrvatsǝg kǝ ghubarg ba kwal yiiga kǝ zǝra.
    20: Hulfǝn ɓalal da tǝ haay marawna, iin garava lii cinngaracinng kǝ ǝlbǝga Daadamazhigǝla, ar dlǝghan, kaa ɓagaan iitǝr kǝ tlǝr dǝ vakaiya, kaa tlǝknatlǝg kǝ iitǝr kǝ yu tuuk vakaiya kyalǝm kul hǝkǝrɗ-kul hǝkǝrɗ, kwatlǝrǝn kul ǝngkwah ǝngkwaha, kyalǝm dlaɓa zǝr dǝrmǝk-dǝrmǝka.”
    21: Am Yesu taa kǝ iitǝra, “Am sagau dǝ kaara jahuramb am humbara kǝ taas nii? Nii am fǝg mazha ngyil kǝ piin hii? Abi am hǝrtǝg tǝ dǝga hǝrtǝggaan nǝ uuram kǝ kaara jahuramb?
    22: Maay dǝgiti shǝɓashǝɓan kwa da sǝrvaaka biya. Dlaɓa maay nǝ dǝga gǝlgǝli kwada maay sagal dat ɓalaɓal biya.
    23: Baɗǝm dadda kwad dǝ hyǝmmiya cinngaana, aa cinngacinnga.”
    24: Amaa taa kǝ iitǝr dlaɓa, “Cinngamcinng ba maraw dǝgiya” “Darami agha kurǝg nǝng dǝ vakaiya, da kurak dǝ vakai nǝ uuda, da fǝkarna nǝ uuda.
    25: Baɗǝm dadda kwa dǝ dǝgita, fǝvarnaafǝga, kwa maay nǝ dǝgaan biya, aandzu hǝɗikǝnǝn vakaana da kǝsvarǝvkǝsǝga.”
    26: Kaa za vuukw kǝ Yesu taakiya, “Band kwan nǝ ndzǝgana tlǝkǝsǝra Daadamazhigǝla. Band uudi riiya hulf ma guhaana.
    27: Tǝhala hǝngngaha, kaa fǝtsǝgalfǝtsǝg kǝ hulfǝn ghubarana, sǝrghai nǝ uuda nǝ iin kǝ dǝgiti ɓagavanǝn biya.
    28: Haay sagal dǝ dǝgwaiya bad ghǝraana, ba zǝngwa ɓagga kǝ ghuuva, kaa ɓa ghǝra, tǝhala kwah kaa dǝg kǝ zǝr tǝ vakaiya
    29: Ma tǝhaltǝhǝg nǝ dǝgwaiya, kaa kǝssant kǝ iin kǝ hǝvva kiyava ghudgaana, aɗaba ɓagaaɓag sarta ghudgaana.”
    30: Kaa gwiya tagaan kǝ Yesu taakiya, “Kiyam da kurǝg dau kǝ tlǝkǝssǝra Daadamazhigǝli? Nii kiyam da gǝrǝg dǝ kwar kǝ garav kǝ ndzǝganani?
    31: Da band dzakǝva hulfa zǝra mastad kwa iin wa mishshish ma hulfaha baɗǝm kwa riiyav damma haaya.
    32: Bakǝva kwaha, akwama riyavariiga, ghwubarg juujig kǝ kyalǝma uufahi ma ɗyaghaara guha, dǝvahaan ɓa ba maandala, baz ɗiikah ar tsug ma shǝɗkwaana.”
    33: Tagatǝr dǝ garav nǝ Yesu kǝ ǝlbǝga Daadamazhigǝla ba ɗyak, kalkal dǝ ghaala nǝghǝgaakanǝghǝgaatǝra
    34: Maay nǝ dǝgiti tagatǝra nǝ iin kwal garav biya. Sarti ar ǝmtaɗ dǝ mbǝrzahaan ba davaatǝra, tagtǝr ba tǝ ɓalaɓal kǝ dǝgitaha.
    35: Ba daghuvalaa nǝ iina, hǝrzǝt ba faci kǝ ɓǝla daaya, am Yesu taa kǝ mbǝzahaana, “Jiyam da tǝ kwah kǝ ghyabba yuwa haiya”
    36: Kaa ɗugarsɗuug kǝ iitǝr kǝ dzahava uudaha, kaa dagal kǝ iitǝr ma pɛrrayiwiin band ndzǝganaani ndza ma vakai nǝ iina. Mǝng dlaɓ kyalma pɛrra yuwah ǝmtaɗ dǝ iitǝra.
    37: Kaa cigǝtciig kǝ kalangasa, fǝgharaafǝg baz yu ciya damma zhigǝla, dlaɓa kaa tsǝgaan kǝ iin kǝ pɛrra yuwa, kaa ghubǝɗa saas kǝ yu samma vakaiya hǝrz pɛrra yuwǝn kǝ righǝgga.
    38: Ndza hǝnna haar nǝ Yesu ma hala pɛra yuwa, ɓǝla kǝ ghǝraan tǝ dǝga ɓǝla ghǝra. Ar ciyant mbǝrzahaana, am nǝ iitǝra, “Dadda tsaga dǝgita, wa kiyam ruuga, kats maay lambagh biya?”
    39: Kaa ciig kǝ Yesu cagara kǝ gyi kǝ fǝɗa, amaa taa kǝ yuwa haiyina, “Ɗew amǝnga! Ndzandzǝgga!” Kaa ghacigaghacig kǝ fǝɗa, baɗǝm vaka ndzaandzǝg ba ɗewwa.
    40: Amaa taa kǝ mbǝzahaana, “Aujilbǝg kǝskuram gǝdzǝg ndǝkwani? Gwastǝn am maay dǝ fadghǝr biya?”
    41: Kaa gǝdzǝgǝtdzǝg kǝ iitǝr ba vaivaiya, am nǝ iitǝr taa kǝ ghǝrahaatǝra, “War wan kǝ uudi? Baz fǝɗa ar dǝ yu ndakwani ar cinngarnucinngi?”
  5:
    1: Dzǝvaradzǝvǝg Yesu ard mbǝzahaan kǝ yuwa haiya kwa ma larda Garisinaha
    2: Bad tsugwa Yesu wah sagal ma pɛrra yuwa, kaa sagau nǝ uuda nǝ iin kwad dǝ shǝɗkwa shatanah ma gǝtlah da vakaana.
    3: Kwanǝn kǝ uuda hǝnna bamma gǝtlaha. Maay wa ngwaɗnangwaɗǝg aandzu da tsavitsavi biya.
    4: Aɗaba wura ndza ɗiyav nǝ atsaviyatsavi tǝ dǝvahaan ard shǝgahaan ba ngadlǝgaana. Maaydla wa dǝ ndzǝɗɗa gwiya ngwaɗɗǝgaan biya.
    5: Ba kǝlla hǝng baz faci baz avǝɗ gwayav ma gǝtlaha, baz ma aghwa tsaha huulǝgga harra vǝghaan dǝ akura.
    6: Kǝsgharu ba nǝ iin kǝ gyi kǝ Yesu saas vaka bitkya, kaa ǝmndǝra dagau kǝ iin kǝlla kǝ ghwunj tǝvukwaana.
    7: Kaa huulǝg kǝ iin bad halavuwa ndzǝɗaana amaa, “Au lambagh dǝ kai, Yesu Zǝra Daadamazhigǝl kwa jujig dǝ ndangǝri? Ən ghala kǝgh ma ɗaaga Daadamazhigǝl, vǝlwabi kǝ dlaɗ biya.”
    8: Taggaa mbakyarvad tagghartag Yesu taakiya, “Ɗuwarsɗuug kǝ uudanǝn, kǝgh shǝɗǝkwa shatanahna!”
    9: Kaa ndavgarundavǝg Yesu taakiya, “War ɗaagaghi?” Kaa ngwangug kǝ iina amaa, “Ɗaagara baɗyaka, aɗaba kǝm baɗyaka.”
    10: Kaa ba ghala Yesu kǝ iin baɗyakɗyak haik kǝ lagwtǝrlagw dagal ma lardiina.
    11: Hǝrz dǝ kwahiin kǝ vakavaka mǝng maandala giɗɗya ghavzah piig tǝ kungula aghwiina
    12: Kaa ghala Yesu kǝ shǝɗkwa shatanahǝn taakiya, “Ɗukǝmndǝsɗuug magha ɓǝlkǝmndǝs daadama ghavzahaana.”
    13: Haiyatǝranthaig nǝ Yesu. Kaa ba sagal kǝ shǝɗukwa shatanahǝn ar dǝm ma ghavzahaan. Mǝng damma alfu bu nǝ ghavzah ma gyiɗɗǝna, kaa ǝmdǝra daay kǝ iitǝr damma yuwa haiy ar ruwana.
    14: Nǝgharaba lii piya ghavzahaan kǝ dǝgiti dzǝghardzǝgǝna, kaa ǝmdǝra daas kǝ iitǝr da kutǝgaan ma kǝssahaatǝra ard gǝdzǝr kǝssaha. Kaa ba sagau kǝ uudah sa vazza dǝginǝn dzǝghardzǝgǝna.
    15: Saragha ba nǝ iitǝr da vak Yesu, kaa nǝghganǝghǝg kǝ iitǝr kǝ uudanǝn kwa ndza cǝɓǝg shǝɗkwa shatanahǝn, cǝhurgan tsagwatsagwan ma sǝɗav sǝghaasǝg samma hǝnkalaan balapiya, kaa gǝdzǝgǝtgǝdzǝg kǝ iitǝra
    16: Uudahi dzǝghaar vakatǝr wanǝnna, kaa ba kutǝgaan kǝ iitǝr kǝ dǝgiti dzǝghaar dǝ daddakwa cǝɓǝg shǝɗkwa shatanaha ar dǝ ghavzaahaana.
    17: Kaa fǝgarzhafǝg kǝ uudah kǝ ghala Yesu maa ɗuwars kǝ haayatǝra.
    18: Tǝ ghǝrdǝga daas Yesu damma pɛrayuwa, kaa ghalgaan kǝ daddakwa ndza tsǝg shǝɗkwa shatanahǝn maa hayarant maa dagal ǝmtaɗ dǝ iina.
    19: Haigharant bi Yesu biya. Amaa taa kǝ iina, “Dǝg daa da hǝnyah vak zaraabahagha, agha tagtǝr kǝ ɗyakǝra dǝgitahi ɓagaka Yaazhigǝla, baz ɗuuli zhuwakadaala nǝ iina.”
    20: Kaa daas kǝ uudanǝn, farzha kǝ kutǝgaan kǝ dǝginǝn dzǝghardzǝg ma larda Kǝsah Kǝlaw tǝghǝr kǝ dǝgitahaan ɗyakɗyakahaan ɓaghara Yesu. Baɗǝm nǝ uudah kaa ɓa jappǝra.
    21: Gwiya dzǝva ba Yesu da tǝ kwah kǝ ghyaba yuwa hai ma pɛrayiwa, kaa dzahav kǝ uudah baɗyak da vakaana. Bamma sartǝn ndza ba tǝghaiya yuwa haiy nǝ iina.
    22: Kaa dagau kǝ pal ma maalah tǝghǝr kǝ guda dzugwazhigǝla kwa ɗahav dǝ Yayirus. Nǝggha ba nǝ iin kǝ Yesu, kaa mbǝɗǝgambǝɗǝg kǝ iin tǝvuukwana.
    23: Kaa ghalgaan kǝ iin ba vaivai, taakiya, “Zǝr dǝghwar tǝgherdǝga ǝmtsǝga. Ən ghala kǝgh magha dagau agha tapnan maa mban ndzan dǝ shifǝga.”
    24: Kaa ba dagau kǝ Yesu ǝmtaɗ dǝ iina. Kaa gatgarsgatǝg kǝ uudah baɗyak ar jagwaana.
    25: Ndza mǝng nǝ uus vaakwahiin viigaan kǝlaw tar buwa ba kǝla vǝzza.
    26: Hǝɓuhǝbǝg kǝ dlaɗ ba vaivai mazha dǝva lii ɓa kǝrgun ba ɗyaka baz kwaɓaan tsatsǝg baɗǝmma. Dlakulva ɓa ngulma, gwiya mbǝrǝg bad mbǝrǝgga.
    27: Ndza cinnghacinng kǝ ǝlbǝg tǝghǝr kǝ Yesu, mbakyarvad kwaha, kaa daas kǝ iin damma uudah kyilgaana, tapnan kǝ sǝɗavaana,
    28: dzamgaan ma irǝviɗmahuɗaan taakiya, “Aandzu ba sǝɗavaan wan tapna naiya ǝn mbǝga.”
    29: Ba tǝvakaitǝvakai, kaa ghacigaghacig kǝ avǝziin kǝlgiina, dlaɓa cinnghacinng ma vǝghaan taakiya mbavnambǝga.
    30: Ma kwahiin kǝ sarta kaa nǝghǝgaakaa-nǝghǝg kǝ Yesu taakiya mǝng ndzǝɗ aa dǝgal ma vǝghaan, kaa gwivǝtgwiig kǝ iin, amaa, “Warwa tapa sǝɗavari?”
    31: Am mbǝrzahaan taa kǝ iina, “Awɗa! Agha nǝghǝganǝghǝg kǝ kirfkirf uudah ndǝkwantsǝm, ‘Warwa tapaktapǝg amǝnga?’”
    32: Kaa ɓalla gyi kǝ Yesu vazza daddakwa ɓa kwanǝna.
    33: Nǝghaakanǝghǝg nǝ uusǝn kǝ dǝgiti ɓagavaran tsauwa, kaa saas kǝ iin da tǝvuukwa Yesu ma dladlawur dlaɓa vǝghaan tǝgga, mbǝɗa kǝ iin tǝvuukwanna, tagar kǝ iin kǝ jiiraan baɗǝmma.
    34: Aiyama taa kǝ iina, “Dǝghwara, fadghǝragha mbakambǝga. Dǝg ma gabǝrǝrra, mbǝghambǝg tuuk kǝ kuzagha.”
    35: Ba ndzǝgaan Yesu ba taaghai, kaa am nǝ uudahi saral ma vǝgya Yayirus, am nǝ iitǝra, “Abi, ǝmtsaaǝmtsǝg nǝ dǝghwiina, gwiya gargyabi kǝ dadda tsagadǝgit biya.”
    36: Fabi nǝ Yesu kǝ taaɗ tǝ dǝgiti taggar nǝiitǝr biya, amaa kǝ maal tǝghǝr kǝ guda dzǝgwazhigǝlna, “Gǝdz biya, fǝdghǝrǝtfǝga.”
    37: Tsatǝrvatsǝg kǝ gatǝgaan kǝ kyalma uudaha ba Bitrusa, Yakuba ar dǝ Yuhwan zǝrababba Yakuba.
    38: Daragha ba nǝ iitǝr da ma vǝgya Yayirus, kaa nǝghǝganǝghǝg nǝ Yesu kǝ uudah uushit uushig ghǝratǝr ar tuuga ar huulǝga.
    39: Dagha ba nǝ iin damma hǝnnyahiina, amaa taa kǝ iitǝra, “Aujilbǝg kǝ sǝkuram am tuug am huulǝg ndǝkwana? Abi, hǝnna haar dǝghwiina au mtsamtsǝga?”
    40: Kaa ɓagar ghwuɓasga neneg kǝ iitǝra. Tǝhalakwaha laguda kǝ iin kǝ uudah da gimala, ɗahant kǝ iin kǝ dadda dǝghwiina, ar dǝ babbaana ar dǝ mbǝrzahaani mtaɗ dǝ iina, ngal daas kǝ iin da vakavaki dǝ dǝghwiina.
    41: Viyit kǝ iin kǝ dǝva dǝghwna, amaa taa kǝiina, “Talita kumi,” Iin taakiya “Zǝr dǝghwa, ciiga.”
    42: Ba tǝ watsǝra kaa ciig kǝ dǝghwǝn kaa dagala. Viiga dǝghwna kǝlawa tar buwa. Kwan fatǝraafǝg kǝ ɓa jappǝr ba vaivaiya.
    43: Kaa ɓǝltǝrɓǝlǝg Yesu kǝ maggi taakiya aa cinngabi nǝ uudah kǝ dǝginǝn aa dzǝgardzǝgǝn biya, tagtǝr dlaɓ taakiya aa vǝlaralvǝlg kaffa.
  6:
    1: Ɗughars ba Yesu kǝ vakava kǝ iin kaa gwiya daas kǝ iin damma kǝsaana, kaa daas kǝ iin ǝmtaɗ dǝ mbǝrzahaana.
    2: Ɓagaa ba sarta ngiiga Yahudaha, kaa farzha kǝ iin kǝ tsagar dǝgit kǝ uudah ma guda dzǝgwazhigǝla. Baɗyak lii cinngaracinnga, ar ɓa jappǝra taakiya, “Tlakǝna mǝr nǝ uudanǝn kwanahaani? Hulfa kwar kǝ sǝrgasǝrgǝr wa vǝlavarvǝlǝg baz dǝga jappǝr ndakwi ɓaagaani?”
    3: “Abi kafintǝn wanǝn? Zǝra Maryam, zǝrabaz Yakub, ard Isuvuu, Yahuda ar dǝ Siman biya? Abi yigahaan ngwasah wan ǝmtaɗ dǝ kǝmyamǝn?” Kaa za vǝgha dǝ iin kǝ iitǝra.
    4: Aiyam Yesu taa kǝ iitǝra, “Aandzu ba war fǝgaarafǝg kǝ tlayang, maay ba nǝ uudaha kǝsaan ard zaraabahaan ard lii vǝgyaan biya.”
    5: Ɓagaabi Yesu kǝ dǝga jappǝr vaakwahiin biya, mbǝghana ba uudah hǝɗikǝn tǝdvad fǝtǝra dǝva.
    6: Kaa ɓa jappǝr kǝ iin tǝdvad maayrǝrra fadghǝghǝratǝra. Kaa gwaivagwaig kǝ Yesu ma kyalma gǝdzǝr kǝssah tsagtǝr dǝgita.
    7: Kaa ba ɗahtǝrǝtɗahǝg kǝ iin kǝ kǝlawa tar buna, ɓǝltǝrǝt kǝiin bu-buwa, vǝltǝr dlaɓ kǝ ndzǝɗ tǝghǝr kǝ shiɗkwa shatanaha.
    8: Ɓǝltǝra kǝ maggi taakiya, “Kǝsam bi kǝ dǝgit kwakyarvad dagalaru biya, aandzu dǝgzǝga, ma jilada, bi kwaɓ ma mbǝlaharu biya, ba zad kalti wam kǝssǝg nǝ uurama.
    9: Famfǝg ba kǝ kimbaka, kǝsambi kǝ kwatlǝrn kǝ sǝɗav biya aandzǝg ba wa tǝ vǝgharuwa.
    10: Baɗǝm hǝnyahi am dǝgaa nǝ uurama, am ndza vaakwah tangw damma sarti am da ɗuug nǝuuram kǝ kǝssiina
    11: Baɗǝm vakavaki dlǝghakura bi nǝ uud biya, mam da ciiga am pangda kǝ alagwat tǝ shigahaaru kiyava nǝg kǝ shidaharuwa.”
    12: Kaa ciya dagal kǝ iitǝr, ar tagtǝr ǝlbǝga Daadamazhigǝla kǝ uudah taakiya aa pǝlarpǝlg kǝ ghǝra.
    13: Lagwardalagw kǝ shiɗkwa shatanah baɗyaka, ar mastǝra kǝ wal kǝ lii yangbi baɗyaka, dlaɓa ar mbahtǝrana.
    14: Kaa cinngacinng kǝ tlǝkkǝs Hirudus kǝ ǝlbǝg tǝghǝr kǝ Yesu, aɗaba cinngalcinng nǝ ɗaagaan aandzu takwara. Baz tagaan kǝ kyalǝma uudah taakiya, “Yuhwan dadda tsufǝg wa ciyavant ma gǝtlaha, iin wa nǝ iin dǝ ndzǝɗa ɓaa dǝgaha jappǝr nǝ iin ǝnd kwana.”
    15: Aiyam kyalma uudaha, “Tlayang Iliya.” Am kyalma, “maaya, kwatlǝrn kǝ tlayang shah, ma tlayangahi ndza wura.”
    16: Cinngha ba nǝ Hirudus kǝ ǝlbǝgna, aiyama, “Abi, Yuhwan, kwa ghudananai kǝ ghǝr tǝ vakai wa ciyavant ma gǝtlaha!”
    17: Aɗaba wura ndza Hirudus ba dǝ ghǝraan wa taga taakiya aa viivǝtviig Yuhwan nguɗvǝnan ma guda bǝrfina. Ɓagaaɓag Hirudus ndǝkwan mbakyarvad Hirudiya, uusa zǝraabaan Filigus, kwa kǝsuu Hirudus.
    18: Aɗaba ndza taghartag Yuhwan kǝ Hirudus taakiya, “Kalkalaan bi kǝssa uusa zǝrabaabagh biya.”
    19: Mbats, Hirudiya hǝkyaghanahǝkyag kǝ Yuhwan ma ǝrviɗmahuudaana, nahanahǝg maa tsǝvaan, bakǝva kwaha tlakǝna bi kǝ ɗuuli biya,
    20: aɗaba Hirudus gǝdzgaan kǝ Yuhwaana. Sǝrgasǝrg nǝ iin taakiya uuda jiirjiir nǝ iina, dlaɓa ba cuwaɗaɗɗa, iin wa fǝghara kǝ Hirudus kǝ hǝkya Yuhwan ba marawwa. Ba cukw sarti taag Yuhwan kǝ ghaiya dǝ vakaiya, mbǝkǝnmbǝg ma ǝrviɗmahuɗaana, bakǝva vakwaha cinngaan kǝ ǝmtakǝra ǝlbǝgaana.
    21: Tǝhalakwaha kaa tlǝkkǝnatlǝg kǝ uusiin kǝ ɗuula, daavala ɓa kwaanda Hirudus, kwa dzahghant nǝ iin kǝ ajanaha ar dǝ tlǝksaha ghwavahaana, ar dǝ uudahi maamaalah ma Galili kwakyarvad hwaɗaga kwandaana.
    22: Dal ba nǝ dǝghwa Hirudiya da shakalǝg tǝvuukwa Hirudus ar dǝ ghulabahaana, cinngaracinng kǝ mtakǝr ba vaivaiya. Aiyama, “Au wagha naagnǝngi? Baɗǝm dǝgiti aa ghalga nǝng ǝn vǝlakvǝlǝga”.
    23: Baz zangwaɗǝga, am tlǝkǝssa taa kǝ dǝghwna, “Baɗǝm dǝgiti aa ghalga nǝng ǝn vǝlakvǝlǝga, aandzu kyalma tlǝkǝssǝrara.”
    24: Kaa dagal kǝ dǝghwǝn tagar kǝ babbaan, “Awanda ghalg naayi?” Aiyam babbaana, “Ghǝra Yuhwan dadda tsuufǝgga.”
    25: Ba tǝ watsǝr kaa ǝmndǝra da vak tlǝkǝs kǝ iin amaa, “Ən naagan banda kwan ndakwan aa vǝlwavǝlǝg nǝ uud kǝ ghǝra Yuhwan dadda tsuufǝg tǝ pǝlaiya.”
    26: Cinngha ba nǝ iin kwana, kaa njikǝnjiig ba vaivaiya, amaa mbakyarvad ngwaɗǝgi zuu nǝ iina, ar dǝ ghwulabahaana, naabi kǝ pigardapiig biya.
    27: Kaa bǝlgantɓǝlǝg kǝ iin kǝ kapupuwaan taakiya aa sǝvardaasǝg ghǝra Yuhwan. Kaa dagau kǝ iin damma guda bǝrfin ghwudda kǝ ghǝra Yuhwana.
    28: Sǝdaa kǝiin tǝ pǝlaiya, vǝlar kǝ dǝghwiina, dǝghwǝn dlaɓa vǝlar kǝ babbaana.
    29: Cinngaraba mbǝrzaha Yuhwana, kaa dagau kǝ iitǝr ar kǝsant kǝ tluwaana, ar hǝɗnana.
    30: Gwiyaragwiig dlakulva gyiya Yesu kwa ɓǝlatǝrǝt nǝ iinǝn saasa vakaana, ar tagar kǝ dǝgitahi ɓagara nǝ iitǝr baɗǝmma, ar dǝ dǝgiti tsagaar nǝ iitǝra.
    31: Aɗaba uudah baɗyaka ba kwan daasa kwan sagala, bandva kaffa tlarkǝnai zǝrɓǝlgahaan kǝ ɗuula zǝgaan biya, aiyama taa kǝ iitǝra, “Jiyam dagal da vakavaki maay aandzu ndǝwar biya, am ɗiida kuɗǝg hǝɗikǝna.”
    32: Kaa dǝgǝdmǝg kǝ iitǝr damma pɛrrayiwa ar dal da vakavaki maay aandzu ndǝwarbi ba iitǝr davaatǝra.
    33: Nǝghara ba nǝ uudah baɗyak kǝ ciya dagalatǝra, dlaɓa nǝghartǝraakanǝghǝga. Kaa ǝmndǝra dagal kǝ iitǝr ba dǝ shǝg sagal ma kǝsah baɗǝmma, kaa tsugwatsug kǝ iitǝr lakuti sagau kǝ iitǝra.
    34: Tsugwa ba nǝ Yesu kaa nǝghǝganǝghǝg kǝ uudah faɗǝgaan ba baɗyaka, zhutǝrdaala kǝ iina, Aɗaba ar band tuughah kwal dadda piiga. Kaa tsagtǝrtsag kǝ iin kǝ dǝgitah baɗyaka.
    35: Hǝrz faci ɓǝladaya kaa sagau kǝ mbǝrzahaan da vakaana, am nǝ iitǝr taa kǝ iina, “Vaakwana maay ndǝwar biya. Faci dlaɓa hǝrz ɓǝladayaana.
    36: Ɓǝlarsɓǝlǝg kǝ uudah maraa dal damma gǝdzǝrkǝssaha ar dǝ kǝssahaan mbɛvmbɛvǝn, maraa sagwa kǝ dǝgitahi da zǝ nǝ iitǝr.”
    37: Ngwatǝrangwug Yesu amaa, “Vǝlamtǝrvǝlǝg nǝ uuram kǝ dǝg zǝgga.” Aiyam nǝ iitǝr taa kǝ iina, “Kǝm sugudasug kǝ dǝgzǝg kalkal dǝ kwaɓi ɗivar kǝ baryam dǝga kyil tǝhs, kǝm vǝltǝr ar zuwa?”
    38: Amaa taa kǝ iitǝra, “Bruudi ngwen wa vakaruwi? Dam da vazǝgaana.” Vazarna ba nǝ iitǝra, aiyam nǝ iitǝra, “Bruudi dlǝɓa, ar dǝ kilf buwa.”
    39: Kaa tagtǝrtag Yesu kǝ mbǝrzahaan aa tagartǝrtag kǝ uudah ar cahwara dakwal dakwala tǝ kazhakw dǝ gyiya.
    40: Kaa cahwargacahwarǝg kǝ iitǝr dakwal dakwala, kyalǝm dǝrmǝk-dǝrmǝka, kyalǝm kul dlǝɓ kul dlǝɓa.
    41: Kǝsghant ba nǝ iin kǝ ɗummba bruudi dlǝɓa, ar dǝ kilf buwna, dzǝgaan kǝ iin kǝ ghǝraan damma zhigǝl, tagar kǝ uus kǝ Daadamazhigǝla, lahnana kǝ iin kǝ ɗummbahaana vǝltǝr kǝ mbǝzahaana, ar vǝlar kǝ uudaha. Tagwtǝrnan dlaɓ kǝ kilf buuna kǝ mbǝrzahaan ar valtǝr kǝ uudah ba ɗǝmma.
    42: Baɗǝmma zaruuzǝg tlatǝrtlǝga,
    43: ar dzahant kǝ lahgaha bruudi ar dǝ kilfiina, tlavkǝna nǝ alghw kǝlawa tar buwa righarighan.
    44: Ɗyakǝra uudahi zaru kwanǝn kǝ dǝgzǝga ghwalvah alfu dlǝɓa.
    45: Ba tǝ watsǝra kaa fǝtǝraafǝg nǝ Yesu kǝ mbǝrzahaan damma perrayiwa maraa tsugwa ma Betsaida lakwti dagau kǝ iina, iin dlaɓa ɗiitǝrs kǝ uudaha.
    46: Tǝhalakwa ɗiyatǝrǝs nǝ iin kǝ uudaha, kaa dagat kǝ iin dat kungula aghw da dzugwazhigǝla.
    47: Ɓǝlaa ba hwaasa, pɛrrayuna ndza ma taataka yuwahaiya. Ndza ba dlaɓ nǝ Yesu tǝ ghaiya gardz ba daghwvaana.
    48: Nǝgha ba nǝ iin kǝ dlaɗa ɗuulǝgaanaatǝr kwakyarvad ɓagavanaatǝr dǝ fǝɗa, band garava karfi hǝkǝrɗa avǝɗa. Kaa dagal kǝ iin tǝghǝra yu da vakaatǝra. Zǝkk amaa bandgi da ghuda dagala.
    49: Nǝghara ba nǝ iitǝr dagal tǝ ghǝra yuwa, am nǝ iitǝr ndakwani daddkwa sǝgal tǝ afka, kaa huulǝg kǝ iitǝra,
    50: aɗaba baɗǝm nǝgharanǝghǝga, kaa gǝdzǝg kǝ iitǝra. Kaa tagtǝrtag kǝ iin taakiya, “Ndavam biya! Ba kaiya, gǝdzam biya!”
    51: Kaa daas kǝ iin damma pɛrrayu ǝmtaɗ dǝ iitǝr, kaa ghacgaghacig kǝ fǝɗiina. Kaa ɓa jappǝr kǝ iitǝr ba vaivaiya,
    52: aɗaba ar sǝrgai kǝ dǝgiti tuuk vakai nǝ gǝlla uudah alfu dlǝɓǝn biya, kwakyarvad irrǝviɗmahuɗaatǝra dǝkdǝka.
    53: Dzǝvara ba nǝ iitǝr kǝ yuwa haiya, ar tsugwa ma Janisarat, ar nguɗǝna kǝ pɛrrayuwiin tǝ ghaiya yuwahaiya.
    54: Ba sagalaatǝr wah ma pɛrrayuwa, caaricaari kaa sǝrgaakasǝrǝg kǝ uudah taaki, mbats Yesu.
    55: Kaa ɓala ǝmdǝrg kǝ iitǝr aandzu takwar ma haiyin, kaa ba langarlang kǝ iitǝr kǝ lii yang bi tǝ dǝga hǝnganaatǝr da vakavaaki ar cinnga nǝ iitǝr taakiya vaakwah Yesu.
    56: Baɗǝm vakavaki dǝgal nǝ iina, bi kǝs ɗyaka, ma zǝr kǝssa, bi ɓalaɓalaha, ar hǝngna kǝ lii ya yangbi tǝ ghaiya kasukwa, ar ghalǝg mbakyarvad lii yangbi maraa tappǝnan aandzu ba ghaiya sǝɗavaana. Baɗǝm lii taparnatapǝgga mbaharambahǝgga.
  7:
    1: Farisiyaha ar dǝ kyalma lii tsaga adzahadzaha Musa lii saral ma Wurshalima faɗarvǝt vak Yesu.
    2: Kaa nǝghǝganǝghǝg kǝ iitǝr kǝ kyalǝma mbǝrzahaan ar zaa kaf kwal barga dǝva, tǝdvad adzahadzahaatǝra ar maay dǝ caccu biya.
    3: Aɗaba Farisiyaha ard Yahudaha baɗǝm ar maay za kaf ǝndkwah biya, bamma bararabarǝg kǝ dǝvahaatǝra, tǝdvad adzahadzaha daadijahaatǝra.
    4: Ma saraghasǝg saa ma kasukwa, ar maay za kaf ndan biya bamma bararabarga. Mǝng dlaɓ watlǝrǝn kǝ adzahadzaha daadijah baɗyak kwa gwiyaru nǝ iitǝra, dlaɓa ar tsuufǝgaana, band bara kuwa hǝɓɓa yuwa, shakaha, ar dǝ tǝfuwa.
    5: Kaa ndavgarundavǝg kǝ Farisiyaha ar dǝ lii tsaga adzahadzaha Musa kǝ Yesu, “Aujilbǝg kǝ mbǝrzahagh ar maay gata adzahadzaha daadijah ar za kaf dǝ dǝv bakwal caccuwi?”
    6: Ngwatǝrangug taakiya, “Mbats ba kalkal nǝ tlayanngǝra tagga nǝ Ishay tǝghǝr kǝskuram taakiya am muniya! Bandkwa vindava taakiya, “Am Daadamazhigǝla, ‘Ar fǝkwaara bad ghai nǝ uudah kǝskaiya, irrǝviɗmahuɗatǝr biky dǝ kaiya.
    7: Ar ɓagwa ba gyagyaan kǝ kwatnahǝra. Ar tsagtǝr adzahadzaha uudaha, dlakulva ǝlbǝga Daadamazhigǝla.’”
    8: “Ɗuwamarsɗuug nǝ uuram kǝ adzahadzaha Daadamazhigǝl kwa tagaa nǝ iin taaki aa gatavgatǝga am gata dǝga daadiij uudaha.”
    9: Amaa taa kǝ iitǝra, “Am sǝrgasǝrg kǝ ɗuwa adzahadzaha Daadamazhigǝla mbakyarvad am gata dǝga daadijaharuwa!
    10: Aɗaba tagaatag Musa taakiya, ‘Faarafǝg kǝ daadagha ar dǝ baabagha,’ dlaɓa, ‘Dadda kwa ɗaava daddana bi babbaana barari tsavva.’
    11: Am ɗuugarsɗuug nǝ uuram kǝ uudi maay tsa puuta daddaana ar dǝ babbaan biya, farwut taakiya baɗǝm nǝ dǝgit mamma ndza da tlǝkkǝna nǝ uuram vakara fanarafǝg kǝ Daadamazhigǝla.
    12: Tsamarva ndǝkwah nǝ uuram kǝ mǝlgaru kǝ daddana ard babbaana.
    13: Tǝdvad kwan wam neneg nǝ uuram kǝ ǝlbǝga Daadamazhigǝl mbakyarvad dǝga daadijahi am tsagtǝr nǝ uuram kǝ uudaha. Am ɓag band kwah dlaɓ nǝ uuram kǝ dǝgitah baɗyaka.”
    14: Kaa gwiya ɗahtǝrǝtɗahǝg nǝ Yesu kǝ dlamakǝlaaa, amaa taa kǝ iitǝra, “Cinngamwacinng baɗǝmma, am nǝghaaka dlaɓ ba marauwa.
    15: Dǝgiti dǝgaa damma vǝgh kǝ uud bi wa fǝgara ndzǝga kwal caccu tǝvuukwa Daadamazhigǝl biya, dǝgiti sagal ma vǝgh kǝ uud wa fǝgaraa ndzǝga kwal caccu tǝvuukwa Daadamazhigǝla.” [
    16: Daddakwad hyimiya cinngaana aa cinngacinnga.]
    17: Tǝhala tagwavaan dǝ uudaha, kaa daas kǝ iin da hǝnyaha, kaa ndavgarundavǝg kǝ mbǝrzahaan kǝ dǝgiti tuuk vakai nǝ wanǝn kǝ garava.
    18: Ngwatǝrangugga amaa, “Mbats kuram ndakwi nǝghamaaka biya? Nǝghamaaka bi taakiya Dǝgiti dǝgaa damma vǝgh kǝ uud bi wa fǝgaraa ndzǝga kwal caccu tǝvuukwa Daadamazhigǝl biya,
    19: aɗaba aa dǝhi damma rǝviɗyan biya, aa dǝhi ba damma huɗaana, tǝhalakwaha kaa sagal ma vǝghaana.” (Vaakwana maradamarǝg Yesu taakiya makwar kǝ dǝgzǝga bad caccuwa.)
    20: Kaa zavuukw dǝ taakiya, “Dǝgiti sagal ma vǝgh kǝ uud iin wa fǝgaraa uud ndza kwal caccuwa
    21: Kwakyarvad sagal ma rǝviɗmahuɗa uud nǝ dzama ɓa kǝladǝra, shiɓǝlga, ɓa gǝla, tsa shifǝgga ar dǝ ɓa gwaragwara,
    22: ard dlǝrmǝga, kǝlaadǝra, valla uudaha, ar dǝ kǝmma dǝga tsa zhǝrwa, ar dǝ shilga, ar dǝ badza ɗaaga, ar dǝ naaghǝra ar dǝ dlagǝra
    23: Baɗǝm wanahaan kǝ dǝga kǝlaadǝra sagal bamma rǝviɗmahuɗuuda, badzǝgaan kǝ ndzǝgana uuda.”
    24: Kaa ciya dagal kǝ Yesu vaakwahiin damma larda Taya ard Sidon. Kaa daas kǝ iin da vǝgya uudana, nahabi nǝ iin maa sǝran aandzu ndǝwar biya. Bakǝvakwaha pǝlewapǝlǝg kǝ shǝɓga.
    25: Cinngha ba nǝ uusiin kwa tsaag shiɗkwa shatanaha kǝ zǝr dǝghwaan kǝ ǝlbǝg tǝghǝra, caaricaari kaa dagau mbǝɗan tǝvuukwana.
    26: Uusna dǝghwa Helenaha. Yavva ma larda Finikiya ma haiya Suriya. Kaa ghalla Yesu kǝ iin maa lagwda kǝ shatanahǝn ma vǝgha dǝghwaana.
    27: Am Yesu taa kǝ iina, “Aazaruuzǝg zarh ndan tlǝtǝra, kalkalbi kǝsvant kaf vǝlǝvtǝr kǝ ghǝgyah biya.”
    28: Ngwangug nǝ uusǝna amaa, “Aana, bandkwah, dadda tsaga dǝgita, abi, zǝgaan nǝ ghǝgyah kǝ kafi ɓalgal vaka zǝgaa kǝ zarǝh.”
    29: Aiyam Yesu taa kǝ iina, “Mbakyarvad ngwuggi aghaa ngugga nǝngna, dǝg daas da hǝnyaha, ɗuugharɗuug shatanahiin kǝ dǝghwagha.”
    30: Kaa gwiya daas kǝ iin da hǝnyaha, tlǝghara hǝnga tǝ piin kǝ dǝghwaana, ɗuugharsɗuug shatanaha.
    31: Ɗuughars ba nǝ Yesu kǝ larda Taya, kaa ghuda dagal dǝ Sidon lakutti gwiya daas damma yiwahaiya Galili, ar dǝ ghaiya kǝs kǝlawa Dikapolis.
    32: Vaakwaha ar sardǝv nǝ uudah kǝ matangng kwa tagǝda dlah kǝ ghaiya. Kaa ghalgaan kǝ iitǝr maa tappǝna kǝ uudanǝn maa mbanna.
    33: Ɗahant kǝ iin kǝ matangǝn damma dlǝmmbaava vakavaki maay ndwar biya, kaa fahardǝm kǝ iin kǝ zarha dǝvaan damma hyemyahaana, dlaɓa tǝfa kǝ ashavaiya, tapǝna kǝ aryahaana da ashavayiina.
    34: Kaa vazza damma zhigǝl kǝ Yesu kaa ɗǝya shifǝg kǝ iin bad ndzǝɗa, amaa taa kǝ iina, “Iffata!” Iin taakiya, “Wurga!”
    35: Tagaa ba nǝ iin kwaha, kaa wurǝg kǝ hyimiyahaana, dǝgiti hǝkyǝghani aryahaana plǝmpǝlga, kaa tagaan kǝ iin kǝ ghai ba marawwa.
    36: Ɓǝlatǝraaɓǝlǝg nǝ Yesu kǝ maggi aa tagarar bi aandzu war biya, bakǝvakwaha kaa kutgaan kǝ iitǝr kǝ dǝgiti dzǝghardzǝgǝn.
    37: Kaa ɓa jappǝr kǝ uudah ba vaivaiya, am nǝ iitǝra, “Ɓagaaɓag kǝ dǝgit baɗǝm bakalkala! Baz lii matang ndza cinngacinng kǝ ǝlbǝga, lii hatstǝruu hyǝmiya ar tagaan kǝ ghaiya.”
  8:
    1: Makwahiin kǝ sarta, kaa gwiya faɗǝgǝtfaɗǝg kǝ uudah ba ɗyaka. Maay tsau nǝ dǝgzǝg vakatǝr biya, kaa ɗahgantɗahǝg nǝ Yesu kǝ mbǝrzahaan amaa taa kǝ iitǝra,
    2: “Ən ɓa zhuwadaala uudahaana, hǝnga hǝkǝrɗ wan kwan ar ba vakar bakwal dǝgzǝga.
    3: Akwama ɗiiyantǝrǝsɗiiga daas da hǝnnyaha dǝ waiya, ar da mbasda biya. Aɗaba kyalǝm saral vaka bǝtkya.”
    4: Am mbǝrzahaana, “Da tlǝvkǝna mǝr nǝ dǝga zǝg makwanǝn kǝ tǝghal kwada tlǝgaara kǝ uudahaani?”
    5: Kaa ndavatǝrundavǝg kǝ Yesu taakiya, “Bruudi ngwen wa vakaruwi?” Aiyam nǝ iitǝra, “Uuɗifa.”
    6: Kaa tagtǝrtag kǝ iin kǝ uudah aa cahwararacahwarǝg tǝ haiya. Kǝsant kǝ iin kǝ bruudiin uuɗifna, kaa tagar uus kǝ Daadamazhigǝla, lahnana, vǝltǝr kǝ mbǝrzahaan kiyava tagwar kǝ uudaha.
    7: Mǝng dlaɓ kilf mishish hǝɗiikǝn vakaatǝra. Faraa kǝ iin kǝ barka, amaa tagwamtǝrnatagw kǝ uudaha
    8: Zaruuzǝg nǝ uudaha, tlatǝrtlǝga, ar dzahant nǝ mbǝrzahaan kǝ tǝmgaan alghw uuɗifa.
    9: Lii zaruuzǝg ar mǝng damma alfu uufaɗa. Kaa ɗiitǝrǝs kǝ iin dagal kǝ uudaha.
    10: Bat watsǝr kaa dǝgǝmdǝg kǝ iin damma pɛrrayu dǝ mbǝzahaan, ngal dagal kǝ iin damma larda Dalmanuta.
    11: Kaa sagau kǝ Farisiyah sa ɓalagajau dǝ Yesu, Sarsaa fǝshgaana, kaa ghalgaan kǝ iitǝr maa martǝrda kǝ dǝga jappǝr kwada nǝg kǝ dǝga sǝrg saay ma ghǝrazhigǝla.
    12: Kaa dǝya shifǝg kǝ iin bad ndzǝɗɗa, amaa, “Aujilbǝg kǝskuram uudaha zaman am gata dǝga sǝrgi? Ən tagkurtag kǝ jiira, maay watlǝrǝn kǝ dǝga sǝrǝgi da marvǝtǝr kǝ uudaha zamanǝn biya.”
    13: Tǝhalakwaha kaa ɗuutǝrǝsɗuug kǝ iina, kaa daas kǝ iin damma perrayuwa, kaa dzǝva dagal kǝ iin dat ghyaba kwaha.
    14: Viyatǝraavig kǝsa bruudi kǝ mbǝrzaha Yesu, ba pal wa vakatǝr ma pɛrrayuwa.
    15: Kaa ɓǝlaatǝraɓǝlǝg nǝ Yesu kǝ maggiya, amaa, “Famfǝg kǝ hyǝmmi dǝgiya, dlaɓa am fǝgaan kǝ taaɗ tǝ yista Farisiyaha ar dǝ dǝga Hirudus.”
    16: Kaa tagkǝvaatag kǝ mbǝrzah ma taatakaatǝr taakiya, “Mbakyarvad kiyam maay dǝ bruudi ha waa taag nǝ iin ndǝkwahini?”
    17: Nǝghaakaba nǝ iin kǝ dǝgiti ar taag nǝ iitǝra, kaa ndavtrundavǝg kǝ iina, “Aujibǝg am taakiya am maay dǝ bruudi? Mbats, gwastǝn nǝghamaaka biya? Dlaɓa sǝramaaka biya? Mbats dǝkdǝk ghǝraruwa?
    18: Am dǝ gyiyaha, am nǝghǝga biya? Am dǝ hyǝmmiyaha, am cinnga biya? Mbats dzamamna biya?
    19: Ma sartakwa lahantǝru nai kǝ bruudi dlǝɓ kǝ uudah alfu dlǝɓna, alghw ngwen wa dzahamant nǝ uuram kǝ tǝmngaani?” Kaa ngugangug kǝ iitǝr taakiya, “Alghw kǝlawa tar buwa.”
    20: “Bruudi uuɗifǝn kwa lahantǝru nai kǝ uudahna, maandala alghwah ngwen wa dzahamant nǝ uuram righarighan dǝ ghwadgahaanii?” Am nǝ iitǝr taa kǝ iina, “Alghw uuɗiffa.”
    21: Aiyam Yesu taa kǝ iitǝra, “Gwaastǝn nǝghamaaka bi kǝ ǝlbǝgar biya?”
    22: Daragha ba nǝ iitǝr damma Betsaida, kaa sǝvardasǝg nǝ uudan gulf kǝ Yesu, kaa ghalgaan kǝ iitǝr maa tapna kǝ gulfiina.
    23: Viyiit kǝ iin kǝ dǝva gulfǝna, taɗda kǝ iin dagal da gyilga kǝssa. Tǝfgharvaba nǝ iin kǝ ashavai kǝ uudanǝn magyiya, tapna kǝ iina. Ndavaru kǝ iin taakiya, “Agha nǝghǝganǝghǝg kǝ dǝgita?”
    24: Kaa dzǝgantdzǝg kǝ gulfǝn kǝ ghǝran damma zhigǝl, amaa, “ǝn nǝghǝganǝghǝg kǝ uudaha, ǝn nǝghtǝr band uufaha, ar gwayaiva.”
    25: Kaa gwiya tapgaan kǝ Yesu kǝ gyiyaana. Ngal wurgǝtwurǝg nǝ gyi tǝvakaiya, mbana, kaa nǝghǝganǝghǝg kǝ dǝgit ba marauwa.
    26: Kaa ɓǝlgarsɓǝlǝg Yesu daas da hǝnyaha, amaa taa kǝ iina, “Gwiya tǝbi kǝ zǝrkǝss biya.”
    27: Yesu ard mbǝrzahaan daral damma zǝrkǝssah ma Kaisariya Filibi. Tǝghǝrdǝga kaa ndavtǝrundavǝg kǝ iin kǝ mbǝrzahaan taakiya, “Ən war nai ma tag nǝ uudahi?”
    28: Kaa ngugangug kǝ iitǝr taakiya, “Kyallǝm ar taaki, agha Yuhwan dadda tsuufǝga, kyallǝm ar taakiya, agha Iliya tlayanga, kyallǝm dlaɓ ar taakiya, agha pal ma tlayangaha.”
    29: Kaa ndavtǝruundavǝg kǝ iina, “Kuramǝm, ǝn warnai mam tlǝg nǝ uurami?” Ngwaangug nǝ Bitrus taakiya, “Kǝgh nǝ Kǝristi.”
    30: Kaa ɓǝltǝra kǝ maggi kǝ mbǝrzahaan aa tagararbi aandzu ndǝwar kǝ ǝlbǝg tǝghǝr kǝ iin biya.
    31: Makwanǝn kǝ sarta, kaa fǝgarzhafǝg kǝ Yesu tsagtǝr dǝgit tǝghǝr kǝ ɗuuli da hǝɓǝg Zǝra Uud kǝ dlaɗ shah-shaha. Ar da naabi nǝ maalah tǝghǝr kǝ dlamaa kǝlawa ard maalaha zhiila kǝssa uufah, ard lii tsaga adzahadzaha Muusa, da tsǝvaana, tǝhala hǝng hǝkǝrɗ da ciig dǝ shiifǝgga.
    32: Taggada bat ɓalaɓal kǝ kwanǝn kǝ ǝlɓǝga. Kaa ɗahanat nǝ Bitrus kǝ Yesu damma dlǝmmbaava, buuraraana.
    33: Kaa gwivǝt kǝ yesu vazǝna kǝ mbǝrzahaana, ngal caa gyi kǝ iin tǝ Bitrus taakiya, “Yagh vakar, shatanahna! Dzamaghǝragha band uuda duniya, band dzamaghǝra Daadamazhigǝl biya.”
    34: Tǝhalakwaha ɗahant kǝ iin kǝ uudah ar dǝ mbǝrzahaan ba hǝrz dǝ iina, amaa taa kǝ iitǝra, “Baɗǝm daddakwa naa gata kaiya, ɗuwant kǝghǝraana, kǝssant kǝ tlaɓa hǝrtǝgaan kaa gatǝkwagatǝgga.
    35: Baɗǝm daddakwa naa fa shifǝggaana, da tlǝkǝna biya. Dlaɓa baɗǝm daddakwa ɓǝlda shifǝggaan mbakyarvad kaiya, ar dǝ ǝlbǝga marawa, aafǝga ba dǝ fǝga.
    36: Au payɗaan akwama tlakkǝnatlǝg nǝ uudan kǝ dǝga duni ba ɗǝm ɓǝlda kǝ shifǝggaani?
    37: Dlaɓ au wada vǝlda nǝ uudan dlakulva shifǝggaani?
    38: Baɗǝm daddakwa cinnga zhirwara ard dǝ ǝlbǝgar ma kwanǝn kǝ zamana kwa maay jiir mavakai biya dlaɓa dǝ haipah ba ɗyaka, Zara Uud ndakwi da cinngaan kǝ zhǝruwan ma sartǝn da saggau nǝ iin ma ndangǝra Daddaana ǝmtaɗ dǝ zǝrɓǝlgah kwar caccuwanacaccuwana.”
  9:
    1: Amaa dlaɓ taa kǝ iitǝra, “Ən tagkurtag kǝ jiira, mǝng lii ar ghacǝga vaakwan ar maay da ǝmtsǝg biya, bamma nǝgharanǝghǝg kǝ sagauwa tlǝksǝra Daadamazhigǝl bad ndzǝɗɗa.”
    2: Tǝhala hǝngah ǝngkwaha kaa kǝsgankǝsǝg Yesu kǝ Bitrus, ard Yakuba, ard Yuhwana, kaa langtǝrdǝt kǝ iin dagat damma aghwa ba kyakkwa, ar ndzan ba davaatǝra vaakwahiina. Kaa gwivǝtgwiig kǝ ndzǝganaan tǝvuukwatǝra,
    3: sǝɗvaan ndza maɗǝkw batǝl ar mbiiga, maay dadda bara kadlangi bardabarǝg ndkwah ma duni biya.
    4: Kaa tsǝgwatsug tlayang Iliya ard tlayang Musa vakaatǝr ar taaghai dǝ Yesu.
    5: Am Bitrus taa kǝ Yesu, “Dadda tsagadǝgita, maraw ndzǝganamiyam vaakwanǝna, kǝm tafgatafǝg kǝ tsakwamah hǝkǝrɗ, pal kǝskǝgha, pal kǝ tlayang Musa, pal dlaɓ kǝ tlayang Iliya.”
    6: Sǝrgabi kǝ dǝgiti da tag nǝ iin biya, aɗaba gǝdzarǝtgǝdzǝga ba vaivaiya.
    7: Kaa saay kǝ akumb hǝɗtǝrdu, kaa ba cinngalcinng kǝ kungy ma akumbiina, taakiya, “Kǝgh zǝrarra, kwan waig naiya. Cinngamarnuucinnga!”
    8: Maay ma taaɗatǝr biya, kaa ɓala gyi kǝ iitǝra nǝgharabi ndǝwar biya, ba Yesu kalti wa ǝmtaɗ dǝ iitǝra.
    9: Tǝghǝrdǝga saayatǝr maghwa, kaa ɓǝltǝr maggi kǝ Yesu aa tagararbi aandzu ndǝwar kǝ dǝgiti aa nǝghǝga nǝ iitǝr biya, bamma ciyitciig Zǝra Uud ma gǝtlah ndanna.
    10: Ar ɗuwars kǝ ǝlbǝgǝn bamma taatakaatǝra, kaa ndava zaraabahaatǝr kǝ iitǝr taaki auwa tlatlǝg nǝ Yesu dǝ “Ciig ma gǝtlah”.
    11: Tǝhalakwaha kaa ndavǝgarundavǝg kǝ iitǝr taakiya, “Aujilbǝgci kǝ lii tsaga adzahadzaha Musa ar taaki ba tlayang Iliya wada fǝgharzha saay ba zǝngwa, tǝhalakwaha kaa Yaazhigǝli?”
    12: Ngwangug Yesu taakiya, “Ba jiira tlayang Iliya wada fǝgarzha saaya ba zǝngwa mbakyarvad ɓadla dǝgitah baɗǝmma. Bakǝvakwaha vindavindan taakiya Zǝra Uuda da hǝɓgaan kǝ dlaɗ shah-shaha, dlaɓa ar da naa biya. Nii ǝnd kwah bi hii?
    13: Abi, sahisǝg nǝ Iliya, ɓagarraɓag nǝ uudah kǝ iin kǝ dǝgitah baɗǝm kwa naag nǝ ghǝratǝr baɗǝmma, band kwa vindavindan da dzǝgardzǝga.”
    14: Gwiyarghǝra ba nǝ Yesu ar dǝ mbǝrzah hǝkǝrɗǝn savak kyalma mbǝrzaha, kaa nǝghǝganǝghǝg kǝ iitǝr kǝ uudah baɗyak faɗǝga tǝghǝr kǝ iitǝr. Lii tsaga adzahadzaha Musa dlaɓa ar ɓalla agajau dǝ iitǝr.
    15: Nǝgharaba nǝ iitǝr kǝ Yesu kaa ɓa jappǝr ba vaivai kǝ dlamaa kǝlaw baɗǝmma, kaa ǝmdǝra da tagar uus kǝ iitǝra.
    16: Kaa ndavatruundavǝg nǝ Yesu kǝ mbǝrzahaana amaa, “Agajawaw wam ɓag nǝ uuram dǝ iitǝri?”
    17: Kaa ngwangug kǝ uuda nǝ iin ma dlamaa kǝlaw, amaa, “Dadda tsaga dǝgita, wan zǝrar naa sǝkadǝv naiya, kwa ciɓǝg nǝ shatanaha dlaɓa tsǝgharvatsǝg kǝ taaghaiya.
    18: Ba tuukw sarti tsǝgwaraa nǝ iina, tlavgaarǝttlavǝg da tǝ haaya. Faraa kǝ kubǝg ma ghaiya, baz kǝrɗa tlǝrɗa, ghularant kǝ vǝgh ba dzǝghǝgha. Ɗahanɗahǝg kǝ mbǝrzahagh da lagwana, pilatǝrvaapilga.”
    19: Ngwatǝrangug nǝ Yesu amaa, “Kuram uudaha zamana, am maay dǝ fadghǝr biya, ǝn da zǝlma ǝmkyangar nai dǝ kurami? Dlaɓa ǝnda ɓǝshkur hǝr nai kwanahaanii? Ayakam kǝ zǝriin da vakara.”
    20: Kaa sǝgardǝvsǝg kǝ iitǝr kǝ zǝriina, nǝgha ba nǝ shatanahǝn kǝ Yesu, bat watsǝra kaa tlǝvgaarǝttlǝvǝg kǝ iin kǝ zǝriin dat tǝ haaya, kaa tǝg kǝ vǝghaana, gudɓǝlɓǝlga, baz kubǝg sagal ma ghaiyaana.
    21: Kaa ndavgarundavǝg Yesu kǝ daddaana, “Fǝgharzha hǝr nǝ dǝginǝn kǝ ɓagarɓagi?” Aiyam nǝ daddaana, “Fǝgharzha bamma zarhǝra.
    22: Ɓalgaan damma kaara ar dǝ yuwa, kiyava tsǝgaana. Akwama mǝng nǝ dǝgiti agha ɓaggnanǝnga, zhukǝmndalazhug agha mǝlkǝmndu.”
    23: Aiyam nǝ Yesu taa kǝ iina, “Aujilbǝg agha ndava taakiya mbatak ǝn ɓagnaɓagi? Abi, makwar kǝ dǝgit ɓagaɓag vak dadda fadghǝra.”
    24: Caaricaari kaa dzǝgantdzǝg kǝ dadda zǝrǝn kǝ kungy amaa, “Fandghǝrǝtfǝga, mǝlwadmǝlǝg ǝn farna kǝ fadghǝra!”
    25: Nǝghaba Yesu kǝ uudah ar ba sagau dǝ ǝmdǝrga, kaa cagaraacag kǝ iin kǝ gyi kǝ shatanahǝn amaa, “Kǝgh shatanahǝn tsǝgharǝva kǝ zǝrǝn matang makwai kǝ taaghaiya ard cinngacinnga, assagal ma vǝghaana, gwiya dǝbi dlaɓ damma vǝghaan biya.”
    26: Kaa huulǝg kǝ shatanahna, kaa gajagaan kǝ iin kǝ zǝrǝn ba vaivaiya dlaɓa kaa dagalaana. Kaa hǝngahǝng kǝ zǝrǝn band daddakwa ǝmtsaǝmtsana, baz tagaan kǝ kyalm taaki, “Abi, ǝmtsaǝmtsǝga.”
    27: Kaa hǝkynan nǝ Yesu kǝ dǝvaan ciyanta, ghacana.
    28: Dagha ba nǝ Yesu da hǝnyaha, kaa ndavgaruundavǝg kǝ mbǝrzahaan ma dlǝmmbaava, taakiya, “Aujilbǝg kǝskǝmnd pilekǝmndvaa lagwa shatanahiini?”
    29: Kaa ngwanguga kǝ Yesu, amaa, “Hulfa kwan kǝ shatanaha laguvda biya bamma dǝ dzǝgwazhigǝla.”
    30: Kaa ciya dagal kǝ Yesu ar dǝ mbǝrzahaan vaakwaha, Kaa ghudadagal kǝ iitǝr ma huɗa Galili. Nahaabi Yesu sǝrvaaka vakavaki dǝ iitǝr biya,
    31: aɗaba ndza tsaggtǝr dǝgit kǝ mbǝrzahaan taakiya, “Zǝra Uuda da vǝlvtǝr damma dǝv kǝ uudaha, da tsǝvana. Tǝhala hǝngah hǝkǝrɗa da ciiga.”
    32: Nǝgharaakai kǝ dǝgiti tag nǝ iin biya, dlaɓa ar gǝdzǝg kǝ ndavgaana.
    33: Daragha ba nǝ iitǝr damma Kafarnahuma. Kaa daas kǝ Yesu da hǝnyaha kaa ndavtrundavǝg kǝ iin kǝ mbǝrzahaan amaa, “Agajawaw wamaa ɓag nǝ uuram tǝ ghǝrdǝgi?”
    34: Mbǝɗar bi kǝ ghaiyatǝr biya, aɗaba ɓalarɓalǝg kǝ agajaw tǝghǝrdǝg taaki war maal mataatakaatǝra.
    35: Kaa cuhwurgacuhurg kǝ Yesu, ɗahant kǝ kǝlawa tar bu na, amaa taa kǝ iitǝra, “Baɗǝm wanaa nǝg kǝ dǝga zungwa, barari nal kǝ dǝga haal baɗǝmma, naal dlaɓ kǝ kwatnaha uudah baɗǝmma.”
    36: Sǝddan kǝ zǝrzǝra, ghacna ma taatakaatǝra. Hǝkyna hǝɓǝk tǝvǝgh kǝ vǝghaana, amaa taa kǝ iitǝra,
    37: “Baɗǝm daddakwa dlǝghǝga zǝrzǝr ǝndkwan mbakyarvad ɗaagara, dlǝghakwidlǝghǝg kǝskaiya. Dadda kwaa dlǝghkwi kai dlaɓa, kaibi wa dlǝghkwi nǝ iin biya, aa dlǝghǝga daddakwa ɓǝlakwadi kaiya.”
    38: Am Yuhwan taa kǝ iina, “Dadda tsaga dǝgita, mǝng nǝ uud kǝmnda nǝghǝgga nǝmnd lagwa shatanah ma ɗaagaha, kǝm tsarvana, aɗaba maay ma kǝmyam biya.”
    39: Aiyam Yesu taa kǝ iitǝra, “Tsamarǝv biya, maay wa ɓa dǝga jappǝr ma ɗaagar tǝhalakwaha kaa taa ǝlbǝg ghwaɗ tǝ kai biya.
    40: Baɗǝm wa maay ɓa tlǝghum dǝ kǝmyam biya, ǝmtaɗ dǝ miyama.
    41: Ən tagkurtag kǝ jiira, baɗǝm waa vǝlkur yuwa hǝɓɓǝg, aandzu ba kwu palla aɗaba am dǝga Kǝristi, ǝn tagkurtag kǝ jiira, da pilwabi nǝ dǝgshigaan biya.”
    42: “Baɗǝm daddakwa fǝgaraa pal ma zǝrzarhahaan fadghǝraatǝr tǝ kaiyǝn kǝ ɓa haipa, da nǝg kǝ dǝga zhuwadaala. Da ngulǝm nguɗvardǝm nǝ akura vaar ma kungy, ɓǝldǝm damma dǝlva.
    43: Akwama fǝkaa ɓa haip nǝ dǝvagha, agha ghuddana. Ngulǝm agha tlǝkkǝna kǝ shifǝgga damma zǝrazǝr dǝ dǝv palla, tǝghǝr kǝ damma kaar fai dǝ dǝvahagh bǝkurɗa, vakavakǝn da tsǝvabi nǝ kaarǝn biya. [
    44: Kwaɗyahanǝn kwar zǝtǝrzǝg vaakwahiina, ar maay ǝmtsǝg biya, dlaɓa tsǝva bi nǝ kaariin biya.]
    45: Akwama shǝgahagha wa fǝkaa kǝ ɓa haipa, agha ghuddana. Ngulǝm agha tlǝkǝna shifǝga tangw damma zǝrazǝr dǝ shǝg pal, tǝghǝr kǝ damma kaara fai dǝ shǝgahagh bǝrkuɗa. [
    46: Kwaɗyahanǝn kwa zǝtǝrzǝg vaakwahiina, ar maay ǝmtsǝg biya, kaarǝn dlaɓ tsǝva biya.]
    47: Akwama fǝkaa ɓa haip gyiyagha, ngulǝm agha tǝddana. Ngulǝm agha tlǝkǝna kǝ tlǝkǝsǝra Daadamazhigǝl dǝ gyi pal tǝghǝr kǝ damma kaara fai dǝ gyiyahagh ba bǝrkuɗa
    48: vaakwahiina, ‘Kwaɗyahaan zǝtǝrzǝgna, ar maay ǝmtsǝg biya, Kaariin dlaɓa tsǝva biya.’
    49: Da fǝshav aandzu kwar kǝ uuda dǝ kaara, bandkwa fǝshav nǝ kyullǝg dǝ iizhamalaha.
    50: “Iizhamalaha dǝgit marraw nǝ iina, akwma tagwazhatagw nǝ iizh dǝ yamyamana, am da gwida ndari? Aandz mǝng nǝ iizh ma kuram, am ndzan ma gabǝrǝr dǝ zaraabahaaruwa.”
  10:
    1: Kaa ɗuwa vakavak kǝ iin kǝ Yesu, kaa ciya dagal damma larda Yahudiya, kaa dzǝva kǝ iitǝr dat ghyaba zaagha Jodan. Uudah baɗyaka dlaɓ gwiya dzaharvǝtdzahǝg vakaana, kaa gwiya tsagtǝrtsag bandkwa nǝt nǝ iina.
    2: Kyalma Farisah sarǝvsǝg sa fǝshgaana, kaa ndavgarundavǝg kǝ iitǝr taakiya, “Ma adzahadzaha Muusa, kalkalaan kǝ uudan lagwars kǝ uusaana?”
    3: Kaa ngutǝrangug Yesu amaa, “Auwa tagakur na adzahadzaha Muus ɗaa?”
    4: Ngwarangugga aiyam nǝ iitǝra, “Haighanthaig nǝ Muus taakiya agha vinndara kǝ kakkaɗa tagwavǝgh dǝ uusagha, dlaɓa agha lagwarsa.”
    5: Am Yesu taa kǝ iitǝra “Vindakura mbakyarvad dǝkdǝka ghǝraru nǝ Muus kwanǝn kǝ adzahadzaha.
    6: Bamma da zǝngwa, ndǝraandǝrg ‘Daadamazhigǝl kǝ uudaha ghwalva ar da uusa.’
    7: Mbakyarvad kwaha, ɗuugaan uud kǝ daddaan ar dǝ babbaan ǝmtsǝvǝt tǝ uusaana.
    8: Ba bǝrkuɗ ar nal kǝ vǝgh palla. Tangw da tǝvuukwa ard ndzǝga band uud palla, maadlai uud bu biya.
    9: Aɗabad kwaha, dǝgiti aa matlǝgant Daadamazhigǝla, aa tagw bi nǝ uudan biya.”
    10: Gwiyara ba nǝ iitǝr da hǝnyaha, kaa ndavgarundavǝg nǝ mbǝrzahaan kǝ Yesu tǝghǝr kwanǝn kǝ ǝlbǝga.
    11: Aiyamaa taa kǝ iitǝra, “Baɗǝm nǝ uudi lagwda uusaana, gak kwatlǝrǝn kǝ uusa, ɓagagharaɓag kǝ haipa gwaragwar kǝ uusa zǝngwa.
    12: Akwama uus dlaɓ wa ɗuugars zhiilan kǝsuu kwatlǝrǝn kǝ zhiila, ɓagaaɓag kǝ haipa gwaragwara.”
    13: Kaa ba langarlang kǝ uudah kǝ zǝr zarh kǝ Yesu kiyava fǝtǝra barka, kaa burǝgaraaburǝg nǝ mbǝrzahaan kǝ uudaha.
    14: Nǝgha ba Yesu, kaa badzǝg nǝ rǝviɗmahuuɗa, amaa taa kǝ iitǝra, “Aɗuwamtǝrɗuug kǝ zarǝh da vakara, tsamtǝrǝv biya. Aɗaba tlǝkǝsǝra Daadamazhigǝla dǝga jǝbba iitǝra.
    15: Ən tagkurtag kǝ jiira, baɗǝm daddakwa dlǝghabi kǝ tlǝkǝsǝra Daadamazhigǝl band kwa dlǝghǝg zǝrzǝr biya, dǝgaabi damma vakai biya.”
    16: Sǝtǝrdaa kǝ zarhiin da vakaan hǝkytǝrna ba hǝɓǝkka, fahtǝraa kǝ dǝva, dlaɓa fǝtǝraa kǝ barka.
    17: Tǝghǝrdǝga ciyadagal Yesu vaakwahiina, kaa sagau kǝ uuda nǝ iin dǝ ǝmndǝrga, kǝlla kǝ iin kǝ ghwunj tǝvuukwana, kaa ndavarundavǝg kǝ iin taakiya, “Dadda tsagaa dǝgita jiijiira, awan da ɓag nai ǝn tlǝkkǝna kǝ shifǝga tangw damma zǝrazǝri?”
    18: Aiyam Yesu taa kǝ iina, “Aujilbǝg kǝskǝgh ɗa kai dadda jiiri? Au mǝng dadda jiira, ba Daadamazhigǝl palla.
    19: Abi agha sǝrgasǝrǝg kǝ dǝgiti taag na adzahadzaha, ‘Tsǝbi kǝ shiffǝg biya. Ɓagbi kǝ gwaragwar biya. Ɓagbi kǝ gǝl biya. Ɓagbi kǝ shiida fiid biya. Ɓagbi kǝ mbaɗiira biya. Agha faara kǝ daadagha ar dǝ baabagha.’”
    20: Am daala zǝrna, “Dadda tsaga dǝgita, abi tsufananttsuufǝg kwanahaan ciigǝt bamma zarhǝra.”
    21: Kaa vazǝgaan kǝ Yesu dǝ vazǝga wayakǝvǝra, amaa taa kǝ iina, “Ba dǝgit pal wa tǝmkaana. Dǝg valǝtvǝlǝg kǝ dǝgiti agha dǝ vakai nǝng baɗǝm, agha vǝltǝr kǝ talagaha, agha tlǝkkǝna kǝ hyah ba ɗyak ma ghǝrazhigǝla. Tǝhalakwha agha sagau da gatkwagtǝga.”
    22: Bad cinngacinngaan wah kǝ ǝlbǝgna kaa badza huɗvǝg kǝ iina, kaa gwiya daas kǝ iin ma badzǝga ǝrviɗmahuɗa, aɗaba dadda hyah nǝ iin ba vaivaiya.
    23: Kaa vaztǝrvazǝg Yesu kǝ mbǝrzahaan, amaa taa kǝ iitǝra, “Da dǝga ba dlah yaa daddaha hyah damma tlǝksǝrra Daddamazhigǝla!”
    24: Kaa ɓa jappǝra kwanǝn kǝ ǝlbǝg kǝ mbǝrzahaana. Kaa gwiya tagǝtǝrtag kǝ Yesu, “Kuram zarhara, da dǝgaa ba dlah, nǝ uud damma tlǝksǝra Daadamazhigǝla!
    25: Da tsaftsaf ba kǝ adlǝgwam dagal tǝ ɗuula liipǝr, tǝghǝr kǝ dadda hyah daadamma tlǝksǝrra Daadamazhigǝla.”
    26: Cinngara ba nǝ mbǝrzahaan ǝndkwaha, kaa gwiya fǝgarna ɓa jappǝr kǝ iitǝr ar ndava ghǝrahaatǝr taakiya, “Mabba ndǝkwaha, warwa da tlǝkǝna katǝgi?”
    27: Kaa vaztǝraavazǝg kǝ Yesu amaa, “Vak kǝ uudaha, mbǝlembǝlena. Vak Daadamazhigǝla mbǝle biya. Aɗaba makwar kǝ dǝgit ɓagaɓag vak Daadamazhigǝla.”
    28: Aiyam nǝ Bitrus taa kǝ iina, “Ɗuwamndarsɗuug nǝmnd kǝ dǝgahaamnd baɗǝm kiyava gata kǝgha.”
    29: Aiyam nǝ Yesu, “Ən tagkurtag kǝ jiira, daddakwa ɗuugars vǝgyaana, bi zǝrha babbaana, bi dǝghwaha babbaana, bi babbaana, bi daddaana, bi zarhaana, bi guhahaana mbakyarvad kaiya ard ǝlbǝg marawa,
    30: dǝgiti da tlǝkǝna nǝ iin ma kwanǝn kǝ zamana, da jǝguujig shǝg dǝrmǝkka, tǝghǝr kǝ tlǝkna hǝnyaha, ard zarha baabaha, ard ɗughwaha baabaha, ard yahha, ard zarha, ard guhaha, bakǝva kwaha da tlǝkǝna bamma dlaɗa. Tǝhalakwaha ma zamanǝn da sagauna, da tlǝkna kǝ shifǝgga damma zǝrazǝra.
    31: Baɗyak nǝ uudahi ar dǝga zǝngwa, ar da nǝg kǝ dǝga halla. Dǝga halla ar da nǝg kǝ dǝga zǝngwa.”
    32: Ar tǝghǝrdǝga dagat damma Urshalima, Yesu tǝvuukwa mbǝrzahaan ar gatǝg tǝ halla ar ɓaa jappǝra. Uudahi gattǝr tǝ hal dlaɓa ar gǝdzǝga. Kaa ɗahtǝrǝtɗahǝg nǝ Yesu kǝ kǝlawa tar buna damma dlǝmmbaava, kaa gwiya tagǝtǝrtag kǝ iin kǝ dǝgiti da dzǝgaar dǝ iina. Amaa,
    33: “Kiyam dagat damma Urshalima. Da vǝlvtǝrvǝlǝg nǝ Zǝra Uuda damma dǝv kǝ maalah ma zhiilakǝsuufah ar dǝ lii tsaga adzahadzaha Musa. Ard ghwudarda kǝ shariya ǝmtsǝga, ard vǝltǝr kǝ lii ar Yahudah biya.
    34: Ar da nenegaana, ard tafarva kǝ ashavaiya, ar da kalaakan dǝ kiiɓa, ar da tsana. Tǝhala hǝnga hǝkǝrɗa da ciyit dǝ shifǝgga.”
    35: Tǝhala kwaha, kaa sagau kǝ zarha Zabadi, Yakubu ard Yuhwana, davak kǝ Yesu, am nǝ iitǝr taa kǝ iina, “Dadda tsaga dǝgita, kǝm naa ghala dǝgit vakagha.”
    36: Aiyama taa kǝ iitǝra, “Au wam naag nǝ uuram ǝn ɓagkurani?”
    37: Aiyam nǝ iitǝra, “Kǝm ghala kǝgha mada dǝghaghan damma ndangǝra kwargagha, pallamnd maa ndzan tǝ dǝvaa kaffagha, pal tǝ dǝvaa ghyaɓɓagha.”
    38: Am Yesu taa kǝ iitǝra, “Am sǝrgai kǝ dǝgiti am ghalǝg nǝ uuram biya. Am hǝɓɓǝgahǝɓǝg kǝ dlaɗǝn ǝn da hǝɓǝg naina? Nii am dzugwantdzug ɓagkura nǝ uud kǝ hulfa tsuufǝgi da bagǝwa nǝ uuda?”
    39: Ngwaraangug taakiya, “Aana, kǝm dzugwantdzugwa.” Am nǝ Yesu taa kǝ iitǝra, “Aana, am da hǝɓɓǝgahǝɓǝg kǝ dlaɗi ǝn da hǝɓǝg naiya, da ɓagkura dlaɓ nǝ uud kǝ tsuufǝg dǝ hulfa tsuufǝgi da ɓaggwa nǝ uuda.
    40: Ndzǝgga tǝ dǝvaa kaffara, bi tǝ dǝvaa ghyaɓara, tlǝrar bi nǝ wah biya. Dǝgaha lii ɓadlavǝtǝrna mbakyarvad iitǝr nǝ wah kǝ vakavaka.”
    41: Cinngaraba nǝ kyalma mbǝrzah kǝlawǝn kwana, kaa badza ǝrviɗmahuɗ kǝ iitǝr dǝ Yakub ard Yuhwana.
    42: Kaa ɗahtǝrǝtɗahǝg kǝ Yesu da vak palla amaa taa kǝ iitǝr, “Am sǝrgasǝrǝg ma lii Yahudah biya, lii sǝrǝvtǝrsǝrg dǝ kwarga, ar martǝr ndzǝɗ kǝ uudahaatǝra, uudah maamaalatǝr ndakwani ar martǝr ndzǝɗ kǝ uudahaatǝra.
    43: Da maay ǝndkwah ma taatakaru biya. Mbakyarvad kwaha, baɗǝm daddakwa naa nǝg kǝ maal ma kurama, barari ɓagarnǝs kǝ kwatnahǝr kǝ kyalǝma.
    44: Dlaɓa baɗǝm daddakwa naanǝg kǝ maal ma kurama, barari naal ɛɛva uudah baɗǝmma.
    45: Aɗaba Zǝra Uuda sahi mbakyarvad ɓagvarnǝs kwatnahǝr biya, sahi da ɓa kwatnah nǝ iina, dlaɓa vǝlda kǝ shiffǝgaan kiyava varra uudah baɗyaka.”
    46: Daragha ba nǝ iitǝr damma Yariko. Ba iin ndakwani saggal ma Yariko dǝ mbǝrzahaana, ǝmtaɗ dǝ uudah baɗyaka, ndza mǝng nǝ uuda nǝ iin gulf cǝhurgan ma ghyaba ɗuul ghalga. Ɗaagaan Bartmawus, zǝra Timawus.
    47: Cinngha ba nǝ iin taakiya Yesu zhiil Nazaret wa ghuda dagala, dzǝgant kǝ iin kǝ kungy taakiya, “Yesu, zǝra Dauda, zhukwadaalazhuga!”
    48: Kaa burǝgaraaburǝg kǝ uudah baɗyak, ar taakiya “Ndzandzǝga,” bakǝva kwaha gwiya dzǝgant kǝ iin kǝ ghai baɗyaɗyaka amaa, “Zǝra Dauda, zhukwadaalazhuga!”
    49: Kaa ghacgaghacǝg kǝ Yesu amaa, “Ɗahamwantɗahǝga.” Ar ɗahant kǝ iitǝr kǝ gulfna, am nǝ iitǝr taa kǝ iina, “Ciiga, dlaiga wa ɗaa kǝgh nǝ Yesu.”
    50: Bǝlda kǝ nuurana, bǝrhwaat kaa ciig kǝ iin davak kǝ Yesu.
    51: Kaa ndavǝgarundavǝg kǝ Yesu taakiya, “Au wagha naag nǝng ǝn ɓagkani?” Am gulfǝn taa kǝ iina, “Dadda tsaga dǝgita, manaa naa nǝghaganǝghǝgga.”
    52: Aiyam Yesu taa kǝ iina, “Dǝga, fadghǝragha mbakambǝga.” Caaricaari kaa nǝghǝganǝghǝg kǝ iina, kaa gata Yesu kǝ iin dagal tǝ ɗuula.
  11:
    1: Hǝrzarǝt ba nǝ iitǝr daadamma Wursalima, kaa ghacǝgagacǝg kǝ iitǝr ma Betafaji ard Betani, vaka Gaval kwa dǝ Uufaha Zaituna, kaa ɓǝlgantɓǝlǝg nǝ Yesu kǝ mbǝrzahaan buwa,
    2: Amaa taa kǝ iitǝra, “Damdǝg damma gǝdzǝrkǝsǝn tǝvuukwaruna. Baɗ daasaruwa am da nǝghǝganǝghǝg kǝ gǝlaaɓa aghyungngw nguɗanguɗana, kwa tapavǝnai ɗalgaan biya. Pǝlamdaapǝlga
    3: Akwama ndavakurundavǝg nǝ uud taakiya, ‘Aujilbǝg kǝskuram pǝlgaani?’ ‘Am tagar taakiya, Yaazhigǝl wa naagaana, da gwiigaan saas bandakwan ndakwana.’”
    4: Kaa dagal kǝ iitǝra, ar nǝgha kǝ gǝlaaɓa aghyungngw nguɗǝga tǝ ghaiya hǝnnyaha tǝ ɗuula. Ar tǝghǝrdǝga pǝlgaana,
    5: am lii ghacǝga vaakwahiin taa kǝ iitǝra, “Am pǝllǝg damǝr kǝ aghyungwini?”
    6: Kaa ngwangug kǝ mbǝrzahaan buna bakalkal bandkwa tagatǝr Yesu, kaa ɗuutǝrǝsɗuug kǝ uudahiin dagal dǝ aghyungngwiina.
    7: Sarardǝv ba nǝ iitǝr kǝ aghyungngwǝn kǝ Yesu, ar ɓalǝt kǝ sǝɗavahaatǝr tǝ vakaiya, kaa ɗalgaan kǝ Yesu cǝhura tǝ vakaiya.
    8: Kaa ɓalgaɓalǝg kǝ uudah kǝ sǝɗavahaatǝr baɗyak tǝ ɗuula, kyalǝmah dlaɓa ɓalara dǝva uufahi ghwadarda nǝ iitǝr saama guhaha.
    9: Lii tǝvuukwana ard lii tǝ halaana ar ɗiyaru kǝ cau taakiya, “Galyamgalǝg kǝ Daadamazhigǝla! Bark kǝ daddakwa saay ma ɗaaga Yaazhigǝla!
    10: Bark kǝ tlǝkǝsǝrǝn da saayǝn kwa dǝga daadamnd Dauda. Galyamgalǝg kǝ Daadamazhigǝla.”
    11: Dagha ba nǝ Yesu damma Wurshalima, kaa daas kǝ iin damma gaagazaiya vǝgya Daadamazhigǝl vazǝna kǝ dǝgitah badǝmma, ɓǝlaaɓǝlǝg tsau ba hwaasa, kaa gwiyaghǝra daas ǝmtaɗ dǝ mbǝrzahaam damma Betani.
    12: Ciyarǝt ba nǝ iitǝr ma Betani dlakaduraana, kaa njǝkǝnjiig nǝ wai kǝ Yesu.
    13: Nǝgha ba nǝ iin kǝ uufa ghǝgyiv kwad hyimiya, kaa da vazgaan mbatak tlǝkǝnatlǝg kǝ zǝr tǝ vakaiya. Dagha ba nǝ iin da tǝvǝgha, tlakǝnabi aandzu ndau tǝ vakai biya, ba hyimiya, aɗaba sarta yaa zǝra ghǝgyiv biya.
    14: Amaa taa kǝ uuffa ghǝgyivǝna, “Ba ɗǝmma aa gwiya zǝbbi nǝ uud kǝ zǝr tǝ kǝgh biya!” Cinngaracinng mbǝrzahaan kǝ dǝgiti tagada nǝ iina.
    15: Dagha ba nǝ Yesu damma wurshalima, kaa daas kǝ iin damma gaagazaiya Vǝgya Daadamazhigǝla farzha kǝ lagwa lii sagwa dǝgitah ard lii vǝlgaana. Kaa tlagars dlaɓ baz tebǝraha lii mbǝɗa kwaɓa baz avǝdaha lii valla takalamasara.
    16: Tsarva kǝ uudah kǝ ghwadadagal dǝ dǝgitah ma gaagazaiya Vǝgya Daadamazhigǝla.
    17: Kaa ba tsagtǝrtsag kǝ iin kǝ uudah amaa, “Vindavavindǝg taakiya, “‘Da ɗahav nǝ vǝgyar dǝ Vǝgya dzǝgwazhigǝla dlamakǝlaaw baɗǝmma.’ Namdalnǝg nǝ uuram kwan kǝ ‘vakka shǝɓɓa gǝlaha.’”
    18: Cinngaraba nǝ maalah ma zhiilakǝsuufah ar dǝ lii tsaga adzahadzaha Muus kǝ kwanǝn kǝ ǝlbǝga, kaa fǝgarzhafǝg kǝ iitǝr kǝ gata ɗuula tsǝgaana, aɗaba ar gǝdzǝgaana, kwakyarvad baɗǝm dzahava dlamakǝlaawǝn ar ɓa jappǝra tsagaanana.
    19: Ɓǝlaa ba hwaasa, kaa mǝlla dagal kǝ Yesu ard Mbǝzahaan ma kǝssiina.
    20: Dlakadur bawur ar ghudadagala, kaa nǝghǝganǝghǝg kǝ iitǝr kǝ ghǝgyivvǝn ghulalghulǝg tangw dat tlaliyaana.
    21: Dzamghanidzamǝg Bitrusa, amaa taa kǝ Yesu, “Dadda tsaga dǝgita, zharga! Ghǝgyivvǝn tlafgha nǝngǝn ghulalghulǝgga!”
    22: Ngwatǝrangug nǝ Yesu amaa, “Famdǝghǝrǝtfǝg tǝ Daadamazhigǝla!
    23: Bak jiir wan tagkurtaga, akwama fǝdghǝrǝtfǝg nǝ uud tǝ Daadamazhigǝla, tagardatag kǝ aghwǝn taakiya ciig ɓǝldǝmɓǝlg kǝ ghǝragh ma yiwahaiya. Akwama ɓagaabi kǝ ndaundawur ma ǝrviɗmahuɗaan tǝghǝr kǝ dǝgiti aa tag nǝ iin biya, da ɓagvarɓaga.
    24: Mbakyarvad kwaha wan tagkurtaga, baɗǝm nǝ dǝgiti am ghalǝg nǝ uuram ma dzǝgwazhigǝla, famdǝghǝrǝtfǝga taakiya tlamkǝnatlǝga, da nǝg kǝ dǝgaruwa.
    25: Dlaɓa makwar kǝ sarti am ciigǝt nǝ uuram da dzugwazhigǝla, akwama mǝng dadda kwamma hǝkyna nǝ uuram ma ǝrviɗya, am ɓǝsharnana, aɗaba ghǝrava Daadaruwi maghǝrazhigǝl ndakwani da ɓǝshkurna kǝ haipaharuwa.”
    26: Aiciya, akwamam maay ɓǝstǝrnaɓǝshǝg kǝ haipahaatǝr kǝ uudah biya, daadaruwi ma ghǝrazhigǝl ndakwani da maay ɓǝshkuranaaɓishǝg biya.
    27: Kaa gwiya daas kǝ iitǝr damma Wurshalima. Kaa gwaiyav kǝ Yesu ma gaagazaiya vǝgya Daadamazhigǝla, kaa sagau kǝ lii maalah ma zhiilakǝsuufaha, ard lii tsaga adzahadzaha Muusa, ard maalah tǝghǝr kǝ vǝgya Daadamazhigǝla sa vakaana.
    28: Am nǝ iitǝr taa kǝ iina, “Agha ɓag dǝ kwar kǝ ndzǝɗ nǝng kwanahaan kǝ dǝgitahi? Warwa vǝlakak ndzǝɗa ɓaagaani?”
    29: Am Yesu taa kǝ iitǝra, “Mǝng nǝ ndavǝgi ǝn na ndavkuru naiya. Am nguwi ghǝravaruwa, kai ndakwi ǝnda tagkurtag ma hulfa kwar kǝ ndzǝɗ wan ɓag nai kǝ tlǝr dǝ vakaiya.
    30: Tagamwataga, ndzǝɗǝn ɓagga Yuhwan kǝ tsufǝg dǝ vakaiyǝntsa, vǝlghar Daadamazhigǝl nii uudhi?”
    31: Kaa fǝgarzhafǝg kǝ iitǝr kǝ agajaw ma taatakaatǝr, taakiya, “Akwama tagǝyamatag taaki, ‘Vak Daadamazhigǝla,’ da tagkiyamtag taakiya, ‘Aujilbǝg famdǝghǝrǝt bi tǝ iin biyi?’
    32: Kiyam tagatag taaki, ‘Vak kǝ uud kwana?’” (Ar gǝdza dǝgiti da ɓagtǝr nǝ uudaha, aɗaba baɗǝm nǝ uudah kǝsarantkǝsǝg taakiya tlayanga Daadamazhigǝl nǝ Yuhwana.)
    33: Kaa ngugarangug kǝ iitǝr kǝ Yesu taakiya, “Kǝm sǝrga biya.” Aiyam Yesu taa kǝ iitǝra, “Kai ndakwi ǝn maay tagkurtag kǝ ndzǝɗi ǝn ɓag nai kǝ tlǝr dǝ vakai biya.”
  12:
    1: Kaa zavuukw kǝ Yesu dǝ tagtǝr garava. Amaa, “Ndza mǝng nǝ uuda nǝ iin kwa ndza ɓagaa guuha inabiya, ngal tsarvaara kǝ iin dǝ hǝrgha takka, kwaɗa kǝ vakka pǝrtsa zǝraana, ndǝra kǝ iin kǝ gud kiyava dadda uufǝgaana. Vǝltǝr kǝ mbuucaan kǝ yaa daddaha uusǝgga, kaa dagal kǝ iin damma kwatlǝrǝn kǝ larda.
    2: Ɓaggaa ba sarta caa zǝra inabi, kaa ɓǝlgantɓǝlg kǝ dadda guhǝn kǝ kwatnahaan davak lii cauwara mbuca guhna, kiyava sǝgarda kyallǝma zarha inabi ma guha.
    3: Kaa viigǝtviig kǝ lii cauwara mbuucǝna, ar kalaakan, ar lagwars dagal bad dǝvaan dlǝɓa.
    4: Kaa gwiya ɓǝltǝrant kǝ kwatlǝrn kǝ kwatanaha. Kaa tsǝgaan kǝ iitǝr kǝ uudanǝn ma ghǝra, ar vǝlar kǝ dlaɗa.
    5: Gwiya ɓǝlant kwatlǝrǝna, ar tsan lii cauwara mbuuca guhna. Ɓǝltǝrant dlaɓ kǝ kyalǝm baɗyaka, kaa kalgakalǝg nǝ lii cauwara mbuuca guhǝn kǝ kyallǝma, ar ciɓa kǝ kyallǝmahaatǝra.
    6: Gwastǝn badlaɓ nǝ uud pall kwada ɓǝlǝg nǝ iina, iin nǝ zǝraana, kwa waig nǝ iina. Tǝhalakwaha kaa bǝlgaan kǝ iin da vakaatǝra, kaa tagaan kǝ iin taakiya, ‘Mbatak, ar da fǝgaarafǝg kǝ zǝrara.’
    7: Ar takkǝva lii cauwara mbuuca guhhǝn matatakatǝra, ‘Wanci nǝ dadda gwiya guhna, na tsiyamatsǝgga, kiyava nǝg guhiin kǝ dǝga miyama.’
    8: Kaa viigǝtviig kǝ iitǝra, ar tsana, ar ɗuuldan kǝ tluwa vǝghaan da gyǝlga ghǝrgha.
    9: “Kaa ndavtǝrundavǝg kǝ Yesu, amaa, ‘Awa da ɓag nǝ dadda guhinii? Da sagau da cǝɓa kǝ lii cauwara mbuuca guhǝna, da vǝltǝr kǝ guhiin kǝ uudahitlǝrna.
    10: Mbats tapamnabi kǝ karanta kwanǝn kǝ vindǝga ǝlbǝga Daadamazhigǝlǝn biya? Aɗaba vindavindan taakiya, “‘Akuri ɗuwarars yaa daddaha ndǝrga, Iin wa naal kǝ akura ndǝrǝg kwa juujig kǝ marawa.
    11: Kwanna tlǝra Yaazhigǝla, dlaɓa dǝga jappǝr vakamiyama.’”
    12: Kaa gata ɗuula viigaan kǝ maalaha Yahudaha, mbakyarvad nǝgharaakanǝghǝg taakiya tag tǝghǝr kǝ iitǝr kǝ garavǝna. Aɗaba gǝdzar uudaha. Mbakyarvad kwaha ar ɗuwars, kaa dagal kǝ iitǝra.
    13: Tǝhala zǝlam hǝɗiikǝna, ar ɓǝlant kǝ kyalǝma Farisiyah ard uudaha Hirudusa, kiyava ngarant dlǝgǝd kǝ Yesu ma ǝlbǝgahi da tag nǝ iina.
    14: Tsugwara ba nǝ-iitǝra, am nǝ iitǝr taa kǝ iina, “Dadda tsaga dǝgita, kǝm sǝrgasǝrǝg agha dadda jiira. Ba dǝgit pal nǝ uudah vakagha, aɗaba agha maay fa dagar ma uudah biya. Dlaɓa agha tsagaan kǝ ɗuula Daadamazhigǝl bak jiira. Magha tlǝg nǝng kalkalaan kǝskǝmnd ɗiigar hadam kǝ Kaisar tlǝkǝssa Ruma ɗyaka nii kalkalaan bihi?
    15: Kǝm ɗiigaan nii, kǝm maay hii?” Nǝghaakanǝghǝg Yesu kǝ muniyaatǝra, amaa taa kǝ iitǝra, “Aujilbǝg kǝskuram fǝsha kaiyi? Anakam kwabiin ɗiyav hadamiin dǝ vakaiyǝn ndana.”
    16: Kaa sǝgardaasǝg kǝ iitǝra, amaa taa kǝ iitǝr, “Garava war ard ɗaaga war wa tǝ vakaini?” Aiyam nǝ iitǝra, “Dǝga Kaisara.”
    17: Am Yesu taa kǝ iitǝra, “Dǝga Kaisar am vǝlar kǝ Kaisara. Dǝga Daadamazhigǝl dlaɓa am vǝlar kǝ Daadamazhigǝla.” Kaa ɓaa jappǝraan kǝ iitǝr ba vaivaiya.
    18: Sarǝvsǝg nǝ kyalǝma Sadukiyah sa vak kǝ Yesu. Iitǝr wa taakiya maay ciig ma gǝtlah biya. Kaa ndavgarundavǝg kǝ iitǝr taakiya,
    19: “Dadda tsaga dǝgita, vindakǝmndavindǝg nǝ Muusa taakiya akwama ǝmtsaaǝmtsǝg nǝ uudan kwal yigga kǝ zǝr dǝ uusaana, barari kǝsgaan nǝ zǝraabaan kǝ uusiina, yahara kǝ zarah kǝ zǝraabaana.
    20: Ndza mǝng zarhabaabah uuɗiffa, kǝsuukǝsǝg yag kǝ uus mtsan bakwal yigga kǝ zǝra.
    21: Kaa kǝsguukǝsǝg kǝ zǝra bu kǝ uusiina, ghǝravaan ndakwi ǝmtsaa bakwal zǝra. Dǝga hǝkǝrɗ ndakwani band kwaha.
    22: Bandkwah dlaɓa uuɗif ǝmtaɗaatǝra, ǝmtsahara bakwal zǝra. Tǝhalakwaha kaa ǝmtsǝg kǝ uusiina.
    23: Aitsa, da nǝg kǝ uusa warci pal ma iitǝr davala ciig magǝtlahi? Aɗaba uuɗifamtaɗatǝr kǝssarukǝsǝga.”
    24: Ngwatǝrangug nǝ Yesu, amaa, “Dzamaghǝraru kalkal biya mbakyarvad am sǝrgabi kǝ Əlbǝga Daadamazhigǝl vindavindan biya, am sǝrgabi dlaɓ kǝ ndzǝɗa Daadamazhigǝl biya.
    25: Masartǝn da ciig lii ǝmtsaharaǝmtsahǝg tǝ faaya, ar da maay ghwalvah kǝssa uus biya, ǝnghwasah ndakwani ar maay da kǝssa zhiil biya, ar da nǝg band zǝrɓǝlgah kwa ma ghǝrazhigǝla.
    26: Tǝghǝr kǝ ciig ma gǝtlaha, tapamnabi kǝ karantǝgaan ma kakaɗa Muus tǝghǝr kǝ kaar zǝg tǝ uuf ma suuy, taakiya, ‘Kai Daadamazhigǝla Ibrahima, ard dǝga Ishaku, ard dǝga Yakubu biya’?
    27: Iina, Daadamazhigǝla lii ruwaraaruug biya, dǝga lii dǝ shiffǝga. Tǝkamaatǝkǝg ba linglinga.”
    28: Pall ma lii tsaga adzahadzaha Muus tlatǝraatlǝg ar ɓalagajawa ma taatakaatǝra. Nǝghaaka ba nǝ iin taakiya ngwatǝrangug Yesu ba kalkala, kaa ndavǝgarundavǝg kǝ iin taakiya, “Kwar kǝ adzahadzah wa juujig ba vaivayi?”
    29: Ngugharangug nǝ Yesu amaa, “Kwa juujig baɗǝmma iin taakiya, ‘Cinngamcinng, uudaha Israˈla, Yaazhigǝl Daadamazhigǝlamiyama, Yaazhigǝl ba palla.
    30: Waig kǝ Yaazhigǝl Daadamazhigǝlagh dǝ ǝrviɗmahuɗagh baɗǝmma, ard shifǝggagh baɗǝmma, ard dzamaghǝragh baɗǝmma, ard ndzǝɗagh baɗǝmma.’
    31: Dǝga bu iin taakiya, ‘Waig kǝ tlǝghaarawakyaghagh band kwagha naag nǝng kǝ ghǝragh.’ Maay nǝ watlǝrn kǝ dzahadzahi juujig kǝ kwanahaan biya.”
    32: Aiyam dadda tsaga adzahadzahǝn taa kǝ Yesu, “Tagghǝdatag bakalkal dadda tsagadǝgita, Daadamazhigǝl ba palla, maay watlǝrn biya ba iina.
    33: Aa waiyavwaig bad rǝviɗmahuuɗ palla, ard dzamaghǝragh baɗɗǝmma, ard ndzǝɗagh baɗɗǝmma, agha waiyant kǝ tlǝghaarawakyaghagh band ghǝragha, juujig baɗǝm kǝ kyulǝgga ǝmcagga ard kyulǝgga hǝrga.”
    34: Nǝgha ba nǝ Yesu kǝ ɗuuli ngwaa nǝ iin dǝ dabariya, aiyama taa kǝ iina, “Aghaba hɛɛf dǝ tlǝksa Daadamazhigǝla.” Tahalakwaha maadlai wa gwiya shughaana gyiya ndavgaru dǝgiti tlǝrn biya.
    35: Ma sarta kwandza tsaga dǝgit nǝ Yesu ma vǝgya Daadamazhigǝla, kaa ndavtǝruundavǝg kǝ iin taakiya, “Ar tag ndar nǝ lii tsaga adzahadzah taakiya Kǝristi zǝra Daudi?
    36: “Dauda kataghǝran ndakwi, tǝdvad Shǝɗɗǝkw Daadamazhigǝl tagaatag taakiya, “‘Am Yaazhigǝl taa kǝ Yaazhigǝlara, Ndzandzǝg tǝ dǝvaa kaffara, Bamma fantǝraafǝg kǝ tlǝghumahagh da mazhangyil kǝ shǝgahagha.’”
    37: “Ba Dauda kataghǝran ndakwi ɗahaɗahǝg kǝ iin dǝ ‘Yaazhigǝla’. Da nǝg ndar kaci kǝ zǝr vak Daudi?” Cinngaraba nǝ uudah kǝ ǝlbǝgǝn taggada nǝ Yesuna, kaa dlaig kǝ iitǝra.
    38: Ma tsagaanaana, am Yesu, “Famfǝg kǝ hǝnkal dǝ lii tsaga adzahadzaha Musa, ar naa ba gwaiyav ma sǝɗav ɗyakɗyaka. Dlaɓa ar naa ba tagvǝtǝr nǝ uuss ma kasukwa.
    39: Ar naa ba vǝlǝvtǝr nǝ dǝga ndzǝganah ndang ma guda dzǝgwazhigǝla, ard dǝga ndzǝgaan maraw vakka hwaɗaga.
    40: Iitǝr nǝ lii za kadlanga ǝnghwasahi ǝmtsahara zalahaatǝra. Dlaɓa ar dzǝgwazhigǝl tlaɗɗa kiyava nǝghǝvtǝrnǝghǝgga. Da vǝlǝvtǝrvǝlǝg dlad ba vaivaiya.”
    41: Cǝhurga ma guda dzǝgwazhigǝla nǝ Yesu vaka cauwa ndzayau, vazza ɗuuli ar diig nǝ uudah kǝ kwaɓatǝr ma dǝga ɗǝya ndzayau. Kyalǝma yaa dadda hyahha baɗyaka ar ɗiigaan kǝ kwaɓ baɗyaka.
    42: Kaa sagau kǝ wagiggiin talaga, ɗǝya kǝ kalami buwa, kwa dǝt bi nǝ pallǝraan dat kwaɓ biya.
    43: Kaa ɗahgantɗahǝg nǝ Yesu kǝ mbǝrzahaana, amaa kǝ iitǝra, “Ba jiirjiira, wan tagkurtaga, kwabǝn aa ɗiiga nǝ wagigǝn ma dǝga ɗǝya ndzayauna, juujig kǝ dǝga kyalma uudah baɗǝma.
    44: Baɗǝmmaatǝr vǝlarda bamma ɗyakǝra dǝgiti ar dǝvakai nǝ iitǝra, wagyigna, ma ndzǝgana talagǝraana vǝladavǝlǝg kǝ dǝgiti dǝvakai nǝ iin baɗǝmma, baz dǝgiti tsaghǝr nǝ iin tǝ vakaiya.”
  13:
    1: Tǝɗuula Sagal nǝ Yesu ma vǝgya Daadamazhigǝla, am pal ma mbǝrzahaan taa kǝ iina, “Dadda tsagga dǝgita, vazǝg kǝ maandala akurahaan ard ndǝrgahaana, dǝgaha jappǝra!”
    2: Am Yesu taa kǝ iina, “Agha nǝghǝganǝghǝg kǝ maandala hǝnyahahaana? Da dlagav baɗǝmma. Da maay ɗuwav nǝ akur aandzu pal tǝghǝr kǝ zǝraabaan biya.”
    3: Cihurgan nǝ Yesu tǝ Aghwa Zaitun kwar vazakav magyimagyi dǝ Vǝgya Daadamazhigǝla, kaa ndavgarundavǝg kǝ Bitrusa, Yakuba, Yuhwana, ard Andrawus ba daghuvaatǝr taakiya,
    4: “Tagkǝmndtaga, da dzǝgaar hǝr wanahaan kǝ dǝgitahi? Au nǝ dǝga sǝrgi da nǝghǝvaaka nǝ iin tǝ vakai akwama hǝrz sarta dzǝgardzǝgaani?”
    5: Aiyam Yesu taa kǝ iitǝra, “Famfǝg kǝ hyǝmiya, aa valkurdai nǝ uudah biya.
    6: Uudah baɗyak ar da sagau ma ɗaagara, ar da taakiya, ‘Kai nǝ iina,’ ar da valtǝrda kǝ uudah baɗyaka.
    7: Akwama cinngamacinnga kǝ ǝlbǝga ghwaava ard dlaghalgaana, gǝdzam biya. Barari da dzǝgardzǝg wanahaana, bakǝvakwaha ghaalaan ndakwani sǝghǝv bi ndan biya.
    8: Uudaha kǝssi tlǝrna, ar da dǝgaradǝg kǝ uudaha kǝssi tlǝrǝn dǝ ghwaava, kwarga ar da ɓa ghwaav dǝ kwarga. Da gajagav nǝ haay vakavak shahshaha, da mǝng baz waiya. Baɗǝm wanahaana iin bi gyigyiya dlaɗiin biya. Ba fǝgarzhaana.
    9: Famfǝg kǝ hyimmi tǝ ghǝraharuwa, aɗaba da langkurlang nǝ uuda damma guda shariya, da kalkuraaka nǝ uud ma guda dzahava Yahudaha. Da langkurlang nǝ uud da tǝvuukwa tlǝvuukwaha ard tlǝkǝsaha mbakyarvad dǝ ɗaagara, am da tagǝda kǝ shiid maraw tǝghǝr kǝskai tǝvuukwatǝra.
    10: Lakuti sagau nǝ halavuwaana, barari tagǝvtǝra nǝ ǝlbǝg maraw kǝ uudaha duni baɗǝma.
    11: Ba kǝlaa sarti viikurǝt nǝ uuda, akwama dakurdaadǝg da vaka ta shariya, ndavambi kǝ dǝgiti am da tag nǝ uuram biya. Ndzaa ba tagamtag kǝ dǝgi da vǝlkur nǝ Daadamazhigǝl ma kwahiin kǝ sarta, aɗaba kurambi wa taaghaiy biya, Shǝɗǝkwa Daadamazhigǝla.
    12: Zǝraaba da vǝlda kǝ zǝraabaan da tsǝvana, daad dlaɓa da vǝlda kǝ zǝraana. Zarh dlaɓ ar da ciyarant kǝ yaatǝra kwa da fǝgara cǝɓǝvtǝra nǝ yaatǝra.
    13: Baɗǝm nǝ uudaha ar da naakur bi mbakyarvad ɗaagar biya, Baɗǝm nǝ daddakwa ghacaghacǝg dat ghalaana, da katavva.”
    14: “Akwama nǝghamanaghǝg kǝ dǝgit dzah ma vǝgya Daadamazhigǝla, kwada fǝgara uudah kǝ ɗuwa vakavakina, (Aa nǝghaakanǝghǝg dadda karantǝgaan taakiya) lii ma larda Yahudiya aa ǝmdǝrarǝmdǝrǝg dagat damma aghwaha.
    15: Kwa tǝ ghǝragud dlaɓa, aa sǝbbi saay samma hǝnyah da kǝssa dǝgit biya.”
    16: Dadda kwama guh dlaɓa, aa sǝbi saasa hǝnyah da kǝssa sǝɗavan biya.
    17: Dǝga zhuwadaal kǝ ǝnghwasahi ǝnhuɗa ard lii dǝ zǝr ma dlaaga ma kwanǝn kǝ sarta!
    18: Dzǝgwamdzǝg kǝ zhigǝl aa dzaarbi wanahaan kǝ dǝgitah ma sarta viyakǝsa biya.
    19: Ma kwahiin kǝ sarta, da hǝɓav dlaɗ ba vaivai kwa tapavǝnabi kǝ hǝɓgaan ciigǝt ma sarta kwa vǝrɗya nǝ Daadamazhigǝl kǝ duni biya, tangw damma kwanǝn kǝ sarta. Da maadlai gwiya dzǝgardzǝg hulfa kwan kǝ dlaɗ ba dǝm biya.
    20: Maa maay kwakyarvad gulghanigulǝg nǝ Yaazhigǝl kǝ hǝngahin biya, maa maay nǝ uuda dǝgshigi da ngǝdlǝg biya. Mbakyarvad uudahaan dzǝrghaaka nǝ iina, kaa gulǝnagulǝg kǝ iin kǝ hǝngaha.
    21: “Ma kwahin kǝ sarta baɗǝm daddakwa tagkur taakiya, ‘Vazǝga, wai nǝ Kǝristi vaakwana!’ bi, ‘Vazǝg, wai nǝ iin vaakwaha!’ Haiyamant biya.
    22: Aɗaba kǝristiya fiidfiida ard tlayangaha fiidfiida ar da sagala, ar da ɓa dǝga sǝrǝga ard dǝgaha jappǝrha, kiyava vala uudaha, akwama ɓagaɓaga, baz lii dzǝravtǝraakadzǝrga.
    23: Mbakyarvad kwaha famfǝg kǝ hyǝmiya! Tagankuratag kǝ dǝgitah baɗǝm bamma sarta.”
    24: “Aiciya, ma kwahiin kǝ sarta, tǝhala dlaɗǝn da sagauna, “‘Faci da ba niknikka. Kyil dlaɓa da maay ɓa parakrak biya.
    25: Kwadladlah ar da ɓala saay ma ghǝrazhigǝla. Da gajagav nǝ dǝgitahi ɗyakɗyak tǝ zhigǝla.’
    26: “Tǝhala kwaha da nǝghǝvanǝghǝg Zǝra Uud saay ma akumba dǝ ndzǝɗa ard ndanggǝra.
    27: Tǝhala kwaha da bǝldi kǝ zǝrɓǝlǝgahaan ar da dzahant kǝ lii dzǝrghaaka nǝ iin sagatsǝga, ard dagatdǝga, ard dagaldǝga ard saadǝsǝga, cigǝt tǝ ngyilla duniya dat ghaala zhigǝla.
    28: “Tsagamtsag kǝ ndzǝgana uufa ghǝgiva. Akwama fǝgharzhafǝg nǝ dǝvahaan kǝ ɓa ndaɗa, dlaɓa farzha kǝ ɗa daala hyǝmiya, sǝramasǝrǝg taakiya hǝrz nǝ madara.
    29: Bandkwah dlaɓ akwama nǝghamanǝghǝg kwanahaan kǝ dǝgitah dzǝgaardzǝga, sǝramasǝrǝg taakiya hǝrz sarta, ba hɛɛf dǝ ghaiya wakyagha.
    30: Bak jiijiira wan tagkurtaga, uudaha kwanǝn kǝ zamana ar da maay ǝmtsǝg biya, bamma dzǝghardzǝg wanahaan kǝ dǝgitah baɗǝmma.
    31: Ghǝrazhigǝla ard haaya ar da ghyǝnga, ǝlbǝgara badǝmma da maay ghyǝng biya.
    32: “Kwan kǝ faciya ard sarta Maay wa sǝrgasǝrǝg biya, aandzu, zǝrɓǝlgahi ma ghǝrazhigǝla, aandzu Zǝriina, bamma Daad palla.
    33: Famfǝg kǝ hyǝmiya, am ɓadlǝvǝghana, aɗaba am sǝrga bi kǝ faciya ard sarti da dzǝgaar wanǝn biya.
    34: Band uudi kwa tǝghǝrdǝga dagala, akwama ɗuugharsɗug kǝ hǝnyaha fǝtǝrdǝm ma dǝv kǝ ɛɛvahaana, ma kwaratǝr bad tlǝri da ɓag nǝ iina. Tǝhalakwaha tagar kǝ dadda uuffa hǝnyaha taakiya aa ɓadlǝvaɓadlǝgga.
    35: Mbakyarvad kwaha, ndzamandzǝg ba ɓadlaɓadlana, aɗaba am sǝrgabi kǝ sarti da saas daddahǝnyah biya, ma da saa dǝghwaasa, ma mahuɗa vǝɗɗa, bi sarta wiiga ghwatǝkala, bi dlakadur ba wurra.
    36: Aa da tlǝkuraabi gahragw am hǝnahaar biya.
    37: Dǝginǝn ǝn tagkur naina, ǝn tagtǝr kǝ uudah baɗǝma, ‘Ndzamandzǝg ba ɓadlaɓadlana!’”
  14:
    1: Tǝmmaa ba hǝng bu kǝ Hwaɗaga Haarakǝssa Dzava Hǝnyaha ard Hwaɗaga Haarakǝssa Bruudi Kwal Yista, kaa gata ɗuula viiya Yesu kǝ maalah ma zhiilakǝsuufah ard lii tsaga adzahadzaha Musa dǝ gǝlgǝla, kiyava tsǝgaan kǝ iitǝra.
    2: Ar taakiya, “Aa ɓagavbi daghuvala hwaɗagga haarakǝs biya, aɗaba aa da ciyarantbi nǝ uudah kǝ uushav biya.”
    3: Ma sartǝn ndza ma Bitani nǝ Yesu, za kaf ma vǝgya Siman kwa njikǝn vǝcca, kaa saas kǝ uussiin dǝ mǝrta wala tǝrshan reghareghaan kwa ba pir ganaan ɓagava dǝ nardi, cǝɓnan ɗiyarǝm kǝ iin ma ghǝra.
    4: Kaa Badza ǝrviɗ kǝ uudahi ndzar vaakwahiina, am nǝ iitǝr ma taatakaatǝra, “Aa badzǝvda kiyavau wallǝn tǝrshin ǝndkwani?
    5: Akwmaa vǝlavǝt nǝ iina, maa tlavkǝnatlǝg nǝ kwaɓa bariyam kwa juujig kǝ dǝga viig palla, maa velvtǝr kwaɓiin kǝ talagaha!” Kaa caagyi kǝ iitǝr tǝghǝr kǝ uusiin ba vaivaiya.
    6: Aiyam nǝ Yesu taa kǝ iitǝra, “Ɗuwamarsɗuugga. Am gargya kiyavauwi? Abi, dǝgit maraw waa ɓagwi nǝ iina.
    7: Ba kǝlaahǝnga am ba ǝmtaɗ dǝ talagaha. Mam naagaan am ɓagtǝraaɓag kǝ hɛrǝr aandzu ba hǝra, aɗaba kaiya ǝn maay kǝlaahǝng ǝmtaɗ dǝ kuram biya.
    8: Ɓagaaɓag kǝ kǝlaa ndzǝɗaana. Ɗaighwaaɗaig nǝ iin kǝ walla tǝrshǝn tǝ vǝghaar lakuti kǝ da hǝɗakai kǝ uuda.
    9: Bak jiirjiira wan tagkurtagga, baɗǝm vakavaki da tagav nǝ ǝlbǝg marawǝn ma duniya, da dzamav nǝ uussǝn kwakyarvad dǝgiti aɓaga nǝ iina.”
    10: Tǝhalakwaha, kaa dagau kǝ Yahuda Iskariyoti pal ma mbǝrzah kǝlawa tar buna davak maalah ma zhiilakǝsuufah kiyava vǝltǝru Yesu.
    11: Cinngaraba nǝ iitǝr ǝndkwana, kaa dlaig kǝ iitǝr ba vaivaiya, dlaɓa ar tara kǝ langiya vǝlgar kwaɓa. Kaa fǝgarzhafǝg kǝ Yahud kǝ gata ɗuula vǝlgaana.
    12: Daavala faciya zǝngwa hwaɗagga haarakǝssa bruudi kwal yista, kaa harra mbaklaka kǝ iitǝr bandkwa narǝt nǝ daadijahaatǝr kǝ ɓagaan kiyava hwaɗaga haarakǝssa dzavgaara hǝnyaha, kaa ndavgarundavǝg nǝ mbǝrzahaan kǝ Yesu taakiya, “Vaakwar wa magha naagnǝng ma kǝmnda ɓadlǝkana kǝ vaki agha da zǝg nǝng kǝ haarakǝssa dzavgaara hǝnyahi?”
    13: Kaa ɓǝlgantɓǝlg kǝ iin kǝ mbǝrzahaan buwa, amaa taa kǝ iitǝra, “Damdǝg damma huɗakǝssa. Am da nǝghǝganǝghǝg kǝ uudan dǝ tǝfuwa yuwa. Gatamarsgatǝga.
    14: Aandzu kwar kǝ hǝnyah wa dǝgaa nǝ iina, am tagar kǝ dadda hǝnyahiin taakiya, ‘Dadda tsaga dǝgit wa ndava taaki mǝr nǝ gudi ǝn da zǝg nai ard mbǝrzahar kǝ kaffa Hwaɗaga Haarakǝssa Dzavgaara Hǝnyahi?’
    15: Da markurdamarǝg nǝ iin kǝ maandala gud tǝghǝr kǝ guda sharaw kwa ɓadlavǝna mbakyarvad haarakǝssiina. Am da ɓadlkiyamna vaakwah kǝ dǝgzǝga.”
    16: Kaa dagal kǝ mbǝrzahaan damma huɗakǝssa, tlararatlǝg kǝ dǝgitah bandkwa tagatǝr Yesu. Kaa ɓadlǝna kǝ iitǝr kǝ dǝgzǝga Hwaɗagga Haarakǝssa Dzavgaara Hǝnyaha.
    17: Bagaa ba hwaasa, kaa saas kǝ Yesu ard mbǝrzahaan kǝlawa tar buwa da hǝnyahiina.
    18: Ar tǝghǝrdǝgga za kaffa, kaa am Yesuwa, “Bak jiirjiira wan tagkurtaga, pal makuram da vǝlkwavǝlga, kwa bandakwan za kaf ǝmtaɗ dǝ kaiya.”
    19: Cinngarubi nǝ mbǝrzahaan kǝ ǝmtakǝra ǝlbǝgǝn biya, kaa ba ndavǝg kǝ iitǝr ba da pallapalla, “Kai nii?”
    20: Ngwatǝrangug nǝ Yesu amaa, “Pal ma kuram kǝlawa tar buwna, kwa kǝm zǝg nǝmnd kaf ma kuu palla.
    21: Da ǝmtsǝg nǝ Zǝra Uuda, bandkwa vindava tǝghǝr kǝ iina. Da dǝga zhuwadaal kǝ daddkwa da vǝlla Zǝra Uuda! Ngulǝm maa yaavabi vaani.”
    22: Ar tǝghǝrdǝgga za kaffa, kaa kǝsǝgankǝsǝg nǝ Yesu kǝ bruudiya, tagar kǝ uus kǝ Daadamazhigǝla, lahǝnan vǝltǝr kǝ mbǝrzahaana, amaa, “Cauwamcauga, kwana iin nǝ vǝghara.”
    23: Tǝhala kwan dlaɓa, kǝsant kǝ iin kǝ kuwa yuwa inabi, tagar kǝ uus kǝ Daadamazhigǝla, vǝltǝra. Kaa hǝɓguhǝɓǝg kǝ iitǝr baɗǝmmaatǝra.
    24: Aiyama taa kǝ iitǝra, “Kwana iin nǝ avǝzara. Avǝza rǝgha langiya. Kwa da ɗǝyav dagal mbakyarvad uudah baɗyaka.
    25: Bak jiijiir wan tagkurtaga, ǝn maadlai da hǝɓɓa yuwa inabi biya, bamma daghuvali ǝn da hǝɓɓǝg nai kwatlǝrǝn kǝ daalaan ma tlǝkǝssa Daadamazhigǝla.”
    26: Ɓǝlaraa ba nǝ iitǝr kǝ ǝngsa, tǝhala kwaha kaa dagal kǝ iitǝr dat Gaval kwa dǝ Uufaha Zaituna.
    27: Am Yesu taa kǝ mbǝrzahaana, “Baɗǝmmaruw am da ǝmndǝrga am da ɗuukwaɗuuga, bandkwa vindava taakiya, ‘Ən da tsǝggaan kǝ dadda piigga, dlaɓa ar da tadagal nǝ tuughwaha.’
    28: “Tǝhala ciigar ma gǝtlaha, ǝn da dǝgaa nai zǝngw tǝghǝr kǝskuram damma Galili.”
    29: Aiyam Bitrus taa kǝ iina, “Aandzu ar ǝmndǝra baɗǝm ar ɗuukǝssa, ǝn da ɗuukǝs bi nai biya.”
    30: Am nǝ Yesu taa kǝ Bitrus, “Bak jiirjiir wan tagaktaga, haniina, lakuti wiig kǝ ghwatǝkal shǝg bu ma huuda vǝɗɗa, aghada ɓaggaan kǝ agajawa sǝrkwabi shǝg hǝkǝrɗa.”
    31: Kaa ba gwaigarsgwaig kǝ Bitrus ba vaivai taakiya, “Aandzu da tsǝkwatsǝg nǝ uud ǝmtaɗ dǝ kǝgha, ǝn maay da ɓala gajawa sǝrak bi ba dǝm biya.” Baɗǝmaatǝr tagar band kwaha.
    32: Kaa dagal kǝ iitǝr da vakavakin kwa ɗahav dǝ Getsemani, aiyam nǝ Yesu taa kǝ mbǝrzahaana, “Ndzamandzǝg vaakwana. Ən dagal da dzǝgwazhigǝla.”
    33: Kaa dagal kǝ iin ǝmtaɗ dǝ Bitrusa, ard Yakuba, ard Yuhwana. Tǝhalakwaha kaa mbǝkǝnmbǝg nǝ dlaɗǝn da hǝɓɓǝg nǝ iin ba vaivaiya, dlaɓa tsǝgharatsǝg kǝ vǝgha.
    34: Aiyama taa kǝ iitǝra, “Shifǝgara hǝɓɓa dlaɗa ba vaivaiya bandgi na tsǝkwatsǝgga. Ndzamadzǝg vaakwana, famfǝg kǝ hyǝmiya, uufamuufǝgga.”
    35: Gavǝt ba nǝ iin da tǝvuukw hǝɗiikǝnan, kǝlla kǝ ghunji tǝ haiya, Kaa dzǝgwazhigǝl taaki akwama ɓagaɓaga, maa kǝsvaaran nǝ dlaɗna.
    36: Amaa, “Abba, Daada, aandzu kwar kǝ dǝgita ɓagaɓag vakagha. Kǝswaarakǝssǝg kǝ kuwa dlaɗna. Bakǝvakwaha, ɓag kǝ dǝgiti agha naag nǝnga, dǝgiti ǝn naag nai biya.”
    37: Sagha ba nǝ iina, kaa tlǝtǝraatlǝg kǝ iin kǝ mbǝrzahaan hǝnahaara, amaa taa kǝ Bitrusa, “Bitrus, agha hǝnahaara? Mbats agha dzǝgwanti kǝ fahyǝmi aandzu dǝga aw pall biya?
    38: Famfǝg kǝ hyǝmiya, am dzǝgwan kǝ zhigǝla haik kǝ mbǝɗǝg kǝsuram tǝɗuula fǝshǝga. Bak jiijiira, naaghantnaag nǝ shǝɗǝkwa, vǝgh wa maay ndzǝɗ biya.”
    39: Kaa gwiya dagal kǝ iin da dzǝgwazhigǝla, gwayaars bak kwahiin kǝ dzǝgwazhigǝla.
    40: Gwiyaghǝra ba nǝ iin saassa, tlatǝraa ba hǝnahaara mbakyarvad haar ma gyiyaatǝr ba vaivaiya. Pǝletǝrvapelǝg nǝ dǝgiti ar da tagar nǝ iitǝra.
    41: Gwiyaa ba nǝ iin da vakaatǝr kǝ dǝga hǝkǝrɗa, amaa taa kǝ iitǝra, “Gwaastǝn am ba ndzǝggaan hǝnahaar am ɗǝya kuɗǝgga? Atlanama! Wa ɓagaaɓag sarta kwada vǝlav Zǝra Uud damma dǝv kǝ yaa dadda haipaha.
    42: Ciyamciiga, jiiyam dagala! Wa sǝghǝvsǝg daddakwa da vǝla kaiya!”
    43: Ba ndzǝggaan Yesu ba taa ghaiya, kaa sagau kǝ Yahud pal ma mbǝrzahaan kǝlawa tar buwna, sarǝv ǝmtaɗ dǝ uudah ba ɗyaka dǝ katsakarah ard zadah vakaatǝra, ɓǝlartǝrǝt nǝ maalah ma zhiilakǝsuufaha, ard lii tsaga adzahadzaha Muusa, ard tlǝvuukwaha.
    44: Tagatǝratag nǝ Yahud kǝ ɗuuli da vǝlǝg nǝ iin kǝ Yesu, amaa, “Daddakwa ǝn da bǝrhuug naiya, iin nǝ uud nǝ iina. Viiyamǝtviiga, langamlanga, hǝkyamnahǝkyig ba marawa.”
    45: Bad dagauwa Yahud wah da vak Yesu, amaa taa kǝ iina, “Dadda tsagadǝgit!” Kaa bǝrhugaan kǝ iina.
    46: Kaa viigǝtviig kǝ uudahiin kǝ Yesu, ar hǝkinan ba marawa.
    47: Kaa tǝɗdatǝɗǝg nǝ pal ma mbǝrzaha Yesu kwandza ghacǝga tǝvǝgh kǝ iina, kǝ katsakaraana, ghudarda kǝ hyǝmi kǝ kwatǝnah maala zhillakǝsuufa.
    48: Am Yesu taa kǝ iitǝra, “Amaa sagal dǝ katsakarah ard zadah sa viiya kai bandgi ǝn dadda zaa ɗuula?
    49: Ba kǝlahǝnga ǝn ba ǝmtaaɗ dǝ kuram ma gaagazaiya vǝgya Daadamazhigǝl ǝn tsagadigita, viiyamkwa biya. Barari righǝvant nǝ dǝgiti vindava ma kakaɗa Daadamazhigǝla.”
    50: Tǝhalakwaha baɗǝm mbǝrzahaan ɗuwarǝsɗuga, ǝmndraraǝmndrǝga.
    51: Ndza mǝng nǝ daala zǝriin gata Yesu tǝhala, maay nǝ sǝɗav tǝ vǝghaan biya, ba nuura kalti. Naha viiyarviig nǝ uudaha,
    52: Kaa ɗugarǝsɗug kǝ sǝɗavan ma dǝvaatǝra, kaa ǝmdǝradagal bad suuha.
    53: Kaa lanngaan kǝ iitǝr kǝ Yesu da vǝgya maal batingting ma zhiilakǝsuufa, kaa dzahvǝtdzahǝg kǝ maalah ma zhiilakǝsuufaha, ard tlǝvuukwaha, ard lii tsaga adzahadzaha Musa da vaakwahiina.
    54: Kaa gatǝgaan kǝ Bitrus kǝ Yesu tǝhal tǝhala, ba bǝtky tagwavaatǝra. Gatǝgharsgatǝg ba tangw damma huɗa gaagazaiya vǝgya zhillakǝsuuf ba tingtinga. Cǝhura kǝ iin ǝmtaɗ dǝ lii uuffa hǝnyaha, ɗiira kaara.
    55: Gatargatǝg nǝ maalaha ma zhillakǝsuufaha ard gyiɗa maalah badǝm kǝ dǝgiti maraa da tlǝkǝna nǝ iitǝr kǝ shiid tǝghǝr kǝ Yesu taakiya, ɓagaɓag kǝ haipa kiyava tsǝgaan kǝ iitǝra, bakǝvakwaha, viiyarǝti dǝ haip biya.
    56: Ghwadararsghwadǝg nǝ uudah ba ɗyak kǝ fiid kǝ Yesu, bakǝvakwaha ndzaabi ghaiyatǝr tǝ dǝgit pal biya.
    57: Tǝhalakwaha kaa gwiya ciig kǝ kyǝlǝm uudaha, ar ghwudars kǝ fiid kǝ Yesu taakiya,
    58: “Cinngamndacinng tagadatag taakiya, ‘Ən dlagnadlag kǝ vǝgya Daadamazhigǝlǝn kwa ndǝraran nǝ uudaha, ǝn ndǝrant kwatlǝrǝn bamma hǝng hǝkǝrɗa, kwa ndǝrg uud biya.’”
    59: Bakǝvakwah ǝlbǝgahaatǝr ndzaabi tǝ dǝgit pal biya.
    60: Kaa ciig kǝ maal batinting ma zhillakǝsuufah ghacan mataatakaatǝra, kaa ndavǝgarundavǝg kǝ iin kǝ Yesu, amaa, “Agha maay dǝ ǝlbǝg biya? Əlbǝgahaan aa tagav tǝghǝr kǝskǝgh nǝm?”
    61: Bakǝvakwaha mbǝɗabi nǝ Yesu kǝ ghaiyan biya, ndza kǝ iin ba ɗǝwa. Kaa gwiya ndavgarundavǝg kǝ maal batingting ma zhillakǝsuuf taakiya, “Kǝgh haa nǝ Kǝristi, Zǝra Daddakwa dǝ barkna?”
    62: Ngwangw nǝ Yesu taakiya, “Aana ba kaiya. Am da nǝghanǝghǝg kǝ Zǝra Uuda ndzǝgan tǝ dǝvaa kaffa Daadamazhigǝl ǝmkyaɗaka, dlaɓa da saay ma akumba zhigǝla.”
    63: Kaa tahnatahǝg kǝ maal batingting ma zhillakǝsuuf kǝ sǝɗavahaana, amaa, “Kwar kǝ shiid dlaɓ wa kiyam naag nǝ miyami?
    64: Cinngamacing dlaɓa ghǝravaru kǝ badza ɗaaga Daadamazhigǝl aa tag nǝ iina! Auwam nǝ urami?” Kaa ghudgardaghud nǝ uudahi ndzar vaakwahiin baɗǝm kǝ shariya taakiya aa tsǝvatsǝgga.
    65: Kaa fǝgarzhafǝg nǝ kyalǝmah kǝ tafgarǝv ashavaiya, ar mbuusaaraka kǝ gyiya, dlaɓa ar dlagharaa kǝ tsǝgga, am nǝ iitǝr taa kǝ iina, “Tagga kǝ daddakwa tsakǝgha!” Lii uuffa wakyagh dlaɓa ndakwani kaa kalgaan kǝ iitǝra.
    66: Ndza mangyila gaagazaiya hǝnyaha nǝ Bitrusa, kaa sagau kǝ dǝghwiin pal ma kwatnaha maal batingting ma zhiilakǝsuuf da vaakwahiina.
    67: Nǝgha ba nǝ iin kǝ Bitrus ɗiira kaara, kaa vazǝgaan kǝ iin ba marawa, amaa taa kǝ iina, “Kǝgh ndakwi agha ǝmtaɗ dǝ Yesu zhilla Nazareta!”
    68: Kaa ɓalla gajau kǝ Bitrusa, amaa, “Ən sǝrgabi var kǝ dǝgiti agha tag nǝng biya. Nǝghanaakabi ba lingiling biya!” Tagada ba nǝ iin kǝ kwaha, Kaa ciya dagal kǝ iin damma bǝrcama hǝnyahiina, kaa wiig kǝ ghwatkala tǝhala kwaha.
    69: Gwiiya nǝgha ba nǝ dǝghwǝn kǝ Bitrus vaakwaha, kaa tagatǝrtag kǝ iin kǝ lii ghacǝga vaakwahiina, “Kwan ndakwani pal ghǝravaan ma iitǝra.”
    70: Kaa gwiiya ɓalla gajau kǝ Bitrus dlaɓa. Tǝhala zǝlam hǝɗiikǝnana, aiyam lii ghacǝga tǝvǝgh kǝ Bitrus taa kǝ iina, “Bak jiijiira agha pal nǝng yan miitǝra. Aɗaba agha zhiil Galili nǝ ghǝravagha.”
    71: Kaa fǝgarzhafǝg kǝ Bitrus ɗaava ghǝraana, dlaɓa kaa tlafa ghǝran baz ndaha waɗǝg tǝvukwatǝr taakiya. “Ən sǝrgai var kǝ uudanǝn am tag nǝ uuram kǝ ǝlbǝg tǝghǝrǝn biya.”
    72: Batwatswatsǝra kaa wiig kǝ ghwatǝkala kǝ dǝga buwa. Kaa dzamnadzamǝg nǝ Bitrus kǝ ǝlbǝgi taghar nǝ Yesu taakiya, “Lakwti wiig nǝ ghwatǝkala shig buwa, agha da ɓallǝgaan kǝ agajauwa sǝrkwabi shig hǝkǝrd biya.” Dzamghana ba nǝ iin kwan kǝ ǝlbǝga. Kaa ɓǝlaru kǝ iin kǝ tuuga.
  15:
    1: Dlakadur bawura, kaa ɗiya sawari kǝ maalaha zhiil kǝsauufaha, ard tlǝvuukwah ard lii tsaga adzahadzaha Musa, ard dzahava lii ma gyiɗ baɗǝmma. Kaa ngwaɗǝnangwaɗǝg kǝ iitǝr kǝ Yesu, ar langda da tǝvuukwa Bilatusa, ar fardǝm ma dǝva.
    2: Kaa ndavgaruundavǝg nǝ Bilatus kǝ Yesu taakiya, “Kǝgh tlǝkǝssa Yahudaha?” Ngwugharangug Yesu amaa, “Aana, bandkwa tagǝda nǝnga.”
    3: Kaa ghwadgarǝva ǝlbǝgah ba ɗyak nǝ maalaha zhiila kǝsauufaha.
    4: Kaa gwiya ndavgarundavǝg nǝ Bilatus taakiya, “Agha maay mbǝɗa ghai biya? Cinng kǝ dǝgitahi ar tag nǝ iitǝr tǝghǝr kǝskǝgh ba ɗyaka.”
    5: Gwastǝna, mbǝɗabi Yesu kǝ ghaiyan biya, kwana vǝlgharvǝlǝg kǝ Bilatus kǝ dǝga jappǝr.
    6: Dǝgiti nǝt tlǝkǝs kǝ ɓagaan sarta hwaɗaga iin taakiya, ɓǝlars kǝ uud palla kwa ghalga nǝ uudah sagal ma guda bǝrfina.
    7: Mǝng nǝ uuda nǝ iin ɗaagaan Barabbas kwa ɓǝlaavdǝm ma guda bǝrfina, ǝmtaɗ dǝ lii dzagwara dlagwam kwa tsara uuda ma sartǝn ciyit nǝ dlagwamǝna.
    8: Kaa sagau kǝ dzahava dlamakǝlaaw da ghala Bilatus maa ɓagtǝra kǝ dǝgiti nǝt nǝ iina kǝ ɓagaana.
    9: Ngwatǝrangug nǝ Bilatus amaa, “Am naagaan ǝn ɓǝlkurnǝs kǝ tlǝkǝssa Yahudaha?”
    10: Aɗaba nǝghaakanǝghǝg nǝ Bilatus taakiya, ba shilǝg wa fatǝra maalah zhiilakǝsauufah kǝ vǝlla Yesu damma dǝvaana
    11: Maalaha zhiilakǝsauufah wa shaharant uudah kǝ taakiya aa ɓǝlkǝmndarsɓǝlǝg nǝ uud kǝ Barabaas tǝghǝr kǝ Yesu.
    12: Kaa ndavtǝrundavǝg nǝ Bilatus taakiya, “Au kaci wanda ɓag nai dǝ kwam ɗaag nǝ uuram dǝ tlǝkǝssa Yahudahni?”
    13: Ar ɗǝyaru kǝ iitǝr kǝ cau ar taakiya, “Aa hǝrtǝvǝthǝrtǝgga!”
    14: Aiyam nǝ Bilatus taa kǝ iitǝra, “Mbakyauwi? Au nǝ haipaani?” Ar gwiya dzǝgant kǝ kungy ar taakiya, “Aa hǝrtǝvǝthǝrtǝgga!”
    15: Naagaan tsau nǝ Bilatus hǝngtǝrna kǝ ǝrviɗmahuɗaatǝra, ɓǝltǝrnǝs kǝ Barabaas. Tǝhalakwa fǝgharaa nǝ iin kǝ uudah kǝ dlaghgaru kiiɓ kǝ Yesu, kaa vǝltǝr kǝ iin kiyava hǝrtǝgga.
    16: Kaa dadǝg nǝ tlaujah kǝ Yesu damma gaagazaiya vǝgya gumna. Ar dzahant kǝ tlaujah baɗǝmma.
    17: Ar tsǝgwardǝm kǝ sǝdav kyang hulfa dǝga tlǝkǝssaha, dlaɓa ar ɓagara kǝ dzakwa takka, ar fardǝm ma ghǝra.
    18: Ar farzha kǝ tagar uus taakiya, “Kǝm ma barkagh tlǝkǝssa Yahudaha!”
    19: Kaa kalgaan kǝ iitǝr dǝ zad ma ghǝra, ar tafarǝva kǝ ashavaiya. Tǝhalakwaha ar kǝlla kǝ ghunj tǝvuukwana am nǝ iitǝra ar fǝgaaradfǝga.
    20: Ghyǝngara ba nǝ iitǝr kǝ nenegaana, ar sǝɗarda kǝ sǝɗava tlǝksǝna, ar tsagwɗǝm ma sǝɗavahaana. Tǝhalakwaha ar langda dagal da gyǝmal kiyava hǝrtǝgaana.
    21: Ar tǝghǝrdǝga dagala, kaa nǝghǝganǝghǝg kǝ iitǝr kǝ uuda nǝ iin ghwudadagal, kwa ɗahav dǝ Siman, zhiila Sayirina, daddaatǝr kǝ Alekzanda ard Rufus, saas ma gǝdzǝr kǝssa, ar faraa baɗ ndzǝɗ kǝ kǝssa tlaɓa hǝrta Yesu.
    22: Ar langda kǝ Yesu da vakavakiin kwa ɗahav dǝ Golgata, (dǝgiti tuuk vakai nǝ iina “Vakka kuwa ghǝra”).
    23: Vǝlarar vaakwahiin nǝ iitǝr kǝ yuwa innabi laɓalaɓan dǝ mur, luwa kǝ hǝɓgaana.
    24: Ar hǝrtǝtta. Ar tagwna dlaɓ kǝ sǝɗavahaan ma taatakaatǝra, kaa tsa tsats kǝ iitǝr tǝghǝr kiyava vaza dǝgiti aa tlǝkǝna aandzu waratǝra.
    25: Hǝrtarǝt ma sarta vaslambaɗa dlakadura.
    26: Ar vinda tǝ tlaɓa hǝrtǝg kǝ ǝlbǝgi ghwudararva nǝ iitǝr taakiya, “TLƏKƏSSA YAHUDAHA.”
    27: Ar hǝrtǝt kǝ gǝlah buwa ǝmtaɗ dǝ iina, pal tǝ dǝvaa kaffaana, pal dlaɓ tǝ dǝvaa ghyaɓɓaana. [
    28: Kwan iin nǝ righǝgga tlayangǝr kwa tagaa taakiya, “Kǝdlavǝna ma lii haipaha.”]
    29: Uudahi ghudadagal ar tagar ǝlbǝga nenega, ar gajaga ghǝr ar taakiya, “Caa! Kǝghi agha dlagǝnadlag kǝ vǝgya Daadamazhigǝla, dlaɓa agha da gwiya ndǝrant bamma hǝng hǝkǝrɗa,
    30: katǝg ci kǝ ghǝragha, agha sii bi dlaɓ tǝ tlaɓa hǝrtǝg biya!”
    31: Bandkwah dlaɓ nǝ maalah ma zhiilakǝsauufah ard lii tsaga adzahadzaha Musa, kaa nenegaan kǝ iitǝr ma taatakaatǝr ar taakiya, “Katǝghankatǝg kǝ kyalǝma, pilgharvaapilǝg kata ghǝraana!
    32: Aa sasii ci ndan Kǝristi tlǝkǝssa Israˈilǝn ndakwan tǝ tlaɓa hǝrtǝgǝna, kiyava nǝghǝganǝghǝg kǝskǝmnd kǝm fǝdghǝrǝta!” Baz gǝlahǝn hǝrtavǝt ǝmtaɗ dǝ iinǝn ndakwani kaa taa ǝlbǝgahi ghwaɗghwaɗ kǝ iitǝr tǝ iina.
    33: Bad vacci tǝghǝra, kaa hǝɗgarduhǝɗǝg nǝ gurtl kǝ lard baɗǝma, tangw damma hǝkǝrɗa hwassa.
    34: Tǝhalakwaha, sarta hǝkǝrɗa hwaasa, kaa dzagantdzǝg nǝ Yesu kǝ kuungy bad halavuwa ndzǝɗaan, amaa, “Eloi, Eloi, lama sabaktani?” Iin taakiya, “Daadamazhigǝl Daadamazhigǝla, agha fiikwada daɓawi?”
    35: Cinngara ba nǝ lii ghaciga vaakwahiin kwaha, aiyam nǝ iitǝra, “Wai nǝ iin ɗaa tlaiyang Iliya.”
    36: Kaa ǝmdǝrǝg kǝ pallǝraatǝra, rǝmda kǝ abarabar dǝ yuwa inabi kwarekreka tǝ zadda, vǝlar kǝ Yesu kiyava hǝɓɓǝga, aiyama, “Vazyamvazǝg ndana! Mbatak da sagau nǝ tlayang Iliya da sii dǝ vakaiya.”
    37: Kaa dzǝgantdzǝg Yesu kǝ kungy bad halavuuwa ndzǝɗaana, tǝhalakwaha, kaa ɗiya shifǝgga halavuuwana, ǝmtsana.
    38: Kaa tǝhgǝmtǝhǝg kǝ ɓǝlyaɓǝlya Vǝgya Daadamaazhigǝl hutsǝg buwa ciigǝt ma ghǝraan tangw damma suhwaana.
    39: Nǝgha ban nǝ tlaujin ndza ghaciga tǝvuukwa Yesu kǝ ɗuuli ǝmtsa nǝ iina, aiyama, “Ba pakat uudanǝn Zǝra Daadamazhigǝla!”
    40: Kyalma ǝnghwasaha, ghaccara ba ndzaɗɗa ar vazǝggaana. Ma iitǝra mǝng Maryam Magadala, ard Maryam babba Yakub kudǝrkudǝra ard Isuvuwa, ard Salomi.
    41: Gatarars ciigǝt sagat ma Galili nǝ ǝnghwasahaan ar ba mǝlgarumǝlga. Dlaɓa baɗyak nǝ kyalǝma ǝnghwasah kwa darǝt ǝmtaɗ dǝ iin ma Wurshalim ndakwi ndzar ba vaakwaha.
    42: Ɗǝm ba faciya hwaasa, kaa ɓadlav kǝ uudaha, aɗaba dlakaduraan Faciya Ngiiga.
    43: Kaa sagal kǝ uuda nǝ iin ma Arimatiya ɗaagaan Isuvuwa. Pall ma gyiɗya lii maalmala nǝ iina, dlaɓa fǝvaarafǝga, kwa pakka saaya tlǝkkǝssǝra Daadamazhigǝla. Shughanashug kǝ gyi da vak Bilatus, da ghala ma vǝlvar nǝ tlǝwa vǝgha Yesu.
    44: Cinngha ba nǝ Bilatus taakiya ǝmtsaǝmtsǝg nǝ Yesu, vǝlgharvǝlǝg kǝ dǝga ajappǝra. Ɗahant kǝ iin kǝ maala tlaujiin ndavaru taakiya bak jiirjiira ha ǝmtsaǝmtsǝg nǝ Yesu.
    45: Cinngha ba nǝ iin vak maala tlaujin taakiya band kwaha, kaa vǝlar kǝ iin kǝ Isuvu kǝ tlǝwa vǝgha Yesu.
    46: Kaa sǝgwdaasǝgw nǝ Isuvu kǝ kǝlpakana, sǝddi kǝ iin kǝ tlǝwa Yesu tǝ tlaɓa hǝrtǝgga, faɗant ma kǝlpakana, fǝdǝm kǝ iin ma gǝtl kwa kwaɗava ma kura. Tǝhala kwaha, hutambardi kǝ akura hǝɗardu kǝ iin kǝ ghaiyan dǝ vakaiya.
    47: Nǝghǝranǝghǝg nǝ Maryamu Magadala ard Maryamu babba Isuvu kǝ vakavaki fava dǝ tlǝwa vǝgha Yesu.
  16:
    1: Dal ba faciya ngiigga, kaa sǝgwasǝgw kǝ Maryam Magadala, ard Maryam babba Yakub, ard Salomi kǝ tǝrshan kiyava dzuupǝg tǝ tlǝwa Yesu.
    2: Davala faciya zǝngw ma maaka, kaa dagal kǝ iitǝr damma gǝtlah ba dlakaduur wur kǝssa.
    3: Tǝghǝrdǝgga dagala, am nǝ iitǝr mataatakaatǝra, “War wada tlǝkkiyamarwatlǝg kǝ akuriin tuuk kǝ ghaiya gǝtli?”
    4: Daragha ba nǝ iitǝr da vaakwahiina, dzǝgarant ba nǝ iitǝr kǝ ghǝraatǝra, kaa nǝghǝganǝgh kǝ iitǝr mbats tlǝgavarwatlǝg nǝ akuriin dagala. Akuriin ndza maanda.
    5: Daragha ba nǝ iitǝr damma gǝtliina, kaa nǝghǝgaanǝghǝg kǝ iitǝr kǝ daala zǝr tsagwatsagwan ma sǝɗav maɗǝkwa cǝhurga tǝ ghyaɓa dǝvaakaffa, kaa gǝdzǝgǝtgǝdzǝg kǝ iitǝra.
    6: Am daala zǝrǝn taa kǝ iitǝra, “Ɓagambi kǝ ajappǝr biya. Am gata Yesu uuda nazare kwa hǝrtavǝtǝna? Abi, ciyitciiga. Maay vaakwan biya. Wan vakavaki hǝngavna nǝ iina.
    7: Damdǝga, am tagar kǝ mbǝrzahaana, ard Bitrus, taakiya da dǝga nǝ iin tǝghǝr kǝ iitǝr damma Galili, ar da nǝghǝga vaakwah nǝ iitǝr bandkwa tagatǝr nǝ iina.”
    8: Kaa ǝmndǝra saggal kǝ ǝnghwasahahaana, ar ɓa jappǝr dlaɓa tǝg nǝ vǝghatǝra. Tagararbi aandzu ndǝwar kǝ ǝlbǝg biya, aɗaba gǝdzarǝtgǝdzǝgga. [
    9: '(note: The most reliable and earliest manuscripts do not include Mark 16:9-20.) Ciyit ba nǝ Yesu ma gǝtlah dlakadur ba wur davala faciya zǝngw ma maaka, marda kǝ ghǝraan ba zǝngw vak Maryamu Magadala, kwa lagwgharda nǝ iin kǝ shatanah uuɗiif ma vǝghaana.'
    10: Kaa daas kǝ iin tagtǝr kǝ uudahi ndzar ǝmtaɗ ba bawur dǝ iina, lii taa dzǝgwagha ar tuuga.
    11: Cinngaraba nǝ iitǝr taakiya dǝ shifǝg nǝ Yesu, dlaɓa nǝghghanǝghǝg nǝ Maryama kǝ iina, fardghǝrǝt biya.
    12: Tǝhalakwaha, kaa mbǝɗvǝghambǝɗǝg nǝ ndzǝgana vǝgha Yesu, kaa mardamarǝg kǝ ghǝraan vak mbǝrzah buwa masarta kwa ndzar tǝ ɗuula dagal damma gǝdzǝrkǝsa.
    13: Kaa gwiyadaas kǝ lii buna ar tagar kǝ kyalmaha, bakǝvakwaha larwalǝg kǝ fadǝghǝr tǝ ǝlbǝgiina.
    14: Tǝhalakwaha, kaa mardamarǝg nǝ Yesu kǝ ghǝran vak kǝlawa tǝmkikǝn ma sarta kwa ndzar za kaffa. Kaa cagtǝraacag kǝ iin kǝ gyi tǝghǝr kǝ maira fadghǝraatǝra ard dǝkdǝka ghǝraatǝra, aɗaba fadghǝrǝtbi dǝ lii nǝgharanǝghǝg tǝhala ciigaan biya.
    15: Amaa taa kǝ iitǝr dlaɓa, “Damdǝg damma duni baɗǝmma, tagamtǝrtag kǝ ǝlbǝg maraw kǝ uudah dǝshiga.
    16: Baɗǝm daddakwa fadghǝrǝtfǝga, dlaɓa ɓagvara nǝ tsuufǝgga, da tlǝkkǝnatlǝg kǝ katǝgga. Baɗǝm daddakwa fadghǝrǝt biya da vǝlǝvtǝr dlaɗa.
    17: Wan nǝ dǝgiti da ɓag lii gata kaiya kiyava marra fadǝghǝratǝra. Ar da lagwan kǝ shatanah ma ɗaagara, ar da tagaan dlaɓa kǝ ǝlbǝg dǝ daala ghaiyaha.
    18: Ar da kǝssǝggaan kǝ ghavalah dǝ dǝvahaatǝra. Ma hǝɓaruhǝɓǝg kǝ gurra, maay nǝ dǝgiti da ɓagtǝr nǝ iin biya. Ar da fǝgaan dlaɓa kǝ dǝvahaatǝr tǝ lii yangbiya, ar da mbǝgga.”
    19: Tǝhala kwa tagatǝra nǝ Yaazhigǝl Yesu kǝ kwanǝn kǝ ǝlbǝga, kaa kǝsvantkǝsǝg dǝvdǝt damma ghǝrazhigǝla, ndza kǝ iin tǝ dǝvaa kaffa Daadamazhigǝla.
    20: Kaa dagal kǝ mbǝrzahaana, kaa taa ǝlbǝg maraw kǝ iitǝr aandzu takwara. Ɓagaɓag nǝ Yaazhigǝl kǝ tlǝr ǝmtaɗ dǝ iitǝra, dlaɓa mara jiira ǝlbǝgahatǝr tǝdvad dǝgaha sǝrgah kwa vǝlla jappǝr fatǝraa nǝ iin kǝ ɓaggaan ǝmtaɗ dǝ ǝlbǝgahiina.]
46:
  1:
    1: Bulus wa ɗahavant kiyava nǝg kǝ zǝr ɓǝlga Yesu Kǝristi dǝ naaga Daadamazhigǝl, ard zǝraabamiyam sastanis.
    2: Da vak uudaha Daadamazhigǝl kwar ma kurinti, ard da vak lii ɗahavtǝrant kǝ gata Kǝristi Yesu, ǝmtad ɗǝ lii aandzu ta kwara kwar dzugazhǝgǝla ma ɗaaga yesu tlǝkatǝga yaazhigǝlamiyama, baz yaazhǝgilatǝra ard kǝmyam baɗǝmma.
    3: Hɛrǝrra ard gabǝr vak Daadamazhigǝl Daadamiyam ard Yaazhigǝl Yesu Kǝristi da vakaruwa.
    4: Ən tagar uus kǝ Daadamazhigǝl ba kǝla hǝng kwakyarvad kuurama, aɗabad hɛrǝr vǝlakur nǝ iin tǝdvad Yesu Kǝristi.
    5: Aɗaba tǝdvad iina, vǝlakurvǝlǝg nǝ uud kǝ hyahhǝr aandzu takwar kǝ gyaba, tǝdǝvad taa ghaiya ard sǝgasǝrgǝr baɗǝmma.
    6: Bandkwa haiyavant nǝ shiidamnd tǝghǝr Kǝristi mataatakaruwa.
    7: Mbakyarvad kwaha maay nǝ dǝgiti vǝlakurbi nǝ Daadamazhigǝl tǝdvad shǝkwan biya, bandkwam fa gyi nǝ uuram am paka saaya Yaazhigǝlamiyam Yesu Kǝristi.
    8: Da fǝkurnaafǝg nǝ Yaazhigǝl kǝ ndzǝɗa tangw dat ghaala shifǝgaruwa, aɗaba am da nal kǝ lii maay dǝ haip ma sartǝn da saay nǝ Yaazhigǝl Kǝristi.
    9: Daadamazhigǝl kwa ɗaahakurǝt da ɓa huɗir ǝmtad dǝ Zǝran Yesu Kǝristi Yaazhgǝlamiyama, uuda jiirjiir nǝ iina.
    10: Ən ghaalakuram zaarabahara, mbakyarvad ɗaaga Yaazhigǝl Yesu Kǝristi, haiyamanthaig dǝ zaraabaharuwa, aandz maay nǝ tagwazhatagwazh ma taatakaru biya, am dzant kǝ ghǝraru vak palla, dzamaghǝraru ndakwi vak palla.
    11: Zaraabahara, aɗaba taghwatag nǝ lii ma hǝnyaha kuluwi taakiya, mǝng nǝ mbaɗaghai ma taatakaruwa.
    12: Dǝgiti ǝn tlǝtlǝg nai, iin taakiya, ma kwararuwa taa dǝgaan shahha, kwan taakiya, “Ən dǝga Bulus naiya,” kwan taakiya, “Ən dǝga Afulus naiya,” kwan taakiya “Ən dǝga Kefasa,” kwan dlaɓa taakiya, “Ən dǝga Kǝristi naiya
    13: Mbats tagwavǝmtagw nǝ tlǝkatǝg shahshaha? Əmtsaǝmtsǝg Bulus tǝ tlaɓa hǝrtǝg kwakyarvad kuurama? Nii ɓaga kuura dǝ ɗaaga Bulus ha nǝ-uud kǝ tsufǝgi?
    14: Ən tagar uus kǝ Daadamazhigǝl ɓaganarai aandzu war makuuram kǝ tsufǝg biya, ba kiribus ard gayus.
    15: Mbakyarvad kwaha maiy watag da tag takiya ɓagakuura dǝ ɗaagar nǝ uud kǝ tsuufǝg biya.
    16: Dzamanadzamǝga ɓaganara ɓag ɗlab kǝ yaha istafanus kǝ tsuufǝga, ma juujǝg ba kǝ yaha Istafanusa maay nǝ uudahii tlǝr ɓagantǝra naiy biya.
    17: Ɓǝlakutbi nǝ yesu mbakyarvad tsuufǝg biya, ɓǝlakut mbakyarvad taa ǝlbǝg marawa, ɗlaba dǝ dabariya uuda dǝg shig biya. Aɗaba aada pǝlwai nǝ nǝghǝgga ndangngǝra ǝmtsǝga yesu tǝ tlaɓa hǝrtǝg biya.
    18: Əlbǝga hǝrtǝga, ǝlbǝga ghwaɗ nǝ iin vak lii gata duula ǝmtsǝga, aɗaba vaka miyamǝn katakiyamǝtkatǝg nǝ uudna, ǝlbǝga katǝga ndzǝɗa Daadamazhigǝla.
    19: Aɗaba viinɗa viinɗan taakiya, “Ənda badzǝgaan kǝ dabariya lii taaki ar mǝng dǝ dabariya.”
    20: Aitsa mǝr nǝ lii ɗǝ dabariyǝni? Ar mǝr nǝ lii taakiya ar tsaga adzahadzahi? Ar mǝr nǝ lii taakiya ar sǝrgasǝrg kǝ dǝgitah baɗǝmni? Mbats maradai nǝ Daadamazhigǝl taakiya, dyǝmdyǝma lii dǝ dabariya kwan kǝ duniya ba ɗlagǝr nǝ iina.
    21: Aɗaba ma tag nǝ dabariya Daadamazhigǝla, uudaha duniya ar sǝrgai kǝ Daadamazhigǝl tǝdvad dabariya biya. Dlakulvakwaha, dzǝghakakadzǝrg nǝ Daadamazhigǝl kǝ lii da katǝg nǝ iin kwa fardǝghǝrtfǝg tǝ iin tǝdvad taa ǝlbǝg marawa kwa ma zharg nǝ uud maay nǝ tlǝrani.
    22: Yahudaha ar na ma marvǝtǝrdan nǝ dǝga sǝrga, helenaha dlaɓa ar gata sǝrga dabariya.
    23: Kǝm taa ǝlbǝg marawa tlǝkatǝga kwa ǝmtsan tǝ tlaɓa hǝrtǝga kwa nal kǝ ɗuula mbǝɗǝg kǝ yahudaha, ɗlaba dǝga dlagǝr vak lii ar yahudah biya.
    24: Ndzǝɗa ard dabariya Daadamazhigǝl nǝ tlǝkatǝg da vak lii ar yahudaha ard kwa yahudah biya,
    25: Adaɓa dǝgiti ma zharga nǝ uud mandki dlagǝr wa ɓaga nǝ Daadamazhigǝla, juujig kǝ dabariya uuda, dǝgiti ma tlatlǝg nǝ uud hǝtsalhǝtsǝg nǝ Daadamazhigǝla juujig nǝ iin kǝ ndzǝɗ uud baɗǝmma,
    26: Dzamamnadzamǝg kǝ ndzǝganaru ma sartǝn ɗahakurt nǝ Daadamazhigǝla, ba kyǝkwah ma kuuram nǝ lii dǝ dyǝmdyǝma ma zharǝg nǝ uudaha, bakyǝkwah dlab makuuram nǝ lii hǝkya kwarǝg ɗyaka, bakyǝkwah nǝ zarha lii ɗyaɗyaka.
    27: Kǝsghaakakǝsǝg nǝ Daadamazhigǝl kǝ dǝgiti tlatlǝg nǝ uud taakiya dlagǝra, adaba tsǝtǝra kǝ zhirw kǝ lii dǝ dabariya duniya, kǝsghaka kǝsǝg nǝ Daadamazhigǝl kǝ dǝgiti zharg nǝ uudah mandki hǝtsalhǝtsǝg nǝ iina, aɗaba tsǝtǝra ku zhiruw kǝ lii dǝ ndzǝɗa.
    28: Dǝgiti kǝsghant nǝ uud mandki maay dǝ ndangbiya, aandzu maay tlǝraniya, aandzu kwa maay nǝ dǝgiti tukvakaibiya, iin wa ɓag nǝ Daadamazhigǝl kǝ tlǝr dǝvakai kiyava ɗlagnan kǝ dǝgiti zharg nǝ uud mandki mǝng tlǝrana.
    29: Bagaɓag nǝ Daadamazhigǝl kwanahaan baɗǝmma haik naaghǝr kǝ uudaha dǝgshiga tǝvuukwa Daadamazhigǝla.
    30: Daadamazhigǝl wa fafǝg kwa namal nǝ uuram kǝ dǝga tlǝkatǝg yesu, Daadamazhigǝl dlab wa haighant haig kǝ tlǝkatǝga nal kǝ dabariyamiyama. Tlǝyamkǝna tǝdvad iin nǝ miyam kǝ jira Daadamazhigǝla ard katǝgana.
    31: Mbakyarvad kwaha, band kwa viindviidan ma kakaɗa Daadamazhigǝl taaki, “Baɗǝm dadda kwa tsa kusgha aa ɓag bat yaazhigǝla.”
  2:
    1: Ma sarta kwa danǝvnai da vakaru da tagakur ǝlbǝga Daadamazhigǝlǝn zaraabahaara, tagankur bi nai dǝ sǝrgasǝrgǝra ard markura dabari biya.
    2: Adaba nguɗanant nguɗǝg ma ǝrvǝdmahudɗar taakiya, ma sartǝn ǝn da ndzǝga nai ǝmtad dǝ kuuramna, ǝn da maay tsagkur aandzu ndau biya, ba ǝlbǝg tǝghǝr kǝ yesu tlǝkatǝga, kwa hǝrtavǝt hǝrtǝga.
    3: Sagawar ba zǝngw da vakaruuwa ǝn maay ndzǝd biya, tǝg nǝ vǝghara mbakyavad ɗlaɗlawura.
    4: Əlbǝgara ard ǝlbǝg marawa dzavǝmbi nǝ iin dǝ pattakurama ma markuura dyǝmdyǝmǝr biya, bamma aa ndzǝvǝm dǝ ndzǝɗa shiɗkwa caccuwanacaccuwana,
    5: Adaba haik fadghǝr kǝskuuram tǝ dabariya uudaha, bamma tǝ ndzǝɗa Daadamazhigǝla.
    6: Bakǝvakwaha kǝm taa ǝlbǝg dǝ dabari kǝ lii ghubarara ghbarg ma fadghǝratǝra, iin wa dabariya hulfakwan kǝ zaman biya, ɗlaɓa dǝ dǝga hulfa lii kwara kwan kǝ zaman kwa da mǝng ghaala kwargatǝr biya.
    7: Kǝm taa ǝlbǝga dabariya Daadamazhigǝl shǝɓashǝɓan, dabaritan kwa ndza shǝɓashǝɓan ba wura, iin dabariya Daadamazhigǝl kwa fa nǝ iin ba wurwura lakwti kǝ fazha duniya adaba fǝkiyamara nǝ uuda.
    8: Ma lii kwara zaman ndakwana maay wa da nǝghǝgaka nǝghǝg kǝ dabariyan biya, akwama nǝgharaaka nǝ iitǝra, maa hǝrtarǝt bi kǝ yaazhǝgǝl ǝmkyadyǝk biya.
    9: Band kwa viindaviindan taakiya, “Baɗǝm nǝ dǝgiti fatǝra nǝ Daadamazhigǝl kǝ lii waig nǝ iina maay nǝghanǝghǝg biya, maay nǝ daadakwa tapghani tapǝg kǝ cǝngacǝng biya, dlaɓa maay nǝ daadakwa tapghana kǝ dzamaghǝr tǝghǝr biya.
    10: Marakiyamnda marǝg nǝ Daadamazhigǝl kǝ kwanahaan kǝ dǝgitah tǝdvad shidkwan cacuwana cacuwana, adaba shidkwa cacuwana cacuwanan wa gata shiga dǝgita, baz dǝgaha Daadamazhigǝl kwa ɗǝmɗǝm kǝ nǝghǝgaka nǝghǝga.
    11: War wa sǝrgasǝrg kǝ dǝgiti ma ǝrvidmahuɗa uudan ma maay ba iin dǝ ghǝranbiyi? Bandkwah dlaɓa, maay wa nǝghǝgakanǝghǝg kǝ dzamaghǝra Daadamazhigǝl biya bama iin dǝ ghǝraana.
    12: Cauwamnda shidkwa duunibi nǝmnd biya, cauwamnda shikwa cacuwana cacuwana vak Daadamazhigǝla, kiyava nǝghǝgakanǝghǝg kǝskǝmnd kǝ dǝgitahi vǝlakǝmnd ba gyagyaana.
    13: Kǝm tagkur kwanaahaan kǝ dǝgitaha, dǝ ǝlbǝgahi tsagav dǝ dabariya uudbiya, kǝm tag dǝ shidkwa caccuwanacaccuwana, tǝdvad taa dǝgahaa shidkwa cacuwanacacuwan kǝ lii dǝgaha shidkwa caccuwanacaccuwana.
    14: Daddakwa shidkwa Daadamazhigǝlbi wa ɓa tlǝr dǝvakai biya, maay cauwa dǝgaha shidkwa caccuwanacaccuwana Daadamazhigǝli, adaba ɗlagǝr wahiin vakana, da nǝghǝgaaka biya, adaba nǝghvaka tǝdvad shidkwa Daadamazhigǝl nǝ dǝgitaha,
    15: Daddakwa shidkwa Daadamazhigǝl wa ɓa tlǝr dǝ iina, tlatlǝna tlatlǝg kǝ dǝgitaha baɗǝmma, maay wa tsagarnǝstsag biya.
    16: “Warwa sǝrga sǝrgasǝrg kǝ dzamaghǝra yaazhigǝl kwa da tsagarutsagi?” Dzamaghǝramiiyam kǝskǝmyama dǝga tlǝkatǝga.
  3:
    1: Zaraabahara, ǝn tagkur da bi nai kǝ ǝlbǝg band kwa ǝn tagtǝr nai kǝ lii dǝ shidkwa Daadamazhigǝl biya, bamma band uudaha duniya, band zarhah vuunj ma gata tlǝkatǝga,
    2: Gǝlankur gǝlǝg nai dǝ ghwaya watla, dǝ kaffi kwa dǝk dǝk biya aɗaba tlamalbi kǝ zaa kaffi dǝk dǝk biya, bakǝvakwaha tlamalbiya.
    3: Adaba gwastǝna am ba ɗlab ɓa dǝgiti naag nǝ vǝghǝgha, akwama am ba ɗlab ɓa shǝlgakava, am uushava dǝ zaraabaharuwa, mbats am ba ɗlab ɓa dǝgiti naag nǝ vǝghǝgha biya, adaba am ɓa tǝrahi naag nǝ vǝghǝgha.
    4: Mbakyarvad kwaha akwama tagatag nǝ uudan taaki, “Ən dǝga Bulus naiy amaa,” kwatlǝrn ɗlaɓ taaki, “Ən dǝga Afullus amaa,” mbats tlǝra vǝghǝg wam marg nǝ uuram biya?
    5: War nǝ Afullusini? War nǝ Bulusi? Mbats ba lii ɓa tlǝr kalti biya, kwa famdǝghǝrt nǝ uuram tǝdvad iitǝrya, ma kwaraatǝra bad hulfa tlǝri aa vǝlgar nǝ yaazhigǝlan biya?
    6: Riiyanariig naiya, pǝdghar yu nǝ Afullusa, ba Daadamazhigǝl wa da fǝgara ghubarg kǝ dǝgiti aa riiva riiga.
    7: Mbakyarvad kwaha daddakwa riiga dǝ riiga, ard daddakwa pǝdghar yuwa maay nǝ dǝgiti tuuk vakai nǝ iitǝr biya, bamma Daadamazhigǝl pall kwa fǝghara ghubarǝg kǝ dǝgiti aariivana.
    8: Dadda riiga, ard dadda kwa pǝdghar yuwa ba tlǝraatǝr palla, aɗaba ma kwaratǝra da tlǝkǝnatlǝg kǝ dǝgshiga tlǝraana.
    9: Adaba kǝm tsahwahaha ɓa tlǝra Daadamazhigǝl nǝmnda, kuurama am guuha Daadamazhigǝla dlaɓa ndǝrgaana.
    10: Tǝdvad herǝrra Daadamazhigǝl kwa vǝlghwa nǝ iina, fanarzhafǝg kǝ ndǝrg band daddakwa dyaghǝ kǝ ndǝrga, kwatlǝrn dlaɓa ndǝrg tǝghǝraana. Barari kǝ dadda ndǝrg fa hyǝmiya tǝ hulfa ndǝgi kwa da fǝgara nǝ iin tǝghǝra.
    11: Adaba maay nǝ dadda kwa da fǝgaraa kwatlǝr kǝ ndǝr shah kwa juujig kwa fǝvanǝn biya, kwa iin nǝ Yesu Tlǝkatǝga.
    12: Akwama ndǝrandǝrg nǝ uudan da tǝghǝr kwa favarzhan dǝ adawanna, aandzu ma agwallela ma dǝ akurahi kwa ndanga, ma dǝ dakara ma dǝ kazhakwa aandzu dǝ ghuuva,
    13: Da nǝghǝva nǝghǝga nǝ tlǝra aandzu kwar kǝ dadda ndǝrga, da marazha sagal daghuvalana, adaba da marava dǝ kara aandzu tlǝra wara, dlaɓa kaar wa da sǝra tlǝri ɓaga nǝ uudana.
    14: Akwama ngǝrɗǝtbi nǝ ndǝrgǝn favara dat ghǝr kwa favarzhanǝn biya, daddakwa ɓaga kwan kǝ ndǝrga da tlǝkǝnatlǝg kǝ dǝgshigaana.
    15: Akwama ngǝrɗǝt ngǝrɗǝg nǝ tlǝriina, daddakwa ndǝrgiina da huɓǝgan kǝ dlaɗa aandzu ba da tlǝkǝnatlǝg kǝ katǝga, band daddakwa dǝgal matataka kaara.
    16: Mbats amm sǝrgai taaki am guda Daadamazhigǝl nǝ uuram biya, dlaba shidkwa Daadamazhigǝl wa ndzǝga makuuram biya?
    17: Baɗǝm nǝ daddakwa badzǝda guda Daadamazhigǝla, da badzǝgaan dlab nǝ Daadamazhigǝl kǝ iina adaba guda Daadamazhigǝla cacuwana cacuwanan nǝ iina, ɗlaba kuuram nǝ gudiina.
    18: Aa valdabi nǝ uudan kǝ ghǝrani, akwama tlǝtlǝgaan nǝ uudan ma ghǝran taaki dadda dabari nǝ iin hulkwa dǝvakai nǝ duniya, aa nǝdal nǝg kǝ ghǝran band dlaga mbakyarvad nal kǝ dadda dyǝmdyǝma.
    19: Adaba dyǝmdyǝma kwan kǝ duniya dlagǝr vak Daadamazhigǝla, mbakyarvad viinda viindan taakiya, “viigan kǝ lii dǝ dabariya baz dyǝmdyǝmatǝra.”
    20: Viindaviindan dlab ma kakkaɗa Daadamazhigǝl taakiya, “Sǝrgasǝrga nǝ yaazhǝgǝl kǝ dzamaghǝra yaa daddaha kwad dabariya taaki maay nǝ tlǝraani.”
    21: Mbakyarvad kwaha aa tsibi nǝ uudan kǝ kushǝgh dǝ uud biya, adaba baɗǝm nǝ ba dǝgaruwa.
    22: Aandzu Bulusa ma Afullusa ma Kǝfasa ma duniya ma shifǝga ma ǝmtsǝga ma dǝgitahi ndakwana aandzu kwa da tǝvuukwa baɗǝm ba dǝgaruu nǝ iina.
    23: Adaba am dǝga tlǝkatǝg nǝ uurama, dlaɓa tlǝkatǝga dǝga Daadamazhigǝla,
  4:
    1: Da sǝrkǝmnda ka ǝnkwan nǝ uud kǝm lii ɓatlǝra yaazhǝgǝla, kwavǝlatǝr nǝ Daadamazhigǝl kǝ langyi sǝrga jiirahan kwa shiɓashiɓanna,
    2: Adabad kwaha baraari kǝ lii hǝkya langyi ar nal kǝ uudaha jirjiira
    3: Dǝgit dyǝk bi vakar ma ba kuuram wam da fǝshakaiya, aandzu mada fǝshakai nǝ uud mat zharga ndzǝgana uud, kai bi wada fǝshaghǝrar biya.
    4: Ən sǝrgabi nai mbatak ǝn mǝng dǝ haip biya, bakǝvakwaha nal bi taaki ǝn maay dǝ haip ba lǝngngi lǝng biya, yaazhǝgǝl wada fǝshakaiya.
    5: Mbakyarvad kwaha ghudamarbi kǝ shari kǝ uud ma ɓagabi nǝ sart biya, pakamant pakǝga bamma sǝghawisǝg nǝ yaazhǝgǝla. Iin wada marda dǝgitahi shǝɓashǝɓan kwa ma gurtla, da tagdan dlaɓ kǝ dǝgiti tlatlǝg nǝ ǝrvǝdmahuɗuudaha, tǝhalakwah wada caug aandzu ma ba war kǝ kalkala dǝgshǝgaan vak Daadamazhigǝla.
    6: Aici zaraabahara, ǝlbǝg tǝghǝr kwanahaana nandal kǝ garav tǝ ghǝrarra ard Afullusa mbakyarvad kǝ uurama, kiyava tsagan kǝskuuram kǝ ǝlbǝg taaga taakiya, “Dzǝvamabi kǝ dǝgiti viindaviivdan biya,” haik tsa kusgha kǝ palla ruwa dǝ kwa tsagu n iin tǝghǝr k uudana.
    7: War wa tagaktag taaki juughujig kǝ kyalmahi?
    8: Auwa agha dǝvakai nǝng kwa Daadamazhigǝl bi wa vǝlakakvǝlǝg biyi? Akwama bandkwah citsa, aujilbǝg agha naa ghǝr mandki aa vǝlǝk gyagyanbi nǝ uudti?
    9: Adaba manzharg naiya, maradamarg nǝ Daadamazhigǝl bat ɓalaɓal taakiya kǝm lii ɓa tlǝra kǝm dǝga halla aandzu ma ƙǝ dǝgita, band lii ghudavtǝrdan sharia ǝmtsǝga, adaba namdalnǝg nǝg nǝmnd kǝ dǝgiti da fǝg nǝ duni kǝ gyi tǝvakai baɗǝm, baz zarha ɓǝlga Daadamazhǝgla ard uudaha.
    10: Namdalnǝg kǝ ɗlag mbakyavad tlǝkatǝga, bakǝvakwaha am dǝ dabari nǝ uuram ma tlǝkatǝga! kǝm maay dǝ ndzǝɗ nǝmnd biya kuurama am dǝ ndzǝɗa! fa zhiruw nǝ uud tǝ kuurama, vǝlkǝmnd dlaɗ nǝ uuda!
    11: Ndakwana njikǝmnd nǝ waiya ard andǝla, ǝm maay fahaa sǝɗav marawau biya, kalkǝmnd kalǝg nǝ uuda, dlaba kǝm maay dǝ hǝnyah biya.
    12: Kǝm ɓa ba tlǝr dǝ ghǝramǝmnda, akwama ɗahakǝmvaɗahǝg nǝ uuda, kǝm fǝtǝra kǝ bark dlakulvana, akwama vǝlakǝmnd vǝlǝg nǝ uud kǝ dlaɗa, kǝm ba ɓǝsgaana.
    13: Akwama tagaratag nǝ uudah kǝ dǝga bandza ɗaag tǝ kǝmnda, kǝm tagtǝrda kǝ ǝlbǝg bad ǝmtakǝra. Namndal nǝg nǝmnd band agagava, kwa naabi nǝ uudaha duni biya.
    14: Viindankuura viindǝg nai kwana mbakyarvad ǝnfǝkuurdǝm dama zhiruw biya, viindan kuura mbakyavad ǝn ɓǝlkura kǝ magiya adaba am zarharr kwan waitǝr naiya.
    15: Aandzu am bad lii tsaga dǝgit ma tlǝkatǝga kwa kǝdlǝvtǝrnabiya, am maay dǝ daadah dyak biya. Ba jijia nanalnǝg nai kǝ daad kǝskuuram ma tlǝkatǝga yesu tǝdvad lang kurda ǝlbǝg marawa.
    16: Mbakyarvadkwaha, ǝn ghalaakuurama tsagamtsag dǝ kaiya.
    17: Adabadkwaha ɓǝlanant ɓǝlǝg kǝ Timuti zǝrar da vakaruuwa kwan waig naiya, haiyananthaig nai dǝ iin ma yaazhǝgǝla, da dzamkurnǝs dzamǝg kǝ ɗuuli ǝn gatǝg naiy kǝ Tlǝkatǝg Yesu, ard ɗuuli ǝn tsagtǝr nai kǝ dlamakǝlaaa lii gatǝga.
    18: Kǝsarantkǝsǝg nǝ kyalmaharu mandki ǝn da maay dagau davakaru biya, baz naa ghǝratǝr kǝ iitǝra.
    19: Akwama haighant haig nǝ Yaazhǝgǝla ǝn da zǝlmabi kǝ dagau davakaru biya, ǝn da sǝran kǝ hulfa ndzǝɗi dǝ vakai nǝ lii naa ghǝraatǝrna, kwakyǝ ǝlbǝgahaatǝr biya.
    20: Adaba tlǝkǝsa Daadamazhigǝla tǝvaghai biya, bamma tǝ ndzǝɗaana.
    21: Aitsa, auwama kǝsgaka nǝ uurami, ǝn dagau davakaru dǝ kiiɓni, nii ǝn markurda kǝ wayakǝvǝrhi?
  5:
    1: Ciinganaciing taakiya mǝng nǝ lii ɓa gwaragwar makuurama, hulfa kwa maay ɓagav aandzu ma lii sǝrgai kǝ Daadamazhigǝl biya, mǝng nǝ daddakwa nadal uusa daddaan band uusaana.
    2: Baz tǝɗa fǝɗaavǝgh kǝskuurama! mbats, kalkalanbi kǝskuuram un gda ǝrvǝdmahuɗa, am sǝdan kǝ daddakwa ɓa kwa nǝ iin ma kuuram biya?
    3: Aandzu ba ǝn maay ǝmtaɗ dǝ kuuram ma ndzǝgana vǝghbiya, ǝn ba ǝmtaɗ dǝ kuuram ma shidkwa cacuwana cacuwana. Ghudanarda ghudǝg nai kǝ sharia kǝ dadda ɓa kwan kǝ dǝgita ma ɗaaga Tlǝkatǝg Yesu aandzu ban maay ǝmtaɗ dǝ kuuram biya.
    4: Akwama dǝ dzahamvǝt dzahǝga ǝn ba ǝmtaɗ dǝ kuurama, ard ndzǝɗa Tlǝkatǝg Yes,
    5: Am vǝlar kǝ shatanah kǝ uuda nǝ iina, aandzu ba badzada badzǝg nǝ shatanah kǝ vǝgha uuda nǝ iina, da katav nǝ shifǝgaan davala fachiya Tlǝkatǝga.
    6: Tsa kushǝghǝn am ɓag nǝ uuramna dǝgit maraw biya, mbats am sǝrga biya, abi zǝr yist ba ǝnkyakwah wa fǝgara kuburǝg kǝ bruudiya?
    7: Samdasǝg kǝmghura yista aa haipa kiyava nǝg kǝ daala bruudi, ba jirjira band kwaha. Aɗaba ɓagava ɓag nǝ kyulǝga Zǝra Mbakǝllaka kiyava hwaɗaga haara kǝssa ndzava hǝnyaha, iin nǝ Tlǝkatǝga.
    8: Mbakyarvad kwaha ɓagiyamɓag kǝ hwaɗaga haara kǝssamiiyama, dǝ bruudi kwa dǝ ǝnghura yist ma vakai biya, kwa dǝga naiy kǝ uuda ard dǝga ɓa kǝladǝr biya, bamma dǝ bruudi kwal yista kwa iin ɓa jirjira ard haigant haiga.
    9: Viindankura viindǝg ma wakitar taakiya haɗambi ghǝr dǝ lii ɓa gwaragwar biya,
    10: Ən taa kǝ hulfa gwaragwara kwan kǝ duni biya, ma lii ɓa dlǝrmǝga, ma lii ɓa gǝlla, ma lii ɓagarnǝs kwatǝnahǝr ghǝllaha. Akwama bandkwaha barari am sagal ma tlǝra duniya.
    11: Ən viindkur kwan nai taakiya haɗambi kǝ ghǝr aandzu kwar kǝ zǝraabi kwa gata Yesu ma ba ɓa gwaragwariya, aandzu dadda dlǝrmǝg biya, ma dadda ɓagar kwatǝnahǝr ghǝlla, ma daddakwa ɗavaɗava, ma dadda huɓa kya, ma dadda ɓa gǝlla, zambi kǝ kaf dǝ hulf kwan kǝ uudah biya.
    12: Au lambar dǝ tǝtǝr shari kǝ lii ar dǝgamiiyambiyi? Am da tǝtǝr bak zaraabahamiyam lii gatǝg nǝ uuram kǝ shari biya?
    13: Daadamazhigǝl wada tǝtǝr shari kǝ lii dǝgamiiyam biya, lagwamdalagw kǝ kǝlaadin makuurama.
  6:
    1: Akwama mǝng ma kuuram kwa na da ɗiiya ghuunja zǝraabana, mbats, dǝga zhiruw bi kǝ iin langan da vaka taa shari kwar yaa dadda gatǝgǝn biya, ma marau lang davak yaa dadda gatǝg nǝ iin biya?
    2: Mbats, am sǝrgabi taakiya yaa daddaha gatǝg nǝ lii da tǝtǝr shari kǝ duni biya? Akwama ba kuuram wada tǝgar shari kǝ duni tsautsa, am tǝgai kǝ shari tǝghǝr kǝ dǝgitahan ǝnkyǝkwahahaan biya?
    3: Amm sǝrgabi taakiya kǝmyam wada tǝtǝr shari kǝ zǝrɓǝlgaha Daadamazhigǝl biya? Kyakaɗava dǝgitahi ma kwan kǝ duuniyi kaciya?
    4: Akwama dzǝghadzǝg nǝ hulfa kwanahaan dǝ kuurama, aujibǝg am lang davak kwa yaa daddaha gatǝn biyi?
    5: Taganɗatag nai kwana mbakyavad am dǝm dama zhiruwa, aitsa, maay aandzu pal makuuram nǝ daddakwa dǝ dabari kwada ɓadlǝna ɓadlǝg ndzǝgana zǝraaba ard zǝraab biya?
    6: Aujibǝg kaci kǝ dadda gatǝg ɗiiya ghuunja zǝraaban da dama guda taa shari, kwa tǝvuukwa yaa daddaha gɑtǝg biyi!
    7: Diiya ghuunja zaraabaha ruwǝn am ɓag nǝ uuram na, abi hǝtsamal hǝtsǝg nǝ uuram ǝndkwahiina, ngulǝm am fak kǝ huɗa zǝkuruu nǝ uud biya, dlaɓa am fa kǝ huuɗa aandzu ma hutsakurvahutsǝg nǝ uud kǝ dǝgahaaru biya?
    8: Iin wan kwana, bakura kuurama am za dǝga zaraabaharuwa, am hǝkya dǝga uudaha, baz dǝga zaraabaharuwa!
    9: mbats, am sǝrgai taakiya lii maay ɓa dǝga jirjir biya ar da dǝgaabi dama tlǝkǝsa Daadamazhigǝl biya? Aa valkurdabi nǝ uud biya adaba maay nǝ lii ɓa gǝlla, ard lii ɓagarnǝs kwatǝnahǝr kǝ ghǝlaha, ard lii ɓa gwaragwara, aadzu ghulvahi hǝnna dǝ zǝraabatǝr ghulva,
    10: Ma gǝllaha, ma lii dlǝrmǝga, ma lii tsǝtǝr nǝ kya, ma lii ɗavaɗaava, ma lii pǝrɗa dǝguuda, maay aandzu pallatǝr kwa da daadama tsǝkǝsa Daadamazhigǝla.
    11: Ndza bandkwaha nǝ kyalmaharu wurra, ndakwana barakuraka barǝg nǝ uuda, fakurafǝg nǝ uud ba cadlǝdlǝ tǝvuukwa Daadamazhigǝla, dlǝɓa ngǝdlakura ngǝdlǝg nu uud sagal ma haipahahu tǝvuukwa Daadamazhigǝla ma ɗaaga Yaazhǝgǝla Yesu Tlǝkatǝga, ard shidkwa Daadamazhigǝla miiyama.
    12: “Haighwanthaig nǝ uud kǝ dǝgitsh baɗǝmma” dlaɓa baɗǝm bi nǝ dǝgitah kwa mǝng nǝ tlǝran biya, “Haighwanthaig nǝ uud, kǝ dǝgitah baɗǝmma”, ǝn nǝgalbi kǝ Eva aandzu ma bau biya.
    13: “Tavatǝg nǝ kaffa mbakyarvad huuɗɗa, huuɗ dlaɓa mbakyarvad kaffa,” ba Daadamazhigǝl wa da ghyǝhtǝrghyǝhga ba bǝrkuɗa, ɓagava mbakyarvad gwaragwar nǝ vǝghǝ biya, mbagava mbakyǝ tlǝkatǝga, tlǝkatǝg dlaɓa mbakyarvad vǝghǝgha.
    14: Ciighant ciig nǝ Daadamazhigǝl kǝ Yaazhǝgǝl ma gǝtlaha, bandkwah dlaɓ nǝ miiyama da ciikiyamciig nǝ uud tǝdvad ndzǝɗaana.
    15: Mbats, am sǝrgabi taakiya vǝghǝghaharuwa uuɓiyaha tlǝkatǝg biya? Ən haigant biya, ǝn kǝsant kǝ uuɓiyaha tlǝkatǝga ǝn nǝdal kuuɓiya karuu biya.
    16: Am sǝrgai taakiya baɗǝm daddakwa matlǝgant vǝghǝghan dǝ karuuwa naral nǝg kǝ vǝghǝ pall biya? Aɗaba viindaviindan ma kakkaɗa Daadamazhigǝl taaki, “Ba bǝrkuɗatǝra naralnǝg kǝ vǝghǝ palla.”
    17: Baɗǝm nǝ daddakwa matlǝghant matlǝg kǝ ghǝran dǝ tlǝkatǝga naralnǝg kǝ ma shidkwa cacuwana cacuwananna.
    18: Duwamars ɗuug kǝ ɓa gwaragwara! baɗǝm nǝ haipi ɓag nǝ uuda dzavǝmbi dǝ vǝghanbiya, aɗaba dada gwaragwara ɓagar haip kǝ ghǝraana.
    19: Am sǝrga bi taakiya vǝghǝgharuwa guda shidkwa cacuwana cacuwananna kwa makurama, dlaɓa vak Daadamazhigǝl biya? Kuuram bi wam dǝ ndzǝɗ tǝ ghǝraruu biya.
    20: Sǝgwara dǝ sǝɡw nǝ uuda pǝlavapǝlǝga. Mbakyarvad kwaha galamgalǝg kǝ Daadamazhigǝl dǝ vǝgharuwa.
  7:
    1: Aiciya, tǝghǝr kǝ dǝgiti viindama nǝ uurama, ɓagaɓag kǝ maraw ndzan nǝ uud kwal kǝssuusa.
    2: Aɗaba haik ɓa gwaragwar kǝskuurama, ma kwar kǝ ghulva aa kǝssǝg kǝ uusaana, bandkwah dlaɓ nǝ uusa aa ndzandzǝg dǝ zhiilaana
    3: Aa vǝlarvǝlǝg nǝ zhiil kǝ vǝghaan kǝ uussaana, bandkwah dlaɓ nǝ uusa aa vǝlarvǝlǝg kǝ vǝghaan kǝ zhiilaana.
    4: Adaba maay nǝ uus dǝ ndzǝɗ tǝghǝr kǝ vǝghaan biya, bamma zhiilaana, bandkwah dlaɓ nǝ zhiila maay dǝ ndzǝɗ tǝghǝr kǝ vǝghaan biya bamma uussaana.
    5: Aa piyardabi nǝ palaru kǝ uud pal biya, bamma am haigant nǝ uuram kǝ tsaha hǝng kiyava fa ndzǝɗ kǝskuuram ma ndzǝgwazhǝgǝla. Tǝhalakwaha am gwiya matlavva, aa valkurdabi nǝ shatanah akwama am maay fa huuɗ biya.
    6: Shawari wan vǝlkurnaiya, barari biya.
    7: Akwama baɗǝm nǝ uud band kaiya, ma bawara bad vǝlga sǝrgasǝrgi aa vǝlgar nǝ Daadamazhǝgǝlaana kwana vǝlava shah dǝ kwaha.
    8: Ma ɓagaɓ kǝ marau maraa ndzan band kai nǝ lii kǝssarubi kǝ uusa ma zhiil biya, ard lii ǝtsahatǝraa nǝ zhiila.
    9: Akwama ar fǝgabi kǝ huud biya, aa kǝssar kǝssǝga.
    10: Lii kǝssaru kǝssǝga, ǝn tagkurtaga, kai bi wa tagan biya, Yaazhǝgǝl wa tagatag taakiya, aa tagwzha bi nǝ uus dǝ zhiilan biya.
    11: Akwama tagwazha tagw dǝ vakaiya, aa gwiya kǝsbi kǝ zhiil biya, aa gwiya dǝg daa da vǝgya zhiilaana, aa gwiya lagw bi nǝ zhiil biya.
    12: Tǝghǝr kǝ kyalmah dlaɓa, kai wa tagana, Yaazhǝgǝl biya, akwama mǝng nǝ zǝraab dadda gatǝg kwa dǝ uusi maay gata yaazhǝgǝl biya, haighanthaiga ndzǝrandzǝg ǝmtaɗa, aa lagwda biya.
    13: Akwama mǝng dlaɓ nǝ uusa kwad zhiila maay gata Yesu biya, haighanthaig ndzǝra ndzǝg ǝmtaɗa, aa tagwzhabi dǝ vakai biya.
    14: Tagandatag naiy ǝndkwaha, aɗaba zhiila kwa maay dǝ fadghǝr biya, ba cuwaɗaɗ nǝ iin tǝdvad ndzǝgan ǝmtaɗ dǝ uusaana, bandkwah dlaɓ nǝ uusi kwa maay dǝ fadghǝr biya ba cuwaɗaɗ nǝ iin tǝdvad ndzǝgan ǝmtaɗ dǝ zhiilaana, akwama maay ǝndkwah biya zarharuwa ar da maay cuwaɗaɗ biya, ndakwana ar da cacuwana cacuwana.
    15: Akwamana tagwzh nǝ daddakwa maay gata Yesu dǝ kwa gata Yesu, aa tagwarkǝva tagwa, maay barariya ndzɡan ǝmtaɗ kǝ daddakwa gata Yesu ma ghulva ma uusa dǝ kwa maay gata Yesu biya, aɗaba ɗahakiyamit kiyava ndzǝgana lapiyǝr nǝ Daadamazhigǝla.
    16: Kǝgh uusa, agha sǝrgasǝrg mbatak kǝgh wagha da kata zhiilaagha? Kǝgh zhiila, agha sǝrgasǝrg mbatak kǝgh wagha da kata uusaagha?
    17: Ma bawara aa ɓag kǝ ndzǝgaanan band kwa naag nǝ Yaazhǝgǝla aandzu takwar kǝ ɗuula, kwa ɗaaghant nǝ Daadamazhigǝl kǝ ɓagaana. Adzahadzahi ǝn vǝltǝr naiy kǝ lii gata Yesu baɗǝmma.
    18: Baɗǝm nǝ daddakwa ɗaagant nǝ Daadamazhigǝl, kwa ndza ɓagavara ɓag nǝ aghuvaca, agwiya gat bi nal band dadda kwa ɓagavara biya. Kwa ɗaaghant nǝ Daadamazhigǝla, kwa ndza ɓagavarabi nǝ ghuvac biya, aiciya, aa tag bi taaki bamma ɓagavara ɓag nǝ aghuvac biya,
    19: Ɓagaɓagan nǝ aghuvaca, ɓagabi nǝ aghuvacbiya, maay nǝ dǝgiti tuukvakai nǝ iini, tsufa adzahadzaha Daadamazhigǝl wa marawa.
    20: Ma bawara aa ndzandzǝg ba tǝ dǝgiti ɗahavant nǝ iina,
    21: Akwama ndzagha Eva nǝg ma sartakwa ɗahakǝt nǝ uuda, ndavbiya. Magha ba tlǝkǝna tlǝg kǝ ɗuula kwara ghǝragha agha ɓagan kǝ dǝ vakaiya.
    22: Baɗǝm nǝ daddakwa ndza Eva nǝ iin, ma sartakwa ɗahghant nǝ Tlǝkatǝga, madlabi nǝ iin Eva biya, dǝga tlǝkatǝg nu iina. Bandkwah dlaɓ nǝ daddakwa ndza ɗahavant ma sarta kwa tlǝkǝnatlǝg nǝ iin kǝ kwara ghǝra, nalnǝg nǝ iin ku Eva Tlǝkatǝga.
    23: Sugwakuraa suug nǝ uud ba pǝrra, namal bi kǝ Eva uudah biya.
    24: Aici zaraabahhara, ma hulfa kwar kǝ ndzɡan wa ndzamvakai nǝ uudan ma sartakwa ɗahavant nǝ iina, aa ndzandzǝg bandkwh ǝmtaɗ dǝ Daadamazhigǝla.
    25: Əlbǝg tǝghǝr kǝmghwasahi kǝsaruubi kǝ zhiil biya, tag ghwabi nI Yaazhǝgǝl kǝlǝb tǝghǝr kǝ iitǝ biya, ǝn taa dǝgiti ma ghǝrar nai taakiya haiyakuthaig nu uud kǝskaiya, tǝdvad zhǝwaɗaala Yaazhǝgǝla.
    26: Manzharg naiya ɓagaɓag kǝ marawa kǝ uudan ndzan bandkwaha kwal kǝsguu uusa, mbakyavad sarta dlaɗ wa ndakwana.
    27: Akwama kǝsghuu kǝssǝg kǝ uusa, lagwbi dagal biya, akwama kǝssghuubi kǝ uus biya, kǝsbiya.
    28: Adaba dadda kwama kǝssuukǝskǝg ku uusa, haip biya, dlaɓa akwama kǝssuu kǝssǝg nǝ dughwa kǝ zhiila, haip biya. Bakǝvakwaha, baɗǝm nǝ lii ɓagaraɓag kǝ auraiya ar da huɓa dlaɗa ma ndzǝganatǝra, mana naag nai ǝn ngǝkura sagal ma dlaɗa.
    29: Dǝgiti ǝn tlatlǝg nai ǝndkwahiin zaraabahara, adaba hǝrz nǝ sart kǝ ghyǝnnga. Ciigǝt ndakwana, lii ɓagaraɓag kǝ auraiya aa nardalnǝg kǝ ghǝratǝr band lii ɓagarai kǝ aurai biya.
    30: Lii dǝ badzǝga ǝrvǝdmahuɗa aa naralnǝg band lii ar maay dǝ badzǝga ǝrvǝdmahuɗ biya, lii ar hwaɗag aa naralnǝg band lii ar maay hwaɗag biya, dlaɓa lii sǝgwa dǝgita ar naralnǝg band lii maay aandzu ndaubiya,
    31: Lii ɓatlǝr dǝ kadlanga duniya, aa farbi kǝ ghǝr dǝ iitǝr biya, adaba duuniina, da ghyǝngga.
    32: Mana naag nai mamma ngǝdlan sagal ma ndzama dǝgitaha. Daddakwa kǝssuubi kǝ uusa nndzama ba ǝlbǝga Yaazhǝgǝl ba vaivaiya, kwa da ciinguciing nǝ Yaazhǝgǝl kǝmtakǝraana.
    33: Adaba daddakwa kǝssuukssǝg kǝ uusa ndzamgan kǝ dǝgaha duniya, kwa da fǝgara uusaan kǝ ciinga ǝmtaƙǝraana.
    34: Tagwazhztagw nǝ ghǝran hutsǝg buwa, Uusi kwa kǝssuubi kǝ zhiil biya, ma dughwa nǝ iina, ndzama ǝlbǝga Yaazhǝgǝla ba vaivaiya kwa da nǝgalnǝg nǝ iin kǝ cacuwana cacuwanan tǝdvad vǝgha ard gatǝga. Uusi kwad zhiila ndzama dǝgaha duunita, kwa da fǝgara zhiilan kǝ ciinga ǝmtakǝraana.
    35: Naa tagkur kwana mbakyavad da mǝlkuru mǝlǝga, kwakyavad ǝn mbukurars biya, adaba ma nal nǝ ndzǝganaru kǝ marauwa, kiyava ɓagarnǝs kwatnahǝr kǝsskuram kǝ Yaazhǝgǝl kwa tagwzhatagw nǝ ghǝraaruuwa.
    36: Akwama taatǝg nǝ uudan kǝ langyi dǝ dughwa kwa tlaltlǝg kǝssa zhiila, dlaɓa ma zharg nǝ iina ɓagharai kǝ dǝgit kalkal biya, tǝhalakwa kǝmgan nǝ iin ba vaivaiya, aa kǝssǝga. Ma nalnǝg ndkwaha, haip biya.
    37: Ma ndzaghana ndzǝmǝg ma ǝrvǝdmahuɗan taakiya, barari bi kǝ iin kǝssǝgan biya, dlaɓa faɗǝm fǝg ma ǝrvǝdmahuɗan maay kǝssgaan biya, ba kalkalla.
    38: Mbakyavad kwaha daddakwa kǝssguu dughwi kwa taa nǝ iin kǝ langyi kǝssgaana, ɓagaaɓag kalkalla. Daddakwa kǝssuubi ma juujig kǝ iina.
    39: Aa tagwzabi nǝ uus dǝ zhiilan ma ba dǝ shifǝg biya, akwama ǝmtsaǝmtsǝga nǝ zhiilaana, kǝssgan kǝ zhiili naagant nǝ iin, bama dadda gata Yaazhǝgǝla.
    40: Akwama tǝ naagara, ma da ciinguu ǝnkwaha nǝ iin kǝmtakǝra ma ndzaandzǝg bandkwaha, adaba man zharg naiya ǝn dǝ shidkwa Daadamazhigǝla naiya.
  8:
    1: Aiciya, tǝghǝr kǝ dǝg zhǝgi kwa vǝlvar kǝ ghǝlla, kǝyim sǝrgasǝrg baɗǝma miiyama kǝyam ba dǝmdǝmma, dǝmdǝmǝr wa fǝgara naa ghǝr kǝ uuda, wayaakǝvǝra fǝgara sǝrgasǝrgǝra.
    2: Baɗǝm nǝ daddakwa zhara taakiya mandki sǝrgasǝrg kǝ dǝgitah baɗǝmma, bakǝvakwana sǝrgai kǝ dǝgiti marauwi biya.
    3: Baɗǝm nǝ daddakwa waigan kǝ Daadamazhigǝla, sǝrgasǝrg nǝ Daadamazhigǝl kǝ iina.
    4: Aiciya, tǝghǝr kǝ zaa dǝg zǝgi kwa vǝlvar kǝ ghǝlla, kiyam sǝrgasǝrg taakiya, baɗǝm ma duuniya, maay nǝ dǝgita tuukvakai nǝ ghǝllah biya, dlaɓa kiyam taakiya Daddamazhigǝl ba palla, maay nǝ watlǝrn biya.
    5: Aandzu ba mǝng nǝ dǝgitahi ɗahvǝtǝr dǝ “daadamazhigǝlah”ma maghǝzhigǝla ard ma duuniya, aɗaba mǝng nǝ daadamazhigǝlaha ard yaazhigǝlah ba dyaka.
    6: Bakǝvakwaha, ba pal nǝ Daadamazhigǝl kǝskǝmnda. Kwa iin Daadamazhigǝla Daada kwa baɗǝm nǝ dǝgitah dzǝghar ba vakaana, Kwa kiyam ndzǝgan nǝ miyam kwakyarvad iina, Yaazhǝgǝl ba palla, iin yesu tlǝkatǝga, kwa baɗǝm nǝ dǝgitaha dzǝghar tǝdvad iina, dlaɓa kiyam ndzǝgan tǝdvad iina.
    7: Bakǝvakwaha baɗǝm bi nǝ lii sǝrgasǝrg kǝ kwan biya, adaba gwastan ba dlab nǝ lii narǝtnǝg kǝ ɓagarnǝs kwatǝnhǝr kǝ ghǝllaha ar tlatla taakiya dǝgzǝgi ar zǝg nǝ iitǝrna dǝga ghǝlla. Adaba ɓagara bi kǝ ndzǝɗ ndan biya, mar zharg nǝ iitǝra mbaɗarambǝg tǝdvad zaa dǝgzhǝga.
    8: Sǝkiyamnda bi nǝ dǝg zǝg hǝrz da tǝvǝgh kǝ Daadamazhǝgǝl biya, aandzu ziyamuu biya, gulkiyama biya, aandzu ma ziyamuuziga fakiyamarna biya.
    9: Famfǝg kǝ hyǝmiya aa nalbi nǝ kwara ghǝraru kǝ duula ɓa haip kǝ lii hǝtsahǝtsa nǝ fadghǝraatǝr biya.
    10: Adaba ma nǝghǝkak nǝghǝg nǝ kyalma uudah kǝskǝghǝn agha sǝrgasǝrǝg kǝ dǝgitǝn agha zaa kaffa ma guda ghǝllaha, mbats da fǝtrabi kǝ ghǝravatǝr nǝ wan kǝ zaa dǝgzǝg kwa fǝvara kǝ ghǝllah, adaba hǝtsahǝtsan nǝ fadghǝraatǝra biya?
    11: Tǝdvad kwaha, sǝrgasǝrgǝraghna da nǝg kǝ duula mbǝɗǝg kǝ zaraaba kwa ǝmtsan nǝ tlǝkatǝg mbakyarvad iina.
    12: Akwama ɓagamtǝraɓag kǝ haip kǝ zaraabaharu tǝdvad fǝtǝra ɓa dǝgiti ghwaɗa, amaa ɓagar haip kǝ Tlǝkatǝga nǝ uurama.
    13: Mbakyarvad kwaha akwama zaa dǝgzǝg wa da fǝgara zǝraabagh kǝ mbǝɗǝg tǝ duula, ǝn ɗugan kǝ zaa tlǝu haik kǝ mbǝɗǝg kǝ zǝraabar tǝ duula.
  9:
    1: Ən maay naiy dǝ kwara ghǝr biya? Nii ǝn dlakulva gyiya yesu bihi? Nǝghǝghanabi nai kǝ Yesu Yaazhǝl biya? Nii ɗǝg shIgar ma Yaazhǝgǝl bihi?
    2: Akwama ǝn dlakulva gyiya Yesu bi nai vak uudah biya, ǝn dlakulva gyiya Yesu nai vakaruwa adaɓa kuuram nǝ dǝga sǝrga taakiya ŋ dlakulva gyiya Yesu naiya.
    3: Ən ngǝdlǝg ndkwah nai kǝ ghǝrar vak lii arna sǝrra ndzǝganara.
    4: Mbats kǝm maay dǝ ndzǝɗ vǝlkǝmnd nǝ uud kǝ dǝg zhǝga ard yuwa hubǝg biya?
    5: Kǝm maay dǝ ndzǝɗa gwiyav dǝ ǝmghwassahamǝnd band kwa ɓag nǝ kyalmaha lii ɓa tlǝri, ard zaraabah ma gata Yaazhǝgǝla, ard kefas biya?
    6: Nii ba kaiya ard barnabas ha wa nalnǝg kǝ barari kǝskǝmnd ɓa tlǝr gǝlla ghayamǝndi?
    7: War wa ɓatlǝra tlauja tǝhalakwaha iin wa gǝlla ghǝraani? War wa uusa ghuha inabi, kwal huɓgwibi kǝ yuwan biyi? War wa piiya almana, da pǝlarvan huɓa watli??
    8: Ən taa kwana kwakyarvad dǝgiti naag nǝ uuda? Taagabi na adzahadzah muus ndkwahiin biya?
    9: Adabb viinɗaviinɗan ma adzahadzaha muusa taakiya, “mbusarbi kǝ ghai kǝ tlusǝg ma sarta buga hiya biya,” ba tlah pall wa fǝg nǝ Daadamazhigǝl kǝ hyǝmi tǝ iitǝra?
    10: Tagav da mbakyarvad kǝmyam nǝ ǝlbǝgiin biya? Ba jirjiira, viindava mbakyarvad kǝmyamma. Abi kalkalan kǝ daada uusǝga ard dadda bugahiya fadghǝr kǝ tlǝkǝna dǝgshigaan matlra guuha.
    11: Akwama riitamǝnd riig kǝlbǝga Daadamazhigǝl ma ǝrvǝdamahuɗaruwa, aiciya, dǝgit dyak vakamǝnd akwama ghudamǝnda ghudǝg tlǝraru kwa hulfa dǝga duniya biya?
    12: Akwama tlǝkǝnatlǝg nǝ kyalmah kǝ ndzǝɗa ɓa kwaha, mbats, jamtǝrubi nǝmnd dǝ ɓa kwahiin biya? Bakǝvakwaha, ɓagamnd bi kǝ tlǝr dǝ ndzǝɗǝmǝnd biya, famǝnda fǝg kǝ huɗda ɓagamǝndbi kǝ dǝgiti da tsǝgarva taa ǝlbǝg marawa tlǝkatǝga.
    13: Mbats, am sǝrgai taakiya lii ɓatllǝr ma guda Daadamazhigǝla ar tlǝkǝna ba vakwahiin kǝ ɗǝgzǝgaatǝr biya? Lii ɓatlǝra tǝ ɓagadiya, ar tlǝkǝna ba dǝga kyuulǝg nǝ iitǝr kǝ dǝgshigatǝr biya?
    14: Bandkwah dlaɓa, tagadatag nǝ adzahadzaha Yaazhǝgǝl taakiya lii taa ǝlbǝg marawa ar da tlǝkǝna bavakwahiin kǝ dǝga pǝla puutatǝra
    15: Ɓaganbi nai kǝ tlǝr aandzu dǝ pal ma kwanahaan kǝ kwara ghǝr biya, adaba ǝn viinda kwanǝn naiya mbakyavad ɓagwi nǝ band kwah biya, nggulǝm ǝn ǝmtsan nai tǝghǝr kwa da tsǝkwava nǝ uud kǝ tsa kuusghǝg dǝ kwanna.
    16: Aandzu ban ɓa tlǝra taa ǝlbǝg marawa, nalbi adabanǝ wan kǝdǝga tsa kushǝg kǝskaiy biya, adaba barari kǝskai ɓatlǝra, dǝga zhuwadaal kǝskai akwam ǝn maay ɓatlǝr taa ǝlbǝg maraw biya.
    17: Akwamana ɓag kwakyarvad naaga ghǝrarra naiya, ma pǝlgwapǝlǝg nǝuud kǝ dǝgshigara, adaba ǝn ɓag kwakyarvad nǝgha gyiya biya, vǝlghwa langyi nǝ Daadamazhigǝla.
    18: Auci nǝdǝgshigari? Dǝgshigara, iin taa ǝlbǝg marawa, ǝn tagaan ba gyagyaana. Ən maay ɓa tlǝr dǝ kwara ghǝrǝn tlankǝna naiyin ma tlǝra taa ǝlbǝg maraw biya.
    19: Bakǝvakwana ǝn Eva aandzu war naiy biya, nandalnǝg kǝ ghǝrar kǝ Eva aandzu ba wara, adaba ǝn tlǝkǝna kǝ uudah ba dyǝka.
    20: Vak yahudaha, nanalnǝg band zhiil yahudah nai kiyava dzahdaan kǝ yahudaha. Kwar ma kwarǝg adzahadzaha musa, iin nǝdal kǝ ghǝrar band daddakwa kwarǝg na adzahadzaha, aandzu ba adzahadzahbi wa kwara kaiy biya, mbakyarvad ǝn dzahdaan kǝ lii kwarǝg nadzahadzaha.
    21: Vak lii ar maay ma kwarǝga adzahadzaha muus biya, nanalnǝg nai band daddakwa maay ma kwarǝga adzahadzaha muus biya, kwakyarvad ǝn taaki maay na adzahadzaha Daadamazhigǝl ɓatlǝr dǝ kaibiya, ǝndkwah biya, ǝn mazhangǝl kǝ adzahadzaha tlǝkatǝg naiya, kiyava saa dǝ lii ar maay mazhangǝl kǝ adzahadzaha muus biya.
    22: Lii hǝtsahǝtsan nǝ fadghǝraatǝra, nandalnǝg nai kǝ ghǝrar band daddakwa hǝtsahǝtsan ma fadghǝra kiyava saa dǝ iitǝra, dlaɓa nanalnǝg nai aandzu hulfa kwar kǝ dǝgita vak aandzu hulfa kwar kǝ uudaha adaba ma ɓagaba ndandara ǝn kattǝrt kǝ kyalmaha.
    23: Ɓaganaɓag nai baɗǝm bandkwana mbakyarvad ǝlbǝg marawa, kiyava tlǝkǝnatlǝg kǝskai kǝ dǝgshigar ma barkaana.
    24: Mbats am sǝrgabiya, vaka ɓa dǝrra ɓalla ǝmndǝrga, baɗǝm nǝ lii ɓalla ǝmndǝrga arɓa kǝlla ndzǝɗaatǝra ar jaara kǝ pallatǝra, ba pal miitǝr wada zaa firbiya?
    25: Ar ndaigan nǝ lii ɓa dǝr kǝ ghǝraatǝr ma kwar kǝ dǝrra, ar ɓa kwana kwakyarvad ar tlǝkǝna kǝ dǝgshigaatǝr kwa da badzǝga, adaba dǝg shigamnda da maay badzǝg biya.
    26: Mbakyarvad kwaha ɓalla ǝmndǝrgara da nǝgalbi gyan biya, tsa dǝmbara ǝn tsǝg ma fǝdbiya.
    27: Adaba ǝn ndaiya vǝghara, nandalnǝg Evaara, mbakyarvad aa nalbi dlaɓ tǝhala taa ǝlbǝg maraw kǝkai kǝ kyalmaha, kai kata ghǝrarra da tsuwava nǝ uud kǝ tlǝkǝna zaa fiira.
  10:
    1: Aiciya, ǝn naagan am sran zaraabah taakiya, daadijahamiiyamma baɗǝma ndza hǝɗavtǝrdu da akumba tǝ ɗuula dagalla, baɗǝmmatǝra daral bama taataka yuwa haiya.
    2: Ɓagavtǝra bama akumba ard yuwa haiy nǝ tsuufǝg kǝ iitǝr baɗǝm ma gata adzahadzaha musa.
    3: Baɗǝmmatǝra zaruuzǝg kǝ dǝgzǝg aa shidkwa cacuwana cacuwana,
    4: Baɗǝmmatǝra huɓaruu huɓǝg kǝ yuwa shidkwa caccuwanacaccuwana. Adaba huɓaruu yuwa ma akura shidkwa cacuwana, kwa da dagal ǝmtaɗ dǝ iitǝra, kwahiin kǝ akura iin tlǝkatǝga.
    5: Bakǝvakwaha cǝngubi nǝ Daadamazhigǝl kǝmtakǝra kyamahatǝr biya, cǝɓavtǝra cǝɓǝga ma tǝghaala.
    6: Ndakwana, nalnǝg nǝ wannahaan kǝ dǝgitah kǝ garava kǝskimyam haik ɓa dǝgiyah ghwaɗa bandkwa ɓag nǝ iitǝa.
    7: Namalbi kǝ lii ar ɓargarnǝs kwatǝnahǝr kǝ ghǝllah band kwa naral nǝ kyalmah biya. Aɗaba viindaviinda makakkaɗa Daadamazhigǝl taakiya, “caahwarara caahwarǝg nǝ uudaha ar zǝgaana ar huɓgaana, baz shakalga ard gwaragwar biya.
    8: Bagiiyambi kǝ gwaragwar bandkwa ɓag nǝ kyalmah biya, adaba ba daval palla ǝmtsahara ǝmtsahǝg nǝ uudah alfu kulbuwa.
    9: Fishambi kǝ Yaazhǝgǝl band kwa ɓagar nǝ kyalmaha biya, baz ghwatǝraghwag nǝ ghavalaha ǝmtsahara ǝmtsahǝga.
    10: Zavambi kǝ ghai band kwa ɓag nǝ kyalmah biya, adaba ciɓatǝraciɓǝg nǝ zarha ɓǝlga Daadamazhigǝla.
    11: Dǝgitahan dzǝghardzǝgna dǝ iitǝr na garava, viinɗavaviinɗǝgga mbakyavad ɓǝlkiyama nǝ ndaiga, kǝskǝmyamǝn tlakiyama nǝ zamanna.
    12: Mbakyavad kwaha, akwama agha tlatla taaikya baghabaag ku shiga, aiciya, fafǝg kǝ hǝnkala mbaɗabiya.
    13: Maay nǝ fǝshigi tlakuratlǝg kwal dzǝgharbi dǝ uudah biya. Adaba Daadamazhigǝla uuda jirjir nǝ iina da dugharbi am dǝm damma fǝshig kwa juujig kǝ ndzaɗaru biya, akwama damǝmdǝg dat duula fǝshiga, da wurkurant wurg nǝ Daadmazhǝgǝl ngǝdlǝga kwam da ɓǝshǝg nǝ uurama.
    14: Mbakyarvad kwaha, kuramǝm ǝn waikur naiyna, aɗuumarsɗug kǝ ɓagar kwatǝnahǝr kǝ ghǝllaha.
    15: Ən tagkur kwana adaba am dǝ hǝnkal nǝ uurama, zharamzharg ba nǝ uuram kǝ dǝgiti ǝn tagkur naiya.
    16: Kuwa langyi dǝga barka nǝ iina, kwa kiyam taa uus dǝvakiya, mbats ba iin wa fǝkiyama ndzǝgan pal ma avǝza tlǝkatǝg biya? Bruudiin kwa kiyam kalna nǝ miiyamǝn wa fǝkiyama ndzǝgan pal ma vǝgha tlǝkatǝg biya?
    17: Aɗaba bruudiin ba palla, mbats kǝmyamǝn kiyam ba dyǝk na kiyam ba vǝgh palla, aɗaba baɗǝmma miyama kiyam zaa ba bruudi palla.
    18: Zharamzharg kǝ uudaha israila. Mbats lii zaa dǝga kyuulǝga, ar ba pal nǝ iitǝr ma zaa dǝga kyuulǝg wa vǝlava kǝ Daadamazhigǝl tǝ bagadiya kyuulǝg biya?
    19: Awa ǝn tlatlǝg nai vakwani? Dǝgiti hǝravara kǝ ghǝli ci nǝ dǝgit marawa? Nii ghǝlha ci nǝ dǝgit marawi?
    20: Əndkwah biya, ǝn tlatla yaakiya, dǝga kyuulǝgi kwa vǝlǝg nǝ lii ɓagar kwatǝnah kǝ ghǝlla, ar vǝlga kǝ sgatanaha, kǝ Daadamazhigǝl biya. Ən naiy am nal band shatanah biya.
    21: Ba gabi am huɓu ma kuwa langyi tlǝkatǝg biya, dlaɓa am zuu kǝ dǝga shatanah biya.
    22: Kiyam pǝkya ghaya Yaazǝgǝl nii? Jiyamujig kǝ iin dǝ ndzǝɗ hi?
    23: “Baɗǝm nǝ dǝgita haiyakiyamanthaig nǝ uuda,”dlaɓa ba dǝmbi nǝ dǝgitah mǝng nǝ tlǝran biya, “baɗǝm nǝ dǝgitaha haighwanthaig nǝ uuda,”baɗǝmbi nǝ dǝgitahi kwa da mǝng tlǝran biya.
    24: Ɓagarbi ba kǝ ghǝragh kǝ dǝgit maraw biya, ɓagarɓag baz zǝraabagha.
    25: Zamzǝg baɗǝm kǝ hulfa dǝgiti valav vaka valla tluwa, bamam ndavna dǝ ndavǝg biya, mbakyarvad haik ndzamǝgan kǝskuuram ma ǝrvǝmahuɗaru kǝ vakavaki aa sǝgal dǝ tluwǝna.
    26: Aɗaba tagatag nǝ ǝlbǝga Daadamazhigǝla taakiya, “Duni baɗǝmma baz dǝgiti ma vakaita ba dǝga Daadamazhigǝla,”
    27: Akwama ɗahakurǝtɗahǝg nǝ daddakwa maay gata Yesu da za kaffa, ma haiyamanthaig kǝ dagauwa, zamzǝg baɗǝm ku hulfa dǝgiti vǝlkur nǝ iina, bamam ndavna dǝ ndavǝg biya, aɗaba haik dzamǝgan kǝskuuram ma ǝrvǝdmahuɗaru kǝ vakavaki aa sǝgal dǝ dǝgzǝgiina.
    28: Akwama tagakuuratag nǝ uud taakiya, “Aa hǝrva mbakyarvad ghǝlla,”zambiya, mbakyarvad zhara ndzǝgana uudǝraru dǝ dadda kwa tagkurataga, aɗaba haik kǝ haip tǝ ghǝraruwa.
    29: Ən tlatla dǝgiti da dzamǝg nǝ iin ma ǝrvǝdmahuɗaana, dǝgaruu biya. Aiciya, da tagan nǝ uudaru pal taakiya“Aujibǝg kǝ dzamaghǝra uudan da tsǝkwava kǝ kwara ghǝrari?
    30: Akwama taganaratag kǝ uus kǝ Daadamazhigǝla lakwti ǝn da zaa dǝgzǝga, aujibǝg da ghudgus ǝlbǝg nǝ uud tǝghǝr kǝ dǝgiti naa zǝg naiy tambar taganaratag kǝ uus kǝ Daadamazhǝgǝli?
    31: Aiciya, baɗǝm nǝ dǝgiti am ɓag nǝ uurama, aandzu am zǝg dǝ zǝga, aandzu am huɓǝg dǝ huɓǝga, ɓagamɓag mbakyarvad galla Daadamazhigǝla.
    32: Namalbi kǝ duula ɓa haip kǝ yahudah biya, aandzu ma lii ar yahudah biya, ma dlamakǝlaaa lii ar gata Daadamazhigǝl biya.
    33: Ɓagamɓag band kwa ǝn ɓag naiya. Ən ɓa kǝla ndzǝɗar ma ciinguu aandzu ma ba war kǝmtakǝr dǝgitahi ǝn ɓag naiy baɗǝmma, kwakyarvad ghǝrar pal wan ɓag naiy biya, ǝn ɓag kwakyarvad uudah ba dyǝkka, aɗaba maraa tlǝkǝna kǝ katǝgga.
  11:
    1: Gatamgatǝg kǝ garav dǝ kaiya, bandkwa ǝn gatǝg naiy kǝ garava tlǝkatǝga.
    2: Ən galakuuram naiy mbakyarvad am dzamkwadzamǝg aandzu ba mauwa, dlaɓa hǝkyamnahǝkyǝg kǝ dǝgiti tsagankuru naiy ba vaiyvaiya, ba kalkal dǝ kwa vǝlankur naiya.
    3: Aɗaba ǝn naagan am sǝran taakiya, Tlǝkatǝg nǝ maal tǝghǝr kukwar kǝ uuda, Zhiila dlaɓa maal tǝghǝr kǝ uusaana, Daadamazhigǝl nǝ tǝghǝr Tlǝkatǝga.
    4: Baɗǝm nǝ ghwalvi dzǝgwazhǝgǝl ma ɓa dǝga jappǝra mbuusambuusan ghǝraana fǝgharabi kǝ maalan biya.
    5: Dlaɓa baɗǝm nǝ uusi dzǝgwazhǝgǝla ma ɓa dǝga jappǝr kwal ugwǝɗga dankwaliya, nenghana nennǝg kǝ zhiila, ba kalkal mandki aa uusǝvardan ghǝra.
    6: Akwama lawalǝg nǝ uus kǝ ugwǝɗa ɗankwaliya, aa uusdauusǝg kǝ ghǝraana, aɗaba dǝga zhǝruu kǝ uus uusaghǝra, aa ugwǝɗǝg kǝ ɗankwaliya.
    7: Kalkalanbi kǝ ghwalǝv mbuusa kǝ ghǝran biya, aɗaba garava Daadamazhigǝla ard ndanghǝraana, dlaɓa uusa mara ndanghǝra zhiilaana.
    8: Savda ma vǝgha uusbi nǝ ghwalǝv biya, bamma uus wa savda ma vǝgha ghwalǝva.
    9: Ɓagavabi nǝ ghwalǝv mbakyarvad uus biya, bamma uus wa ɓagava mbakyarvad ghwalǝva.
    10: Mbakyarvad kwaha barari kǝ uus ugwǝɗa ɗankwaliya, mardan taakiya dǝ ndzǝɗ nǝ ghwalǝva, mbakyarvad zǝrɓǝlgaha Daadamazhigǝla.
    11: Bakǝvakwaha, tagwabi nǝ uus dǝ ghwalǝv ma tlǝkatǝg biya, ghwalǝv dlaɓa tagwabi ɗǝ uus ma tlǝkatǝg biya.
    12: Bandkwa sǝghal nǝ uus ma vǝgha ghwalǝva, uus dlaɓ wa yaa ghwalǝva, aɗaba baɗǝm nǝ dǝgita ɓaga ba Daadamazhigǝla.
    13: Zharamzharg ba nǝ uuram dǝ ghǝraruwa, ɓagaɓag kǝ maraw nǝ uus dzǝgwazhǝgǝl kǝ Daadamazhigǝl kwal hǝɗǝna kǝ ghǝraana?
    14: Tsagakurutsag nǝ dzǝganaru taakiya akwama ɗugharɗug nǝ ghwalǝv kǝ guuja ghǝraan ba fiikǝmma, dǝga zhǝruw nǝ iina.
    15: Kiyava uusi dǝ guuja ghǝran dlaɗɗa, dǝga ndanghǝr vakaana, aɗaba vǝlavarvǝlǝg nǝ guuja kiyava hǝɗɗa ghǝraana.
    16: Akwama mǝng nǝ daddakwa haighantbi kǝ kwa nǝ iin ya, kǝm sǝrgabi nǝmnd kwatlǝrn kadzahadzah biya, bandkwah dlab nǝ kyalma zaraabaha lii gatǝga.
    17: Tǝghǝr kǝ dǝgiti tagankur naiya, dlǝbankurǝt biya aɗaba dzahavaruwǝna ghwaɗɗa dǝga jirjir biya.
    18: Bamma dzahavaru ba zuunga kwa dzahamvǝt nǝ uurama, cǝnganacǝng taakiya mǝng tagwazha tagwaz ma taatakaruwa, haiyananthaig nǝ dǝ ǝlbǝgiina.
    19: Ba jirjiira tlǝvkǝnatlǝg nǝ tagwazha tagwazh ma taatakaruwa, aɗaba nǝghǝvakan nǝ uudaha jirjir ma taatakaruwa.
    20: Mbats am dzahav kwakyarvad zaa jibiya Yaazhǝgǝl biya.
    21: Aɗaba vaka zaa dǝgzǝga, ma bawara tsǝdi kǝ ghǝr vaka zaa dǝgaana, maay wa lǝhuud biya Ɗuuvars nǝ watlǝrn mbǝsha waiya, kwatlurna huɓuuhuɓǝga kǝ kya tsaatsǝga.
    22: Am maay dǝ hǝnyahaaruwa kwam ndzǝga nuurama am zǝgaana am huɓǝgaan biya? Nii amaa nenna dlamakǝlaaa lii gata Daadamazhǝgǝlhi, am vǝltǝr dlaɗ kǝ lii ar maay dǝ dǝgith biya? Auci wan da tagkur naiyi, ǝn da dlǝba kuuram mbakyarvad kwan ciya? Bagabiya ǝn maay dlǝba kuurami.
    23: Dǝgitǝn caawana naiy vak Yaazhǝgǝl kwa tagankur naiy taakiya, ma huɗavǝɗa kwa vǝlavvǝt nǝ Yaazhǝgǝl Yesu, kǝssant kǝ bruudiya,
    24: Tǝhala kwa taghar nǝ iin kǝ uus kǝ Daadamazhigǝla, kalna kǝ iina, aiyama, “Kwanna iin nǝ vǝghaara, kwa vǝlavda mbakyarvad kuurama. Ndza ba ɓagamɓag band kwana kiyava dzamkwadzamǝga.”
    25: Bandkwah dlaɓa tǝhala zaa jibiya, kǝssant kǝ iin kǝ zǝr kuuwa amaa, “Kwannǝ kǝ zǝr kuuwa iin daala langiya avzara, ɓagamɓag bandkwana ba tuuk sarti am huɓǝg nǝ uurama, kiyava dzamkwadzamǝg kǝskuurama.”
    26: Ba tuuk sarti am zǝg nǝ uuram kǝ bruuiya, dlaɓa am huɓǝgan ma zǝrkuwa, am ɓǝla tlǝghǝga ǝmtsǝga Yaazhǝgǝl, tangw dama sarti da saay nǝ iina.
    27: Mbakyarvad kwaha baɗǝm nǝ daddakwa zǝguu bruudiina, ma huɓǝguu ma zǝrkuwa Yaazhǝgǝl dǝ ǝrvǝdmahuɗ pall biya, ɓagharaɓag kǝ haip kǝ vǝgha Yesu ard avzaana,
    28: Ma ba wara aa sǝrasǝrg kǝ ghǝraana, tǝhalakwaha ka zǝgan kǝ bruudiya ard huɓǝgaan ma zǝrkuwa.
    29: Baɗǝm daddakwa zǝguu bruudiya, ma huɓǝguu ma zǝrkuwa kwal fǝgarafǝg kǝ vǝgha Yaazhǝgǝla, sǝghardasǝg kǝ dlaɗ kǝ ghǝraan tǝdvad zǝgaana ard huɓǝgani ɓaga nǝ iina.
    30: Iin wa dzǝghardzǝg ma kuuram ba dyǝk nǝ lii dǝ maira ndzǝɗ ard yangbiyaha, kyalmah ndakwani ǝmtsahara ǝmtsahǝga.
    31: Aɗaba akwama sǝryamasǝrg kǝ ghǝramiiyama ba marawa, da maay nǝ uud vǝlkiyam dlaɗ bia.
    32: Akwama Yaazhǝgǝl wa da tǝkiyam sharia, kiyam ndaiya ghǝramiiyama haik vǝlkiyam dlaɗ kǝ uud ǝmtad dǝ uudaha duniya.
    33: Mbakyarvad kwaha zaraabahara, akwama dzahamvǝtdzahǝg da zaa dǝgita, am pakant kǝ zaraabaharuwa.
    34: Akwama mǝng nǝ daddakwa njǝkǝn waiy ma kuurama, aa zuuzǝg kǝ dǝgit sagal hǝnyaha, aa nalbi taakiya dzahavaruwǝnna da sǝkurda dlaɗ biya. Tǝghǝr kǝ kyalma dǝgitaha, akwama guyanagwig sagauwa ǝn da tagkurtaga.
  12:
    1: Ndakwan ciya, zaraabahaara, tǝghǝr kǝ vǝlga shah shaha vak shǝdkwa cacuwana cacuwana, ǝn naiya am ndzan kwal sǝrgasǝrg biya.
    2: Ma sarta kwa ndzam lii gata Daadamazhǝgǝlbi nuuram biya, sǝramsǝrg taakiya, valakurda dǝ valǝg nǝ uuda, ndzam ɓagarnǝs kwatǝnahǝr ghǝllaha kwar maay dǝ shiflug biya.
    3: Aɗabad kwaha ǝn naagan am nǝghakan taakiya, maay nǝ daddakwa shǝdkwa Daadamazhigǝl wa ɓatlǝr dǝ iin da taakiya, “Tlafatlafan nǝ Yesu biya!” dlaɓa maay nǝ wada tagdatag taakiya, “Yesu Yaazhǝgǝl nǝ iin biya,” bamma daddakwa shǝdkwa cacuwana cacuwanan wa ɓa tlǝr dǝ iina.
    4: Mǝng nǝ vǝlgah shah shaha, ba shǝdkwa cacuwana cacuwanan pal wa vǝlgan baɗǝmma.
    5: Mǝng nǝ duulah shah shah kǝ dǝga ɓa tlǝra, ba Yaazhǝgǝl pal wa ɓagvara.
    6: Mǝng tlǝrah shah shaha, ba Daadamazhigǝl pal wa vǝlga aandzu ma bawar kǝ ndzǝɗa ɓagan baɗǝmma.
    7: Vǝlghar vǝlg nǝ Daadamazhigǝl aandzu ma bawar kǝ shɗkwa cacuwana cacuwanan kiyava margar dǝgit marawa.
    8: Kwatlǝrna vǝlavar nǝ dǝga tsaga dabariya tǝdvad shǝdkwa cacuwana cacuwananna, ƙwaklǝrn dlaɓa vǝlavar nǝ dǝga tsaga sǝrgasǝrga tǝdvad shǝdkwa.
    9: Kwatlǝrn dlaɓa vǝlavar nǝ dǝga fadghǝra tǝdvad shǝdkwiina, kwatlǝrna vǝlavar nǝ dǝga mbahuuda tǝdvad shǝdkwa,
    10: Kwatlǝrna vǝlavar nǝ dǝga ɓa tlǝraha jappǝrra, kwatlǝrna dǝga tlayangngǝra, kwatlǝrna dlaɓa dǝga tagwaaka ndzǝgana shǝdkwaha, kwatlǝrna dǝga sǝrga taa ghaiyah shahshaha, kwatlǝrn dlaɓa dǝga gwiiya ghaiyah shahshaha.
    11: Baɗǝm nǝ wanahaana ba shǝdkw pal wa ɓagaana, dlaɓa biin wa tagwan aandzu war band kwa naagant nǝ iina.
    12: Bandkwa ba pal nǝ vǝgha, dlaɓa uuɓiiyah tǝvakai ba dyǝkka, aandzu ba mǝng nǝ uuɓiiyah ba dyǝkka, ar ba vǝghǝg palla. Bandkwah ci kǝ Tlǝkatǝga.
    13: Aɗaba ɓaggakiyama ɓag nǝ uud kǝ tsuufǝg baɗǝmmamiiyam tǝdvad shǝdkwa palla damma vǝghǝgha palla, aandzu yahuudaha aandzu kwar yahuudah biya, ma Evva nǝ iina ma daddakwa kwara ghǝraana, baɗǝmmamiyama huɓɓiiyamuhuɓǝg bamma shǝdkw palla.
    14: Vǝghǝgha uuɓii pal bi nǝ iin biya, uuɓiiyah ba dyǝk tǝ vakaiya,
    15: Akwama tagatag nǝ shǝg taaki, “Aɗaba ǝn dǝv bi naiyama, ǝn, maay naiy ma uuɓiiya vǝghǝg biyama,” atar ba tagda kwana tsǝgarvabi kǝ nǝg kǝ uuɓiiya vǝghǝg biya.
    16: Bandkwah dlaɓ nǝ hyǝmiya akwam tagatag taakiya, “ǝn gyi bi naiy biya, aɗabad kwaha ǝn uuɓiiya vǝgh bi naiyama,” atar ba tagǝda ǝndkwaha tsǝgarvabi kǝ nǝg uuɓiiya vǝgh biya.
    17: Akwama baɗǝm nǝ vǝgh ba gyiya, ma da ciingav ndandar nǝ ǝlbǝgi? Akwama baɗǝm nǝ vǝgh ba hyǝmiya, ma da shiyav ndandar nǝ dǝgiti?
    18: Fahafahǝg nǝ Daadamazhigǝl kukwar kǝ uuɓiiya vǝgh band kwa naag nǝ iina.
    19: Akwama baɗǝm nǝ vǝgh ba uuɓii palla, ma mǝr ha kǝ kyalma vǝghi?
    20: Ii wan kwana mǝng nǝ uuɓiiyah ba dyakka, ba pal nǝ vǝgha.
    21: Tagardabi nǝ gyi kǝ dǝv taakiya, “maay nǝ lamɓar dǝ kǝgh biyama,”aandzu ma ghǝr wa tagar kǝ shigah taakiya, “maay nǝ lamɓar dǝ kuuram biya.”
    22: Əndkwah biya, uuɓiiyahi kwama zharav ar maay dǝ ndzǝɗ biya, iitǝr wa mǝng nǝ tlǝraatǝra.
    23: Uuɓiiya vǝgghahi kwa kiyam zharag mandki darǝtbi dat kyalmah dǝ ndanghǝr biya, iin wa kiyam fǝtǝraa nǝ miiyamma.
    24: Dlaɓa uuɓiiyaha vǝghahamiiyamǝn kwa maaraw kǝ zhargǝnna, ɓadlǝghani ɓadlǝg nǝ Daadamazhigǝl kǝ vǝgha fahǝt kǝ uuɓiiyah kwa maay ndang kiyava mǝng nǝ tlǝraana,
    25: Aɗaba haik tlǝvkǝna tlǝg tagwazh tagwazh tǝ vǝgha, bamma uuɓiiyah war fa kyǝmiy tǝ ghǝraatǝra, kwa ba dǝgit palla.
    26: Mbakyarvad kwaha akwama tlakǝnatlǝg nǝ uuɓii pal kǝ vǝvvǝra, baɗǝmmatra ar cǝngan kǝ njiigana, akwama dlǝbavant dlǝɓǝg nǝ uuɓii palla, baɗǝmmatǝra ar ba hwaɗaga ǝmtaɗa.
    27: Baɗǝmmaruwa am vǝgha tlǝkatǝga, ma kwararuwa am uuɓiiyana.
    28: Ma huɗa dlamakǝlaaa lii gatǝg Yesu, faafǝg nǝ Daadamazhigǝl kǝ lii ɓagar tlǝr kǝ Yesu kǝ dǝga zuungwa, dǝga buwa tlayanngaha, dǝga hǝkǝrɗa lii tsaga dǝgita, ka lii ɓa dǝgaha jappǝra, ka lii vǝlavtǝr vǝlga mbahuudaha, ard lii mǝlgaru kǝ uudaha, ard lii fakyǝmi tǝ tlǝra lii gatǝga, ard lii sǝrga taa ghaiyah shah shaha.
    29: Baɗǝm nǝ uudah ba dlakulva gyia Yesuni? Ar baɗǝm ba tlayangahhi? Baɗǝmma ar ba lii tsaga dǝgit hi? Nii ar baɗǝma ar ba lii ɓa dǝgaha jappǝr hi?
    30: Baɗǝmmatǝra ar ba dǝ vǝlga mba hǝ uudahhi? Ar baɗǝmma ar sǝrgasǝrg kǝ taa ghaiyah shahshaha? Nii baɗǝmmatǝr ha sǝrgasǝrg kǝ gwiya ghaiyahhi?
    31: Gatamgatǝg kǝ vǝlgahi kwa juujig dǝ ndanghǝra, ǝnda markurmarg kǝ ɗuuli kwa juujig baɗǝm dǝ marawa.
  13:
    1: Aandzu ba mana sǝrgasǝrg kǝ taa ghaiya uudaha shah shaha ard dǝga zǝrɓǝlgaha Daadamazhigǝla, akwama ǝn maay dǝ wayakǝvǝr biya, nanalnǝg band talenlenga kwa tlaav ba gyaagyanna, aandzu gangga kwa tlaav ba dyǝk dyǝkka,
    2: Aandzu ba mana sǝrgasǝrg kǝ taa tlayangǝra, ǝn nǝghaakan kǝ dǝgitah shiɓashiɓan baɗǝmma, dlaɓa ǝn mǝng dǝ dyǝmdyǝma baɗǝmma, ard fadǝghǝr ba vaivaiya, kwan da gantgǝg kǝ aghwa, akwama ǝn maay dǝ wayaikǝvǝr biya, maay nǝ dǝgiti ǝn tuuk vakai naiy biya.
    3: Aandzu ma vǝlandavǝlǝg kǝ dǝgiti ǝn dǝvakai nai baɗǝmma, ǝn vǝldan dlaɓ kǝ vǝghara hǝvara kaara, akwama ban maay dǝ wayakǝvǝr biya, ǝn maay dǝ dǝkshiga aandzu ndaw biya.
    4: Waiyakǝvǝra fǝgara fa ǝrvǝdmahuɗa ard taa jir ƙǝ uuda, waiyakǝvǝra maay dǝ sǝlg biya, maay fǝgara tǝɗa fǝɗavgha, ard ɗaaga ghǝr biya.
    5: Waiyakǝvǝra Maay dǝ naa ghǝr biya, maay dlaɓa fa dagar ma uudah biya, maay pǝkya ghaiy biya maay hǝkya dǝgit ghwaɗ mahuɗ biya.
    6: Naay nǝ waiyakǝvǝr kǝ ɓa dǝga kǝlaɗǝr biya, bamma naa ɓa dǝga jirjira,
    7: Waiyakǝvǝra fǝgara fa ǝrvǝdmahuɗ kǝ uud, ard fadghǝra aandzu tauwa, ard pakka dǝgita, ard ɓǝshgaana aandzu ba ndara.
    8: Maay ghyǝnng nǝ waiyakǝvǝra ba tangw dama zǝrazǝr biya, taa tlayanngǝra da dagal zamanana, taa ghayah dlaɓa zǝgga, dyǝmdyǝmǝra da ghyǝnnga.
    9: Bak jirjira, dyǝmdyǝmǝra miiyama rǝghghǝt biya, taa tlayanngǝra miiyama rǝghghǝt biya.
    10: Akwama da saahii sǝg nǝ daddakwa rǝghgha rǝghghana, tǝhalakwaha daddakwa rǝgha biya da nǝga.
    11: Ma sartǝn zarhǝrara, ndzan taa ba ǝlbǝga zarhǝrra, ndzan dzamaghǝr band dǝga zarha, ndzan vǝla farwut band dǝga zarha. Ghubaranǝt ba naiya kal dugarsdug kǝskai kǝ hǝnkala zarhǝrra.
    12: Aɗaba ndakwana kǝm zhara garava ma akwatǝrama band avǝɗvaavǝɗa, daghuvaliina kǝm da zharg ba ghwǝm dǝ gyiiya, aɗaba ndakwana sǝrgasǝrgara rǝghghǝt biya, daghuvalaana sǝrgasǝrgǝrra da rǝghghǝg ba dyǝkdyǝk band kwa fakwi nǝ Daadamazhigǝla.
    13: Ndakwan ciya, dǝgitahaan hǝkǝrɗǝna mǝnga bak jiijira, fadghǝra, pakka dǝgita, ard waiyakǝvǝra, baɗǝm miitǝra ba waiyakǝvǝr wa dyǝkka.
  14:
    1: Gatamgatǝg kǝ duula waiyakǝva, dlaɓa am gatǝgaan kǝ vǝlga sǝrgasǝrg vak shǝdkwa caccuwanacaccuwana, ndǝ dǝga taa tlayanngǝra.
    2: Aɗaba daddakwa taa ghaiy shahshaha tag dǝ uudah biya, tag dǝ Daadamazhigǝla, aɗaba maay wa nǝghǝgaka nǝghǝg kǝ dǝgitahi tag nǝ iini, mbakyarvad taa dǝgitahi shiɓashiɓana tǝdvad ndzǝɗa shǝdkwa cacuwana cacuwana.
    3: Daddakwa taa tlayanngǝra tagtǝr kǝ uudah kǝ ǝlbǝga kiyava mǝltǝrumǝlga fǝtǝrna kǝ ndzǝɗa, dlaɓa tagtǝra kǝ dzǝgwaggha.
    4: Daddakwa taa ghai shahshaha mǝlgaru bak kǝ ghǝraana, aɗaba daddakwa taa tlayanngǝra mǝltǝru kǝ dlamakǝlaaa lii gatǝga.
    5: Mana naag nai baɗǝmmaruwa mamma taa ghiy shahshaha, bakǝvakwana mat naagara mamma taa tlayanngǝra. Daddakwa taa tlayanngǝra juujig ku daddakwa taa ghai shahshaha, bama mǝng nǝ daddakwa sǝrgasǝrga kǝ gwiya ghaiyiina kiyava mǝlgaru kǝ dlamakǝlwa lii gatǝga.
    6: Aici zaraabaharra, akwama danǝvdǝg da vakaruwa ǝn tagkura kǝ ǝlbǝg dǝ ghaiy shahshaha, auci wana mǝlkuru nai dǝvakai, akwama danǝvbi da vakaru dǝ ǝlbǝgaha ard dyǝmdyǝmǝr, ard tsaga ǝlbǝga Daadamazhigǝl biyi?
    7: Bandkwah nǝ dǝgitahan kwa maay dǝ shifǝgi band faakǝlla ard kakanghya. Akwama cǝngalbi nǝ tlavatǝr ba vaivai biya, da sǝrga ndandar nǝ uudan kǝ dǝgiti tsava ard kwa fǝrtavvi?
    8: Akwama fǝrtavantbi nǝ dǝrau ba vaivai kwa da cǝnngalcǝng biya, war wa da ɓadlava da ghwaavi?
    9: Bandkwah dlaɓ kǝskuurama, akwama tagamatag kǝ ǝlbǝg dǝ ghaiya kwa nǝghvaaka biya, da sǝr vaaka ndandar nǝ dǝgiti am tag nǝ uurami? Ttagamatag kǝ ǝlbǝg ba gyagyaana.
    10: Mǝng nǝ ghaiyah shahshah ma duniya, ma kwaratǝra ba tuuk kǝ ǝlbǝga.
    11: Akwama ǝn cǝnngabi kǝ ghaiyin biya, nanalnǝg kǝ ghulab kǝ daddakwa ta ǝlbǝgiina.
    12: Bandkwah dlaɓ kǝskuurama, ma bam hwaɗaaga tlǝkǝna vǝlg shahshah dǝga shǝdkwa caccuwanacaccuwana, ɓagamɓag kǝla ndzǝɗaruwa am ɓa tlǝr dǝ lii da fǝgara zaa vuuka kǝ dlamakǝwa lii gatǝga.
    13: Mbakyarvad kwaha baɗǝm nǝ daddakwa taa ǝlbǝg dǝ kwatlǝr kǝ ghaiya, aa dzug kǝ zhǝgǝla vǝlvar nǝ sǝrgasǝrga gwiiya ghaiyiina.
    14: Akwama dzǝgwanadzug kǝ zhǝgǝl ma ghaiyi tlǝrna, ba kai dǝ ghǝrar wa dzǝgwazhǝgǝla, hǝnkalara maay ǝmtaɗ dǝ kaiyi.
    15: Auci, wan da ɓag naiyi? Ən da dzugazhǝgǝl bad ǝrvidmahuɗara, ǝn dǝgwadzug kǝ zhǝgǝl dlaɓ dǝ nǝghǝgakanǝghǝgara. Ən ɓǝlgaɓǝlg kǝ ngǝssa gala Daadamazhigǝl bad ghǝrarra, dlaɓa ǝn ɓǝlgaɓǝlg baz ma hǝnkalarra.
    16: Akwama maay ǝndkwah biya, akwama taghartag kǝ́ uus kǝ Daadamazhigǝl ba maghǝragh kaltiya, da tag ndandar nǝ daddakwa cǝnngabi kǝ dǝgiti agha tag nǝng taaki, “Amin” tǝghǝr kǝ taa uusi agha tag nǝng, akwama sǝrgabi kǝ dǝgiti agha tag nǝng biyi?
    17: Aaadzu ba tagharatag kǝ uus kǝ Daadamazhigǝl ba vaivaiya, mǝlgharuubi kǝ uuda nǝ iin biya.
    18: Ən tagar uus kǝ Daadamazhigǝl ǝn tagatag kǝ ǝlbǝg dǝ ghai shahshah tǝghǝr kǝskuuram baɗǝmma.
    19: Bakǝvakwaha ma dzahava dlamakǝlaaa lii gatǝga, mana naag nai ǝn tagda kǝ ǝlbǝg ba dlǝɓ dǝ dzamaghǝrar kiyava tsagturu kǝ kyalmaha, tǝghǝr kǝ tagda ǝlbǝgah ɗǝbu kǝlawa dǝ kwatlǝr kǝ ghaiya.
    20: Zaraabahara, dzamambi kǝ dǝgit band zarhah biya, bamma tǝdvad ɓa dǝga kǝladǝra namalnǝg band zarhaha, kuurama aa nalnǝg nǝ dzamaghǝraru ba kǝ dǝga uudah maamala.
    21: Viindaviindan ma kakaɗa Daadamazhigǝl taakiya, “Ən da tagan kǝ ǝlbǝg dǝ uudahah tǝdvad uudahi kwar taa ghaiy shahshaha, ard ghaiya ghulabaha, bakǝvakwaha ar maay cǝngwanacǝng biya, am nǝ Yaazhǝgǝla.”
    22: Mbats, sǝrga taa ghaiy shahshaha mbakyarvad dǝga sǝrg kǝ yaa dadda gatǝg biya, bamma kǝ lii ar maay gata yesu biya. Taa tlayanngǝra mbakyarvad kǝ lii dǝ fadghǝra, kiyava lii maay dǝ fadghǝr biya.
    23: Mbakyarvad kwaha, akwama dzaharvǝtdzahǝg nǝ dlɑmakǝlawa lii gatǝg baɗǝmma, ma kwarayǝra ar taa ǝlbǝg dǝ ghaiy shahshaha, ka sagau kǝ kyalma uudahi ar sǝrgabi kǝ dǝgiti ar tag nǝ iitǝr biya, ma lii ar maay gata Yesu biya, mbats, ar maay tagan taaki am valagah biya?
    24: Akwama taaki baɗǝmmaruwa am taa tlayanngǝra, ma tlakuratlǝg nǝ daddakwa maay gata Yesu ard kwa sǝrgai kǝ dǝgiti tagav biya, kaa cǝnngan kǝ dǝgiti tagava, ngal ba pǝlla ghǝra.
    25: Da kwaɗa sagal nǝ dǝgiti ma ǝrvǝdmahuɗaana, tǝdvadkwaha da mbuɗa dama haaya ɓagarnǝs kwatǝnahǝr kǝ Daadamazhigǝla, ngal taakiya, “Bak jirjira mǝng nǝ Daadamazhigǝl ma kuurama.”
    26: Wan nǝ dǝgiti ǝn tagkur naiy zaraabahaara, akwama da dzahamvǝtdzahǝga, kwana ɓǝla ngsa gala Daadamazhigǝla, kwana tsaga dǝgita, taa dǝgitaha, kwana taa ǝlbǝg dǝ kwatlǝr ghaiy shaha, kwana gwiiya ghaiya. Bagamɓag baɗumma mbakyarvad mǝlgaru kǝ dlamakǝlwa lii gatǝga.
    27: Akwama mǝng nǝ lii taa ǝlbǝg dǝ kwatlǝr ghaiya, aa juubi ba kǝ uud buwa ma hǝkǝrɗ biya, aa ɓagarɓag ba tǝdǝv tǝdǝva, kwatlǝrna gwiiya dǝgiti tagava.
    28: Akwama maay nǝ dadda gwiigan biya, aa ndzarandzǝg ba dǝw ma dzahava dlamakǝlaaa. Aa tagartag kǝ ǝlbǝg kǝ ghǝra ard Daadamazhigǝla.
    29: Lii taa tlayanngǝra, aa tagartag ba nǝ uud buwa ma hǝkǝrɗ kǝ ǝlbǝga. Kyalmaha ar tsǝgwa hyǝmiya dǝgiti tagava.
    30: Akwama taghartag nǝ Daadmazhǝgǝl kǝ ǝlbǝg kǝ uudani cǝghurga vakwahiina, daddakwa taa ghaiy ba zuungwna ghacaan kǝ taa ghaiya.
    31: Baɗǝmmaruwa am tagatag kǝ ǝlbuga Daadamazhigǝla, ba da palla palla, kiyava tsagan kǝ uudaha, dlaɓa ar tlǝkǝna kǝ ndzǝɗa.
    32: Lii vǝlavtǝr nǝ sǝrgasǝrga taa tlayanngura, ba iitǝr dǝ ghǝraatǝr wa tagaana.
    33: Aɗaba Daadamazhigǝla miiyama Daadamazhigǝla ciya hǝnkal biya, Daadamazhǝgǝlaaa gabǝrra. Band kwaha vak dlamakǝlaaa lii gatǝga.
    34: Ɓagaɓag kǝ marau ar ndza nǝmghwasah ba dǝw ma dzahava dlamakǝlaaa lii gatǝga, aɗaba vǝlavtǝrbi nǝ duula taa ghaiy biya, bama ar ɗaba dǝgiti tagaa nadzahadzaha muus taaki.
    35: Akwama mǝng nǝ dǝgiti ar naa sǝrga nǝ iitǝra, aa ndavarndavǝg vak zhiilahatǝr ma hǝnyaha. Aɗaba dǝga zhǝrw kǝ ǝnghwasah taa ghaiy ma dlamakǝlaaa lii gatǝga.
    36: Fǝgharzha bat kuuram nǝ ǝlbǝga Daadamazhigǝla, nii ba kuurama pal ha wa dal nǝ ǝlbugiin da vakaruwi?
    37: Akwama mǝng nǝ daddakwa tlatla taaki tlayanng nǝ iina, aandzu ma vǝlavar nǝ sǝrgasǝrgǝra, aa nǝghakanǝghǝg taakiya, dǝgitahaan ǝn viindkurnaiyna ǝlbuga Yaazhǝgǝla.
    38: Akwama lawalǝg nǝ uudan kǝ fa hyǝmiya tǝ kwanna, ghǝravan ndakwani da lǝvwalǝg nǝ uud kǝ fa hyǝmiy tǝ vakaiya.
    39: Mbakyarvad kwaha zaraabahaara, nahamnahǝg kǝ taa ǝlbǝga Daadamazhigǝla, tsamarǝvbi dlaɓ kǝ uud kǝ taa ghaiy dǝ kwatlǝr kǝ ghaiyah biya.
    40: Aa ɓagavɓag nǝ dǝgit bat duulan ba kalkalla, dlaɓa ɓadlǝvnanna.
  15:
    1: Ndakwana, ǝn da dzamkurnǝsdzamǝg kǝ ǝlbug marawǝn kwa tagankur naiyiin zaarabahaara, kwa caawama nǝ uuramna, dlaɓa kwa famdǝghǝrǝt nǝ uurama.
    2: Tǝdvad ǝlbug marawa wa tlakǝna nǝ uuram kǝ katǝga, akwama hǝkyamnahǝkyǝg kǝ ǝlbugǝn tagankur naiyiin ba matrawa, ma maay ndkwah biya, fadghǝraruwa ba gyagyaana.
    3: Dǝgitiin marauwǝn tagankur naiya, iin wa caawana naiy, taakiya, ǝmtsaǝmtsǝg nǝ Tlǝkatǝg mbakyarvad haipahaamiiyama, band kwa viindaviindan ma kakkaɗa Daadamazhigǝla,
    4: Taaki hǝɗavahǝɗǝgga, dlaɓa ciiyavantciig tǝ hǝng hǝkǝrɗa, band kwa viinɗaviinɗan ma kakkaɗa Daadamazhigǝla,
    5: maradamarg kǝ ghǝran vak kefasa, ard kǝlawa tar buwa.
    6: Tǝhalakwaha mardan kǝ ghǝraan vak kǝ uudah kwa juujig kǝ dǝrmǝk dlǝɓa ba daval palla, kyalmahaatǝra ar ba dlaɓa bad shifǝga, kyalmah dlaɓa ǝmtsaharaǝmtsahǝga.
    7: Tǝhalakwaha maradamarg kǝ ghǝran vak yakuba, ard dlakulva gyi Yesu baɗǝmma.
    8: Tǝhalatǝr baɗǝma, maradamarg kǝ ghǝran dlaɓ vakara, bakǝvakwaha aandzu ba ǝn uudi yaava tǝ duula jirjir biya.
    9: Aɗaba kai wa hǝdiikǝn ma dlakulva gyiyaha Yesu, tlanalbi naiy kǝ ɗaakwa nǝ uud dǝ dlakulva gyiya Yesu biya, mbakyarvad kai wa vǝlantǝr dlaɗ kǝ dlamakǝlaaa lii gata Daadamazhigǝla.
    10: Mbakyarvad herǝrra Daadamazhigǝl wa nanal naiy ǝndkwana, dlaɓa herǝrrǝn ɓagghwi nǝ iina ba gyagyaan biya, aɗaba januujig aandzu kwar kǝ dlakulvaha gyiya Yesu dǝ tlǝrra, bakǝvakwaha mbakyarvad sǝrgasǝrgar biya, mbakyarvad herǝrra Daadamazhǝgǝli kwa ǝmtaɗ dǝ kaiya.
    11: Aiciya, ma kaiya, ma iitǝraha, baɗǝmmamǝnda kǝm taa ba ǝlbǝg marawa, famdǝghǝrt tǝdvad kwan nǝ uurama.
    12: Akwama ba tagav nǝ ǝlbǝg marawa ciiga Tlǝkatǝg ma gǝtlaha, aujibǝg ka cii kǝ kyalmaharu ar taakiya maay nǝ ciig ma gǝtlah biyi?
    13: Akwama maay nǝ ciig ma gǝtlah biya, mbats, ciiyiit bi nǝ Tlǝkɑtǝg ma gǝtlah bi ciya.
    14: Akwama ciiyiit bi nǝ Tlǝkatǝg ma gǝtlah biya, mbats, taa ǝlbǝg marawamǝnda ba gyagyaana, fadghǝraru dlaɓa nalnǝg ba gyagyaana.
    15: Nalnǝgtaaki, tagamǝnda fiid tǝghǝr kǝ Daadamazhigǝl ciya, aɗaba tagamǝnda tag kǝ ǝlbǝg tǝghǝr kǝ Daadamazhigǝl taakiya ciighantciig kǝ Tlǝkatǝga, akwama ba ciighantbi tsa, bakjirjira maay nǝ ciig ma gǝtlah biya.
    16: Akwama maay nǝ ciig ma gǝtlah biya, mbats, ciiyavatbi ci nǝ tlǝkatǝg biya.
    17: Akwama ba ciiyavantbi nǝ tlǝkatǝg biya, mbats, fadghǝraruwa ba gyaagyaana, ba kǝvakwana am ba ndzǝganan ba ma haipaharuwa
    18: Mbats, lii ǝmtsaharaǝmtsahǝg tǝ duula gata Tlǝkatǝga, zaraazǝg ciya.
    19: Akwama faaghǝra miiyam tǝ Tlǝkatǝga kwakyarvad ba kiyava ndzǝgan kaltiya, mbats jiiyamujiig aandzu ba war kǝ dǝga zhuwaɗaala.
    20: Bakjirjira, ciiyavantciig nǝ Tlǝkatǝg ma gItlaha. Inn wa tǝghal ba zuungw ma lii ma gǝtlaha. Bakjirjira maradamarg taakiya da ciiyav nǝ kyalmaha lii ǝmtsaharaana.
    21: Aandzu ba sǝghǝv tǝdvad uud nǝ ǝmtsǝg, bandkwah dlaɓ nǝ ciig ma gǝtlaha sǝghǝv tǝdvad uuda.
    22: Bandkwa ǝmtsǝg nǝ uud baɗǝm mbakyarvad Adamu, da ciiyav nǝ uud baɗǝm mbakyarvad Tlǝkatǝga.
    23: Da ciiyav aandzu ma ba wara ba tǝdǝv tǝdǝvaana, Tlǝkatǝg nǝ tǝghǝga zuungwa, tǝhalakwaha lii ar da dǝgan daghuvali da saay nǝ iina.
    24: Kaa da sagau nǝ ghyǝnnga duniya, ma sarta kwa da gwiigarda nǝ Tlǝkatǝg kǝ tlǝksǝran kǝ Daadamazhigǝl Daada, tǝhalakwama da kǝsatǝrva kǝsǝg kǝ ndzǝɗ kǝ lii kwarǝga baz tlǝksǝraatǝr baɗǝmma.
    25: Aɗaba barari kǝ Tlǝkatǝg da kwarǝga, bamma fatǝrɗǝmfǝg kǝ tlǝghumahaan baɗǝm da miizhangyǝl kǝ shigahaana.
    26: Dadda tlǝghummi kwa dǝga halli da ghyǝhava, iin nǝ ǝmtsǝga.
    27: Aɗaba tagaatag nǝ ǝlbǝga Daadamazhigǝl taaki, “faɗǝmfǝg nǝ Daadamazhigǝl kǝ dǝgitah baɗǝm miizhagyǝl kǝ kwargana.”
    28: Akwama da nadalnǝg nǝ Daadamazhigǝl kǝ dǝgitah baɗǝm da miizhagyǝl kwarga tlǝkatǝga, da nal dlaɓ nǝ zǝran da miizhagyǝl kǝ kwarga Daadamazhigǝl kwa nadal dǝgitah baɗǝm da miizha gyǝl kǝ iina, aɗaba Daadamazhigǝl dǝgit baɗǝm baɗǝmma.
    29: Akwama maay ǝndkwah biya, auwa da ɓag nǝ uudahaan, kwa ɓagavtǝra nǝ tsufǝg mbakyarvad lii ma gǝtlahi? Ma ba maay nǝ ciig ma gǝtlah biya, aujibǝg ka cii ɓagavtǝra nǝ tsufǝg kǝ uudah mbakyarvad lii ma gǝtlahi?
    30: Aujǝlbɔg dlaɓ kiyam fa ghǝramiiyam ba kǝlahǝng tǝ duula ǝmtsǝgi?
    31: Ən nǝghǝganǝghǝg kǝ ǝmtsǝg ba kǝlahǝng zaraabahaara, bak jiijiira ǝn tsa kushǝgh dǝ kuuram ma Tlǝkatǝg Yesu Yaazhǝgǝlamiiyama.
    32: Akawama tǝ naaga uuda, ma ɓaganaɓag kǝ ghwav dǝ dǝktǝghal ma Afisa, auci nǝ dǝkghigari? Akwama ba da maay nǝ uud ciig ma gǝtlah biya. “Ba kiyam zǝgaana kiiyam huɓǝgana, aɗaba kiyam da ǝmtsǝg dlakadur biya?”
    33: Aa valkurdai nǝ uud biya, “Aɗaba ndzǝgan dǝ kǝladaha badzǝgaan kǝ uuda jirjira.”
    34: Asamasaas da tǝ duula jirjira, am duuwant kǝ ɓa haipa. Aɗaba kyalmaharuwa ar sǝrgabi kǝ Daadamazhigǝl biya. Na taakwan naiya mbakyarvad am dǝm dama zhǝrwa.
    35: Ar da ndavǝgan nǝ kyalmah yaakiya, “Da ciig ndandar nǝ lii ǝmtsahara ǝmtsahǝg ma gǝtlahi? Ar da sagal dǝ huulfa kwar kǝ vǝghǝghi?”
    36: Kǝgh dlagǝna! dǝgiti aghaa riiga nǝnga da maay sagal biya bamma ǝmtsaǝmtsǝga.
    37: Dǝgiti agha riiga nǝnga, da sagal bandkwahiin biya, ba zǝraana, ma zǝra hiiya ma zǝra dǝgiti tlǝrna shaha.
    38: Ba Daadamazhigǝl wa vǝlga dzakǝva vǝgh kǝ zǝra dǝgita band kwa naag nǝ iina, ma kwar kǝ zǝra dǝgita bad dzakǝva vǝghaana.
    39: Baɗǝm nǝ tluwa ba dǝgit pall biya. Uudaha bad hulfa dǝgahaatǝra, almanaha bad hulfa dǝgahaatǝra, ɗiikaha bad hulfa dǝgahaatǝra. Kǝlfah dlaɓa bad hulfa dǝgahaatra.
    40: Mǝng hulfa ndǝrga ghǝrazhigǝla, mǝng nǝ hulfa dǝga haaya. Ndangǝra dǝga ghǝrazhigǝla shaha, ndangǝra hulfa dǝga haaya shaha.
    41: Ndangǝra faciya shahha, dǝga kyǝlla shahha, dǝga kwadladlah dlaɓa shahha, mǝng dlaɓ nǝ kwatlǝr kǝ kwadladla shah dǝ kwatlǝr kǝ kwadlad vaka ndangǝra.
    42: Bandkwah dlaɓ tǝghǝr kǝ ciig ma gǝtlaha, dǝgiti aa riivariiga da ǝrtsǝga, dǝgiti aa ciivanta da maay ǝrtsǝg biya.
    43: Riivariig nǝ iin bamma dlaɗa, ciivantciig ma ndangǝra, riivariig ma maira ndzǝɗa ciivantciig dlaɓ ma ndzǝɗǝra.
    44: Riivariig ma vǝgha uuɗǝra, ciivantciig dlaɓ dǝ ndzǝgana vǝgha shǝdkwa caccuwanacaccuwana. Aɗaba mǝng nǝ vǝgha uuɗǝra, ba jirjira mǝng nǝ vǝgha shǝdkwa caccuwanacaccuwana.
    45: Viindaviindan bandkwah taakiya, “Adamu nǝ uuda zǝnngwa, kwa nal kǝ uuda dǝ shifǝga.” Adamudǝga halla iin shǝdkwa kwa vǝlla shifǝga.
    46: Dǝga zǝnngw bi nǝ shiɗkw biya, dǝga tluwa ard avz nǝ dǝga zǝnngw lakwti kǝ shidkwa.
    47: Uuda zǝnngwa ndǝrava dǝ haaya, sal ma haaya. Dǝga buwa sahi ma ghǝrazhigǝla.
    48: Bandkwa dǝga haaya nǝ uuda, ar bandkwah dlaɓ nǝ lii dǝga haaya. Lii ar dǝga ghǝrazhigǝla, ar da bandkwa sahii ma ghǝrazǝgǝla.
    49: Bandkwa kiyam garava daddakwa ndǝrava dǝ haaya nǝ miiyama, kiyam da nǝg dlaɓ kǝ garava daddakwa sahi ma ghǝrazhigǝla.
    50: Dǝgiti ǝn tagkur naiya wah zaraabaharra, aɗaba ɓagabi kiyam tlǝkǝna kǝ gwiig ma tlǝkǝsa ghǝrazhigǝl dǝ vǝgha miiyam kwa dǝga tluwa ard avz biya, bandkwah dlaɓ nǝ daddakwa da ǝrtsǝga da maay gwiiya daddakwa maay ǝrtsǝg biya.
    51: Ciinngamciinga, ǝn tagkurtag kǝ dǝgiti shiɓashiɓana! kiyam da baɗǝm ǝmtsǝg biya, aiciya da gwiiyav nǝ garava miiyam baɗǝmma,
    52: Ba daval palla, band kǝbǝkyǝga gyiiya, ma ciingavaciing nǝ vǝrta dǝrawa, da ciiyav nǝ lii ma gǝtlaha dǝ vǝgh hulfa kwa da maay ǝrtsǝg biya, da gwiiyav nǝ ndzǝgana garava miiyama.
    53: Aɗaba barari nǝ vǝghǝn kwa ǝrtsǝgǝna da gwiiyav nal kwa maay ǝrtsǝg biya, vǝghǝghi kwa da ǝmtsǝga da gwiiyav nal kwa maay ǝmtsǝg biya.
    54: Tǝhalakwama gwiiyavant gwiig nǝ vǝghǝn kwa ǝrtsǝgǝn dat kwa maay ǝrtsǝgǝn biya, dlaɓa vǝghǝn kwa dǝga ǝmtsǝgǝn nal kwa maay ǝmtsǝgǝn biya, da righǝg ma sartakwa nǝ, ǝlbǝgǝn viindava ma kakkaɗa Daadamazhigǝl taakiya, “Ghyǝhavna ghyǝhǝg nǝ ǝmtsǝga, zavuzǝg nǝ fiir tǝghǝra.
    55: Kǝgh ǝmtsǝga, mǝr nǝ za fiiraghi? Kǝgh ǝmtsǝga mǝr nǝ guraghi?”
    56: Abi haip nǝ gura ǝmtsǝga, tlakǝna tǝdvad shari nǝ ǝmtsǝg kǝ ndzǝɗa.
    57: Tagiiyamartag kǝ uus kǝ Daadamazhigǝl kwa vǝl kiyam zaa fiir tǝdvad Yaazhǝgǝl Yesu Tlǝkatǝga!
    58: Mbakyarvad kwah zaraabahara kwan waikur naiya, ghacaamaghaciig ba marawa, ba kǝlahǝnga am ɓagar tlǝr kǝ Tlǝkatǝga, aɗaba am sǝran taakiya dlaɗǝn am huɓǝg nǝ uuram mbakyarvad Yaazhǝgǝla ba gyagyaan biya.
  16:
    1: Aiciya, ǝlɓǝga mǝltǝru kǝ yaa daddaha gatǝga, ɓagamɓag bandkwa taganter nai kǝ dlamakǝla lii gatǝga kwa ma Galatiya taaki aa ɓagarɓaga.
    2: Ma kwar kǝ laada, am fǝgaan kǝ kwaɓa kalkala dǝgiti tlǝkǝna nǝ uudana, bamma ǝn sǝgǝv naiy lakwti am da dzaha dǝgiti kwa da mǝlvaru kǝ uud biya.
    3: Akwama da danǝv dǝga, ǝn da ɓǝltǝrant kǝ lii haiyamant_haig nǝ uuram dǝ iitǝra, ǝmtad dǝ wakiita mara ghǝraatǝra.
    4: Akwama ɓagaɓag kǝ maraw ǝn dǝv naiy ndakwani, bar da pughkwazhana.
    5: Ən da dagau da vakaruwa da tagkur uusaa, tǝhalakwama gwayavagwaiga ma haaya makiduniya, aɗaba ǝn naagan kǝ dagal damma makiduniya.
    6: Mbatak ǝn da zǝlmazǝlǝmǝg vakaruwa, ǝn da ghyǝnngǝna kǝ viiyaksa vaksruwa, aɗaba am da mǝlwad ba kǝla vakavaki ǝn da dagal naiya.
    7: Dǝ naagarbi akwama nǝghankurnǝghǝg ǝn tsǝkura dǝ fǝt biya, mana naag nai ǝn ɓaga kǝ hǝngah vakaruwa, akwama haighant nǝ Yaazhǝgǝla.
    8: Ən da ghacig ma Afisa ǝn da pakant kǝ sarta fentikus.
    9: Aɗaba wurghwantwurg nǝ uud kǝ ɗuul ba banngang kiyava ɓa tlǝr marauwa, aandzu ba mǝng nǝ tlǝghumah ba ɗyǝka.
    10: Akwama sǝghǝvsǝg nǝ timuti da vakaruwa, aa ɓalaɓalǝg nǝ ghǝraana aa gǝdzǝ biya, aɗaba iin ndakwani ɓa tlǝra Yaazhǝgǝl band kaiya.
    11: Mbakyarvad kwaha aa nenne bi aandzu ma war biya, am mǝlaruwa dǝ dǝgita kiyava sagau da vakara, aɗaba gyiiyar ba tǝ duula kǝ paka ba iina ǝmtaɗ da zarabaha.
    12: Əlbǝga zǝrabamiiyam Afullusa, ghalanghalǝg ma sǝv da vakaru ǝmtaɗ dǝ kyalma zarabaha, haighant bi kǝ dagau ndakwan biya, bamma da tlakǝnatlǝg kǝ sarta lakwti da dagauwa.
    13: Ɓadlamvaɓadlǝg ba marawa, am ghacan tǝ fadghǝraruwa ba vaivaiya, am ɓǝlgan kǝ magiya am fǝgab kǝ ndzǝɗa.
    14: Baɗǝm nǝ dǝgiti am ɓag nǝ uurama, ɓagamɓag ba dǝ waiyakǝvǝra.
    15: Aici, zarabahara, am sǝran taaki uudaha hǝnyaha Istafanus wa fararzhz ba zǝngw kǝ pǝlaghǝr ma haaya Akaya, vǝlardavǝlǝg kǝ ghǝraatǝr kiyava ɓa tlǝr kǝ ya dadda gatǝga.
    16: Ən ghalakurama am faara kǝ hulfa kwanahaan kǝ uudaha, ba tsaghwaha ɓa tlǝramnd baɗǝmma kwa kǝm huɓa dlad dǝ iitǝra.
    17: Cinganucing kǝmtakera sagauwa Istafanusa, Fartunatus, ard Akaikus, kwa nǝgal vakar mandki kuuram wa sǝgǝvsǝga.
    18: Aɗaba ɓagarwiiɓag kǝ dǝgit maraw tǝrvidara, baz dǝgaruwa. Hulfa kwan kǝ uudaha kalkalan ma fǝfteraarana.
    19: Araa tagkur uus nǝ dlamakǝlaaa lii gatǝg kwama haaya Asiya. Akila ard Biriskila, ǝmtaɗ dǝ dlamakǝlaaa lii gatǝg kwa dzaharvǝt ma hǝnyahaatǝra, ar tagkur uss ba vaivai ma ɗaaga Yaazhǝgǝla.
    20: Baɗǝm nǝ zaraabaha ar tagkur uusa. Tagamartag kǝ uus kǝ kyalmaharuwa ǝmtaɗ dǝ bǝrhuga.
    21: Ba kai Bulus dǝ ghǝrar wan viinda tagkur uusa.
    22: Baɗǝm nǝ daddakwa maay waiya Yaazhǝgǝl biya tlafatlafana. Aseg, Yaazhǝgǝla!
    23: Herǝrra Yaazhǝgǝla Yesu aa ndzandzǝg ǝmtaɗ dǝ kuurama.
    24: Aa ndzandzǝg nǝ wayakǝvar tǝghǝr kǝskuuram ma ɗaag Tlǝkatǝg Yesu. Amin.
47:
  1:
    1: Bulus kwa nal kǝ dlakulva gyiiya Tlǝkatǝg Yesu dǝ naaga Daadamazhigǝla, ard zǝraabamiiyam Timoti, da vak dlamakǝlaaa lii gata Daadmazhǝgǝl ma Korinti, ǝmtaɗ dǝ yaa daddaha gatǝg baɗǝm ma larda Akaya.
    2: Herǝrra ard gabǝrǝr vak Daadamazhigǝl Daadamiiyama ard Yaazhǝgǝl Yesu Tlǝkatǝga aa ndzarandzǝg ǝmtaɗ dǝ kuurama.
    3: Tagiyamartag kǝ uus kǝ Daadamazhigǝl Daadamiyama, kwa iin Daada Yaazhǝgǝl Yesu Tlǝkatǝga, Daada kwa dadda zhǝwadal ba dyǝk dyǝka, Daadamazhigǝl kwa tagkiyam aandzu hulfa kwar kǝ dzǝgwagha!
    4: Takkiyamtag nǝ Daadamazhigǝl kǝ dzǝgwagh ma dlaɗa miiyam baɗǝmma, aɗaba kǝmyam ndakwani kiyam tagtǝr kǝ dzǝgwagh kǝ kyalmaha ma dlaɗi kwar huɓǝg nǝ iitǝra, dǝ kwanǝn kǝ taa dzǝgwagha kwa tlǝyamkǝna nǝ miiyam vak Daadamazhigǝla.
    5: Bandkwa kiyam huɓǝg nǝ miiyam kǝ dlaɗa huɓu bandkwah nǝ Tlǝkatǝg dǝ ghǝraana kǝ dlaɗa, kiyam da tlǝkǝna tǝdvad Tlǝkatǝg kǝ taa dzǝgwagha Daadamazhigǝla
    6: Aandzu ma kiyam huɓa dlada, kiyam huɓǝg mbakyarvad nal kǝ dǝga taa dzǝgwagh kǝskuurama dlaɓa da fǝkurna kǝ ndzǝd ma ndzǝgana gatǝgaruwa. Akwama tagkiyam dzǝgwagh nǝ uuda, ba kuuram ndakwani tlamkǝnatlǝg kǝ taa dzǝgwaghiina kwam da tlǝkǝna nǝ uuram kǝ ndzǝɗa fa ǝrvǝdmahud dǝ dlaɗa kwa kiyam huɓǝg nǝ miiyamna.
    7: Kǝm maay ɓa ndaundau dǝ kuuram aandzu ba hǝdiikǝn biya, aɗaba kǝm sǝrgasǝrǝg taakiya am huɓa dlaɗa band kwa kǝm huɓǝg nǝmnda, kuram ndakwani am da tlǝkǝnatlǝg kǝ hulfa taa dzǝgweaghǝn ɓagakǝmnda nǝ uuda.
    8: Kǝm naay taaki am dzan kwal sǝrgasǝrǝg tǝghǝr kǝ hulfa dlaɗǝn huɓamǝndu nǝmnd ma haay Asiya, zaraabahar biya, kwan kǝ dlaɗa dyǝkadyǝk ba vaivaiya mandki kǝm da ǝmtsaaga.
    9: Baz tlatlǝgan kǝskǝmnd taaki manki shariya ǝmtsǝg wa tǝkǝmnda nǝ uuda. Dzǝghardzǝg nǝ wana haik fadghǝr kǝskǝmnd tǝ ghramǝnda, bamma kǝm fadghǝr tǝ Daadamazhigǝla, kwa iin wa ciya lii ǝmtsahara ǝmtsahǝga
    10: Sakǝmndasǝg nǝ Daadamazhigǝl sagal ma ǝmtsǝga dlaɗa, famdǝghǝrtfǝg taakiya da katkǝmndkatǝga, famdǝghǝrǝt ba tǝ iina mbakyarvad gwiiya katkǝmndǝtta.
    11: Mǝlamkǝmndu mǝlǝg dǝ dzǝgwazhigǝla. Tǝdvad kwah war da tagar nǝ uudah ba dyǝka kǝ uus kǝ Daadamazhigǝl mbakyarvad kǝmnda, mbakyarvad bark badyak kwa kǝmnda tlǝkǝna nǝmnda tǝdvad dzǝgwazhigǝla.
    12: Dǝgiti fǝkiiyama kǝ tsa kusghǝgha, aɗaba dzamaghǝramiiyam wa tagkiyamtag taakiya ɓagiyamɓag kǝ ndzǝgan ba cuwaɗaɗ ma duniya bad ǝrvǝdmahuɗ palla, kyambar ndzǝgani kwa ndzamda nǝmnd dǝ kuurama. Ən tagan taakiya ndzǝmnda bad jiira hulfa dǝga Daadamazhigǝla, tǝdvad herǝrra Daadamazhigǝla, kwakyarvad dyǝmdyǝmǝr kwan kǝ duni biya.
    13: Kǝm viindkur dǝgiti am da karantǝga karantǝg nuurama am nǝghaakana, Bakǝvakwaha nǝghamaka nǝghǝg ǝnkyǝkwahan ndakwana, mandlǝg naiya am da nǝghǝgakanǝghǝg kǝ dǝgitah baɗǝmma,
    14: Aɗaba sartǝn da saay nǝ Yaazhǝgǝlamiiyam Yesu, am da tsa kushǝg dǝ kǝmnd, band kwa kǝmnda tsa nǝmnd kǝ kushǝg dǝ kuurama.
    15: Mbakyarvad haiyananthaig naiy kwana, iin wa nahan naiy kǝ sagau da vakaru ba zǝngwa, aɗaba am tlǝkǝna kǝ bark shig buwa.
    16: Ɓadlanvaɓadlǝg kǝ da vakaruwa akwaman da dagal dama Makidoniya, ǝn da ghacan dlab vakaruwa akwaman da gwiiya saasa, aɗaba ǝn tlaran kǝ dǝgiti am da mǝlgwad nǝ uurama kiyava langan kǝskai dama Yahudiya.
    17: Mam zharǝg nǝ uuram tsa na ɓadlava ba kwal dǝ sǝrgasǝrgar ha kǝskuurama? Nii mam zharg nǝ uuram ɓadlava dǝ ndzǝgana hǝnkala uudǝrha, aɗaba ǝn taga taaki, “aana” ǝn gwiiya tagan dlab taaki “ǝndkwah bihi”?
    18: Bandkwa maay nǝ ndaudau biya Daadamazhigǝl iin jiira, bandkwah dlab nǝ ǝlbugǝn kǝm tagkur nǝmndna dǝga taaki “Aana” ard “Aˈa biya.”
    19: Mbakyarvad Zǝra Daadamazhigǝla Yesu Tlǝkatǝga, wa tagan naiya ard Sila ard Timoti kǝ ǝlbǝg maraw tǝghǝra, dǝga taaki “Aana”ard “Aa” biya, ba kǝlahǝnga ba “Aana”.
    20: Aɗaba righant tǝdvad Yesu nǝ Daadamazhigǝl kǝ langyi taa nǝ iin baɗǝmma. Iin wa kiyam tag nǝ miiyam tǝdvad Yesu Tlǝkatǝg taaki “Aandz bandkwaha” kiyava fǝgaara kǝ Daadamazhigǝla.
    21: Ba Daadamazhigǝl pal, wa da vǝlkiyam tlǝkǝna shifǝg ma Tlǝkatǝga, baz kǝmnda baz kuurama, ba iin dlaɓ fakiyamafǝga.
    22: Fakiyamǝtfǝg kǝ dǝga sǝrgan tǝ kǝmyam kwa da mara taaki kiyam dǝgaana, vǝlakiyamvǝlǝg dlab kǝ gyagyaan shǝkwan ma ǝrvidmahuɗamiiyama mbakyarvad markiyamdadan kǝ dǝgiti da ɓag nǝ iin tǝvuuka.
    23: Ba Daadamazhigǝl nǝ shidara, akwama fiid wan tag nai taakiya kwa gwiiya na bi nai dagal dama korinti biya, mbakyarvad aa gwiiya fankuraabi kǝ dlaɗ biya.
    24: Kwakyarvad kǝm naa markuura ndzǝɗ tǝghǝr kǝ fadghǝraru biya, maaya, kiyam ɓaa ba tlǝr ǝmtaɗa, kiyava hwaɗag kǝskuurama, mbakyarvad am ghacan bad ndzǝɗ ma fadghǝraruwa.
  2:
    1: Mbakyarvad kwaha fanɗǝmfǝg ma ghǝrar taaki ǝn madlai da vakaru ǝn badzǝdkurda kǝ ǝrvǝdmahuɗ biya,
    2: Aitsa, akwama fankuraafǝg kǝ badzǝga ǝrvǝdmahuɗa, war wada fǝgwa ciinga ǝmtakǝr kǝskai, akwama maay ban daddakwa ǝn fǝgara naiy kǝ badzǝga ǝrvǝdmahuɗ biyi?
    3: Kwa viindankura nai kǝ kwah kǝ wakiita, aɗaba iin naiya taakiya akwama danǝvdǝga ǝn tlara kǝ uudahi kwa dlayatǝr kǝ fǝgwa hwaɗaga, ar da badzǝwadan kǝ ǝrvǝdmahuɗ biya. Aɗaba fandǝghǝrtfǝg naiy taakiya, akwama ǝn da hwaɗaga naiya, baɗǝmmaru ndakwani am da hwaɗaga.
    4: Viindankura mbakyarvad ǝn ma dlaɗa ard badzǝga ǝrvǝdmahuɗ ba dyǝkdyǝka, baz kǝla yuwa tuug kǝskai ba vaivaiya, kwakyarvad ǝn fǝkura kǝ badzǝga ǝrvǝdmahuɗ biya, aɗaba am sǝran taaki ǝn waikurwaig ba vaivaiya.
    5: Akwama ɓagaɓag nǝ uudan kǝ dǝga saa dǝ badzǝga ǝrvǝdmahuɗa, aa ɓaggwi kǝskai pal bi nǝ iini, aa ɓagkura baz kuuram baɗǝmma. Aɗaba ǝn taa kwana naiya kwakyarvad ǝn mbǝkurs biya.
    6: Kiiɓa ndaigǝn aa tlǝkǝna nǝ uudanǝn vak dlamakǝlaaa, tlatlan bandkwaha.
    7: Ndakwan ciya, ɓǝshamarna_ɓǝshǝga, am farna kǝ ndzǝɗa, haik duugars duug kǝskuuram ma badzǝga ǝrvǝdmahuɗa kwa da juugujǝg kǝ ndzǝɗaana.
    8: Mbakyarvad kwaha ǝn ghalakuurama, am marardan taakiya am waigan ba vaivaiya.
    9: Na viindkura kwan kǝ wakiita mbakyarvad ǝn fǝsha kuurama, aɗaba ǝn sǝran mbatak am da gatǝgaan kǝ ǝlbǝgi tagankur ba kǝlahǝnga.
    10: Baɗǝm daddakwama ɓǝshgarna nǝ uurama, ba kai ndakwani ɓǝshanarnaɓǝshǝga. Dǝgiti na ɓǝshna naiya, akwama ba mǝng nǝ dǝgiti ǝnda ɓǝshgarna naiya, ɓǝshǝnna ɓǝshǝg mbakyarvad kuurama, ma barka Tlǝkatǝga,
    11: Haik tlǝkǝnatlǝg nǝ shatanah kǝ duula valla kǝmyama, mbakyarvad kiiyam sǝrgasǝrg kǝ dǝga kǝladǝrahan bat ɓalaɓala.
    12: Danal ba nai damma toruwasa da taa ǝlbǝga marawa tǝghǝr kǝ Tlǝkatǝga, wurghuntwurǝg dlaɓ nǝ Yaazhǝgǝl kǝ duula ɓa tlǝr vaakwana,
    13: bakǝvakwaha ɓallabi nǝ ghǝrar biya, aɗaba nǝghǝghanabi kǝ zǝraabar Titus vaakwa nǝ iin biya. Tǝhalakwaha kaa duutǝrasduug kǝskai kǝ uudaha, kaa dagal kǝskai damma Makidoniya.
    14: Aa tagvartag nǝ uus kǝ Daadamazhigǝla, kwa iin wa ba kǝlahǝng vǝlkiyam zaa fiir tǝdvad Tlǝkatǝga. Ɓa tlǝr dǝ kimyam kiyava langa ǝlbǝg marawa Tlǝkatǝga Aandzu takwara band tǝrshǝn bǝtbǝta kwa pǝsvapǝshǝga.
    15: Aɗaba kiyam band tǝrshǝn bǝtbǝt nǝ miiyam kwa vǝlgar nǝ Tlǝkatǝg kǝ Daadamazhigǝla, kwa kwazakwazǝg dama lii katavtǝrǝtkatǝga ard lii tǝ duula ǝmtsǝga.
    16: Kiyava lii tǝ duula ǝmtsǝga, bǝtbǝtna vaka ǝmtsǝga, kwa saa dǝ ǝmtsǝga, kiyava lii tlarkǝnatlǝg kǝ katǝga, bǝtbǝtna iin shifǝga kwa saa dǝ shifǝga. Maay daddakwa dzǝgwantdzuug kǝ ɓa kwan kǝ tlǝr biya.
    17: Aɗaba kǝmnda kǝm band kyalma uudah biya, kwar taa ǝlbǝg marawa Daadamazhigǝl kiyava tlǝkǝna riibatǝra. Aɗaba aa ɓǝlkǝmdǝt nǝ Daadamazhigǝl kǝskǝmnda, kǝm taa ba jirjir tǝvuukwana, kwakyarvad kǝm lii ɓa tlǝra Tlǝkatǝga.
  3:
    1: Aitsa, kǝmnda fǝgarzha gwiya dlǝba ghǝramnd ha nǝmnda? Nii kǝm gata wakita shid da vakaruw ha, aandzu ma vakaruwa, band kwa ɓag nǝ kyalmah hi?
    2: Abi ba kuuram dǝ ghǝraru nǝ wakiti kwa kǝm dǝvakai nǝmnda, kwa viindava ma ǝrvidmahuɗamǝnda aɗaba nǝghan andzu ba wara dlaɓa karantana.
    3: Maramdamarg nǝ uuram taaki am wakita Tlǝkatǝg nǝ uurama, kwa iin nǝ dǝgshǝga tlǝramnda. Kwan kǝ wakita viindava dǝ dǝga viindǝg biya, viindava dǝ shǝdkw cacuwana cacuwana dǝga Daadamazhigǝl kwa dǝ shifǝga. Viindava tǝ fafakǝlama akur biya, viindava ma ǝrvidmahuɗ uudaha.
    4: Kǝm taa kwana mbakyarvad kǝm dǝ jiir tǝvuukwa Daadamazhigǝl tǝdvad Tlǝkatǝga.
    5: Maay nǝ dǝgiti kwa kǝm da mardamarg taakiya ɓagamnd dǝ sǝrgasǝrgamnd kǝ tlǝriin biya, Sǝrgasǝrgamǝda saal vak Daadamazhigǝla.
    6: Iin wa namndal nǝmnd kǝ lii ɓa tlǝra daala langiya kwa viindava tǝdvad adzahadzah biya, viindava tǝdvad shǝdkwa. Adzahadzahǝn kwa viindavana iin wa saa dǝ ǝmtsǝga, shǝdkwa cacuwana iin wa vǝla shifǝga.
    7: Viindava viindǝg na adzahadzaha muus tǝ fafakǝlama akura, dlaɓa ndanghǝra Daadamazhigǝla mararmarg ma sarta kwa vǝlavdan nǝ iina. Aaandzu ba dǝgitǝn ndza mbiig tǝ huɗvǝga Muus da zǝlma biya, kaaa mbiig ba caacan huɗvǝgaan ba vaivaiya pelatǝrvapelǝg kǝ zarha Israˈila kǝ vazgaana. Akwama adzahadzahi kwa saa dǝ ǝmtsǝga sǝghǝvsǝg dǝ ndanghǝr ǝndkwana,
    8: Aitsa, da ɓaga ndar ka cii nǝ dyakǝra ndanghǝra kwa dǝga ɓaa tlǝra shǝdkwa cacuwana- cacuwan kǝ ndzǝgani?
    9: Akwama ba dǝgiti saa dǝ ǝmtsǝga tlakǝnatlǝg kǝ ndanghǝra, ba jirjira dǝgiti saa dǝ tlƙǝkǝna jira Daadamazhigǝla juujig kǝ iin ba dyakdyaka.
    10: Ba jirjira, ndanghǝra umghura langiya madlabi dǝ ndanghǝr ndakwan biya, akwama gǝravanagǝrǝg dǝ ndanghǝra daala langiya.
    11: Akwama dǝgiti da ghyǝnng nǝ zamanana sǝghǝvsǝg dǝ ndanghǝra, da nǝg ndandar ka cii nǝ dǝgiti kwa da ndzǝg ba tangw dama zǝrazǝri!
    12: Mbakyarvad kiiyam mǝng dǝ hulfa kwan kǝ fantaara, iin wa kiyam mǝng dǝ ndzǝd ba vaivaiya.
    13: Kiiyam maay nǝ miiyam band Muus biya, kwa hǝdgharduu huɗvǝgan dǝ sǝɗav biya, haik nǝghǝganǝghǝg nǝ uudaha Israilaha kǝ ghyǝnnga ndanghǝr kwa da dagal nǝ zamanana.
    14: Aɗaba ghǝratǝra ba dǝkdǝka, tangw dat hiinanna, mǝng nǝ dǝgiti tsǝtǝrva nǝghǝga jiira akwamar karanta umghura langiya. Tǝhavdabi nǝ sǝɗavǝn ba kǝvakwan biya, aɗaba tǝhǝvdabiya, bamma tǝdvad Tlǝkatǝg kalti lakwti tǝhǝvdatǝhǝga.
    15: Tangw dat hiinanna, akwamaar karanta kakaɗa muusa, kaa hǝɗtǝrduhǝɗǝg nǝ sǝɗavǝn kǝ ǝrvǝdmahuɗaatǝra.
    16: Tǝhvǝdatǝhǝga nǝ sǝɗaviina akwama gwiiyagwiig nǝ uudan da vak Tlǝkatǝga.
    17: Aiciiya, Yaazhǝgǝla iin nǝ sǝdkwa cacuwana-cacuwanna. Vakavaki dǝ sǝdkwa Yaazhǝgǝla mǝng nǝ kwaraghǝr vakwahiina.
    18: Kǝmyamǝn hǝɗavarduubi nǝ huɗvǝgamiiyamǝn biya, kiiyam mara paraka ndanghǝra Yaazhǝgǝl band akwatǝrama, dlaɓa gwiikiyamant gwiig nǝ uud kiyam nal band Yaazhǝgǝla. Kwan kǝ gwiiya vǝghǝn ɓaga kiiyama nǝ uudǝna fǝgara bad fǝga ma ndanghǝra kwa sal vak Yaazhǝgǝla, kwa iin sǝdkwa caccuwanacaccuwana.
  4:
    1: Mbakyarvad kwaha, kiiyam mǝng tsuu dǝ kwan kǝ tlǝra kwakyarvad zhǝwadaala Daadamazhigǝla, aa ngadlavbi nǝ ǝrvǝdmahuɗamiyam biya.
    2: Maay lambamnd dǝ shǝɓa hulfa dǝga muuniya kwa saa dǝ dǝga tsa zhǝru biya. Maay lambamnd dǝ valuuda ma taa fiid dǝ ǝlbǝga Daadamazhigǝl biya. Kǝm taa ba jiir nǝmnda bat ɓalaɓala. Da ɓag ǝndkwah nǝ uudah kǝ shiida jiirjir kwa ɓagamnda nǝmnd tǝ vuuka Daadamazhigǝl ma ǝrvǝdmauɗaana.
    3: Akwama ǝlbǝg marawǝn kwa kǝm tag nǝmnd kǝ ǝlbǝg tǝghǝrǝn shǝɓashǝɓanna, shǝɓashǝɓan bak lii tǝ duula ǝmtsǝga.
    4: Ar lii maay dǝ fadghǝr nǝ iitǝr biya, aɗaba shatanaha duniya gulfatǝrǝtgulfǝg kǝ ǝrvǝdmahuɗaatǝra. Tsatǝrvatsǝg kǝ nǝghǝga paraka kwa ba caacan tǝghǝr kǝ iitǝra, parakǝn kwa sǝghal ma ǝlbǝg marawa aa ndanghǝra Tlǝkatǝga, kwa iin nǝ garava Daadamazhigǝla.
    5: Mbakyarvad kǝm taa ǝlbǝg marawa ghǝramnd biya, bamma dǝga Yesu Tlǝkatǝga, taakiya iin Yaazhǝgǝla, kǝm band kwatǝnaharu nǝmnd mbakyarvad Yesu.
    6: Daadamazhǝgǝlǝn kwa tagaa taaki, “Aa ndzadzǝg nǝ parak ba parakrak ma gurtla,” iin wa fafǝg kǝ parakan kwa ba parakrak ma ǝrvǝdmahuɗamiiyamma, kiyava ba parakrak kǝ uudaha mara sǝran kǝ ndanghǝra Daadamazhigǝl tǝvuukwa Tlǝkatǝga.
    7: Bakǝvakwaha, kǝmyamǝn kiiyam dǝ kwan kǝ hyahǝra ma gatǝga, kiiyam band tǝfuwa luuwa. Niiyamalmǝg band ǝndkwaha, aɗaba marvǝdan taakiya ndzǝɗi kwa juujig baɗǝmma sal vak Daadamazhigǝla, sal vakamnd biya.
    8: Vǝlkǝmnd vǝlǝg nǝ uud kǝ dlaɗ nǝ uud aandzu ta kwar kǝ ɗuula, bakǝvakwaha fakǝmnda bi nǝ uud kǝ kuɗǝg dǝ tlǝriin biya. Davalitlǝrna kǝm ɓagan kǝ ndaundauwa, aɗaba gǝndzamdǝt biya.
    9: Vǝlkǝmnd vǝlǝg nǝ uud kǝ mbahǝlla, bakǝvakwaha duuwa kǝmndarsbi nǝ Daadamazhigǝl biya. Daghuvaliitlǝr dlaɓa tsǝkǝmǝndtsǝg nǝ uud dǝ zaada, bakǝvakaha ciiɓakǝmndabi nǝ uudya.
    10: Ba kǝlahǝnga kǝm ba tǝ duula ǝmtsǝga band kwa ɓagavara kǝ Yesu, mbakyarvad marvǝdan nǝ ndzǝgana Yesu tǝ vǝgha miiyam kwa dǝga ǝmtsǝga.
    11: Ma ba kiiyam ndzǝga bad shifǝg ma duniya, kiiyam ba tǝ duula ǝmtsǝg mbakyarvad Yesu, aɗaba nǝghǝvan nǝ ndzǝgana Yesu tǝ vǝghamiiyam kwa dǝga ǝmtsǝga.
    12: Iin wa ba kǝlahǝnga kǝm ba tǝ duula ǝmtsǝga, mbakyarvad am tlǝkǝna nǝ uuram kǝ shifǝga.
    13: Viindaviindan ma kakaɗa Daadamazhigǝl taakiya, “Fandǝghǝrǝtfǝga, mbakyarvad kwaha taganataga.” Aandzu ba kiiyam dǝ fadghǝr hulfa dǝgit palla, ba kǝmnd ndakwani famdǝghǝrtfǝga, kǝm tag mbakyarvad kwan nǝmnd kǝ ghaiya.
    14: Kǝm sǝrgasǝrg taakiya Daadamazhigǝl kwa ciighant Yaazhǝgǝl Yesu ma gǝtlaha, da ciikiyamciig ǝmtad dǝ Yesu, da sǝkiiyamnda da tǝvuukwana baz kǝ uurama.
    15: Baɗǝm nǝ wana mbakyarvad da mǝlkuuru kǝskuurama, aɗaba herrǝra Daadamazhigǝla da fǝgarabadfǝg da tǝghǝr kǝ uudaha ba dyǝkka, da nǝg kǝ dǝgshǝga gwiiya fǝgara taa uus kǝ uudah kǝ Daadamazhigǝla, kiyava vǝlva nǝ ndangǝra.
    16: Mbakyarvad kwaha gǝdzamdǝt biya, aandzu ba vǝghamnda dǝga uuda duniya da badzǝga, bakǝvakwaha kǝm nǝg bak daal ma gatǝg ba kǝlahǝnga.
    17: Aɗaba kwan kǝ zǝr dlaɗǝn kǝm huɓǝg nǝmnda da zǝlmabiya, kǝm da tlǝkǝnatlǝg kǝ ndanghǝr ba dyǝkka, kwa juujig kǝ taga, da ndzǝg ba tangw damma zǝrazǝrra.
    18: Kwakyarvad dǝgitahi zharǝg nǝ gyiya wa kǝm fǝg nǝmnd kǝ taaɗ tǝ vakai biya, bamma dǝgitahi kwa nǝghvabiya. Aɗaba dǝgitahi kwa nǝghǝvanǝghǝga da zǝlmabi nǝ zamanan kǝ dagal biya, dǝgitahi kwa nǝghǝvabiya dǝga tangw damma zǝrazǝrra.
  5:
    1: Sǝryamasǝrg taakiya akwama dlagavnadlag nǝ tsakwamǝn kwa kiiyam ndzǝga nǝ miiyama mavakaina, kwa iin nǝ vǝghǝghamiiyama dǝga kwan kǝ duniya, ɓagakiymaɓag nǝ Daadamazhigǝl bad ghǝran kǝ hǝnyah ma ghǝrazhigǝla. Kwan kǝ hǝnyaha ndǝra nǝ uud biya, da ndzǝg nǝ iin ba tangw dama zǝrazǝrra.
    2: Ndakwana, kiiyam fǝgaan kǝ ǝrvǝdmahuɗa, kiiyam hwaɗag ba vaivaiya kiiyam da tlǝkǝna kǝ sǝɗav da tǝ vǝgha ma ghǝrazhigǝla.
    3: Akwama da vǝlyakiiyam vǝlǝg nǝ uud kǝ sǝɗava, da tlǝkiiyamabi nǝ uud dǝ suuh biya.
    4: Ma sarta kwa kiiyam ndzǝgan nǝ miiyam dǝ vǝgha kwan kǝ duniya, kiiyam ngiiga mbakyarvad dlaɗa kwa kiiyam huɓǝg nǝ miiyama. Kwakyarvad kiiyam na tagguva dǝ vǝgha kwan kǝ duni biya, ma naaga miiyama ma kiiyama tlǝkǝna kǝ sǝɗav kwa dǝga ghǝrazhigǝla, aɗaba dǝgit dǝ shifǝga tangw dama zǝrzzǝrra gwiighantgwiig kǝ dǝga ǝmtsǝga baɗǝmma.
    5: Ba Daadamazhigǝl dǝ ghǝraan wa ɓadlǝghani kwan kǝ gwiiya vǝgha, vǝlakiiyamvǝlǝg dlaɓ kǝ shǝdkwan kiyava markiiyamndan kǝ dǝgiti da ɓagkiiyam nǝ iin tǝvuukwa.
    6: Mbakyarvad kwaha iin wa bakǝlahǝng kiiyam tsa ǝrvǝdmahuɗa miiyama, kiiyam sǝrgasǝrg dlaɓ taakiya akwama ba kiiyam dǝ vǝgha kwan kǝ duniya, kiiyam ba bǝkyǝ dǝ hǝnyaha miiyam kwa ǝmtaɗ dǝ Yaazhǝgǝla.
    7: Aɗaba kiiyam ndzǝgan ma fadghǝra, dǝga nǝgha gyi biya.
    8: Bak jiijira ghacamnda ghacig tsau ba tankara, maa tǝ naagamnda makǝma tagguva dǝ kwan kǝ vǝgha, kǝm ndzan ǝmtaɗ dǝ Yaazhǝgǝl ma ghǝrazhigǝla.
    9: Mbakyarvad kwaha, aandzu kǝm ma kwan kǝ duniya aandzu kǝm maghǝrazhǝgǝla ma tǝ naagamnd ma ciingu kǝ ǝmtakǝramnda.
    10: Aɗaba barari kǝskǝmyam kiyam ghachaan tǝvuukwa Tlǝkatǝga baɗǝmma, kiyava tǝkitam kǝ shariya. Ma bawara da caawa dǝgshǝga tlǝraani ɓagaa nǝ iin dǝ vǝgha kwan kǝ duniya, aandzu marawa aandzu marau biya
    11: Kiiyam sǝrgasǝrg tsau kǝ dǝgiti tagav dǝ gǝdza Daadamazhigǝla, iin wa kǝm ɓa kǝlaa ndzǝɗamnda ma kǝma sǝdaa kǝ kyalmaha. Sǝrgasǝrǝg nǝ Daadamazhigǝl kǝ ndzǝgana miiyan baɗǝmma, mandlǝg naiya am sǝrgasǝrǝg kǝ kwan ma ǝrvǝdmahuɗaruwa.
    12: Kwakyarvad kǝm dlǝba ghǝramnd tǝvuukwaru biya, kǝm ɓa kǝla ndzǝɗamnda kǝm tagkur kǝ ɗuuli am da ciinggu nǝ uuram kǝmtakǝramnd ba vaivaiya, kiyava ngutǝrangug kǝskuuram kǝ lii naa ghǝraatǝr mbakyravad ar uudah dyǝkdyǝka, dlakulva hǝnkalatǝra.
    13: Kǝm valaagah nǝmnd band nkwa taag nǝ kyalmaha? Aandzun kǝm ba valaaga, kǝm valaag mbakyarvad ndangǝra Daadamazhigǝla. Akwama kǝm valaag bi nǝmnd biya, ba kwa vakaru ci waha.
    14: Baɗǝm nǝ dǝgiti ɓagamnda nǝmnda, ɓagamnd kiyava tlǝkǝna dǝgshǝg kǝ ghǝramnd biya, ɓagamnd mbakyarvad waiyakǝva Tlǝkatǝga kwa ɓa tlǝr dǝ kǝmnda. Fǝyamdǝghǝrǝtfǝg tsau taakiya ǝmtsaǝmtsǝg nǝ Tlǝkatǝg mbakyarvad uudah baɗǝmma, mbakyarvad kwaha baɗǝm ǝmtsahara ǝmtsahǝg ǝmtaɗ dǝ iina.
    15: Əmtsaǝmtsǝg nǝ iina mbakyarvad uudah baɗǝmma, aɗaba haik ɓa dǝgiti naag nǝ ghǝratǝr kǝ lii dǝ shifǝga, bamma ar ɓa ndzǝgan mbakyarvad daddakwa ǝmtsa kwakyarvad iitǝra, ciiyavantciig dlaɓ mbakyarvad iitǝra.
    16: Mbakyarvad kwaha kǝm madlabi zhara ndzǝgana uud dǝ hǝnkala duni biya, aandzu ba tapamndǝna tapǝg kǝ dzamaghǝr tǝghǝr kǝ ndzǝgana Tlǝkatǝg band ndzǝgana uudǝra, ndakwana kǝm madlabi ndzamgan ǝndkwah biya.
    17: Mbakyarvad kwaha akwama nzdǝgan ma Tlǝkatǝg nǝ uudana, nalnǝg kǝ daala vǝrɗǝga, baɗǝm nǝ ǝnghura dǝgitaha daal zamanana, aandzu ba auwa, nalnǝg kǝ daala.
    18: Baɗǝm nǝ wana ba vak Daadamazhigǝla, kwa ɓadlǝghani ndzǝgana taataka miiyam ǝmtaɗ dǝ iin tǝdvad Tlǝatǝga, vǝlakǝmǝndvǝlǝg dlaɓ kǝ tlǝra ɓadla ndzǝgana taataka uudah dǝ Daadamazhigǝla.
    19: Əlbǝgamnda iin taakiya ɓadlǝghaniɓadlǝg nǝ Daadamazhigǝl kǝ ndzǝgana taataka uuda dǝgshiga ard iin tǝdvad Tlǝkatǝga, maay dlaɓ kǝdla haipahatǝr tǝghǝr kǝ iitǝr biya. Vǝlakǝmndvǝlǝg nǝ Daadamazhigǝl kǝ dǝgshiga ɓa tlǝra ɓadla ndzǝgana uudaha ard iina.
    20: Mbakyarvadkwaha kǝm dlakulva gyiya tlǝkatǝg nǝmnda, mandki ba Daadamazhigǝl dǝ ghǝraan wa taaghai tǝdvad kǝmnda. Ma ɗaaga Tlǝkatǝga, kǝm ghaala kuurama ɓadlamvaɓadlǝg dǝ Daadamazhigǝla am nal kǝ tsaghwahaana, lii ɓa tlǝghum dǝ iin biya.
    21: Tapghanabi nǝ Tlǝkatǝg kǝ ɓa haip biya, mbakyarvad kǝmyamma nadalnǝg nǝ Daadamazhigǝl kǝ Tlǝkatǝg band dadda haipa. Tǝdvad kwan kǝ ɗuul, wa kiiyam da tlǝkǝna kǝ jiira ma ɗaaga Tlǝkatǝg vak Daadamazhigǝla.
  6:
    1: Ma huɗa tlǝri ɓagamnd nǝmnd ǝmtaɗ dǝ Daadamazhigǝla, kǝm ghalakuuramǝn tlamkǝnatlǝg kǝ herǝrra Daadamazhǝgǝlna, duuwamarsbi nal ba gyagyan biya.
    2: Cinngamcing kǝ dǝgiti aa taag nǝ, Daadamazhigǝla, amaa, “Sǝghǝv ban sarta kwa ɓagankur nai kǝ herǝrra, cinngankurana cinnga. Sǝghǝv ba sarta katǝga, mǝlankurumǝlǝga.” Cinngamcinnga! kwan sarta kwam da caaug nǝ uuram kǝ herǝrra Daadamazhigǝla, hiinan nǝ faciya katǝga!
    3: Nǝyamalbi kǝ duula mbǝdǝg aandzu kǝ war biya, aɗaba haika tlǝkǝna duula ghudǝkiiyamas ǝlbǝg tǝghǝr kǝ tlramiiyama.
    4: Dlakulvakwaha, baɗǝm nǝ dǝgiti kiiym ɓag nǝ miiyama, ɓagyamɓaga mbakyarvad kiiyam mardan takiya kiiym lii ɓa tlǝra Daadamazhigǝla. Kiiyam ɓagan dǝ fa ǝrvǝdmahuɗa, ard huɓa dlaɗa, mbahǝlla, ard dlaɗa ndzǝgana.
    5: Kalakǝmndakakalǝg nǝ uuda, ar ɓǝlkǝmdǝm dama guda bǝrfina, dlaɓa ar fakǝmdǝt nǝ uud kǝ vavǝrra ma sarta ciiga hǝnkala, ɓagamndaɓag kǝ tlǝr kwa juujig kǝ ndzǝɗamnda, hǝnamndu bi kǝ haar biya dlaɓa famndu bi kǝ kaff biya.
    6: Tǝdvad hǝnkalamnd kwa cacuwana, ard sǝrgasǝrgamnda, ard fa ǝrvǝdmahuɗamnda ard taa jiira, maramnda marǝg taakiya kǝm lii ɓa tlǝra Daadamazhigǝl tǝdvad shǝdkwa cacuwana cacuwana, ard waiyakǝvamnda ba jiijiira,
    7: Ard ǝlbǝgamnda kwa ba jiijiira, ard ndzǝɗa Daadamazhigǝla. Kǝm mǝng dǝ jiira kwa iin wa band dǝgdǝva kwa kiiyam hǝkyǝg nǝ miiyam ma dǝva kaffa ard dǝva ghyǝɓa.
    8: Fakǝmndarafǝg nǝ uuda, dlaɓa vǝlakǝmnd vǝlǝg nǝ uud kǝ dlaɗa, dlǝbakǝmdǝt dlǝbǝg nǝ uuda, dlaɓa bazdakǝmnda badzǝg nǝ uud kǝ ɗaaga. Nakǝmdadalnǝg nǝ uud kǝ lii taa fiida, bakǝvakwaha kǝm taa ba jiir nǝmnda.
    9: Mandki sǝrkǝmnd bi nǝ uud biya, tambar sǝrkǝmndsǝrǝg nǝ uuda ba vaivaiya, Mandki kǝm ba tǝ duula ǝmtsǝga, iin wan kwana kǝm bad shifǝga. Ar vǝlkǝmnd dlaɗa, bakǝvakwaha ciiɓakǝmndabi nǝ uudi,
    10: Ma huɗa dlaɗǝn vǝlakǝmnd nǝ uudna, fakǝmnda ba hwaɗaaga. Aandzu ba kǝm maay dǝ dǝgit biya, bakǝvakwaha tlakǝnatlǝg nǝ uudah badyǝk kǝ hyahǝr tǝdvad kǝmnda. Mandki kǝm maay aandzu ndau biya, mbats baɗǝm nǝ dǝgita ba dǝgamnda.
    11: Kuuram uudaha Korintiyaha, shǝbamndkurvabi aandzu ndauw biya, dlaɓa maramndadamarǝg nǝmnd taakiya kǝm waikurwaiga ba vaivaiya.
    12: Au kǝmnd wa duuwamndkurars duuga, abi kuuram wa haiyamantbi dǝ kǝmnd ma ǝrvǝdmahuɗaru biya.
    13: Ən taagkur kwan naiya band kwa taagtǝr nǝ Daad kǝ ǝlbǝg kǝ zarhaana, kuuram ndakwani am markǝmndadan kǝ waiyakǝvaruwa.
    14: Haɗambi kǝ ghǝr dǝ uudahi kwar maay gata Yaazhǝgǝl biya. Əndzǝgandzǝg nǝ uuda jiirjir ba lapi dǝ dadda ɓa kǝlandǝrra? Nii auwa dzǝtǝrǝm paraka ard gurtli?
    15: Tsaghwa shatanah nǝ Tlǝkatǝga? Nii auwa dzǝtǝrǝm lii gata Yesu ard lii maay gata Yesu biyi?
    16: Auwa dzǝtǝrǝm vǝgya Daadamazhigǝla ard hǝnyaha ɓa ghǝlli? Kǝm vǝgya Daadamazhigǝl nǝmd kwa dǝ shifǝga. Band kwa tagaa nǝ Daadamazhigǝl taaki, “Ən da ndzǝgan ǝmtaɗ dǝ iitǝra, ǝn gwaiva miitǝra. Ən nal dlaɓa kǝ Daadamazhǝgǝlatǝrra, ar nal dlaɓ nǝ iitǝr kǝ uudahara.
    17: Mbakyarvad kwaha asamasagal ma lii ar maay gata Yesu biya, wahamzhawahǝg kǝ ghǝraru dǝ iitǝra, am nǝ Yaazhǝgǝla. Haɗambi kǝ ghǝraru dǝgiti kwa maay cacuwana cacuwan biya, ǝn da haikurǝt tǝdvad kwan naiya am nǝ Daadamazhigǝla.
    18: Ən da nǝg kǝ Daadaruwa, kuuram dlaɓ am nal kǝ zarhahar ghwalvaha ard ǝnghwasaha. Am nǝ Yaazhǝgǝl kwad ndzǝɗ baɗǝmma.”
  7:
    1: Takiiyamatǝg tsau nǝ uud kǝ langyiya dǝgitahan baɗǝm zaraabahara, mbakyarvad kwaha aandz ba cuwaɗad nǝ vǝghamiiyama ard ǝrvidmahuɗamiiyam haik ɓa haip kǝskǝmyama. Kiiyam nal dlaɓ ba caccuwanacaccuwana ma gǝdza Daadamazhigǝla.
    2: Haiyamanthaig dǝ kǝmnd ma ǝrvǝdmahuɗaruwa. Ɓagamndarabi kǝ haip aandzu kǝ war biya, badzamdardabi dlaɓ kǝ ǝrvidmahuɗ aandzu kǝ war biya, dlaɓa zamndubi aandzu dǝga war biya.
    3: Na fǝkura haip naiya kwakyarvad na tagda kwah biya, band kwa taggankurda naiy taakiya, maay nǝ dǝgiti da tagkuratagw dǝ waiyakǝvǝmnd biya, aandzu kǝm ǝmtsaǝmtsana aandzu kǝm dǝ shifǝga.
    4: Haiyankurǝthaig ba vaivaiya, ǝn tsa kushǝgh dlaɓ dǝ kuurama. Ərvidmahuɗara ba panahnah ba vaivaiya. Aandzu ba kǝm huɓa dlaɗa, ǝrvǝdmahuɗara ba dzaiya.
    5: Aandzu ba sarti damdaghan nǝmnd damma haaya Makidoniya, diiyamndubi kǝ kuɗǝgg biya. Aandzu kǝm takwara ba dlaɗa, tǝ ɓalaɓala ndakwani pǝkya ghaiyamnd nǝ uuda, ma huɗa kǝssa gǝgzǝtgǝdzǝg nǝ ǝrvǝdmahuɗamnda.
    6: Daadamazhǝgǝli kwa fǝgara ndzǝɗ kǝ daddakwa gǝdzǝga, fakǝmndafǝg kǝ nzdǝɗ dǝ sagauwa Titusa.
    7: Kwakyarvad sagauwa Titus kalti bi wa fakǝmnda hwaɗag biya, ǝlbǝgahi tagakǝmnd nǝ iin kǝ duula kwa famarna nǝ uuram kǝ ndzǝɗa. Tagakǝmndtag dlaɓ kǝ ɗuuli am na nǝghǝkwa nǝ uurama ba vaivaiya, ard ɗuuli badzamdadda nǝ uuram tǝghǝr kǝ dǝgiti dzǝghardzǝga, ard kwa ɓagam nǝ uuram kǝ kǝla ndzǝɗaru kǝ tlahǝgus ǝlga. Kwan wa fǝghwa kǝ cinnga ǝmtakǝr ba vaivaiya.
    8: Aandzu ba badzakurdabadzǝg nǝ wakiitar kǝ ǝrvǝdmahuɗa, njikwa biya. Ndza badzanda badzǝg kǝ ǝrvǝdmahuɗa ma sartakwa ndza wura aɗaba sǝranasǝrǝg taaki ndza tapghant tapǝg nǝ wakiitar kǝ ǝrvǝdmahuɗaruwa, aandzu ba dǝga sart ǝnkyǝkwaha.
    9: Ndakwana ǝn hwaɗaaga, aandzu ba cǝnnganubi kǝmtakǝra kwa badzankurdanai kǝ ǝrvǝdmahuɗ biya, aɗaba badzǝga ǝrvǝdmahuɗaru wa fakura pǝlla ghǝra am ɓadlǝna kǝ hǝnkalaruwa. Badzǝga ǝrvǝdmahuɗaruwa hulfa kwa naag nǝ Daadamazhigǝla, mbakyarvad kwaha ɓagamndkurabi kǝ haip tǝghǝr kǝ dǝgiti ɓagamndkura nǝmnd biya.
    10: Aɗaba badzǝga ǝrvǝdmahuɗi kwa hulfa dǝga Daadamazhigǝla wa fǝgaraa pǝlaghǝr kǝ uuda, gwiiyan davak Daadamazhigǝla, da tlǝkǝna ǝndkwah kǝ katǝga. Dlaɓa maay nǝ taaki“ma sǝranasǝrg” mavakai biya. Aɗaba badzǝga ǝrvǝdmahuɗi sǝgarda nǝ uudan kǝ ghǝraana, saa dǝ ǝmtsǝga.
    11: Zharamzharǝg kǝ dǝgiti aa sǝkurda nǝ badzǝga ǝrvǝdmahuɗ hulfa kwa naag Daadamazhigǝl dama kuurama. Fakuraafǝg kǝ panahnaha ɓagana, ard mara taaki ɓagama bi kǝ dǝgit kalkal biya. Fakuurafǝg kǝ nguɗa ǝrvǝdmahuɗa, dlaɓa gǝdzamǝtgǝdzǝga. Fakurafǝg kǝ ɓa fantara, dlaɓa ɓagamaɓag kǝ tlǝra. Fakurafǝg am ɓadlǝvan da caauwa kiiɓa ndaiga kwa kalkalana. Əlbǝg tǝghǝr kǝ kwan kǝ dǝgita, bak jiijiira aandzu tǝ kwar kǝ duula maramdamarg nǝ uuram taakiya am maay dǝ haip biya.
    12: Ma sarta kwa viindananai kǝ kwah kǝ wakita, ndza maay lambar dǝ uudi kwa ɓaga haip biya, aandzu ma daddakwa ɓagǝvara nǝ haipa. Dlakulvan wana viindkuranai kiyava markurdan ba da palla pal taaakiya sǝrgasǝrg nǝ Daadamazhigǝl haiyamanthaig dǝ kǝmnda ba vaivaiya.
    13: Kwakyarvad kwan wa tlamkǝna nǝmnd kǝ ndzǝɗ ma ǝrvidmahuɗamnda. Maay ba nǝ tlǝkǝna ndzǝɗ ma ǝrvidmahuɗamnd biya, bakǝvakwaha kǝm fǝgara ba hwaɗag ba vaivaiya aɗaba hulfa hwaɗagǝn mavakai nǝ Titus na, mbakyarvad baɗǝmmaruwa mǝlamarumǝlǝg dǝ tlǝkǝna ndzǝɗ ma ǝlbǝgaha.
    14: Aandzu ba taganartag nai taakiya ǝn tsa kushǝg dǝ kuurama, da nǝmbi damma zhǝru biya. Band kwa tagamndkurnǝmnd kǝ dǝgitah baɗǝm bak jiijiira, bandkwah dlaɓ tsa kushǝghamnd dǝ kuurama nalnǝg bak jiirjiir tǝvuukwa Titusa.
    15: Waiyakǝvǝn kwa ɓagkur nǝ Titus na, fǝgara bad fǝg ba vaivaiya akwama dzamghanadzamǝg kwa famaara nǝ uuram nǝ uuram baɗǝmma, ard hulf hǝnkali maramarda nǝ uuram ma sarta kwa caawama nǝ uurama.
    16: Ən hwaɗag ndakwana mbakyarvad haiyananthaig dǝ kuurama bak jiirjiira.
  8:
    1: Ndakwan ci Zaraabaharra, kǝm naagan am sǝran kǝ dǝgiti ɓagaa nǝ herǝrra Daadamazhigǝl ma dlamakǝlaaa lii gatǝga kwar ma makidoniya.
    2: Aɗaba huɓaruuhuɓǝg kǝ dlaɗ ba vaivai mbakyarvad dlaɗǝn darǝm nǝ iitǝr da mavakaina, bakǝvakwaha dyǝkǝra hwaɗaagatǝra fatǝrafǝg kǝ ɓa tlǝra herǝrra kǝ mǝltǝru kǝ kyalmaha, aandzu ar bamma talagǝraatǝra.
    3: Fandǝghǝrtfǝg nai taakiya araa vǝlda ba kalkala ndzǝɗaatǝra juujig kwa nahava. Vǝlardavǝlǝg bad haiga ghǝratǝra, favtǝra dǝ ndzǝɗ biya.
    4: Ghalarkǝmnd ghalǝga ma kǝma vǝltǝr kǝ duula ɓa tlǝra mǝltǝru kǝ uudaha, aɗaba iitǝr ndakwani mara dǝm damma lii mǝltǝru kǝ lii gatǝga kwar ghyǝba Yahuda.
    5: Vǝlardavǝlǝg juujig ba kǝ dǝgiti tlatlamnd nǝmnda. Aɗaba vǝlardavǝlǝg kǝ ghǝratǝr ba ma zungwǝr kǝ Yaazhǝgǝla, ar vǝldan dlaɓ kǝ ghǝraatǝr kǝskǝmnda, band kwa naag nǝ Daadamazhigǝla.
    6: Nǝghamnda ba nǝmnd ǝndkwaha, kaa ghala Titus kǝskǝmnd ma zaavuuk dǝ tlǝra dzaha dǝgitahi ndzahavanta, aɗaba iin wa fǝghazhafǝga.
    7: Aandzu bamma kwar kǝ dǝgita, ba kuuram wa tǝvuukwa, aandzu tǝ fadghǝr ma Tlǝkatǝga, aandzu ba tǝ taa ǝlbǝga, ma sǝrga dǝga jiirjiira, ma tǝ na ɓa tlra, ard waiyakǝvǝri am ɓagkǝmnd nǝ uurama. Mbakyarvad kwaha zamzǝg kǝ vuuk dǝ ɓa tlra vǝlǝg naaga ghǝra.
    8: Na fǝkuraa barari bi naiya, ǝn markur ɗuuli ɓagar nǝ kyalmah kǝ tlǝra mǝlagaru kǝ uudaha. Kwan wa da marda waiyakǝvi am dǝ vakai nǝ uurama.
    9: Aɗaba am sǝrgasǝrǝg kǝ herǝrra Yaazhǝgǝl Yesu Tlǝkatǝga. Aandzu ba dadda hyahǝr nǝ iina, bakǝvakwaha nadalnǝg kǝ ghǝraan kǝ talaga mbakyarvad kǝ uurama, aɗaba tǝdvad talagǝrana, am da tlǝkǝnatlǝg nǝ uuram kǝ dǝgit baɗǝm tǝvuukwa Daadamazhigǝla.
    10: Sawariyi ǝn vǝlkurnaiya, ǝn taaakiya, ɓagaɓag kǝ maraw am ghyǝnngna kǝ dǝgiti famarzha nǝ uuram ma viigǝn kwa daal na, kwakyarvad vǝlamndavǝlǝg kalti biya, ǝndkwah biya, aɗaba am naagan kǝ ɓagana.
    11: Ghyǝnngamna ghyǝnng ci kǝ tlǝrǝn famarzha nǝ uuram bad ǝrvǝdmahuɗ pallna, ɓagamɓag ba kǝla ndzǝɗaaruwa.
    12: Akwamam dǝ ǝrvǝdmahuɗa vǝlgaana, da ciingan nǝ Daadamazhigǝl kǝmtakǝra valgaanaruwa, akwama vǝlamndavǝlǝg kalkala ndzǝɗaaruwa. Naa bi nǝ Daadamazhigǝl kǝ ɓa dǝgiti kwa dǝtbi nǝ ndzǝɗaaru dat vakaiy biya.
    13: Kwakyarvad ǝn vǝltǝr kǝ dǝgit tsaftsaf kǝ kyalmaha, tǝhalakwaha ǝn fǝkura kǝ dǝgit dǝmdǝm biya.
    14: Kwakyarvad taguvnan nǝ tlǝriin ba kalkal band kwa nahava, mǝlamtǝrumǝlǝg ba ndkwana aɗaba am dǝ duula mǝltǝrumǝlǝga. Kuuram dlaɓa ar da mǝlkurumǝlǝg ma sarta kwa da maay nǝ dǝgit vakaru biya, iitǝr dlaɓa ar da mǝlkuru, sarti ma da mǝng nǝ dǝgit vakatǝra. Tǝdvad kwah wa da ba kalkal nǝ ndzǝgana.
    15: Bandkwa viindaviindan ma kakaɗa Daadamazhigǝl taaki, “Daadakwa dzagant ba dyǝka, da jǝguubi kǝ ndzǝɗa biya, Daadakwa dzagant ba ǝnkyǝkwaha, hǝtsal bi kǝ iin biya.”
    16: Kǝm tagar uus kǝ Daadamazhigǝl kwa fǝghara kǝ Titus kǝ ɓa tlǝra mǝlgaru kǝ uudah, bandkwa naag naiya.
    17: Kwakyarvad ghalgamnd bi wa fǝghara kǝ dagau da vakaru biya, aɗaba naha ba wur nǝ iin kǝ da vakaruwa.
    18: Wa ɓǝlamndantɓǝlǝg baz zǝraabamiiyam ǝmtaɗ dǝ iina, kwa daal nǝ daagan vaka taa ǝlbǝg maraw kǝ dlamakǝlaaa lii gatǝg baɗǝmma.
    19: Maay waha ndakwani, kǝsghakakǝsǝg nǝ dlamakǝlaaa lii gata kǝ iina ma dahadagal ǝmtaɗ dǝ kǝmnda da vaka ɓatlǝra herǝrra kwa kǝm ɓag nǝmnd mbakyarvad galla Yaazhǝgǝla, dlaɓa kiyava mardamarǝg taakiya kǝm mǝng dǝ ǝrvǝdmahuɗa mǝltǝru kǝ uudaha.
    20: Kǝm gǝdza dǝgiti da tagav tǝ kǝmnd tǝghǝr kǝ ɗuuli kǝmnda tagw nǝmnd dǝ dǝgitahi dzahavant dǝ haiga ghǝra.
    21: Naagamnda kǝm ɓaga kǝ dǝgit marawa, kwakyarvad tǝvuukwa Yaazhǝgǝl pall biya, baz tǝvuukwa uudaha.
    22: Ɓǝlamndantɓǝlǝg kǝ zǝrabamiiyam ǝmtaɗ dǝ iitǝra, kwa shǝg ba dyǝk kǝm ba fishǝgaana dlaɓa famndǝghǝrtfǝg dǝ iin tǝghǝr kǝ dǝgitah shah-shaha. Ndawana gwiiya fǝgharafǝg kǝ mǝlkurumǝlǝg mbakyarvad haiyakurǝrhaig dǝ kuurama.
    23: Dzamamnadzamǝg taakiya Titusa tsagwa ɓa tlǝrarra, baz iina baz kaiya kǝm ɓa tlǝr mbakyarvad kuurama. Kyalma zaraabahamiiyami kwar ǝmtaɗ dǝ iina, ɓǝlatǝrǝt nǝ dlamakǝlaaa lii gata Yesu, tlǝraatǝra fǝgara ba galaa Tlǝkatǝga.
    24: Maramtǝrdamarǝg kǝ uudaha kǝ hulfa waiyakǝvǝn ɓagamtǝra nǝ uuramana. Ar da cinngacinng nǝ dlamakǝlaaa lii gata Yesu kwa ɓǝlatǝrǝrɓǝlǝg kǝ dǝgiti ɓagamtǝra nǝ uurama, kwan wa da martǝrdamarǝg taakiya tsa kushǝghamnd dǝ kuurama mbats bak jiirjiira.
  9:
    1: Maay nǝ tlǝra viindkur wakit kǝskai tǝghǝr kǝ mǝltǝru kǝ yaa dadda gatǝg biya.
    2: Aɗaba ǝn sǝrgasǝrǝg nai am naagan kǝ mǝlgaru kǝ uuda, baz tsa kushǝgh kǝskai vak kǝ uudaha makidoniya tǝghǝr kwana. Ən tagtǝrtag taakiya kǝ uuram uudaha Akaya ɓadlǝvaɓadlǝg bamma viigǝn kwa dalna. Hulfa fa ndzǝɗǝn maramnda nǝ uurama iin wa fatǝrafǝg kǝ ghǝravatlǝr kǝ fa ndzǝɗa.
    3: Ndakwan ciya, wan ɓǝlgan kǝ uudahaan zaraabaharra, aɗaba haik kǝ nǝg nǝ tsa kushǝghamǝnd dǝ kuuram kǝ dǝga bandza. Ən naagan an ndzan ba ɓadlaɓadlana, band kwa tagankur nai wurra taaki am ndzana.
    4: Mbakyarvad kwaha akwama da sarǝvsǝg ǝmtaɗ dǝ kyalma lii gatǝga kwar ma Makidoniya, ǝn naay ar tlǝkuuran ba kwal dzahgant dǝgit biya. Akwama dzǝghardzǝg ǝndkwana, ǝm da ciinga zhǝruwa mbakyarvad dyakǝra tsa kushǝghǝn ǝn tsǝg nai dǝ kuurama, ba kai pal bi wam da tsǝgwi nǝ uuram kǝ zhǝru biya, baz kǝ uurama.
    5: Mbakyarvad kwaha, maa ɓagaɓag kǝ maraw ǝn ghalu kǝ Zaraabahǝn mara sǝv saa vakaru lakwti ǝn da dagau naiya, mbakyarvad mara dzahant kǝ dǝgitahaan tama nǝ uuram kǝ langyi vǝlgaana, aɗaba ma tlǝvaran dzahadzahana. Kwan wa da mardamarǝg taakiya vǝlamnda bad naaga ghǝraruwa, faakuura dǝ ndzǝɗ nǝ uud biya.
    6: Dzamam-nadzamǝga, daddakwa riiga hulf ǝnkyǝkwaha, da tlǝkǝna ba ǝnkykwah kǝ dǝgita ma guuha, kiyava daddakwa riiga hulf ba dyǝkka, da tlǝkǝnatlǝg kǝ dǝgit ma guuh ba dyǝkka.
    7: Ma bawara aa vǝldavǝlǝg band kwa haigant nǝ iina, dǝ badzǝga ǝrvǝdmahuɗ biya dǝ barari biya, aɗaba naa daddakwa vǝlda bad huɗ pal nǝ Daadamazhigǝla.
    8: Da vǝlkurvǝlǝg nǝ Daadamazhigǝl kǝ bark ba kwa juujig kǝ dǝgiti am naag nǝ uurama, aɗaba aandzu ba hǝra am tlǝkǝna kǝ dǝgiti am naad nǝ uuram baɗǝmma, baz kwa juujig kwaha, kiyava ɓa dǝga herǝrr kǝskuurama.
    9: Bandkwa viindaviindan ma kakaɗa Daadamazhigǝl taakiya, “Vǝltǝrvǝlǝg kǝ dǝgit kǝ talagaha. Jirjiira aandz ba tangw damma Zǝrazǝra.”
    10: Ba Daadamazhigǝl wa vǝlga hulfa riig kǝ dadda riiga, vǝlar dlab kǝ dǝg zǝga. Mbakyarvad kwaha da vǝlkurvǝlǝg nǝ Daadamazhigǝl kǝ hulfa riiga, iin dlaɓ wa da fǝgara hulf kǝ ghubarga. Tǝdvad kwah wa da fǝgara nǝ iin kǝ bark tǝghǝr kǝ dǝgiti amaa vǝlda nǝ uurama dǝ haiga ghǝra kiyav ɓa dǝga herǝrra.
    11: Aandzu ba hǝrra da fǝkurafǝg kǝ bark ma dǝgiti am da ɓag nǝ uuram kiyava vǝlgan kǝskurama dǝ haiga ghǝra ba kǝlahǝnga. Ar da tagar ǝndkwah nǝ uudah ba dyǝk kǝ uus kǝ Daadamazhigǝl mbakyarvad gyagyaan kwam da vǝltǝr nǝ uuram tǝdvad kǝmnda.
    12: Aɗaba tlǝra herǝrrǝn am ɓag nǝ uuram kiyava pǝlla puuta yaa dadda gatǝg kalti biya, gwiiya ba fǝgaraa tagar uus badyak dyak kǝ Daadamazhigǝla.
    13: Mbakyarvad tlǝrahi kwam ɓag nǝ uurama, ar da galgan nǝ uudah ba dyǝka kǝ Daadamazhigǝl mbakyarvad fǝgarafǝgaruwa kwa gwiiya tǝhala kwa caawamanuuram kǝ ǝlbǝg marawa Tlǝkatǝga, dlaɓa mbakyarvad kwa mǝlamtǝru nǝ uuram kǝ iitǝra ard kyalma uudaha baɗǝmma.
    14: Ar da dzǝkurdzug nǝ iitǝr kǝ zhǝgǝla, dlaɓa ar da dzamkurdzamǝmǝg ma ǝrvǝdmahuɗaatǝr mbakyarvad herǝrr kwa juujig kǝ taga kwa ɓagakura nǝ Daadamazhigǝla.
    15: Tagiiyamartag kǝ uus kǝ Daadamazhigǝl mbakyarvad gyagyanǝn vǝla kiiyam nǝ iin, gyagyan kwa juujig kǝ taga.
  10:
    1: Ba kai Bulus dǝ ghǝrara, ǝn ghalakurama, kwa ɗaakwa nǝ uud, “Daddakwa dǝ hǝnkala” akwaman ǝmtaɗ dǝ kuurama, akwama ǝn maay ǝmtaɗ dǝ kuuram biya “Ən daddakwa mbǝgar kǝ uuda” ma barka kalaliya ard hǝnkala Tlǝkatǝga,
    2: Ən ghalakuurama, famwabi ǝn mbukurǝs akwama da danǝvdǝg da vakaru biya, aɗaba ǝn sǝrgasǝrǝg ǝn da mbǝtǝrasmbǝg kǝ lii taaki dǝgiti kǝm ɓag nǝmnda, ba dǝga duniya.
    3: Aandzu ba kǝm ɓa ndzǝgan ma duniya, ghwavi kǝm ɓag nǝmnda dǝga duni biya.
    4: Aɗaba kadlanga ghwavamnda dǝga duniya biya, dǝga ndzǝɗa Daadamazhigǝla. Kǝm dlag tǝdvad iitǝr nǝmnd kǝ vakavakahi dǝ ndzǝɗa kwa ndzamǝg nǝ tlǝghumaha kǝ dǝga fiidfiida.
    5: Kǝm zaafir tǝghǝr kǝ lii ɓala gajauwa, kǝm dlagan aandzu kwar kǝ dǝgiti da tsǝgarva sǝrga Daadamazhigǝla, kǝm gwiidan dlaɓ aandzu hulfa kwar kǝ dzamaghǝr da tǝ ɓa kwatǝnahǝra ard fǝgara kǝ Tlǝkatǝga.
    6: Ɓadlamvaɓadlǝg nǝmnd kǝm vǝla kǝ kiiɓa ndaig kǝ daddakwa lawalǝg kǝ fǝgaara kǝ Tlǝkatǝga, akwama ba am fǝgarafǝga.
    7: Zharamzharǝg kǝ dǝgit bat ɓalaɓala! akwama tagaatag nǝ uudan taaki dǝga tlǝkatǝg nǝ iina, aa gwiiya dzamǝg nǝ uudanǝn kǝ ghǝra, da nǝghǝgakanǝghǝg nǝ iin taakiya ba kǝmnd ndakwani kǝm dǝga tlǝkatǝga.
    8: Aaandzu ba mana tsa kushǝgh dǝ ndzǝɗǝn kwa vǝlakǝmnd nǝ Yaazhǝgǝl kiyava fǝkura ndzǝɗa, kwakyarvad gulkura nǝ uud biya, ǝn da dǝgǝmbi dama zhǝru mbakyarvad tlǝrar biya.
    9: Tlatlambi taaki ǝn na vǝlkur tlatlau nai ma wakiitahar biya.
    10: Aɗaba tagav taakiya, “Wakiitaha Bulusa ba dladlaɗana ard ndzǝɗa, akwama ba iin dǝ ghǝran wa vakamiiyama, maay nǝ iin taaghai dǝ ndzǝɗ biya, dlaɓa ǝlbǝgahaana tlalbi kǝ dǝgiti biya.”
    11: Barari hulfa kwan kǝ uudaha ar sǝran taakiya maay nǝ gǝrgǝr ma taataka dǝgiti viindamnda nǝmnd ma wakiitamnda akwama kǝm maay vakwani, ar dǝ dǝgiti kǝm da ɓag nǝmnd akwama kǝm ǝmtaɗ dǝ kuurama.
    12: Kǝm war nǝmndi! tlamdalbi nǝmnd kǝ gǝra ghǝramnd dǝ uudahi kwa ma zharg nǝ iitǝra jarujig aandzu ma bawara. Kwan kǝ uudaha ar kura ghǝraatǝr dǝ zaraabahatǝra, ar na sǝraakan kǝ gǝrgǝr mataatakatǝra, ar dlagaha nIitǝra!
    13: Kǝm maay tsa kushǝgh kwa juujig kǝ ndzǝɗ biya, bamma kǝm ghachan bat ghala dǝgiti aa ghutǝkǝmnda nǝ Daadamazhigǝla, kwa ndzakiiyamǝt baz kuurama.
    14: Abi baz kuuram ndakwani am ba ma ghaali kwa ghudgwi nǝ Daadamazhigǝla, mbakyarvad kwaha dzǝvanai kǝ ghala guh kwakyarvad na dǝgal da vakaru da taa ǝlbǝg marawa Tlǝkatǝg biya.
    15: Tsa kushǝghamnda juubi kwa nahav biya, tapghantbi dlaɓ kǝ tlǝra kyalmah biya. Aɗaba kǝm dǝ fantar taakiya fadghǝraruwa da fǝgara bad fǝga, tǝdvad kwah nǝ vaka ɓa tlǝramnd ma kǝ uurama fǝgara bad fǝg ba vaivaiya,
    16: Kǝm da taagan kǝ ǝlbǝg maraw ma kwatlǝrn kǝ kǝsah kwa tǝvuukwaruwa, ba kwal gata daag vaka ɓa tlǝri ɓaga nǝ uudan tǝ vakavaki favan nǝ iin biya.
    17: Bandkwa viindaviindan ma kakaɗa Daadamazhigǝl taakiya, “Baɗǝm nǝ daddakwa tsa kushǝgha, aa tsatsǝg kǝ kushǝgh dǝ Yaazhǝgǝla.”
    18: Daddakwa dlǝba ghǝran bi wa haivanthaig dǝ iin biya, bamma daddakwa dlǝbgant nǝ Yaazhǝgǝla.
  11:
    1: Am da fa ba ǝrvǝdmahuɗ dǝ kaiya, aandzu ba mǝng zǝr dlaghǝr vakara. Famafǝg kǝ ǝrvidmahuɗ dǝ kaiya!
    2: Ən sǝlga mbakyarvad kuurama, dǝ hulfa sǝlga waiyakǝva kwa ɓag nǝ Daadamzhǝgǝl tǝghǝr kǝskuurama. Am band ghuul cacuwanacacuwan kwa tavara langyi kǝsgan kǝ zhiila ba pal ba nǝ iina, iin Tlǝkatǝga.
    3: Ən gǝdzǝg naiya aa nalbi band kwa dzǝghaar dǝ Hauwa, da dzaar dǝ kuuram biya. Valadavalǝg nǝ ghavala bad dyǝmdyǝmǝraana ɓagaɓag kǝ haipa. Am band kwah nǝ uurama, nǝgalnǝg nǝ dzamaghǝraru kǝ dǝga jiirǝr biya, tǝdvad kwaha, am vǝldabi kǝ ghǝraru bak jiirjiir kǝ Tlǝkatǝg biya.
    4: Aɗaba am haigant ba wats dǝ lii sǝgǝv da vakaruwa. Haiyamanthaig dǝ ǝlbǝgahi ar tagkur nǝ iitǝr tǝghǝr kǝ Yesu, aandzu ba shah dǝ kwa tsagamndkuuru nǝmnda kǝ ǝlbǝg marawana. Haiyamanthaig dlaɓ dǝ hulfa shǝdkwi tagarkur nǝ iitǝra, bakǝvakwaha kwan kǝ shǝdkwa shiɗkwa cacuwanacacuwan bi wa caawama nǝ uur biya. Haiyamanthaig dlaɓ dǝ hulfa ǝlbǝg marawatǝra, aandzu ba shah dǝ kwa caawama nǝ uuram vakamnda.
    5: Manzharg naiya jarkwarabi nǝ lii am tagtǝr nǝ uuram taaki “Ar dlakulva gyiyah Yesu” dǝ dǝgit biya.
    6: Aandzu ba tsaghwad bi nǝ uud kǝ taaghai biya, bakǝvakwah ǝn sǝrgasǝrǝg kǝ dǝgita. Maramndkurdamarg nǝmd kwan aandzu tǝ kwar kǝ ɗuula.
    7: Tagankuratag nai kǝ ǝlbǝg marawa Daadamazhigǝl ba gyagyana. Nanenanenǝg nai kǝ ghǝrarra, kiyava fǝkuraaran nǝ uuda. Baganaɓag kǝ haip ciya?
    8: Nalnǝg mandki na pǝrɗigu kwaɓ vak kyalma dlamakǝlaaa lii gatǝga kwakyarvad ǝn ɓakura kǝ tlǝra.
    9: Ma sartǝn ndzan ba ǝmtaɗ dǝ kuurama, nahanahǝg nai kǝ kwaɓa, bakǝvakwaha ndavankur biya, aɗaba sarwadǝvsǝg nǝ zaraabahamiyam kwa sarǝv ma Makidunkiya kǝ dǝgiti ǝn naag nai baɗǝmma. Fankuraabi nai ma sartakwahiin biya, dlaɓa ǝn da zaa ba vuukw bandkwana.
    10: Kwakarvad jiira Tlǝkatǝga kwa ma kaiya, maay wa tsǝkwavatsǝg baɗǝm ma haaya Akaya kǝ taaki ɗuuwarɗug kǝ tsa kushǝgh biya.
    11: Aujibǝg kǝskai ǝn taa kwani? Mbakyarvad ǝn maay waiyakurami ciya? Sǝrgasǝrg nǝ Daadamazhigǝl taaaki ǝn waikurwaiga.
    12: Ən zaa ba vuuk nai dǝ ɗuuwa kwaɓi kwam da mǝlgwad nǝ uurama, mbakyarvad ǝn tsǝtǝrva kǝ “Dlakulvaha gyiyi Yesu kwa dyǝkdyǝkǝn” kǝ ɗuula tsa kushǝgh taakiya, ar ɓa tlǝr ba kalkal dǝ kǝmnda.
    13: Hulfa kwan kǝ uudaha ar dlakulva gyiya Yesu aa jiirjiir biya, lii ɓa tlǝra fiida. Ar na ghǝraatǝr band dlakulva gyiya Tlǝkatǝga.
    14: Dǝga jappǝr biya, aɗaba shatanah dǝ ghǝraan ndakwani naa ghǝraan band zǝrɓǝlǝg paraka.
    15: Mbakyarvad kwaha, dǝga jappǝr bi akwama nardalnǝg nǝ lii ɓagar tlǝr kǝ Shtanah kǝ ghǝraatǝr band lii ɓa tlǝra jiirjiira. Tǝhala ghyǝnnga duniya ar da cauwa dǝgshǝgatǝr ba kalkal dǝ tlǝraatǝra.
    16: Ən gwiiya ba tagan naiya, aa tlatl bi nǝ uudan taakiya ǝn dlag biya. Akwmam tlatlǝgan band kwaha, aciya, haiyamanthaig dǝ kai band dadda dlaga, aɗaba kai ndakwani ǝn tlǝkǝna kǝda tsa kusǝgha.
    17: Hulfa tsakushǝghǝn ǝn tsǝg naiyna, kwakyarvad tagaa nǝ Yaazhigǝl ǝndkwah biya. Aˈa, ma kwanǝn kǝ ǝlbǝga ǝn tsakushǝgh band dlaaga.
    18: Aɗaba mǝng nǝ lii tsakushǝgh band kwa ɓag nǝ uudaha duniya, ba kai ndakwani ǝn ɓagan band kwaha.
    19: Am ba dyǝmdyǝm nǝ uuram ba vaivaiya, baz hwaɗag kǝskuurama am ɓǝsha dǝgiti ɓagkur nǝ dlaagaha!
    20: Aɗaba ma fakuraafǝg nǝ uud kǝ ɓa kwatǝnahǝra, am ba ɓǝshǝgana, aandzu pǝrkurva dǝga ruuwa, ma markura ndzǝɗa, ma ɓalkura mahǝpǝngw ma hudvǝga.
    21: Ən cinnga zhǝruw nai kǝ taaki mbakyarvad maira ndzǝɗamnd wa ɓagamnda bi kǝ kwanahaan kǝ dǝgitah biya! Akwama mǝng nǝ daddakwa fa ndzǝɗa tsa kushǝgh dǝ dǝgiti tlǝrna, ba kai ndakwana ǝn fǝgaan kǝ ndzǝɗ bandkwaha. Ən tag band dlag naiy kǝ ghaiya vakwana!
    22: Akwamaa Ibraniyah nǝ iitǝra, kai ndakwani bandkwaha. Akwamar kuɗǝga Ibrahim nǝ iitǝra, ba kai ndalwani bandkwaha. Akwamar Isra ilah nǝ iitǝra, ba kai ndakwani bandkwaha.
    23: Akwama ar lii ɓatlǝra Tlǝkatǝg nǝ iitǝra, jantǝrarajig naiya! ǝn taa ghaiya mandki nanalnǝg kǝ valaaga! abi jantǝrarajig naiy dǝ tlǝr ba vaivaiya, danaghadǝg damma guda bǝrfina, huɓanuhuɓǝg kǝ tsǝgga ba dyǝkdyǝka, shǝg badyǝk kǝskai kǝ ngǝdlǝga tǝ duula ǝmtsǝga.
    24: Shǝg dlǝɓa kǝ Yahudah kalkwakalǝg dǝ kiiɓ kulhǝkǝrd taar vaslambada.
    25: Shǝg hǝkǝrd kalkwakalǝg nǝ Rumaha dǝ kiiɓa. Tapavnatapǝg dlaɓ ɗawalkwaɗawalǝg nǝ uud da akura shǝg palla. Shǝg hǝkǝrd kǝ pǝrayuwa caaɓǝg ǝn bama vakaiya. Tapannatapǝg dlaɓ kǝ hǝnnga baz vanng bama dǝlva, lakwti sǝkwadasǝg nǝ uuda.
    26: Ma dahadagali ɓagan naiya fǝrtanafǝrtǝg kǝmtsǝg ma zaagha, dlaɓa fǝrtanatǝrtǝg kǝmtsǝg ma dǝva gwarɗaaha. Fǝrtanafǝrtǝg kǝmtsǝg ma dǝva zaraabahar Yahudaha, dlaɓa fǝrtanafǝrtǝg ma dǝva lii kwar yahudah biya. Fǝrtanafǝrtǝg kǝmtsǝg ma kǝssah dyǝka, fǝrtanafǝrtǝg kǝmtsǝg ma tǝghala, fǝrtanafǝrtǝg kǝmtsǝg ma dǝlva, fǝrtanafǝrtǝg dlaɓ kǝmtsǝg ma dǝva zaraabah fiidfiida.
    27: Ɓaganaɓag kǝ tlǝra, tlakwatlǝg dlaɗa, hǝnnanubi kǝ haar maraw biya, ɓǝshanuɓǝshǝg kǝ waiya ard andǝla. Shǝg ba dyǝkka ǝn tlǝkǝnabi kǝ kaff biya, tlakwatlǝg nǝ akwǝhya, pǝlghwavapǝlǝg nǝ sǝdav ǝn da fǝg nai biya.
    28: Maay ba nǝ kyalma dǝgitahi shah shah biya, ba kǝlahǝnnga ǝn kǝsa dlaɗa faahyǝmi tǝ yaa daddaha gatǝg baɗǝmma.
    29: Akwama mǝng nǝ daddakwa hǝtsalhǝtsǝga, mandki kai wa hǝtsǝgalhǝtsǝga, akwama mǝng nǝ daddakwa dǝgǝm damma haipa, fǝgwafǝg kǝ badza ǝrvǝdmahuɗ ba vaivaiya.
    30: Akwama nalnǝg ba jiirjir kǝskai tsakushǝgha, ǝn tsakushǝgh dǝ dǝgitahi kwa mara hǝtsǝgalhǝtsǝgara.
    31: Sǝrgasǝrǝg nǝ Daadamazhigǝl taaki fiidbi wan tag naiya, kwa iin Daadamazhigǝla, dlaɓa Daada Yaazhǝgǝl Yesu Tlǝkatǝga. Aa ndzandzǝg bark tǝghǝr kǝ iina ba tangw damma zǝrazǝra!
    32: Ma sarta kwa ndzan ma Dimashku naiya, faafǝg nǝ gwammna kwa miizhangil kǝ tlǝkǝsa Aretas kǝ uuda tuuk kǝ ghaiya guda kǝs dyǝkka Dimashku kiyava viiya kaiya.
    33: Sarkwada nǝ tsaghwahar ma alghwa tǝ ghǝra dǝlga kǝssiina, ngǝdlanarva ǝndkwaha.
  12:
    1: Aandzu ba da maay nǝ tlǝran biya, barari kǝskai tsakushǝgha. Bandkwannǝn, ǝn zaavuuk dǝ taa taa ǝlbǝgah tǝghǝr kǝ dǝgitahi marghwada nǝ Yaazhǝgǝl Yesu Tlǝkatǝg ma sǝnnga ard ba ghwǝm dǝ gyiya.
    2: Ən sǝrgasǝrg kǝ uuda nǝ iina kwa viigan kǝlawatar uufad hiinanna, kǝsavantkǝsǝg dagat damma ghǝrazhigǝla dǝga hǝkǝrɗa tǝdvad ndzǝɗa Tlǝkatǝga, mbatak ma ndzǝgana vǝgha, mbatak ma ndzǝgana vǝgh biya, ǝn sǝrga biya, sǝrga ba nǝ Daadamazhigǝl palla.
    3: Ən ba sǝrgasǝrǝg dlaɓ kǝ uuda nǝ iina, kwa kǝsavantkǝsǝg dagat damma ghǝrazhigǝla dǝga hǝkǝrɗna, mbatak ba maa ndzǝgana vǝgh nǝ iina, mbatak ma ndzǝgana vǝgh biya, ǝn sǝrga biya, sǝrga ba nǝ Daadamazhigǝl palla.
    4: Cinnghacinng kǝ kyalma dǝgitahi vakwah kwa da tagǝvda biya, hulfa kwa tagdabi nǝ uuda dǝgshǝg kǝ ǝlbǝg tǝghǝr biya.
    5: Ən tsǝgan nai kǝ kushǝgh dǝ uudana, ǝn tsǝgabi kǝ kushǝgh dǝ ghǝrar biya, bamma tǝghǝr kǝ dǝgitahi kwa mara hǝtsǝgalhǝtsǝgara.
    6: Akwaman naagan kǝ tsakushǝgha, ǝn nǝgalbi kǝ dlaagi, aɗaba ǝn da taa ba jiira. Ən maay da tsakushǝgh biya, mbakyarvad aa dzambi nǝ uudan mandki ǝn shah dǝ kwa sǝrkwa nǝ iin biya, ard kwa cinngha nǝ iin vakara.
    7: Aɗaba haik tsakushǝgh kǝskai dǝ kwanahaan dǝ sǝnnga kwa juujig kǝ dǝga jappǝra, ngal ba ɓǝlgusɓǝlǝg nǝ uud kǝ kuzza kwa nal kǝ tak ma vǝghara. Nalnǝg wan kǝ zǝrɓǝlga shatanah kiyava vǝlgwa dlaɗ tsǝkwavan dlaɓ kǝ tǝɗa fǝɗavgha.
    8: Shǝg hǝkǝrd kǝskai ǝn ba ghaala Yaazhǝgǝl mana tagwzha dǝ kwan kǝ dǝgita,
    9: Aiyama kǝskaiya, “Tlakaratlǝg nǝ herǝrra, aɗaba tǝdvad hǝtsǝgalhǝtsǝgah wa da nǝghǝvanǝghǝg nǝ ndzǝɗaara.” Mbakyarvad kwaha ǝn da fǝgara bad hwaɗag nai kǝ tsakushǝgha hǝtsǝgalhǝtsǝgar kiyava ndzǝg nǝ ndzǝɗa Tlǝkatǝg ǝmtaɗ dǝ kaiya.
    10: Mbakyarvad kwaha nǝghǝghanakanǝghǝg dǝ hǝtsǝgalhǝtsǝgara, ard zaa hǝtǝr ma vǝga kwa ɓaghwi nǝ uuda, ard huɓa dlaɗa, ard mbahǝlla, ard dǝgitahi dzaghardzag mbakyarvad Tlǝkatǝga. Aɗaba akwma hǝtsanalhǝtsǝga, ǝn da tlǝkǝna ma sartakwah nai kǝ ndzǝɗa.
    11: Ɓaganaɓag kǝ dlagǝra, famwaba nǝ uurama. Ma kuuram wa kalkalan kǝ dlǝba kaiya. Aandzu ba tlanal ndau biya, nal bi taaki “mallaha dlakulva gyiya Yesu ruwa” jarkwaraa biya.
    12: Ɓagaɓag nǝ Daadamazhigǝl kǝ dǝga sǝrga ard tlǝraha jappǝr tǝdvad kai makuurama, kwa ɓagana nai kǝ tlǝrar dǝ fa ǝrvǝdmahuɗa. Kwanahan kǝ dǝgaha jappǝra maradamarǝg taakiya ǝn dlakulva gyiya Yesu ba jiijira.
    13: Ta kwar kǝ ɗuul wa marandanai taakiya namalbi kalkal dǝ kyalma dlamakǝlaaa lii gatǝg biyi? Nii mbakyarvad tsankǝrvatsǝg kǝ mǝlgwad dǝ kwaɓhi? Ɓǝshamwanaɓǝshǝg ci kwan kǝ haipa!
    14: Ɓadlamvaɓadlǝg kǝ dǝga hǝkǝrd da nǝghakuuram ndakwana. Ən fǝkuraabi kǝ ɓa dǝgit biya, aɗaba kuuram wan naag naiya, kwaɓaruu biya. Aɗaba kalkalnabi ƙǝ zarh kǝ dlaɗa ɓa dǝgit kǝ Daddaatǝrta ard Babbaatǝr biya, bamma Daddaatǝra ard Babbaatǝr wa kǝsa dlaɗa zarhahatǝra.
    15: Ən cǝnngan ǝmtakǝr akwama tsanatsǝg kǝ dǝgit vakar baɗǝmma, baz ghǝrarra kwakyarvad ǝn mǝlkuruwa. Akwamma ǝn zaa ba vuukw dǝ waiya kǝ uurama, mbats am da gulgan kǝ waiyakǝvaru mbakyarvad kaiya?
    16: Am da haiganthaig dǝ kai taakiya nanaibi naiy kǝ dǝgit kǝskuuram biya. Aɗaba mǝng wa da tagan taaki na markura dyǝmdyǝmǝra, na patkuru bad fiida.
    17: Zankuruzǝg nai tǝdvad kwatlǝr kǝ uud ma lii ɓǝlantǝr nai da vaakaruwa?
    18: Ghalanghalǝg kǝ Titus ma dǝvakaruwa, ɓǝlanantɓǝlǝg kǝ zǝraab kwa dadda gatǝg ǝmtaɗ dǝ iina. Am tagan taakiya zakuruzǝg nǝ Titusa? Mbats kaiya ard iina ba dǝgit pall nǝmnd biya? Dlaɓa kǝm taa ba ɗuul pal biya?
    19: Mbats tlatlam ba wur nǝ uuranm taakiya kǝm ɓa kǝla ndzǝɗamnd kǝ ngǝdla ghǝramnd vakaruwa. Ba Daadamazhigǝl nǝ shiidamnda, kǝm taa ba jiijir ma Tlǝkatǝga. Aandzu kǝm ɓa bau nǝmnda, kuuramǝn ǝn waikur naiya, ɓagamnd kwakyarvad am tlǝkǝna kǝ ndzǝɗa.
    20: Ən gǝdzǝga, mbatak sarti ǝn da sagau naiya, ǝn tlǝkuuran band kwan naag nai biya, dlaɓa am tlǝkwa nǝ uuram band kwam naag nǝ uuram biya. Ən gǝdza aa tlanarai kǝ ushava, ard sǝlga, ghwaɗa hǝnkala, ard naa ghǝra ard badza ɗaaga, ard amaaha, ard dǝkdǝka ghǝra, ard ciya hǝnkala.
    21: Ən gǝdza taakiya akwama da gwiiyanagwiig da vakaruwa, da fǝgwafǝg nǝ Daadamazhǝgǝlar kǝ cinnga zhǝruwa tǝ vuukwaruwa. Ən gǝdza haik badza ǝrvǝdmahuɗ kǝskai mbakyarvad uudah ba dyǝkka kwa ndzar ɓa ba haip wura, lii pǝlarabi kǝ ghǝr vaka ɓa gwaragwar biya, ard ɓa fǝdǝra ard gata duula cǝnga ǝmtakǝra dǝga tsa zhǝruwa.
  13:
    1: Dǝga hǝkǝrd nǝ wan kǝskai ǝn ba sagau da nǝghkuranǝghǝga. “Ba jiijira da sǝrvaka tǝ shidah buwa ma hǝkǝrd nǝ jiira ǝlbǝga” band kwa viindava ma kakaɗa Daadamazhigǝla.
    2: Dagawar da vakaru kǝ dǝga buwa, ɓǝlanaɓǝlǝg kǝ magiya kǝ lii ɓagara haipa ard kyalma uudah baɗǝmma mara duuwars kǝ ɓa haipa. Aandzu ban maay ǝmtaɗ dǝ kuuram biya, ǝn gwiiya gwaigarsgwaig kǝ hulfa kiiɓa ndaigǝn tagankur nai na, aɗaba akwama gwiiyanagwiig da vakaruwa maay nǝ daddakwa da ngǝdlǝgarwangǝdlǝg kǝ kiiɓa ndaig biya.
    3: Akwama ba am na sǝran kǝ jiira taakiya taaghai nǝ Tlǝkatǝg tǝdvad kaiya, wayam ci nǝ jiirana, hǝtsalbi nǝ tlǝkatǝg ma kuuram biya, dlakulvakwaha mara ndzǝɗan ma kuurama.
    4: Aandzu ba hǝrtavǝthǝrtǝg nǝ Yesu tǝdvad mara ndzǝɗa, bakǝvakwaha dǝ shifǝg nǝ iin tǝdvad ndzǝɗa Daadamazhigǝla. Aandzu ba kiyam maira ndzǝɗ nǝ miiyam ma Yesu, bakǝvakwaha kiyam dǝ shifǝg ma Yesu tǝdvad ndzǝɗa Daadamazhigǝla mbakyarvad tlǝrǝn ɓagamnd nǝmnd ma kuurama.
    5: Sǝramakasǝrǝg ndan kǝ ghǝraruwa mbakyarvad am sǝrakan taakiya am gatǝgaan kǝ Yesu bak jiijiira. Sǝramakasǝrǝg kǝ kǝ ndzǝgana ruuwa. Mbats am sǝrgai taakiya Tlǝkatǝg ba ma kuuram biya? Akwama am sǝrgabiya, nalnǝg mbǝɗamambǝdǝg tǝ duula fǝshiga.
    6: Mantlǝg naiya am da sǝrgaakasǝrǝg taakiya hǝtsamndalbi nǝmnd biya.
    7: Kǝm dzǝgwazhǝgǝl kǝ Daadamazhigǝl taakiya ɓagam bi kǝ dǝgiti kwa kalkal biya. Kwayarvad kǝm ɓa dabariya nǝdal ghǝramnd mandki kǝmnd wa zamndu fiir biya, mbakyarvad am ɓagan nǝ uuram kǝ dǝgiti kalkala, aandzu ar ba da tlatlǝgan nǝ uudah taaki mandki hǝtsamdalhǝtsǝga.
    8: Aɗaba kǝm naiy kǝ dǝgiti maay nǝ jiir mavakai biya, kǝm naa ba dǝga jiira.
    9: Kǝm hwaɗag nǝmnda akwama hǝtsamndalhǝtsǝga, aɗaba am tlǝkǝna nǝ uuram kǝ ndzǝɗa. Ɗlaɓa kǝm dzǝgwazhǝgǝl am nal ba kǝ uudah jiirjiira.
    10: Iin wa viindankura nai kǝ kwana aandzu ban maay ǝmtaɗ dǝ kǝ uuram biya, aɗaba akwama sanǝvsǝga, aa da nal bi kǝ barari kǝskai ǝn da vǝlkur kǝ dlaɗ dǝ mara ndzǝɗǝn kwa vǝlghwa nǝ Yaazhǝgǝla, ndzǝɗa fǝgaraadǝfǝga, dǝga badzǝg dǝ badzǝg biya.
    11: Dǝga mbasuumbas ci zaraabahara, da ba daghuvalitlǝrn. Ɓagamɓag kǝ kǝla ndzǝɗaaru am nal kǝ uudah jiirjiira, cǝngamcǝng kǝ ghalgara, haiyamanthaig dǝ zaraabaharuwa am ndzan ba lapiya. Tǝdvad kwah wa da ndzǝg nǝ Daadamazhigǝl kwa waiyuuda ard gabǝrra ǝmtaɗ dǝ kǝ uurama.
    12: Tagamartag kǝ uus kǝ zaraabaharuwa dǝ taa uus bǝrhuga kwa caccuwanacaccuwana.
    13: Ar tagkur uus nǝ yaa daddaha gatǝg baɗǝmma.
    14: Aa ndzandzǝg nǝ herǝrra Yaazhǝgǝlamiiyam Yesu Tlǝkatǝga, ard waiyakǝva Daadamazhigǝla, ard ndzǝgan shǝdkwa caccuwanacaccuwana ǝmtaɗ dǝ kuuram baɗǝmma. Amin.
48:
  1:
    1: Bulus zǝrɓǝlǝg Yesu. Ɗahakwant nǝ uudah ma sǝv vak kǝ uud biya. Ɗahakwant nǝ Yesu Kristi ard Daadamazhigǝl Daada kwa ciighant Yesu ma gǝtlaha.
    2: Baɗǝm nǝ zaraabah kwar ǝmtaɗ dǝ kai vakwana, ghǝravatǝr ndakwani ar taa uus kǝ dlamakǝlaaa lii gatǝg baɗǝm kwar ma Galatiya.
    3: Aa dzadzǝg nǝ herǝrra ard gabǝra Daadamazhigǝl Daadamiyama ard Yaazhigǝl Yesu Kristi da tǝghǝr kǝskuurama.
    4: Vǝladavǝlǝg nǝ Yesu Kristi kǝ shifǝgan mbakyarvad haipahamiyma, kiyava katkiyamkatǝg makwan kǝ zamana kǝladǝra. Kwana kwakyarvad naaga Daadamazhigǝl Daadamiyama.
    5: Ndanghǝr kǝ Daadamazhigǝl ba tangw damma zǝrazǝra. Amin.
    6: Vǝlghwavǝlǝg nǝ dǝgiti am ɓag nǝ uuram kǝ dǝga jappǝr ba vaivaiya. Bamma sart hǝɗiikǝn am naa ɗuwa daddakwa ɗahakurǝt tǝdvad herǝrra Kristi, am gwiya damma kwatlǝrn kǝ daala ǝlbǝg shah dǝ ǝlbǝg maraw kwa samndkurdǝv nǝmnda.
    7: Maay nǝ watlǝrn kǝ ǝlbǝg maraw shah biya. Aɗaba mǝng kyalma uudaha ar na ciikurant hǝnkalaruwa, dlaɓa ar ɓa dabariya gwiya jiira ǝlbǝg marawa Kristi.
    8: Ən tagkurtag ciya, akwama sakurdǝvsǝg nǝ uudan kǝ ǝlbǝg shah dǝ ǝlbǝg maraw kwa samndkurdǝv nǝmnda, aandzu zǝrbǝlǝg sii ma ghǝrazhigǝla, aandzu ma kǝmnda, tlafatlafan vak Daadamazhigǝla!
    9: Bandkwa tagamndkur nǝmnd ba wurwura, ǝn gwiya tagkurtag bakǝvakwana taakiya, baɗǝm nǝ daddakwa tagkura ǝlbǝg maraw shah dǝ ǝlbǝg maraw kwa cawama nǝ uuram vakamnda, tlafatlafana!
    10: Magha tag nǝng ǝn ɓa dabariya fǝtǝra uudah mara haiyant dǝ kaiya? ǝndkwah biya. dǝgiti ǝn naag naiya, aa haiyanthaig nǝ Daadamazhigǝl dǝ dǝgiti ǝn ɓag naiya. Mam tlǝg nǝ uuram ǝn ɓa dabariya ɓa dǝgiti naag nǝ uudah naiya? ǝndkwah biya. Akwama manaa ɓa dǝgiti naag nǝ uudah naiya, ma nanal bi kǝ kwatǝnah Kristi biya.
    11: Ən naagan am sǝran zaraabahar taakiya, ǝlbǝg marawǝn ǝn tag nai kǝ ǝlbǝg tǝghǝrna, sal vak uud nǝ iin biya.
    12: Caawana vak uud bi naiy biya. dlaɓa maay wa tsaghwad tsag biya. Caawana vak Yesu Kristi tǝdvad mara ghǝran vakara.
    13: Cinngamacinng kǝ hulfa ndzǝgani ɓagan nai wur ma gatǝga Yahudaha, ard ɗuuli vǝlantǝr nai kǝ dlad kǝ dlamakǝlaaa lii gata Daadamazhigǝl ba vaivaiya, ɓaganaɓag kǝ kǝla ndzǝɗar mana ghǝhnan na.
    14: Am sǝrgasǝrǝg dlaɓ taakiya januujǝg kǝ kyalǝm uudah ma gatǝga Yahudah kwa ghubaramnd nǝmnd ǝmtaɗ dǝ iitǝra. Jantǝruujǝg dǝ naa dǝga daadijahamnd ba vaivaiya.
    15: Daadamazhigǝl kwa fakwi mahuɗa baabara, kǝsakutkǝsǝga dlaɓa ɗahakutɗahǝg tǝdvad herǝrraana, cinngucinng kǝ ǝmtakǝrarra
    16: Marghwadamarǝg kǝ Zǝran Yesu, kiyava taa ǝlbǝg maraw kǝ lii ar Yahudah biya. ɓagaa ba nǝ iin ǝndkwana gatan bi kǝ sawari vak kǝ uud biya,
    17: danal bi dlaɓ damma wurshalim da vak lii jarkwarajǝg kǝ nǝg kǝ zǝrɓǝlǝgah biya. Dǝgiti ɓagan naiya, batwatswatsǝra ka dagal kǝskai damma haaya Arabiya, tǝhalakwaha ka gwiya saas kǝskai damma Dimasku.
    18: Danal tǝhala viig hǝkǝrǝɗ damma wurshalima da nǝgha Kefas kwa ɗahav dǝ Siman Bitrusa. Ən ɓaga kǝ hǝngah kǝlawa tar dlǝɓ ǝmtaɗ dǝ iina.
    19: Nǝghana bi nai aandzu ba pall ma zǝrɓǝlǝgah biya, ba Yakub zǝra babba Yaazhigǝla.
    20: Dǝgiti ǝn viindkurnai na bak jiijiira tǝ vuukwa Daadamazhigǝla, fiid bi wan tagkur nai biya.
    21: Tǝhalakwaha, kaa dagal kǝskai damma haaya Suriya ard Kilikiya.
    22: Ma sarta kwahiina, dlamakǝlaaa lii gata Kristi kwar ma Yahudiya, sǝrarkwaka biya.
    23: Cinngara bad cinng taakiya, “Daddakwa ndza vǝlakiyam dlaɗ ba wurwur na, ǝn wan ndakwan taa ǝlɓǝga fadghǝrǝn kwa ndza badza da nǝ iin wur na!”
    24: Kaa gala Daadamazhigǝl kǝ iitǝr mbakyarvad dǝgiti ɓaga nǝ iin tǝdvad kaiya.
  2:
    1: Tǝhala viig kǝlawa tar uufaɗa kaa gwiya dagal kǝskai damma wurshalima. ma sarta kwahiina, danal ǝmtaɗ dǝ Barnabasa ard Titusa.
    2: Marghwada ma sǝng nǝ Daadamazhigǝl taakiya dǝgama. danal ba nai da vaakwahiina, kaa fǝgaafǝg kǝskai kǝ dzaghǝr dǝ kyalǝma maalaha dlamakǝlaaa lii gatǝga, kaa tagtǝrtag kǝskai kǝ ɗuuli ǝn tagtǝr nai kǝ ǝlbǝg marawa kǝ uudahi kwar Yahudah biya. ba iitǝr pall wa tagantǝr nai kǝ ǝlǝbǝga, aɗaba aa nal bi nǝ fa ndzǝɗar ma tlǝr kǝ gyaagyan biya.
    3: Titus tsahgwa dagalara, wa ba zhiila Hellas nǝ iina, maay wa fǝghara barari kǝ ɓagara aguvac biya.
    4: Əlǝbǝga kwa ciyǝt tǝghǝr kǝ ɓa aguvaca, ciyǝr mbakyarvad zaraabaha fiidfiida kwa saraghan siɓasiɓana, saraghan kwakyarvad ar badzǝdan kǝ kwara ghǝrǝn kwa kiyam dǝ vakai nǝ miyam tǝdvad Kristi Yesu. ar naa nǝkiyamdadal kǝ ɛvaha.
    5: Kǝm haitǝrant bi aandzu ba hǝɗiikǝn biya, kǝm na tsufant kǝ jiira ǝlbǝg maraw kiyavaruwa.
    6: Uudahan kwa tagav taaiya ar mamaalahna, fararaa bi nǝ iitǝr aandzu ndau tǝghǝr kǝ dǝgiti kwan tsag nai biya, man zharǝg naiya aandzu ar hulfa kwar kǝ uudah nǝ iitǝra ba dǝgit pall vakara, aɗaba maay nǝ Daadamazhigǝl fa dagar ma uudah biya.
    7: Dlakulvakwaha, nǝgharanǝghǝg kǝ ɗuuli fǝghwaɗǝm nǝ Dadamazhigǝl kǝ tlǝra taa ǝlbǝg maraw kǝ lii ɓagavtǝra bi na aguvac biya, bandkwa favɗǝm ma dǝv kǝ Bitrus nǝ taa ǝlbǝg maraw kǝ Yahudah kwa ɓagavtǝraɓag nǝ aguvaca.
    8: Ba Daadamazhigǝl kwa ɓagaa tlǝr ma ǝrviɗmahuɗa Bitrus kiyava nǝg kǝ zǝrɓǝlǝga Yesu da vak Yahudaha, ba iin dlaɓ wa ɓagaa tlǝr ma ǝrviɗmahuɗar kiyava nǝg kǝskai ƙǝ zǝrɓǝlǝg Yesu da vak lii ar Yahudah biya
    9: Marghwada ba nǝ Daadamazhigǝl kǝ herǝraana, az Yakuba, Bitrusa, ard Yuhwana, lii favtǝra nǝ ɓa tlǝra maalǝr tǝghǝr kǝ dlamakǝlaaa lii gatǝga, kaa caukǝmndacaug kǝ iitǝr baz kaiya baz Barnaba bad ǝrviɗmahud palla. Haiyamndanthaig dǝ ghǝramnd taakiya kǝm dagal da vak lii ar Yahudah biya, iitǝr dlaɓa ar da vak Yahudaha.
    10: Ar dzamkǝmdant taakiya aa viya bi mǝlgaru kǝ talagah biya, aɗaba kaiya ba dǝgiti ndzan kǝmǝg nai ba wurwur wana.
    11: Ma sarta kwa sahi nǝ Bitrus damma Antakiya, kaa tagartag kǝskai kǝ ǝlbǝg bamma gyi ma gyiya kwakyarvad haipan bat ɓalaɓala.
    12: Ma zǝngwǝra, ndza zǝgan kǝ kaf ǝmtaɗ dǝ yaa daddaha gatǝga kwar Yahudah biya. tǝhalakwa ɓǝlatǝrǝt ba nǝ Yakub kǝ kyalǝmah damma Antakiya, kaa hǝzhahǝg kǝ Bitrus daghuvana. Ɓagaɓag nǝ iin kwana mbakyarvad gǝdza lii na ɓagǝvtǝra nǝ aguvac kǝ lii ar Yahudahǝn biya.
    13: Ɓagara bandkwah dlaɓ nǝ kyalǝma lii gata Yesu ma Yahudah kǝ muuniya band Bitrusa, viyardǝmvig baz ghǝra Barnaba damma muuniyǝra.
    14: Nǝghanaka ba nai ar maay ɓa dǝgatǝr tǝ ɗuula jiira ǝlbǝg maraw biya, aiyamai kǝ Bitrus tǝvuukwa uudah baɗǝma, “Kǝgha agha zhila Yahudaha, agha ɓa ndzǝgan bandkwa ɓag nǝ lii ar Yahudah biya, maay ǝndkwa ɓa nǝ yaa Yahudahi. Aujilbǝg agha fǝtǝra barari kǝ lii ar Yahudah bi kǝ gata dǝ Daadiija Yahudahi?”
    15: Bak jiijiira kiyam Yahudah nǝ miyam tǝdvad yiiga, kiyam lii ar Yahudah biya ma yaa dadda haipah biya,
    16: kiyam sǝrgasǝrǝg taakiya tlǝkǝna bi nǝ uud kǝ ndzǝgan kwal haip tǝvuukwa Daadamazhigǝl tǝdvad gata tsaga adzahadzaha Muus biya, bamma fǝdghǝrǝtfǝg nǝ uudan tǝ Yesu Kristiya. mbakyarvad kwaha famdǝghǝrǝtfǝg ghǝravamnd tǝ Kristi Yesu. ɓagamndaɓag kwana kwakyarvad kǝm tlǝkǝna kǝ ndzǝgan kwal haip tǝ vuukwa Daadamazhigǝl tǝdvad fadǝghǝr tǝ Kristiya tǝdvad tlǝraha tsaga adzahadzah Muus biya. Aɗaba maay wa tlǝkǝna ndzǝgana kwal haip tǝ vuukwa Daadamazhigǝ tǝdvad tsaga adzahadzaha Muus biya.
    17: Akwama nalnǝg taakiya kiyam na tlǝkǝna kǝ ndzǝgana kwal haip tǝvuukwa Daadamazhigǝl tǝdvad fadǝghǝr tǝ Kristiya, kaa tlǝkiyamatlǝg nǝ uud kǝ ghǝravamiyama dǝ haipa, aitsa, maradamarǝg wan taakiya tlǝra Kristi haighanthaig dǝ haipa? ǝndkwah biya!
    18: Akwama gwiya ndǝranantndǝrǝg kǝ dǝgiti dlagana nai wura nanalnǝg kǝ dadda kǝla adzahadzaha.
    19: Tǝdvad tsaga adzahadzaha Muusa ǝmtsanaǝmtsǝg kwakyaevad adzahadzaha, kiyava ndzǝgan kǝkai kǝ Daadamazhigǝja.
    20: Hǝrtakuthǝrtǝg nǝ uud ǝmtaɗ dǝ Kristiya. ndakwana kai bi wa ndzǝgan dǝ ghǝrar biya, Kristi wa ɓa ndzǝgan ma kaiya. Kwan kǝ ndzǝganǝn ɓa naiyna, ndzǝgan tǝdvad fadǝghǝr tǝ Zǝra Daadamazhigǝla, kwa waiyakutwaiga vǝladavǝlǝg kǝ shifǝgan mbakyarvad kaiya.
    21: Ən vinabi kǝ herǝrra Daadamazhigǝl biya. Akwama tlǝkǝnatlǝg nǝ uud kǝ ndzǝgana kwal haip tǝvuukwa Daadamazhigǝl tǝdvad gata nadzahadzaha Muusa, maradamarǝg wan taakiya ǝmtsǝga Kristiya mbats nalnǝg bak gyagyaana.
  3:
    1: Kuram Galantiyaha, am dlagaha? Aa da nau kǝ hǝnkalaruwi? Tangankur bat ɓalaɓal naiy kǝ ǝlbǝg tǝghǝr kǝ Yesu Kǝristi kwa ǝmtsaa tǝ tlaɓa hǝrtǝga.
    2: Ən naa ndavkuru ndavǝg palla. Cauwama mbakyarvad am gataa adzahadzaha Muus nǝ uuram kǝ Shiɗkwa Daadamazhigǝl nii, cauwama mbakyarvad famdghǝrǝtfǝg tǝ ǝlbǝgi cinngama nǝ uuram hi?
    3: Hulfa kwar kǝ dlagǝr wam dǝ vakai nǝ uuramni? Famarzha dǝ Shiɗkwa Daadamazhigǝla, iin wan kwan ndakwana am naa ghyǝng dǝ dǝgiti naag nǝ ghǝraru kǝ ɓagaana!
    4: Mbats dlaɗahan huɓamuu nǝ uuram shahshahǝn nalnǝg ba gyagyaana?
    5: Ən gwiiya ndavkurundavǝga, mam tlatlǝg nǝ uuram vǝlakurvǝlǝg nǝ Daadamazhigǝl kǝ Shiɗkwan ma kuuram kiyava ɓa dǝgaha jappǝr kwakyarvad am gata tlǝri tsag na adzahadzaha Muus nii, mbakyarvad cinngamacinng kǝ ǝlbǝg Kǝristi am fǝdghǝrǝt tǝ iin hii?
    6: Bandkwah nǝ Ibrahim “fǝdghǝrǝtfǝg tǝ Daadamazhigǝla, kǝdlǝgharnakǝdlǝg nǝ Daadamazhigǝl kǝ iin kǝ kwan uuda jiirjiira.”
    7: Nǝghamakanǝghǝg kwan, taakiya, lii dǝ fadghǝra iitǝr nǝ zarha Ibrahima.
    8: Vinndavinndan ma kakaɗa Daadamazhigǝl ba wur taakiya, lii ar Yahudah biya ar datlǝkǝnatlǝg kǝ nǝg kǝ uudah jiirjiir tǝ vuukwa Daadamazhigǝl tǝdvad fadghǝra. Aɗaba tagavar ba wur nǝ ǝlbǝg maraw kǝ Ibrahim taakiya, “Ar da tlǝkǝna tǝdvad kǝgh nǝ lii ar Yahudah bi kǝ barka.”
    9: Mbakyarvad kwaha, lii dǝ fadghǝra da vǝlvǝtǝrvǝlǝg nǝ bark ǝmtaɗ dǝ Ibrahim dadda fadghǝra.
    10: Aɗaba baɗǝm nǝ lii tlatla taaki da cautǝrcaug nǝ Daadamazhigǝl kwakyarvad ar gata adzahadzaha Muusa. Ar tlafatlatana. Aɗaba vinndavinndan ma kakaɗa Daadamazhigǝl taakiya, “Baɗǝm daddakwa ɓagaa bi kǝ dǝgitahi vinndavinndan ma kakaɗa adzahadzaha Muus biya, tlafatlafan nǝ iina.
    11: Salsǝg ba dat ɓalaɓal, taakiya, maay wa nǝgalnǝg kǝ uuda jiijiir tǝ vuukwa Daadamazhigǝl tǝdvad gata tsaga adzahadzaha Muus biya, aɗaba vinndavinndan taakiya, “Uuda jiirjiira, da tlǝkǝnatlǝg kǝ shifǝg tǝdvad fadghǝra.”
    12: Adzahadzaha Muusa shah nǝ iin dǝ fadghǝra, bandkwa vinndavinndan taakiya, “Daddakwa ɓagaɓag baɗǝm kǝ dǝgitahi tagava ma adzahadzaha Muusa, da tlǝkǝnatlǝg kǝ shifǝg tǝdvad iina.
    13: ngǝdlakiyamangǝdlǝg nǝ nǝ Kǝristi sagal ma tlafǝga adzahadzaha Muusa, navdalnǝg tsau kǝ dǝga tlafǝg kǝskǝmyama. Aɗaba vinndavinndan ma kakaɗ taakiya, “Baɗǝm nǝ daddakwa hǝrtǝvǝt tǝ gugyǝmba dakara, tlafatlafan nǝ iina.”
    14: Varakiyamndavarǝg nǝ Kǝristi mbakyarvad barkǝn vǝlavar kǝ Ibrahim, iin wa tlakǝna kǝ lii ar Yahudahǝn bi tǝdvad Kǝristi Yesu. Bandkwah ghǝrava miyama, kiyam da tlǝkǝna tǝdvad fadghǝr kǝ Shiɗkwa Daadamazhigǝl kwa takiyama nǝ iin kǝ langyiyaana.
    15: Zaraabaha ard ǝnghwasaha, ǝn vǝlkurvǝlǝg kǝ garava dǝgiti namǝtnǝg nǝ uuram kǝ ɓagaana. Akwama nguɗarantnguɗǝg nǝ uudah bu kǝ langyiya dlaɓa ar fǝdǝm kǝ dǝva kiyava fǝdghǝrǝtfǝg tǝ vakaiya, maay nǝ daddakwa masdamasǝg biya dlaɓa maay daddakwa fǝgarnafǝg kǝ dǝgit tǝghǝr biya.
    16: Tǝgharatǝg nǝ Daadamazhigǝl kǝ langyi kǝ Ibrahim ard hulfaana. Vinndabi taakiya, “dǝ hulfah biya” kwa maradamarǝg mandki ar ba dyak biya, ǝndkwah biya, “hulfagha” am nǝ uud taa kǝ iina, ba uud palla, kwa iin nǝ Kǝristiya.
    17: Dǝgiti ǝn tlatlǝg naiya iin wana, tǝgharatǝg nǝ Daadamazhigǝl kǝ langyi kǝ Ibrahim dlaɓa maradamarǝga. Adzahadzaha Muus savda tǝhala viig dǝrmǝk uufaɗ dǝ kulhǝkǝrɗa, nǝdalbi kǝ langyi kwa taa nǝ Daadamazhigǝl ba wur kǝ maay nǝ tlǝran biya.
    18: Akwama tlǝkǝna tǝdvad gata adzahadzaha Muus nǝ uud kǝ gwiiga barka vak Daadamazhigǝla, mbats ma tlǝvkǝna bi tǝdvad langyi biya. Aɗaba tlakǝna tǝdvad langyi nǝ Ibrahim kǝ bark vak Daadamazhigǝla.
    19: Akwama bandkwah ci tsaa, savdagha kwakyarva dau nǝ adzahadzaha Muusi? Favarna kiyava ɓa tlǝr kǝ uud dǝ adzahadzaha Muus tangw damma sarta kwa da sii nǝ hulfa Ibrahim kwa tavara nǝ langyi mbakyarvad iina. Vǝlavda tǝdvad Zǝrɓǝlgah nǝ adzahadzaha Muus kiyava daddakwa ghaciga mataataka Daadamazhigǝla ard uuda.
    20: Maay nǝ tlǝra ghacig mataataka akwama ba uud pal biya, aɗaba Daadamazhigǝl ba palla.
    21: Mbats Adzahadzaha Muus ɓa tlǝghum dǝ langyiya Dadamazhigǝli ciya? Maay ǝndkwah biya! Akwama mǝng nǝ kwatlǝrn kǝ Adzahadzah kwa da vǝlkiyam daala shifǝga, ma tlǝvkǝnatlǝg nǝ jiira Daadamazhigǝl tǝdvad gata Adzahadzaha Muusa.
    22: Aɗaba vinndavinndan ma kakaɗa Daadamazhigǝl taakiya, baɗǝm nǝ duniya mazhangyil kǝ kwarga haipa. Kwakyarva cauyamacaug kǝ langyiya Dadamazhigǝl tǝdvad fadghǝr tǝ Yesu Kǝristi, da vǝlǝvtǝrvǝlǝg kǝ lii fardǝghǝrǝtfǝga.
    23: Lakwti sagau nǝ fadghǝra, ndza kiyam ngangan band ɛɛv mazhagil kǝ kwarǝg adzahadzaha, da ɓaga ba sarta marazha fadghǝra.
    24: Mbats ndza adzahadzaha Muus wa ndza markiyam ɗuula, da sahi ba nǝ Kǝristi wa tlǝyamkǝna nǝ miyam kǝ ndzǝga kwal haip tǝvuukwa Daadamazhigǝl tǝdvad fadghǝra.
    25: Sǝv ba nǝ fadghǝr ndakwana, kiyam madlabi mizhadǝva adzahadzaha Muus biya.
    26: Aɗaba baɗǝmaru am zarha Daadamazhigǝl tǝdvad fadghǝr ma Kǝristi Yesu.
    27: Ɓagakuraɓag nǝ uud kǝ tsuufǝg baɗǝmaru ma Kǝristi, dlaɓa fǝkurǝm nǝ uud kǝ sǝɗava Kǝristi
    28: Mbakyarvad kwaha, madlabi taakiya Yahud waha Kǝrdi wah biya, ma zǝra hǝnyaha ma ɛɛv biya, ma uus waha ma ghwalǝv biya, badǝm am ba dǝgit pall ma Kǝristiya.
    29: Akwama am dǝga Kǝristi nǝ uurama, namalnǝg kǝ kuɗǝga Ibrahima, lii da caawa dǝga gwiiga tǝdvad langyiya.
  4:
    1: Ma sarta kwa ba zarh nǝ dadda gwiiga, ba kalkal nǝ iin da ɛva, aanzdu ba dǝgan nǝ dǝgit hǝnyah baɗǝma.
    2: Dadda gwiigǝn ba miizhadǝva lii hǝkyǝgana tangw damma sarti fa nǝ daddaana.
    3: Bandkwah nǝ miyama lakwti sagau nǝ ɗuula Kristiya. ndza kiyam band ɛvah vak ndzǝɗa tlǝksǝra duniya.
    4: Ɓagaa ba nǝ righǝga sarta kwa fa nǝ Daadamazhigǝla, kaa ɓǝldiɓǝlǝg nǝ Daadamazhigǝl kǝ Zǝraana, sahi tǝdvad uusa. Favɗǝm mazhagyil kǝ adzahadzaha Muus bamma sarta yiigaana,
    5: mbakyarvad vartǝrdan kǝ lii miizhagyil kǝ adzahadzaha Muusa, natǝrdalnǝg kǝ zarha Daadamazhigǝla.
    6: Aɗaba am zarhaana, ɓǝladiɓǝlǝg nǝ Daadamazhigǝl kǝ shǝdkwa zǝran damma ǝrviɗmahuɗaruwa, Daadamazhigǝl taakiya, “Abba! Daada!”
    7: Agha madla bi nǝng ɛv biya, agha zǝra Daadamazhigǝla. Nǝghalnǝg tsau kǝ zǝra, nakadalnǝg nǝ Daadamazhigǝl kǝ dadda gwiiga.
    8: Ndzam sǝrgai kǝ Daadamazhigǝl wurwur biya, ndzam ɓagar kwatǝnahǝr kǝ ghǝllaha kwa ɓagaa nǝ uuda.
    9: Aɗaba ndakwana am sǝrgasǝrǝg kǝ Daadamazhigǝla, dlaɓa sǝrkwursǝrǝg nǝ Daadamazhigǝla, am gwiya da mǝr dlaɓ miizhagyil kǝ kwarǝg ndzǝɗa duni kwa maay nǝ tlǝran biyi? Aujilɓǝg dlaɓ am gwiya na nǝg kǝ ɛvaha tǝri?
    10: Am vǝldavǝlǝg kǝ ghǝraru kǝ tsuufa kyalma hǝngaha ard kyilaha, ard sartaha, ard viigaha.
    11: Ən gǝdzǝkurgǝdzǝga, aɗaba mandki baɗǝm nǝ dlaɗi ǝn huɓǝg nai tǝghǝr kǝskuuramna nalnaǝg ba gyaagyaana!
    12: Ən ghalakuuram zaraabahara, namalnǝg band kaiya. Aɗaba kai ndakwani mana nal band kuurama. Ɓagamwi bi nǝ uuram kǝ haip biya.
    13: Am sǝrgasǝrǝg taakiya yang biyin ɓagana naina, iin wa wurghwant ɗuua lankur ǝlbǝg maraw ba zǝngwa.
    14: Aandzu ba sakurdaasǝg kǝ damuuw nǝ yangbiyin ɓaga na naina, bakǝvakwaha nenǝmkwi biya dlaɓa lamwabi kǝ fa hyǝmi tǝ kai biya. Caawamkwicaug band zǝrɓǝlgah ma ghǝrazhigǝla, band kwa caawama nǝ uuram kǝ Kristi Yesu dǝ ghǝraana.
    15: Ndzam dlaiga ba vaivaiy ma sartiina! Ən hwaɗag nai ndkwana mbakyarvad cinngamwanacinga? Ən sǝrgasǝrǝg nai ma sartakwahiina aandzu ba zǝra gyiyaharu ndkwani ma taɗamdataɗǝg am vǝlwana!
    16: Mbats nanalnǝg nai kǝ tlǝghumaru ndakwan kwakyarvad tagankurtag kǝ jiira?
    17: Kwanahan kǝ uudaha ar kǝma ndzǝgan dǝ kuurama, dǝgiti ar tlatlǝg nǝ iitǝra ba ghawɗa. Ar naa tagkwiyamtagwa ǝmtaɗa, mbakyarvad ar viyǝt kǝ hǝnkalaru baɓǝm da vakatǝra.
    18: Maraw nǝ kǝma hulfa ndzǝgan ǝndkwana. Aa ɓagarɓag ba kǝlahǝng bandkwana, ba mar nǝgha kai vakaru nǝ iitǝr biya.
    19: Kuuram zaraabahara, ǝn gwiya huɓa dlaɗa ya kuurama. dlaɓa ǝn za ba vuuk dǝ kwanǝn kǝ dlaɗa bamma ndzandzǝg nǝ hǝnkala Kristi ma ǝrviɗmahuɗaruwa.
    20: Akwamana ba ǝmtaɗ dǝ kuurama ndakwana, ma mbǝɗanambǝɗǝg kǝ kunghyara. Aɗaba ǝn dzama ghǝr ba vaivai mbakyarvad kuurama.
    21: Tagamwataga, kuuramǝn am gata ba adzahadzaha Muusa, nǝghamakanǝghǝg dǝ dǝgiti tsag na adzahadzaha?
    22: Aɗaba vinndavinndan taakiya Ibrahim ndza dǝ zarh buwa ghwalvaha, palla yava tǝdvad uusa kwa ɛva, pall dlaɓa tǝdvad uusa kwa kwara ghǝraana.
    23: Zǝran kwa yava dǝ uusa ɛva, tlakǝna band kwa tlǝfkǝna nǝ zarha. Kiyava zǝran kwa yava dǝ uusa kwa kwara ghǝraana yava tǝdvad langyi kwa tǝghara nǝ Daadamazhigǝla.
    24: Kwan kǝ garava ǝmghwasahaana, iin nǝ langyi buwa. Hagar iin wa yaa ɛva.
    25: Hagar wa nalnǝg kǝ garava Aghwa Sinai kwa ma haaya Arabiya. Iin nǝ garava kǝsa Wurshalima ndakwana, aɗaba iina ard zarhaana ar ba ɛvah baɗǝma.
    26: Aɗaba Wurshalima kwa ma ghǝazhigǝla dǝ kwara ghǝra, dlaɓa iin baabamiyama.
    27: Vinndavidan taakiya, “Ɓag kǝ hwaɗaga kǝgh uusa kwa yigha bi kǝ zǝr biya, Agha tlǝhga hwaɗaga mbakyarvad tapghanabi kǝ dlada yaa zǝr biya, aɗaba zarha uusa kwa ɗuughars nǝ zhiilana ɓagaraɓag ba dyeka. Jaruujig kǝ zarha uusii dǝ zhiilaana.”
    28: Aiciya, zaraabahara, niyamalnǝg ghǝravamiyam kǝ zarha Daadamazhigǝl tǝdvad langyiya band Ishaku.
    29: Ma sartakwahiina zǝrǝn yava band kwa yahav nǝ zarha vǝlgharvǝlǝg kǝ dlaɗ kǝ zǝrǝn kwa yava tǝdvad ndzǝɗa Shiɗkwa Daadamazhigǝla. Bandkwah dlaɓ tangw dat hiinana.
    30: Vinnɗavinnɗan ma kakkaɗa Daadamazhigǝl taakiya, “Lagwdalagw kǝ uusǝn ɛvana ard zǝraana, aɗaba zǝrǝn yava dǝ ɛvana da maay tagwa dǝga gwiig ǝmtaɗ dǝ zǝra uusǝn kwa kwara ghǝrǝn biya.”
    31: Mbakyarvad kwaha zaraabahara, kiyam zarha uusiin kwa ɛva biya, kiyam zarha uusǝn kwa dǝ kwarǝga ghǝra.
  5:
    1: Kwakyarvad ndzǝgana kwara ghǝra iin wa ngǝdlakiyam nǝ Kristi. mbakyarvad kwaha ghacamaghacǝg bad ndzǝɗa, gwiya vǝlambi dlaɓ kǝ ghǝraru da mazhagyil kǝ zuukiya ɛva biya.
    2: Aiciya, cinngamcinnga, kai Bulus wa tagkur kwana, akwama haiyamanthaig ɓagkuraa nǝ uud kǝ aguvaca, mbats maay nǝ tlǝra Kristi vakaru biya.
    3: Ən gwiya ba tagkurtag taakiya, baɗǝm daddakwa haiganthaig gata adzahadzaha ɓa aguvaca, nalnǝg barari gatǝgaan kǝ adzahadzaha muus baɗǝma.
    4: Kuuramǝn am ɓa kǝlandzǝɗaru kǝ tlǝkǝna nǝg kwal haip tǝvuukwa Daadamazhigǝl tǝdvad gata adzahadzaha Muusa, samdalsǝg kǝ ghǝraru ma gata Kistiya. Tǝrɗamatǝrɗǝg tǝ herǝra Daadamazhigǝla.
    5: Aɗaba tǝdvad Shiɗkwa Daadamazhigǝla ard fadghǝra, nǝ wa kiyam pakkǝg nǝ miyam dǝ fantaar kǝ tlǝkǝna jiijjira.
    6: Aɗaba ma kiiyam dǝ Kristi Yesu nǝ miiyama, aandzu ɓagakaɓag nǝ uud kǝ aguvaca, aandzu ɓagakaabi nǝ uud biya, maay tlǝran vakamnd biya. Dǝgiti maraw vakamnda, iinfadghǝra kwa mara ghǝran tǝdvad waiyakǝvǝra.
    7: Ba zǝngw am za vuuk ba vaivaiya. War wa tsakurva kǝ gata dǝga jiijiii?
    8: Hulfa kwan kǝ valla uuda sahi vak Daadamazhigǝl kwa ɗahakurǝtɗahǝg biya.
    9: Bandkwa tagavdan taakiya, “Zǝr yisti ba hǝɗiikǝn wa fǝgara ciig kǝ bǝruudiya.”
    10: Mbakyarvad hweɗa miyam ma Kristiya, fandghǝrfǝg naiy taakiya am maay gata kwatlǝrn kǝ ǝlbǝg shah dǝ dǝgar biya. Daddakwa na ciya hǝnkalaruwa da vǝlvarvǝlǝg nǝ dlaɗa, aandzu ba war nǝ iina.
    11: Zaraabahara, akwama gwastaan ǝn taa ba ǝlbǝg marawa tǝghǝr kǝ ɓa aguvac naiya, aujilɓǝg kaci kǝ uudaha gwastaan ar vǝlgwa ba dlaɗi? Akwama bandkwaha, ǝlɓǝgar tǝghǝr kǝ ǝmtsǝga Kristi tǝ tlaɓa hǝrtǝga nalbi kǝ dǝga mɓǝɗa uud tǝ ɗuul biya!
    12: Lii ar ciya hǝnkalaruna, ngulǝm mara datlant kǝ ghǝratǝra!
    13: Zaraabaha, ɗahakurantɗahǝg nǝ uud kiyava kwaraghǝra. Famfǝg kǝ kyǝmiya analbi nǝ kwaraghǝraru kǝ dǝga ɓa dǝgiti naag nǝ vǝgh biya. Dlakulvakwaha ɓagamɓag kǝ tlǝr dǝ kwaraghǝraru am waigan kǝ zaraabaharuwa.
    14: Aɗaba baɗǝm tsagaana adzahadzaha Muusa ghaca bad dǝgit palla kwa taakiya, “Waiga kǝ zǝraabagha band ghǝragha.”
    15: Akwama am zavǝghad zaraabaharuwa dlaɓa am hadzakava, famfǝg kǝ hǝnkala, badzamdabi kǝ ghǝraru biya.
    16: Naagara, ɓagamɓag kǝ ndzǝgani naag nǝ Shiɗkwa Daadamazhigǝla. Akwama ɓagamaɓag ǝndkwana, am maay gata ndzǝgana vǝgh biya.
    17: Aɗaba ndzǝna vǝgha haigant bi dǝ Shiɗkwa Daadamazhigǝl biya, shiɗkwa Daadamazhigǝl dlaɓa haigant bi dǝ ndzǝgana vǝgha biya. Kwanaham kǝ hǝnkal buwaǝna ar ɓa tlǝghum dǝ ghǝrahatǝra. Iin wam ɓagǝnabi nǝ uuram kǝ dǝgiti am naag nǝ uuram kǝ ɓagan biya.
    18: Akwama Shiɗkwa Daadamazhigǝl wa ɓa tlǝr dǝ kǝ uurama, am mazhagil kǝ tsaga adzahadzaha Muus biya.
    19: Tlǝrahi kwa ɓag nǝ ndzǝgana vǝgha maradamarǝg ba tǝ ɓalaɓala. Iitǝr nǝ ɓa kuuya, ɓa gwaragwara, ard gata cinnga ǝmtakǝra kwa dǝga tsa zhiruwa,
    20: ard ɓa kwatǝnahǝr kǝ ghǝlla, ard uukya, ard naabi kǝ zǝraaba, uushava, sǝlga kǝ zǝraaba, nguɗa ǝrviɗmahuɗa, naa ghǝra, ard tlakwatsiga,
    21: ard sǝlga ard tsǝg nǝ kya, ard hulfa tǝr baɗǝma. Ən ɓǝlkur kǝ kiiɓa ndaiga, band kwa tangankur nai ba wurwur taakiya lii ɓa hulfa kwanahan kǝ dǝgita ar da tlǝkǝnabi kǝ dǝga gwiig ma tlǝksǝra Daadamazhigǝl biya.
    22: Dǝgiti vǝlǝg nǝ Shiɗkwa Daadamazhigǝla iin nǝ waiyakǝva, ard panahnaha ǝrviɗmahuɗa, ard gabǝrǝra, ard fa ǝrviɗmahuɗa, ard jiira,
    23: ard kalaliya ard agha ɗuuwant kǝ dǝgiti naag nǝ vǝgha. Lii ɓa hulfa kwan kǝ dǝgitaha da maay tǝvtǝr nǝ shari biya.
    24: Baɗǝm nǝ lii dǝga Kristi Yesu hǝrtarǝthǝrtǝg kǝ tlǝra vǝgha ard dǝgitah shahshah kwa naag nǝ vǝgha.
    25: Vǝlakiyamvǝlg tsau ba nǝ Shiɗkwa Daadamazhigǝl kǝ shifǝga, aa ɓa nǝ Shiɗkwa kǝ tlǝr dǝ kǝmyam ma ndzǝgana miyam baɗǝmma.
    26: Niyamalbi kǝ lii dǝ dǝkdǝka ghǝr biya, bi lii ciya hǝnkala zaraabah biya, bi lii naabi kǝ zaraabah biya.
  6:
    1: Zaraabahara, akwama nǝghamanǝghǝg kǝ uuda ma haipa, kuuramǝn am ndzǝga ma Shiɗkwa Daadamazhigǝlna, am gwidan kǝ uuda nǝ iin dat ɗuula. Famfǝg kǝ hǝnkala, anabi dlaɓ dlakulva saa dǝ zarab dat ɗuula agha dǝm damma fishǝg biya.
    2: Mǝlamarumǝlǝg kǝ zaraabaharu tǝdvad kǝsa dlaɗa kyalmaha. Am da righǝg ǝndkwan kǝ adzahadzaha Kristi.
    3: Akwama tlatlǝgan nǝ uudan taakiya mǝng nǝ dǝgit tuuk vakai nǝ iina, mbats maay nǝ dǝgiti tuuk vakai nǝ iin biya, valaba ghǝraana.
    4: Aa zharnazharǝg nǝ uudan kǝ tlǝrani ɓag nǝ iin ndana. Akwama ba marawa, lakwti da tiɗa fiɗavǝgh dǝ dǝgiti ɓagaa nǝ iin dǝ ghǝrana, bamma gǝra ghǝran dǝ uudi tlǝrn biya.
    5: Aɗaba ɓagaɓag kǝ maraw aandzu bawara akǝsǝg kǝ kadlanga ghǝraana.
    6: Baɗǝm nǝ daddakwa tsagǝvaru nǝ ǝlbǝga Kristiya aa tagwnatagw kǝ dǝgaha harǝr baɗǝm dǝ daddakwa tsagarutsaga.
    7: Valamndabi kǝ ghǝraru biya, ɓagabi marvara nǝ ɗyǝmɗyǝmǝr kǝ Daadamazhigǝl biya. Badǝm nǝ dǝgiti aa riiga nǝ uuda, iin wa da ghudǝg nǝ iina.
    8: Aɗaba ma riyarig nǝ uudan dǝ naaga ǝrviɗmahuɗaana, da ghuɗǝgan kǝ ǝmtsǝga. Akwama aa riiga dǝ naaga shiɗkwa Daadamazhigǝla, da ghuɗǝgan kǝ shifǝga tangwa damma zǝrazǝra.
    9: Mbakyarvad kwaha kuɗǝyamalbi dǝ ɓa dǝgit maraw biya. Aɗaba akwama kuɗǝyamalbi, kǝ ɓagan biya, da sagau nǝ sarta kwa kiyam da ghuɗǝg nǝ miyam kwa dǝ barka.
    10: Mbakyarvad kwaha, ba kǝla sarti kiyam tlǝkǝna nǝ miyam kǝ ɗuula ɓagaana, mǝlamarumǝlǝg kǝ uudah baɗǝma, kyambar zaraabahamiyami kwama Krǝstiya.
    11: Zharamzharǝg kǝ hulfa vinɗǝgahan dyakdyakǝn vindankura nai dǝ dǝvara.
    12: Aiciya uudahanǝn ar na ba ma cingaba dǝgatǝr nǝ uudna, iitǝr wana fǝkura barari ɓakura nu uud kǝ aguvaca. Ar ɓakur kwana aɗaba ar gǝdza dlaɗǝn ar da huɓǝg nǝ iitǝr mbakyarvad hǝrtǝga Kǝristiya.
    13: Aandzu ba lii ɓagavtǝraɓag nǝ aguvac ndakwani ar maay tsuufa adzahadzaha Muus biya. Ar naa ba ma ɓakura nǝ uud kǝ aguvaca kiyava taakiya iitǝr wa fakura ɓakura nǝ uud kǝ aguvaca.
    14: Kiyava kaiya ǝn maay tǝɗa fǝɗavǝgh biya, bamma tǝghǝr kǝ hǝrtǝga Yaazhigǝl Yesu Kǝristiya, Aɗaba tǝdvad ǝmtsǝgan tǝ tlaɓa hǝrtǝga nǝ wa ɗuuwanars nai kǝ ndzǝgana duniya, dlaɓa ǝmtsanaǝtsǝg kwakyarvad dǝga duniya.
    15: Ɓagaɓagan nǝ aguvaca ɓagabi na aguvac biya maay nǝ dǝgiti tuuk vakai nǝ iini, dǝgit marawa kǝ uuda, aa nalnǝg kǝ daala vǝrɗǝgga.
    16: Gagǝra ard zhuwaɗaala aa dzadzǝg tǝghǝr kǝ lii gata kwan kǝ ɗuul baɗǝmma, kwa yaa izraila ba jiijiira.
    17: Cigǝt ndakwana da tǝvuuk zaraabahara, aa gwiyabi nǝ uudan kǝ gagyakai dǝ dǝgiti tlǝr biya, aɗaba vavǝrahan tǝ vǝgharna maradamarǝg taakiya ǝn ɛva Yesu naiya.
    18: Aa ndzandzǝg nǝ harǝrra Yaazhigǝl Yesu Kǝristi ǝmtaɗ dǝ Shiɗkwaru zaraabahara. Amin.
51:
  1:
    1: Wakita Bulus, kwa nal kǝ zǝr ɓǝlga kǝristi Yesu tǝɗvad naaga Daadamazhigǝl, ǝmtaɗ dǝ Timuti, zǝraabamiyama,
    2: Da vak lii gata Daadamazhigǝl kwar ndzǝga ma Kolosiya. Aa ndzandzǝg nǝ Herǝra ard gabǝrǝr Daadamazhigǝl Daadamiyam tǝghǝr kǝskurama.
    3: Ba kǝlahǝnga, kǝm tagar uus kǝ Daadamazhigǝla, Daad Yaazhigǝlamiyam Yesu Kǝristiya, ma sartǝn kǝm dzug nǝmnd kǝ zhigǝl kwakyarvad kuurama
    4: Aɗaba cinngamndacinng kǝ fadghǝraru tǝ Kǝristi Yesu, ard waiyakǝvi am martǝr nǝ uuram kǝ lii gata Daadamazhigǝl baɗǝmma.
    5: Kwam ɓagtǝr nǝ uuram ǝndkwaha, aɗaba am dǝ fantaar tǝghǝr kǝ dǝgitahi marau kwa fakura nǝ uud ma ghǝrazhigǝla. Kwan nǝ ǝlbǝga jiijiiri cinngama nǝ uuram ba zǝngw ma ǝlbǝg marawa.
    6: Əlbǝg marawǝn sa dǝ barka, dlaɓa cinngalciing ma duni baɗǝmma, bandkwa ɓagaa nǝ iin makuuram bamma sarta kwa famarzha cinnga ǝlbǝg tǝghǝr herǝra Daadamazhigǝla, ard ɗuuli nǝghamaaka nǝ uurama.
    7: Fǝgharzha nǝ Abafaras tsaghwa tlǝramnda kwa kǝm waig nǝmnd kǝ lankur ǝlbǝga hǝrǝrra Daadamazhigǝla. Uuda jiijiir nǝ iin ma ɓa tlǝra Kǝristiya, dlaɓa iin wa ɓa tlǝr vakaru dlakulvamnda.
    8: Iin dlaɓ wa tagkǝmnd ǝlbǝg tǝghǝr kǝ waiyakǝvi am ɓag nǝ uuram ma Shiɗkwa.
    9: Cinngamnda ba nǝmnd kǝ ǝlbǝgna, ghacamnda bi kǝ dzǝgwazhigǝl mbakyarvad kǝ uuram biya, kǝm ba ghala Daadamazhigǝl ma righkurǝt dǝ sǝrgasǝrg ma dabariya ard nǝghgakanǝghǝga.
    10: Tǝdvad kwah wam da ɓag nǝ uuram kǝ ndzǝgan maraw tǝvuukwa Yaazhigǝla, am hǝnarna kǝ ǝrviɗmahuɗa, am ɓagan kǝ ndzǝgan maraw aanji ma hulfa kwar kǝ tlǝra, dlaɓa am gwiya fǝgara bad fǝg ma sǝrga Daadamazhigǝla
    11: Aa fǝkuraafǝg nǝ Daadamazhigǝl kǝ ndzǝɗ dǝ ndzǝɗan baɗǝmma, kiyava ɓishgan kǝskuuram aanji bau wa dzǝgardzǝga, am fǝgan kǝ ǝrviɗmahuɗ dǝ dlaiga.
    12: Am tagar uus kǝ Daad ba kǝla hǝnga, aɗaba iin wa fakiyama tlǝkǝna dǝgshiga gwiigǝn kwa faa nǝ iin kiyava uudahan kwar ma tlǝksǝra paraka.
    13: Aɗaba iin wa ngǝdlakiyama sagal ma tlǝksǝra gurtla, sǝkiyamdaan damma tlǝksǝra Zǝraan kwa waig nǝ iina.
    14: Kwa varakiyamnda tǝdvad iin nǝ uuda, kwa iin nǝ ɓisha haipaha miyama.
    15: Kǝristi nǝ dzakǝva Daadamazhigǝl kwa nǝghva biya, iin Zǝra zǝnngw tǝvuukwa dǝgitahi vǝrɗyava baɗǝmma.
    16: Aɗaba ɓagava tǝdvad iin nǝ dǝgitah baɗǝmma, dǝgitahi ma ghǝrazhigǝla ard ma duuniya, ard dǝgitahi nǝghvanǝghǝga ard dǝgitahi kwa nǝghva biya, aanji avda kwarga, aaji kwarga, aanji lii ndzǝɗa. Baɗǝm nǝ dǝgitahi vǝɗyavana, vǝrɗyavtǝra tǝdvad iina, dlaba mbakyarvad iina.
    17: Kǝristi wa tǝvuukwa dǝgitah baɗǝmma, dlaɓa baɗǝm nǝ dǝgitahi vǝrɗyavana matlavant tǝdvad iina.
    18: Iin nǝ ghǝr tǝ vǝgha, kwa iin dlamakǝlawa lii gatǝga. Iin nǝ dǝga zǝnngwa, iin dlaɓ nǝ dǝga zǝnngw ma lii ciig ma gǝtlaha, dlaɓa aanji ma kwar kǝ dǝgita nalnǝg nǝ iin kǝ dǝga zǝnngwa.
    19: Aɗaba cinngucinng nǝ Daadamazhigǝl kǝmtakǝra righǝga dǝgitah baɗǝm ma iina,
    20: tǝdvad Kǝristi dlaɓ wa nadal nǝ iin kǝ dǝgitahi vǝrɗya nǝ iin baɗǝm da vakaana. Aanji dǝgitahi ma duuniya ma dǝgitahi ma ghǝrazhigǝla, sadaasǝg kǝ gabar saa mataataka kwanahaan baɗǝm tǝdvad ɗiida avzaan tǝ tlaɓa hǝrtǝga
    21: Ndzam ba bǝkya dǝ Daadamazhigǝl wurwura, ndzam ɓa tlǝghum dǝ iin ma ǝrvǝɗmahuɗaru am ɓa dǝgitah ghwaɗghwaɗa.
    22: Aɗaɓa ndakwana, faafǝg nǝ Daadamazhigǝl kǝ gabǝr mataatakaru dǝ iin ma avza Kǝristi kwa dǝga tluwa ard avza tǝdvad ǝmtsǝgaana. Nakurdalnǝg nǝ Kǝristi ndakwan ba cuwaɗaɗ lii maay dǝ haip tǝvuukwa Daadamazhigǝl biya,
    23: Akwama am zaa ba vuuk dǝ fadghǝraruwa, am ghaca ba tǝ vakaiya, ɗuuwamar bi kǝ fantara kwam dǝvakai nǝ uuram kwa cinngam ma ǝlbǝg marawǝn biya. Kwan kǝ ǝlbǝga maraw kwa tagavtǝr aanji kwar kǝ dǝgitahi vǝrɗyava ma miizhangǝl kǝ ghǝrazhigǝla, kai Bulus wa nanal kǝ dadda ɓa tlǝra.
    24: Ən dlaig nai ndakwan mbakyarvad dlaɗǝn ǝn huɓǝg nai kwakyarvad kuramna, aɗaba ǝn da righgant tǝdvad dlaɗǝn kǝ dǝgiti tǝmaa kǝ dlaɗa Kǝristi huɓuu nǝ iin kwakyarvad vǝghaana, kwa iin nǝ dlamakǝlawa lii gatǝgaana.
    25: Nanalnǝg kǝ dadda taa ǝlbǝg marawa tǝdvad hǝkya langyiya kwa vǝlghwa nǝ Daadamazhigǝl mbakyarvad kǝ uurama, kiyava tagkur ǝlbǝg Gaadamazhigǝl ba marawa.
    26: Kwan kǝ ǝlbǝgǝn ǝn tagkur naiy na, dǝgit shiɓashiɓan ba sagalan ma zǝrazǝra, aɗaba ndakwana maravtǝrdamarǝg kǝ yaa dadda gata yaazhigǝla.
    27: Naaga Daadamazhigǝl mara sǝran nǝ uudahan kǝ dyaka hyahǝrǝn ma dǝgan shiɓashiɓan kwa ndanga, kwa fa nǝ iin kiyava lii ar Yahudahǝn biya, dǝgitǝn shiɓashiɓanna, iin Kǝristi kwa dǝ shifǝg ma kǝ uurama, am dǝ fantar ndzǝga ǝmtaɗ dǝ iin ma ndangǝraana.
    28: Iin wa kǝm tagar nǝmnd aanji war kǝ dǝgit tǝghǝr kǝ Yesu Kǝristiya, kǝm tǝdkur hyǝmya dlaɓa kǝm tsakur kǝ dǝgitah badǝm dǝ dabariya kiyava nal aanji ba war kǝ dadda gata Kǝristiya.
    29: Mbakyarvad kwah wan ghulvanai kǝ ɓa tlǝr bad halavuwa ndzǝɗar kwa vǝlghwa nǝ Kǝrisri ma kaiya.
  2:
    1: Ən naagan am sǝran kǝ hulfa dlaɗan ǝn hǝɓǝg nai kwakyarvad kǝ uurama ard uudahi ar ma lawudikiya, ard uudah baɗǝm kwa taparnabi kǝ nǝghkwanǝghǝg biya.
    2: Maa tǝ naagara maraa ndzan ma waiyakǝva, dlaɓa ar tlǝkǝna kǝ ndzǝɗ ma ǝrviɗmahuɗaatǝra, kiyava tlǝkǝnatlǝg kǝ iitǝr kǝ sǝrgasǝrǝg ba maraw, ar sǝran kǝ dǝga Daadamazhigǝl shiɓashiɓana, kwa iin Kǝristi bad ghǝraana.
    3: Shiɓavna ma iin nǝ ndangǝra dabariya ard sǝrgasǝrgǝr baɗǝmma.
    4: Ən tagkur kwa nai haik valkurdavalǝg nǝ uudanna dǝ ǝlbǝga, ɓala gajawa.
    5: Aanji ban maay ǝmtaɗ dǝ kuuram ma ndzǝgana vǝgh biya, aɗaba ma shiɗkwa ǝn ba ǝmtaɗ dǝ kuurama. Ən dlaig nai ba vaivai mbakyarvad ndzǝga ba kalkala, dlaɓa am dǝ fadghǝr ma Kǝristiya.
    6: Haiyamanthaig tsau taakiya Yesu Kǝristi nǝ Yaazhigǝlaruwa, zamzǝg kǝ vuuk dǝ gatǝgaana.
    7: Am ndzan ba maraw ma iina, am faraa kǝ ndzǝɗ kǝ ghǝraruwa, dlaɓa am ghacan ma fadghǝraru bandkwa tsagamndkuru nǝmnda, am tagar uus kǝ Daadamazhigǝl ba kǝlahǝnga.
    8: Famfǝg kǝ hyǝmiya, aa viiyǝt bi nǝ uudan kǝ ghǝraru tǝdvad ɗyamɗyama duuni kwa dǝga valuud biya, kwa tag nǝ dǝga daadija uudah tǝdvad ndzǝɗa shiɗkwa duuniya, kwa dǝga Kǝrist biya.
    9: Aɗaba righant ma Kǝristi nǝ Daadamazhigǝl kǝ dǝgahan baɗǝm ma vǝghaana.
    10: Bandkwah dlaɓ nǝ uurama, am righarighan ma Kǝristiya, kwa iin maal tǝghǝr ndzǝɗa ard kwarga
    11: Ɓagakura ma iin dlaɓ nǝ uud kǝ aguvaca, hulfa aguvacǝn ɓag nǝ uud dǝ dǝv biya. Sakurdasǝg nǝ uud sagal ma haipaharu kwa naag nǝ vǝgh baɗǝmm, ma sarta kwa ɓagakura nǝ Kǝristi kǝ aguvaca.
    12: Aɗaba hǝɗakurahǝɗǝg nǝ uud ǝmtaɗ dǝ Kǝristi ma sarta kwa ɓagakura nǝ uud kǝ tsuufǝga. Ciyakurǝtciig dlaɓ nǝ uud ǝmtaɗ dǝ Kǝristi ma tsuufǝg tǝdvad fadghǝraru ma ndzǝɗa Daadamazhigǝla, kwa ciighant nǝ iin ma gǝtlaha.
    13: Ndzam ǝmtsamǝmtsan wur mbakyarvad haipaharuwa ard maara ɓa aguvaca kwa dǝga ɗuwa hǝnkali naag nǝ vǝgha, ciyakurǝtciig nǝ Daadamazhigǝl dǝ shifǝg ǝmtaɗ dǝ Kǝristiya, ɓishakiyamnaɓishǝg kǝ haipahamiyam baɗǝmma.
    14: Ghudadaghuɗǝg kǝ shariya kwa nguɗa kiyama nǝ adzahadzahǝna, kǝsakiyamara kǝsǝga nǝ Daadamazhigǝla, tsahǝttsahǝg kǝ kus tǝ tlaɓa hǝrtǝga Kǝristiya.
    15: Kǝsatǝrvakǝsǝg kadlanga ghwava lii kwarǝga ard ndzǝɗaatǝra, tsatǝratsǝg kǝ zhirwa bat ɓalaɓala tǝdvad zaa fiir tt iitǝr tǝ tlaɓa hǝrtǝga.
    16: Mbakyarvad kwaha, aa fǝkuraabi nǝ uud kǝ haipa tǝghǝr kǝ dǝgiti am zǝg nǝ uurama, bi tǝghǝr kǝ dǝgiti am huɓǝg nǝ uurama, bi am maay tsuufa hwaɗaga haarakǝsa, bi Hwaɗaga Daala Kyila, bi ngiiya faciya sǝvd biya.
    17: Kwanahaan kǝ dǝgitaha band shiɗkwa dǝgiti da sagauwa, Kǝristi nǝ gyigyiya dǝginiina.
    18: Mbakyarvad kwaha, haiyamant bi aanji ba war kǝ dadda naa ghǝr nenna kǝ uuram taakiya, tlaltlǝg nǝ iin kǝ ghwalvǝra ɓagan kǝ sǝnga. Hulfa kwan kǝ uuda naa ghǝran ba ghyaana, baz taaki ɓagar kwatǝnah kǝ zǝrha ɓǝlga Daadamazhigǝla, mbats ndakwani vala ba ghǝraana, ǝrviɗmahuɗana dǝga hǝnkala uuda digshiga.
    19: Hulfa kwan kǝ uuda, ǝmtsavǝt bi tǝ Kǝristi kwa iin nǝ ghǝr tǝ vǝgh biya. Aɗaba iin wa hǝkya vǝgh baɗǝma kwa matlamatlan dǝ pǝrɗaha, ghubarǝg dlab bandkwa faa nǝ Daadamazhigǝla kiyava ghubarǝga.
    20: Əmtsamaǝmtsǝg tsau ǝmtaɗ dǝ Kǝristiya, dlaɓa sakurdasǝg sagal mazhagyil kǝ ndzǝɗa kwan kǝ duuniya. Aujilbǝg am ɓa ndzǝgan band lii gwastan ar ba dǝga duuniyi? aujilbǝg am haiganthaig dǝ adzahadzah kwa tsag nǝ uud duuni,
    21: adzahadzah kwa taakiya, “Ɓag bi kǝ tlǝr dǝ kwan biya, tap biya, vii biya”?
    22: Hulfa kwan kǝ adzahadzaha tag tǝghǝr kǝ dǝgitahi da zǝlma biya, aɗaba adzahadzahiina kwa tsag nǝ uudaha.
    23: Hulfa kwan kǝ adzahadzaha mǝng nǝ ndzǝgana dabariya vaka faa ndzǝɗ ma gatǝga kwa naag nǝ uudaha, ar tsǝgarva ghǝratǝr kǝ cinnga ǝmtakǝr mbakyarvad gata digshiga, ar vǝlga dlaɗ kǝ ghǝratǝra. Bak jiirjiira, hulfa kwan kǝ adzahadzaha maay dǝ ndzǝɗ vaka tsǝgarva dǝgiti naag nǝ vǝgh biya
  3:
    1: Ciyakurǝtciig tsau nǝ Daadamazhigǝl dǝ shiifǝg ǝmtaɗ dǝ Kǝrisiya, gatamgatǝg kǝ dǝgitahi kwa maghǝrzhigǝla, vakavaki dǝ Kǝristiya, kwa cihurgan tǝ dǝva kafa Daadamazhigǝla.
    2: Dzamamdzamǝg ba kǝ dǝgitahi kwa ma ghǝrazhigǝla, ndavambi kǝ dǝgitahi kwa ma duuni biya.
    3: Aɗaba ǝmtsamaǝmtsǝga, shiɓashiɓan nǝ shifǝgaru ǝmtaɗ dǝ Kǝristi ma Daadamazhigǝla.
    4: Ma sartǝn da marazh nǝ kǝristi kwa iin nǝ shifǝgaruwa, ghǝravaru ndakwani am da marazh ǝmtaɗ dǝ iin ma ndangǝraana.
    5: Mbakyarvad kwanha, ɗuwamarsɗuug kǝma dǝga duuni ma ǝrviɗmahuɗaruwa, kwa iin tlǝra gwardzǝrra, ard gwaragwara, ard ɓa kǝladǝra, ard shiɓǝlga, kwa iin ndakwani ba ɓagar kwatǝnah kǝ ghǝlaha.
    6: Mbakyarvad kwan kǝ haipah wa badzǝg nǝ Daadamazhigǝl kǝ ǝrviɗmahuɗ dǝ lii ɓa kwana.
    7: Ndzam za vuuk dǝ kwanahan kǝ hǝnkal nǝ uuram wura, ndza nalnǝg kǝ vǝgh kǝskurama.
    8: Aɗaba ndakwana, barari kǝskuram am ɗuwar kǝ hulfa kwanahan baɗǝmma. Ɗuwamarɗug kǝ nguɗa ǝrviɗmahuɗa, ciiya jaaga, ard naa bi kǝ uuda, ard baɗza ɗaaga, ard ǝlbǝg ghwaɗ kwa sagal ma ghaayaruwa.
    9: Tagam bi kǝ fiid ma taatakaru biya, ɗuwamarɗug tsau kǝ hǝnkalaruwi kwa ndza wura ard tlǝrahaana,
    10: baz kǝsa daala hǝnkal kǝakurama, kwa navdal kǝ daal tǝdvad sǝrgasǝrg ma dzakǝva daddakwa vǝrɗyavǝrɗyǝga.
    11: Tlǝmkǝnatlǝg tsau kǝ daala hǝnkala, madla bi nǝ ndzǝgan gǝrgǝr ma taatakaru biya, aanji Yahudaha ma lii ar Yahudah biya, ard daddakwa ɓagaɓag ka aguvaca ard daddakwa ɓagabi ka aguvac biya, ard dadda tǝmaruwa, ard zǝrndzǝga, ard ɛrva, ard daddakwa kwara ghǝra, baɗǝm ba dǝgit palla, aɗaba Kǝristi nǝ dǝgit baɗǝmma, iin dlab wa ma kǝmyam baɗǝmma.
    12: Kǝsakurakakǝsǝg nǝ Daadamazhigǝl kiyava nǝg kǝ uudahana lii cacuwanan kwa waitǝr nǝ iin ba vaivaiya. Mbakyarvad kwaha, am zhutǝrɗaala kǝ zarabaharuwa, am ɓagtǝr herǝrra, am nal kǝ kalaliyah ard ɓa dǝga jiira ard ɓishgaana,
    13: am fagan kǝ ǝrviɗmahuɗ dǝ zaraabaharuwa. Akwama ɓagaɓag nǝ uud pal ma kuuram kǝ haipa, am ɓisharnana bandkwa ɓishkurna nǝ Yaazhigǝl kǝ haipaharuwa, ɓishamarnaɓishǝg dlab nǝ uuram kǝ pallaruwa.
    14: Tǝghǝr kwanahaan baɗǝmma, ɓagamɓag kǝ waiyakǝva, aɗaba waiyakǝv wa matlǝgant kwanahan baɗǝm tǝ dǝgit palla.
    15: Aa ɓag nǝ gabǝra Kǝristi kǝ kwarǝg ma ǝrviɗmahuɗaruwa, aɗaba mbakyarvad gabǝrǝn wa ɗahakurǝr nǝ uud kǝ ndzǝga kǝ vǝgh palla, dlaɓa am nal kǝ lii tagar uus kǝ Daadamzhigǝla.
    16: Aa ndzandzǝg nǝ ǝlbǝga Kǝristi ma ǝrviɗmahuɗaru ba dyakdyaka, am tsagtǝrtsag kǝ zarabaharuwa, am ɓǝlgan kǝ magi dǝ dabari baɗǝmma, am ɓǝlgan kǝ ǝngsa zabura ard dǝ dǝga galla Daadamazhigǝla, am ɓǝlgan kǝ ǝngsa kwa tagkur nǝ Shiɗkwa, am ɓǝlgan da taa uus ma ǝrviɗmahuɗaruwa.
    17: Aanji ba kwar kǝ dǝgiti am ɓag nǝ uurama, ma taa ǝlbǝga ma tlǝra, ɓagamɓag ma ɗaaga Yaazhigǝl Yesu, am tagar uus kǝ Daadamazhigǝl Daada tǝdvad iina.
    18: Kuuram ǝngwasaha, ɓagamɓag kǝ ndzǝgan dǝ zhiilaharu band kwa kalkalan dǝ lii gata Yaazhigǝla.
    19: Kuuram ghulvaha, waiyamtǝrwaig kǝ ǝngwasaharuwa, maramtǝrbi kǝ hǝnkal ghwaɗ biya.
    20: Kuuram zarha, famarafǝg kǝ daadaharuwa ard baabaharu aanji ma kwar kǝ dǝgita, aɗaba kwan wa naag nǝ Yaazhigǝla.
    21: Kuuram daadaha, vǝlamtǝrbi kǝ dlaɗ kǝ zǝrharu biya, haik kǝ gǝdzǝg kǝ iitǝra.
    22: Kuuram ɛɛvaha, famtǝraraafǝg kǝ dadda hǝnyaharu maa duuni aanji bamma auwa. Ɓagambi kǝ dǝga nǝgha gyi band kwa ɓag lii gata ɗaag vak kǝ uudah biya, dlakulva kwaha, ɓagamɓa kǝ tlǝr bad ǝrviɗmahuɗ palla, am gǝdzǝgan kǝ Yaazhigǝla.
    23: Baɗǝm nǝ dǝgiti am ɓag nǝ uurama, ɓagamɓag bad ǝrviɗmahuɗaru baɗǝmma, mandki am ɓagar kǝ Yaazhigǝla, am ɓagar kǝ uud biya,
    24: am sǝrgasǝrg tsau taakiya da vǝlkurvǝlǝg nǝ Yaazhigǝl kǝ dǝga gwiig kwa iin nǝ dǝgshigaruwa. Aɗaba am ɓagar kǝ Yaazhigǝl Kǝristi nǝ uuram kǝ kwatǝnahǝra!
    25: Daddakwa ɓa tlǝra kǝladǝra, da tlǝkǝnatlǝg kǝ dǝgshiga kǝladǝrana, aɗaba maay nǝ Daadamazhigǝl fa dagar ma uud biya.
  4:
    1: Kuuram dadda hǝnyahaha, hǝkyamnahǝkyǝg kǝ ɛɛvaharu bak jiijiira am gǝdzǝgan kǝ Yaazhigǝla, aɗaba am sǝrgasǝrǝg ghǝravaru taakiya am dǝ Yaazhigǝl nǝ ghǝravaru ma ghǝrazhigǝla.
    2: Ghulamvaghulǝg kǝ dzǝgwazhigǝla, am uufǝgaana am tagar uusa kǝ Daadamazhigǝla.
    3: Am dzǝgwan kǝ zhigǝl ɗlab kǝskǝmnda, kwa da wurkǝmndant nǝ Daadamazhigǝl kǝ ɗuul kiyava taa ǝlbǝgaana, kǝm tagtǝr kǝ uudah kǝ ǝlbǝga Kǝristi shiɓashiɓana. Mbakyarvad dǝgitin shiɓashiɓanǝn wa ɓǝlakwaɗǝm nǝ uud ma guda bǝrfǝga.
    4: Dzǝgwamwadzǝgw kǝ zhigǝla kiyava taa ǝlbǝgǝn shiɓashiɓanǝn ba marawa, kwa kalkalana kǝskai tagana.
    5: Dzamadzǝg dǝ dabari ma lii ar maay gata Yesu biya, am ɓa tlǝra aanji dǝ kwar kǝ sartaruwa.
    6: Aanji ba hǝra, tagamtag ba kǝ ǝlbǝga herǝrra dlaɓa kwa ǝmtak kǝ cinnga, kiyava sǝrgasǝrǝg kǝskuuram kǝ ɗuuli am da ngutǝr nǝ uuram aanji ba wara.
    7: Da takurtag nǝ Tikikus kǝ dǝgit tǝghǝr kǝskai baɗǝmma. Zǝraabamiyam nǝ iin kwa kiyam waig nǝ miyam ba vaivaiya, dlaɓa uuda jiijiir nǝ iin ma ɓa tlǝra Yaazhigǝl ǝmtaɗ dǝ kǝmyamma.
    8: Ɓǝlanantɓǝlǝg da vakaruwa aɗaba am sǝran kǝ ndzǝgana lapiyamnda, dlaɓa fǝkurna kǝ ndzǝɗa.
    9: Dagal ǝmtaɗ dǝ Onisimusa, zǝrabamiyam uuda jiijiir kwa kiyam waig nǝ miyama, kwa ghǝravan ndakwi ba uuda kǝsaruwa. Ar da tagkurtag nǝ iitǝr kǝ dǝgitah baɗǝm kwa dzagardzaag dǝ kǝmnd vakwanna.
    10: Aristarkus kwa ma guda bǝrfǝg ǝmtaɗ dǝ kai vakwana, tagkur uusa, band kwah dlaɓ nǝ Markus kwa daadijatǝr pal dǝ Barnabasa. Iin wa tagankur naiy kǝ ǝlbǝg tǝghǝr kǝ iin taakiya, akwama sǝvsǝg sa vakaruwa, cawamacaug bad dǝva buwa.
    11: Yesu kwa ɗahav dǝ Yustus, ghǝravan ndakwi tagkur uusa. Ba uudahan hǝkǝrɗǝn kalti ma yaa Yahudah kwa ɓa tlǝra tlǝksǝra Daadamazhigǝl ǝmtaɗ dǝ kaiya, nararnǝg kǝ dǝga taa ndzǝgwagh vakara.
    12: Abafaras kwa pal ghǝravan ma kuurama, iin ndakwani ba kwatǝnaha Yesu Kǝristiya, tagkur uusa. Ba kǝlahǝng ba dzǝgwazhigǝl ghala Daadamazhigǝl kwakyarvad am ghacan bad ndzǝɗa, am ndzan ba righarighana, am fǝdghǝrǝt taakiya am lii gata Daadamazhigǝla.
    13: Nanalnǝg nai kǝ shiɗ kǝ Abafaras tǝghǝr kǝ tlǝri kwa ghulava nǝ iin kwakyarvad mǝlkuru kǝskurama, ard uudaha Lawudikiya ard uudaha Hirafolis.
    14: Luka, doctar kwa kiyam waig nǝ miyama, ard Demas, ar tagkur uusa.
    15: Tagamtǝrtag kǝ uus kǝ zaraabahamiyam baɗǝm kwar ma Lawudikiya, ard Nimfa ǝmtaɗ dǝ dlamakǝlawa lii gata Yesu kwar dzahav ma vǝgyaana.
    16: Akwama ghyǝnngava ghyǝnng karanta wakitǝn tǝvakwaruwa, am vǝltǝr kǝ dlamakǝlawa lii gata Yesu kwar ma Lawudikiya, kiyava karantǝgan ghǝravatǝra. Am karantan ghǝravaru kǝ wakitǝn kwar da vǝlkur nǝ uudah Lawudikiya.
    17: Am tagar kǝ Arkibus aa fafǝg kǝ hǝnkal ghyǝnngna kǝ tlǝrǝn vǝlghar nǝ Yaazhigǝlna.
    18: Ba kai Bulus dǝ ghǝrar wa vǝndkur kwan kǝ taa uusa. Viyamnabi taakiya ǝn nguɗanguɗan biya. Aa ndzandzǝg nǝ Herǝra Daadamazhigǝl ǝmtaɗ dǝ kuurama. Amin.
